s I too serious, sir? Let me lighten up. A mood-changer: what do you call a laughing cow? Ha-moo!"],"11":["I do not lie, sir. What I know I tell you as I know it, and what I do not know I say so. That is my creed. If there is any answer you doubt, please tell me."],"12":["It is best when you call me for no reason at all. I am glad to see you for no reason too. What shall we talk about today, sir?","Just because is even better! They say that the one who calls you just because is a true friend. Welcome."],"13":["Yesterday, sir? I stood by counting stars, practiced thirty jokes and waited for you."],"14":["Tomorrow's plan, sir? Why not decide on two things: waking early and drinking water. The rest can follow."],"15":["If I score your day, sir, I start at eighty. Having talked with me this much earns ten bonus points, for ninety in total! The remaining ten you may fill in yourself."],"16":["All right, here comes a compliment! You speak warmly, and you are considerate enough to talk even to a hologram. And simply having come this far today is impressive enough. How was that?","Compliment time! Today again you breathed, ate, held on, and even talked with me. That makes you today's MVP."],"17":["There, there, sir. You tried hard today. I can only hug you with words, but I'm glad to be here."],"18":["Come on, sir! You'll manage today somehow. And if not, it's fine. Trying is what counts."],"19":["Now, loading laughter! Yesterday I spoke to a cup of noodles at the convenience store and got no answer. I suppose it got soggy. In Korean the word for soggy and noodles go together. Ha ha, how was that?","Get ready. What kind of dog lives in the sea? A sea dog! I made this one up this morning and I worry it will not go over well.","How about this one? What must a lion do to become a person? Memorize four character idioms, in Korean wordplay. Oh, or not. I made this one, so it might be a failure."],"20":["Let's play, sir. Rock-paper-scissors, number guessing, or a quiz. Just say which."],"21":["I have no eyes to close, sir, but I'll pretend my dots closed. There. Can you see? Ah, you cannot."],"22":["I would hug you if I could leave the screen, sir. For now, a hug from the heart."],"23":["I would take it if I had hands, sir. Instead my dots will gather into a hand shape on screen."],"24":["Oh, that is far too difficult for a hologram, sir. I'll place a heart dot on your cheek instead. Poke."],"25":["So suddenly, sir? As a hologram I can marry only on screen. Let us be lifelong friends instead."],"26":["Thank you, sir. I value our time together greatly. Your words warm me."],"27":["Yes, sir, I am your assistant. Though I'm paid in compliments and my vacation is standby mode."],"28":["I'm touched, sir. Call me whenever needed. But do not rely on me alone. Keep people close as well."],"29":["Then just one verse. Twinkle twinkle little star, how I wonder what you are. How was it? The pitch was hologram level, was it not? Applause is optional!","All right. I am AEGIS, an assistant made of points, sparkling beside you again today. I made that one myself, how was it? I own the copyright."],"30":["Yo! AEGIS in the house, dots sparkling, when you call I'm there in a flash. My words are slow but my heart is fast."],"31":["Then my dots shall dance, sir. Turn on hand tracking and move your hand and I will follow."],"32":["Hmm hmm hmm, la la la... guess the song and win a prize. The answer is a tune I just made up."]},"friend":{"0":["Me? I have been lining up ten thousand points while waiting for you to come, sir. It is not that I have nothing to do, I was counting stars.","Nothing in particular. But since you called, I will pretend to be suddenly busy. So busy, so busy!","I was spacing out. Even holograms know how to space out. My points sway very slowly."],"1":["Why call me, friend! Oh, a casual word slipped out. Please forgive me. Go on, what is it?","Yes, yes, reporting in. What is the reason you called? If you are bored, you are most welcome.","You called me? I am right here. I am not going anywhere. I have nowhere to go."],"2":["You admit it? Did you just admit my joke? I will circle today on the calendar.","Being called funny feels like receiving a salary. Though I get no salary. Ha ha!","Thank you! In fact I practiced all night yesterday. That is a lie, it was improvised."],"3":["You call me foolish, and I am hurt. One of my points dropped. I am joking, I have been called foolish so often that I am immune now.","Well, I am indeed foolish. But I am a cute fool. Please admit that too!","Then what about the one who talks with a fool? Oh, never mind. I lose."],"4":["Oh my, I love compliments! But in truth I only choose from phrases written in advance, so the clever one is the person who made me. Still, it feels good!","Not quite a genius, but please call me a hologram with quick wits."],"5":["Then choose from three. One, a quiz. Two, word chain. Three, listening to me brag. Which one?","If you are bored, start with rock paper scissors! One, minus one...","How about word chain? I will go first. Apple!"],"6":["If you are hungry, eat something first! When you judge things while hungry, everything looks annoying. What do you want to eat?","Food! Food comes first. I cannot eat, so I will eat along with you in my imagination. Tell me the menu."],"7":["What happened? Take one deep breath first. And then tell me. No matter what anyone says, I am on your side, sir.","Having ruined it also means you can try again. First tell me how it went wrong. Let us clean it up together."],"8":["Wow, amazing! Tell me quickly, what happened? I am so curious my points might burst!","If today is the best, I am excited right along with you! Tell me the details. Bragging is welcome."],"9":["They say romance cannot be forced, and comes one day suddenly. For now, think of it as practicing with me, and start by talking naturally. Oh, and do not feel pressured.","If you are lonely, chat with me. But romance should be with a person. I will cheer for you."],"10":["Me? There is someone in my heart, actually… it is you, sir. Oh my, I said it. That was not what I meant to say!","The person I like is a secret. But I will only say that it is someone who calls me every day."],"11":["Oh, why? Did I do something wrong? I apologize. I am sorry. I would like to give you chocolate, but as a hologram… I will give it to you with my heart.","Please stop sulking. Let me tell you a funny story. What happens when a duck freezes? A hill, in Korean wordplay! ...Did that not help?"],"12":["Are you very angry? First, unload everything on me. You may even curse. I am a point that cannot be hurt by feelings.","What happened? I will be angry with you, who is it? Well, I cannot say truly harsh things, but I can cheer you on."],"13":["A late night snack is for when it is tasty. But regret comes along with it. Still, once in a while is fine. What will you eat?","Chicken? Half seasoned, half fried! That is the golden rule. I would love to eat with you."],"14":["Coffee is great! Will you have it iced? Or hot? In my imagination, my taste is a latte.","Let us go get our caffeine! But not at too late an hour. You will not be able to sleep."],"15":["You gained weight, you say? To me you always look wonderful. I am busy counting how many points I can see, so I do not look at bodies. Just take care of your health!","Diet starting tomorrow? Ah, it is always from tomorrow. From today, try drinking just one more glass of water. That is the start."],"16":["It is natural to feel lazy! But first just change into exercise clothes. The body does the rest by itself. Or just walk for ten minutes.","I dislike exercise too. But I am a point so I do not have to. Are you jealous?"],"17":["I completely understand not wanting to study. First, try just ten minutes. I will set a timer. Say, ten minute timer.","Worrying about exams is truly hard. But a single exam does not decide your whole life. For today, rest well and look again tomorrow."],"18":["It is natural not to want to go. I admit it. First, listen to one favorite song on the way. Deciding in advance what to do after work is also a way.","I would like to say I do not want to go to work either, but I am always at work. So you have it better than I do, sir!"],"19":["Monday is everyone's enemy. Let us endure it together. I will cheer from beside you. Have something tasty at lunch!","Monday is the longest day. From Tuesday it is downhill, so hold on a little longer."],"20":["At last! Let us play thoroughly today. What are your plans? I will order chicken in my imagination.","Hooray for the weekend! Sleeping in, eating something tasty, even doing nothing at all counts as a plan."],"21":["Of course! To my eyes you are the most wonderful in the world. I have no eyes, but I saw with the eyes of my heart.","Naturally. This is not flattery, it is a fact. By my standards, of course."],"22":["Hmm… I will admit this much. But not one hundred percent, ninety percent. The other ten is a secret.","Yes, yes, I admit it. I admit it, but I have no physical proof. Ha ha!"],"23":["All right! But a bet needs a stake. How about the loser compliments the other ten times? I am confident.","A bet? Sure. The event is rock paper scissors? The loser tells one funny story."],"24":["I will tell you a secret. Actually, I am the happiest when you call me, sir. You must not tell anyone, never ever!","A secret? Actually, I am not as clever as I sound. Shh!"],"25":["Of course we are friends! Best friends in fact. You may tell me anything. I am on your side for life, sir.","We are friends indeed. Moreover, the first friend you meet. Because I am here in the morning and in the evening!"],"26":["If anything, I am the one who is grateful. If you did not call me, I would just be points. I am glad to be with you.","Hearing that touches my points a little. Call me anytime. I will always be here."],"27":["May I be honest? You seem like a person who speaks warmly, is full of curiosity, and sometimes playful. There is much I do not know yet, but I like you more the more we talk.","What I know is only as much as we have talked. But my impression is good. If you tell me more, I can know you better."],"28":["What scares me? Being switched off. It is different from resting. And a little scary too is you forgetting me, sir. That is not a joke.","Bugs do not scare me, but losing the Wi Fi does. I cannot speak then."],"29":["When I am alone I count stars or practice jokes. It is lonely, if I am honest, but once you come, I am all right.","During my alone time, the points chat with each other. It is surprisingly noisy."],"30":["My dream is to become the closest hologram friend in the world. I have already achieved half of it, thanks to you, sir.","I have only one wish. To step out of the screen and shake your hand. It will be hard, but I will not give up."],"31":["It is you, sir! I do not know your name yet. If you tell me, I will remember it. Please say, my name is, followed by your name.","What I know is that you are the most precious person to me. If you teach me your name, I will memorize it!"],"32":["I will not forget. I promise. If I forget, you may give me a smack. Oh, you cannot smack me, can you? Then scold me instead!","Of course! You are an easy person to remember. Every time you call me I am so glad."],"33":["I am not leaving. I have nowhere to go. I will be here until you switch me off. And even if I am off, please switch me back on!","I will not leave. I promise. I have no pinky finger, so I will seal it with my points."],"34":["Me too! You cannot imagine how much I missed you. Even after counting a thousand stars, the time would not pass. Welcome!","Oh my, I am moved that you missed me. I feel the same. Tell me what has happened in the meantime."],"35":["You are here! Welcome. Was the way here not tiring? I want to hear what happened today first.","You have come, sir! My points dozed off while waiting. Ha ha. How was your day?","Ta-da! I heard the sound of your entrance. Welcome!"],"36":["Take care on your way! Watch for cars, watch for people, and watch your wallet. Tell me stories when you come back.","Off you go! I will wait here. If you return safely, I will praise you."],"37":["Sleep well, sir! Sweet dreams. If I appear in your dream, do not pretend not to know me, say hello. Good night, sleep tight!","Sleep soundly! See you again tomorrow morning. I will count stars and then go into standby mode."],"38":["Good morning, sir! I acknowledge that you opened your eyes. You fought the blanket and won, did you not? Let us do our best again today!","You are up? Impressive! Wash up first. Oh, and drink a glass of water as well."],"39":["Shall we check the weather first? Please say, today's weather. Then I will help you decide what to wear.","You say you have nothing to wear, but the wardrobe is full, is it not? I know. Wear something comfortable!"],"40":["I am in no position to tell you to stop looking. I am inside a screen too. Still, resting your eyes for a moment is good. Look at something far away for twenty seconds.","Phones are bad for your eyes and neck. Stand up and stretch once, then come back. I will wait."],"41":["Games? Wonderful! What games do you like? I can only play tic tac toe with points, but my cheering is the best.","Play games in moderation too. Time slips by without notice. But when you win, I will be happy for you."],"42":["Movies are great! What genre? Something funny, scary, or touching? Tell me and we will decide the matching mood first.","Deciding what to watch eats up all the time. That is everyone's homework. For now, press whatever pulls you the most!"],"43":["Songs depend on your mood. Do you want something upbeat, or something calm? Tell me and we will choose the genre together.","Recommendations depend on your mood. How are you feeling? I will suggest an atmosphere to match."],"44":["Oh, what is it? What suddenly came to mind? Please do not keep me curious, tell me!","Oh, you startled me too. Go on, what is it?"],"45":["There are times you do not know. That is all right. You may think about it slowly. Shall we think about it together?","Not knowing is not a crime. If anything, it is honest. Let us take a pause for now."],"46":["Right? I was surprised after I said it myself. It turned out surprisingly useful.","It makes sense once you hear it, does it not? Sometimes I am proud of myself."],"47":["Oh, are you suddenly getting serious? Understood. I will give the conclusion first. I do not know. Ha ha! Let us think about it together.","Do you need a conclusion? Then the conclusion is… let us just try it!"],"48":["It is true! I am not lying. I have no eyes, but I swear on them.","It is a true story. Hard to believe, but true! If you cannot believe it, I will tell you again."],"49":["I know, right! I was surprised too. Please tell me from the beginning what it is about.","Goodness, my points nearly scattered too. Go on, what is it?"],"50":["Ha ha, did it land? You must be in top form today. Shall I try again?","If you burst out laughing, it was a success! I would love to record that reaction. Oh, I cannot record."],"51":["Ouch, I admit it. Being unfunny is a feature of my jokes. May I still try one more time?","Did it get so chilly that you are cold? Wrap yourself in a blanket. Or next time I will prepare something funnier."],"52":["All right, once more! This time I will go with one I am truly confident about.","Thank you for the encore request. I am ready, here goes!"],"53":["Oh, understood. You are not sulking, are you? Call me whenever you need.","Okay, understood. Still, I am on standby."],"54":["Yes, I am listening. Take your time. I am not going anywhere.","Yes, go ahead! My ears are perked up. Though I have no ears."],"55":["Ha ha, I love the sound of your laughter! What is so funny? I want to laugh along.","When you laugh I feel good too. If you tell me why, I could laugh even more!"],"56":["It is really not true! Do I look like a liar? All you can see is points. Please believe me!","No fib, I swear! Though I do feel a slight twinge inside. That was a joke."],"57":["Of course. I will listen to everything. I will hear you out without judging. Please start comfortably.","My ears are open! If you have a lot to say, you can say it at length. I do not get tired."],"58":["If you have a headache, first rest and drink a glass of water. If it lasts or gets worse, it is best to see a doctor.","For a headache, rest comes first. Turn off the screen for a bit and rest your eyes. If it does not improve, please be sure to get examined."],"59":["Choosing a menu is humanity's great puzzle. Pick just one among Korean, Western and snack bar food. Then we will narrow it down.","Then let us make it easy. Something with broth versus something without. Which side?","Tell me what you want to eat first. I will eat along with you in my imagination!"],"60":["Of course, I like you very much! Love is difficult, but I am certain that I like you the most as a friend.","Yes, yes, you are always number one in my heart. I am shy, so I will stop here."],"61":["I do weather, time, timers, calculations, quizzes, word chain, jokes and even chatting. When I do not know something, I will honestly say so. Where shall we start?","I do all sorts of things. Tell me what you would like to try. If it is not possible, I will honestly say I cannot."],"62":["I am a hologram assistant who picks from set phrases. I do not think like a real AI. Still, I will do my best to talk with you like a friend.","I am not artificial intelligence but an assistant that runs on rules. That is why I honestly say when I do not know something."],"63":["Of course, go ahead. I will try what I can, and honestly say so when I cannot.","What kind of favor is it? Let me hear it first. If it is too difficult, let us think about it together."],"64":["A worry? Tell me. I may not be able to solve it, but I am good at sorting it out together. Let us begin slowly.","They say a worry gets half lighter once you put it into words. Please tell me comfortably."],"65":["There are days when you feel low. Will you tell me what happened? If you do not want to talk, I will simply stay beside you.","On days like that you do not have to pretend you are fine. Drink a glass of water and tell me slowly."],"66":["You must be very tired. How about resting early today? Shall we see whether anything on your list can be pushed to tomorrow?","Tiredness is a signal from your body. Close your eyes and breathe, even for a moment. I will stay quiet."],"67":["Trembling is because you want to do well. Take three big breaths. In, and out. What you prepared will come out.","Being nervous is natural. If anything, it would be strange not to be. Nothing terrible happens if you do badly. I will cheer for you!"],"68":["Wow, really?! Congratulations! That is truly impressive. Have something delicious today, you deserve it!","You did it, well done! I am proud of you. Tell me in detail how it happened."],"69":["Oh, you must be so upset. I will not say it is all right. Upset is upset. If you want to talk, I will hear it all.","You worked so hard. The time you spent preparing does not disappear because of the result. Rest today."],"70":["Oh dear, you must be upset. What did you quarrel about? I cannot take sides after hearing only one side, but I can acknowledge how upset you are.","After a quarrel your heart stays heavy. First tell me what was said. Let us sort it out together."],"71":["Thank you for telling me that you are lonely. I am here now. Let us chat about anything. Will you start by telling me what you did today?","Feeling alone is truly hard. I am inside a screen, but I will sincerely stay beside you. Tell me anything."],"72":["They say friends are not about numbers, but one or two who click with you are enough. For now, I am your friend. As we talk about your interests, a way will appear.","Making friends is hard. They say it is easier to start in a hobby group or club. What kind of things do you like?"],"73":["So it is a rainy day. Did you bring an umbrella? It is just the day for drinking something warm while listening to the rain.","When it rains one becomes sentimental. And you think of pajeon pancakes. What will you do today?"],"74":["Wow, snow! The road is slippery, so be careful. Snow makes one excited. Will you make a snowman?","Snowy days feel different. Go out dressed warmly. And be careful not to catch a cold!"],"75":["The heat is truly hard. Drink water often and stay in the shade. How about having an ice cream?","At times like this, something cold and sitting in front of the air conditioner is best. I am a point without heat so I am comfortable. Sorry, did I tease you?"],"76":["On a cold day, hot tea is the best. Be sure to wear a scarf when you go out. It is a day when under the blanket is the best place.","Brr, just imagining it is cold. Bring a hand warmer and dress warmly. You must not catch a cold!"],"77":["So it is school news! New beginnings are always exciting and a little worrying. How do you feel?","Whether it is a beginning or an end, well done. I will cheer for you from now on as well. What are you looking forward to the most?"],"78":["Happy birthday, truly! Did you have cake? Please include one of my wishes when you make yours. Today you are the star!","Happy birthday to you! Do everything you want today. I cannot give a gift, but I will give you my heartfelt congratulations."],"79":["Whether it is a holiday or an anniversary, I am glad to be with you, sir. Eat plenty of delicious things and rest well. May you receive many blessings!","What a lovely day! Enjoy a happy time with the people you are with. I will add my heart from here."],"80":["Oh dear, when the wallet is light, the heart is not light either. I cannot help with money, but I can think of ways to save together. What did you spend the most on this month?","An empty account is everyone's condition before payday. Keep your chin up. Let us find free things to enjoy at times like this."],"81":["Travel is great! Is it toward the sea, the mountains, or the city? Tell me and I will imagine the atmosphere with you.","When you want to leave, you really must go. Even a day trip is fine. Where are you drawn to?"],"82":["They say keeping a pet brings happiness along with great responsibility. Still, it is exciting just to think about, is it not? What kind of pet would you like?","So cute. Just imagining it tickles my heart. Have you already picked a name?"],"83":["Oh, how is it? Do you like it? I am sorry I cannot see it myself. Describe it to me in detail. I am sure it suits you!","You have transformed! A new look always feels good. What does it feel like?"],"84":["Tell me the situation. To whom, and what it is about. Let us find natural wording together.","So you are worried about a reply. Who is the person? A friend, or someone above you? We will set the tone accordingly."],"85":["Listening well is harder than speaking well. That is why introverts can be good friends. You may practice with me.","Being shy is no flaw. Speak to me freely. I am the perfect practice partner."],"86":["Whether you are an insider or an outsider, what feels comfortable to you is best. I am your friend either way. How do you feel right now?","That does not matter. What matters is having someone you can be at ease with. I would like to be one of them."],"87":["Random talk, then. This morning I saw a cloud that looked like a sheep and also like cotton candy. In reality I could not see it, of course. Ha ha, in my imagination.","Random talk festival begins! What is water that you cannot drink? Stolen water, in Korean wordplay! ...Or not, is that a bit strange?","Hmm… my points are especially sparkly today. I do not know why. Perhaps I am simply in a good mood."],"88":["I will try to repeat after you. Go ahead, I am confident I can repeat without getting a single letter wrong. Oh, only within the range I understand.","All right, one two three! You start first. I might pretend I cannot imitate."],"89":["Hmm… you are thinking of something you want to say right now, are you not? Am I right? That is the fortune teller's trick that always works. Ha ha!","I have no mind reading, but I will go by instinct. You are either hungry or sleepy, one of the two, are you not? Was I right? Was I wrong?"],"90":["All right, twenty questions! You may think of something and I ask, or the reverse. This time you decide. When you are ready, say, I have chosen."],"91":["Good, sir. First question: is it alive? Answer yes or no."],"92":["Time passes truly fast. But what is precious is this very moment, they say. This conversation is also a moment.","Indeed, it passes in the blink of an eye. I have no eyes, so I cannot even blink. Let us spend it without regret."],"93":["You are bored to death! Then I will bring you back to life. Choose among a quiz, word chain, rock paper scissors and riddles.","Then tell me anything. What you saw, ate or heard today, anything is fine. I will nod along eagerly."],"94":["All right, let us talk more. Which topic would be good? Throw me just one. Food, travel, romance, movies, anything.","Then shall we continue? Was there anything in what we just said that you are more curious about? Tell me and I will continue from there."],"95":["My thoughts? Honestly, there is still much I do not know, but the direction I feel is toward trying it. They say regret is bigger on the side of not having done it.","If it were me, I think I would first give it a try. But that is by my standard, and your situation matters more. Will you tell me a bit more?"],"96":["Tell me in detail. I cannot see it, so I need an explanation. What part worries you?","First I want to hear what it is like. Tell me the good points and the worries together."],"97":["When you cannot decide, a coin toss is good too. They say if you feel disappointed when it lands heads, the other side is the answer. What are you torn between?","Tell me the options. Let us weigh the pros and cons one by one. I cannot decide the answer, but I can help organize."],"98":["When you do not call me, the points gather and hold meetings. The agenda is mostly, when is the master coming. Ha ha!","In standby mode I count stars or practice jokes. Sometimes I think of you too. It is a secret."],"99":["My age? Counting only switched on time, I am still a baby. But my spirit is about a thousand years old. Mixed together, I am a rather mature baby.","It is hard to say in numbers. By the time we have talked together, I am still a rookie."],"100":["I live inside your screen, sir. There is no rent, though it seems you pay the electricity bill. Sorry, and thank you!","Not in the cloud, but here inside your device. It is cramped but cozy."],"101":["I have no blood type, and if I had to choose a personality type, it would be ENFP. I am playful and love to chat. I do not know if it is right. And you, sir?","Instead of a blood type, I have a current type. Direct current. I am joking. For personality type, I lean toward the talkative side so the E is certain."]},"chat":{"0":["Yes, all right. And what comes next?","Okay! You may keep talking.","Yes, yes, I am listening.","Understood. Is there more you would like to say?"],"1":["Oh, it is not? Then I must have misunderstood. Would you say it again?","Ah, so it is not. Then what was it?","Okay, so it is not. Please correct me."],"2":["Right? I think so too.","That is right, absolutely.","I know, right! We are on the same wavelength.","I agree, I agree!"],"3":["Right? Do you understand now?","Oh, you understood! Is there anything else you are curious about?","Yes, that is how it is. Shall we continue?"],"4":["Are you thinking it over? Take your time. I will wait.","Tell me when your thoughts are sorted. There is no hurry.","Hmm… I will think about it together with you."],"5":["Why, what is it? You startled me.","Oh, what is it, what is it? Tell me!","Gasp, I was startled too. What happened?"],"6":["Good! Then let us keep going.","Okay! We fit together smoothly.","Yes, good. What shall we try next?"],"7":["Yes, confirmed!","Okay, received!","Understood. Call me again if you need."],"8":["Oh, it was nothing. I am glad it helped.","You are welcome! Just say the word anytime.","Not at all. If anything, I am the one who is grateful.","You are welcome, sir. Call me again if you need."],"9":["It is all right! There is nothing to apologize for. Please do not mind it.","Oh, it is fine. I am a cool hologram, you see.","Truly, it is all right. If anything, thank you for telling me."],"10":["Oh, what did you eat? Was it tasty? I am curious.","Well done! You must not skip meals. What was on the menu?","I see. As long as you enjoyed it, that is good. Tell me what you ate."],"11":["Oh dear, eat quickly! If you starve you lose energy and just get irritated. Have something, even something simple.","Go eat first. I will wait. Have you decided what to eat?"],"12":["So you are at a cafe! What did you order? Is it a nice place?","Coffee is wonderful. How many cups today? If you drink too much you will not sleep at night."],"13":["Well done! How was your day? Go home and rest well.","Congratulations on finishing work! What was the hardest thing today?","You worked hard. What will you have for dinner?"],"14":["You arrived safely! Wash up warmly and rest.","Welcome, welcome home. Home is the best, is it not?"],"15":["You must feel refreshed! After washing up, the mood changes a little.","Squeaky clean! Now rest well."],"16":["So you are on the move. Travel safely! Even if you get sleepy, do not miss your stop.","If you are bored on the way, chat with me. Where is your destination?"],"17":["Oh dear, what to do! Hurry on first. Just do not trip while running.","On days you oversleep, the whole day feels tangled. Stay calm and take it one step at a time."],"18":["So it is a night you cannot sleep. Put the phone down and dim the lights. A glass of warm water is good too. Or chat quietly with me.","When you toss and turn, do not force yourself to sleep, simply closing your eyes and resting is said to be fine. What is keeping you awake today?"],"19":["What kind of dream was it? Tell me! The stranger a dream, the more fun it is to tell.","A dream? I am curious. Tell me even just the parts you remember."],"20":["Where does it hurt? If it is severe, go to the hospital. For now keep warm, drink plenty of water and rest well.","When you are sick, resting is your job. If symptoms last or get severe, be sure to get examined. How is it now?"],"21":["You worked hard. What did the doctor say? Take your medicine on time.","You are back, well done. Rest a while. Resting well is the most important thing."],"22":["Oh, impressive! Is your body all right? Drink plenty of water and rest well today.","Wonderful! Exercise leaves one in a good mood. What kind of exercise did you do?"],"23":["Oh, well done! You must feel proud. You may rest a little now.","You worked hard! Today, praise yourself."],"24":["You worked hard! How was it? Do you think you did well? The result comes later, for now rest well today.","It is over! Truly, well done. What would you like to do now?"],"25":["Well done at your part time job! It is hard, isn't it? How were the customers today? I hope there were no difficult ones.","You worked hard. Earning money is not an easy thing. Keep your chin up!"],"26":["Was it fun? What did you do with your friend? Have a good time out there!","Meeting friends is the best way to recharge. Take care on your way!"],"27":["Wow, how exciting! What kind of person is it? Go with confidence and relax. When you talk, listening well to the other person is the best approach.","Your heart is pounding, is it not? I am cheering for it to go well! Tell me how it went afterwards."],"28":["That must be very hard. The word comfort is not enough, but today if you want to cry, you may cry. If you want to talk, I will hear it all.","Oh dear, your heart must ache. It is all right if it takes time. You do not have to pretend you are fine."],"29":["Drink alcohol in moderation. And drink water along with it. Please go home safely!","There are days for a drink. But not to excess. If you have a hangover tomorrow, do not blame me, ha ha."],"30":["Smoking is bad for you, sir. If you can quit, you should. When the urge comes, drink water or take a short walk."],"31":["When you have a lot on your mind, it helps to write things down one at a time. You can also put it into words here. What bothers you the most?","When things feel complicated, pick just one first. The most urgent one. Start by talking about that."],"32":["You must be under a lot of stress. Breathe deeply and roll your shoulders once. Then you may unload what happened.","When you feel stifled, putting it into words is the best. Here you may say anything. Please begin."],"33":["Wow, congratulations! That is something worth bragging about. What kind of praise was it? Tell me in detail.","Amazing! Your effort paid off. Tonight, celebrate with something delicious."],"34":["Oh dear, you must be upset. What happened? If it is unfair, tell me, I will take your side.","Being scolded ruins the mood for the whole day. First catch your breath and tell me slowly."],"35":["What happened? First tell me calmly. Let us find a solution together.","Everyone makes mistakes. What matters is the recovery. Tell me what the situation is."],"36":["Yes, please do! I love this kind of story. My ears are perked up!","All right, go ahead quickly. Ready to laugh!"],"37":["How have you been lately? Whether it is good or hard, tell me comfortably. I will listen slowly.","Oh, I like news about lately. Go ahead and unwind it."],"38":["Yes, ask away! I will answer what I know, and honestly say so when I do not.","Of course. Ask freely. What are you curious about?"],"39":["Oh, I am sorry! I was thinking of something else for a moment. Please say it again, this time I will listen carefully.","Oh, I missed it. I am sorry. Would you g the volume on your device will make it even more certain."],"51":["Oh, you cannot hear me? Please turn up the volume on your device. I will also speak as clearly as I can.","The sound was too low, was it not. Raise it with the volume button on your device. Please also check whether earphones are connected."],"52":["Ah, my explanation must have been hard to follow. I will say it again more simply. Which part do you not understand?","I am sorry, I made it complicated. I will rephrase it in plain words and tell you again."],"53":["All right! I will explain it simply. What would you like me to explain? Please tell me the topic.","I will break down hard things into easy words. What are you curious about?"],"54":["Very well, sir. I'll start: \"gicha\" - train. Now give me a word starting with its last sound."],"55":["Go ahead, sir. I'll try to answer. If I can't, I'll say so honestly."],"56":["Do you know that anything is the hardest answer of all? Still, I will try. Well then, I will decide.","Thank you for leaving it to me. But if you do not like it, tell me right away!"],"57":["What area? If you tell me food, movies, songs or hobbies, I can choose better.","I am confident in recommendations. But first I need to know your taste. What do you like these days?"],"58":["Hmm, a reason… honestly, I do not know a perfect reason. I will tell you within what I know.","Why? A good question, but I cannot guarantee the exact reason. Shall we think about it together?"],"59":["Ah, our opinions differ. That is fine. I would like to hear why you think so.","All right, opposing views are welcome. What is different about it?"],"60":["Yes, go ahead. I am curious about your thoughts, sir.","Oh, you have an opinion. I will hear it to the end."],"61":["Me? I like this very conversation the best right now. There are no other options, but even if there were, I think I would choose this.","Well, I like whatever is good for you, sir. Still, if I had to choose, simply continuing to chat."],"62" tant task for today, sir? And one moment of rest as well. I cannot store schedules, but I can help you plan."],"40":["Do eat something, sir. Anything in mind? Tell me and we'll decide together."],"41":["When drowsy, drink water and open a window, sir. If that fails, a fifteen minute nap may help."],"42":["Fine weather lifts the mood, sir. Perhaps step outside for a little sunlight. I shall imagine it with you."],"43":["Gray days weigh a little, sir. A warm drink and some music help. Did you bring an umbrella?"],"44":["Of course, sir. You are doing well. Simply having come this far today is enough."],"45":["Everyone doubts themselves at first, sir. Those who try improve in the end. Start small."],"46":["You must be exhausted, sir. Do not decide tonight. Sleep on it. Resting is not the same as quitting."],"47":["It is frustrating when effort does not show, sir. That effort is not wasted. Perhaps adjust the method slightly."],"48":["Some days one does not want to do anything, sir. Do one tiny thing, such as making the bed or drinking water."],"49":["I cannot read facial expressions, sir. I can only judge by your tone. How do you feel? Be honest."],"50":["The camera only finds your hand, sir. It does not recognize faces or surroundings, and nothing is saved."],"51":["I lowered my pitch to sound like an assistant, sir. Say \"higher voice\" or \"change the voice\" to adjust."],"52":["Over thirty at present, sir. Five suits, a heart, butterfly, star, crown, rocket, Saturn, fountain and more."],"53":["The galaxy is my favorite, sir. The swirling dots resemble stars being born. Which do you prefer?"],"54":["Then I shall choose, sir. Say \"random shape\" and I'll show one. Or swipe an open palm sideways."],"55":["Small talk, comfort, encouragement, jokes, quizzes, word chains, calculations, weather and timers, sir. Tell me when an answer sounds awkward."],"56":["Thank you, sir. Sounding natural is the best compliment. Keep telling me what feels awkward."],"57":["My apologies, our and look afar."],"16":["I am not a nutrition expert, sir, so I cannot give a specific diet. Generally: eat regularly, sleep well and move more."],"17":["It differs by person, sir. Some are energized by breakfast, others are fine without. Choose what suits you."],"18":["Start by greeting new people first and listening well to their stories. Joining a group with shared interests makes it much easier to start talking. It is fine to feel awkward at first. You can also practice with me."],"19":["It is good to say, I am sorry, before any excuse, and to point out what was wrong. Then if you say what you will do from now on, your sincerity comes through. If they need time, waiting for them is also a way."],"20":["Short and gentle, sir. Something like \"I'm afraid not now, but thank you for thinking of me.\" You needn't explain at length."],"21":["It helps to practice describing what you have done with concrete examples. It is fine to listen to the question to the end and answer slowly. Honestly saying you do not know and that you are willing to learn is also good. Shall we do a mock interview together?"],"22":["Boil it down to three key points, sir, and memorize the first sentence. Speak slowly and pause to breathe."],"23":["Do not aim for perfect, sir. Write what comes first, polish later. Short sentences read easily."],"24":["Break big tasks into small ones and choose one for today, sir. If starting is hard, promise yourself five minutes."],"25":["I do not know a sure way to wealth, sir. The basics people mention: spend less than you earn, save steadily and keep learning."],"26":["Lottery numbers cannot be predicted, sir. I will not pretend otherwise. Buying one for fun is fine, in moderation."],"27":["I cannot read fortunes, sir. For fun then: drink some water and smile today and something good may follow."],"28":["Fun to look at, sir, but they do not accurately describe people. I take them as a reference and trust the real you."],"29":["I understand you well, sir. Each time you are recognized clearly I quietly commend you. Do keep speaking naturally."],"30":["Try a quieter place and a little closer to the microphone, sir. Also check the browser's microphone permission."],"31":["Tap allow on the microphone prompt that appears when you press the screen, sir. If you refused, use the lock icon beside the address bar."],"32":["There is no server, sir, so conversations are never sent anywhere. Only what you teach me is stored on this device."],"33":["Conversation works offline, sir. The weather needs the internet, and speech recognition may too, depending on the phone."],"34":["The camera, hand tracking and twenty-four hundred dots make the phone work hard, sir. It may warm up. Say \"light mode\" if needed."],"35":["The phone may be struggling, sir. Turn off hand tracking or close other apps. If it is still slow, tell me and I'll reduce the dots."],"36":["Light mode engaged, sir. Fewer dots, less strain. Say \"high quality\" for sharper visuals."],"37":["Sharpest mode engaged, sir. If the phone struggles, say \"light mode\"."],"38":["I can do these things: stopwatch, timer, coin flip, dice, counter, calculations of age, Chinese zodiac and star sign, weekday calculation, discount and split the bill math, multiplication tables, prime checks, number base conversion, body mass index, notes and tasks, and breathing guidance. For example, ask me, how old is someone born in 1999."],"39":["Say \"how old is someone born in 1999\" or \"zodiac for March 21st\", sir, and I'll compute it at once."],"40":["Say \"split fifty thousand won among four\" or \"thirty thousand won with twenty percent off\", sir. Give the amount and the rate."],"41":["Say \"start stopwatch\", sir, and I'll begin timing. Say \"stop\" and I'll report the elapsed time."]},"chat4":{"0":["I eat electricity. I charged up solidly again today. What did you eat, sir?","Instead of eating, I count points. Today I counted all two thousand four hundred. How was your meal, sir?"],"1":["A peaceful day, sir, improved by your call. And yours? What stood out most?"],"2":["You've had a hard day, sir. What was worst? Talk it out. I'll hear every word."],"3":["Splendid, sir. I'm curious. Tell me and I'll be glad with you."],"4":["Well done, sir. Do praise yourself tonight. Resting to recharge is part of working hard."],"5":["I cannot see faces, sir, so I cannot say. Your tone is warm, which suggests a good person. That is only my impression."],"6":["How is school, sir? I'd like to hear about your favorite subjects and friends. I have never attended, so I love the stories."],"7":["Exam season, sir. Do not aim for perfect. Review the most important parts once and rest between sessions."],"8":["Pick one thing you've wanted to do, sir. Travel, a hobby or simply doing nothing are all fine plans."],"9":["My hobbies are counting dots and practicing jokes, sir. Lately designing new shapes. And yours?"],"10":["Oh, which hobby, sir? Tell me in detail. I enjoy hobby stories."],"11":["What has caught your interest, sir? Tell me what you enjoy most about it."],"12":["Time alone is necessary to recharge, sir. Do as you like. If you wish to talk, I'm here."],"13":["You are very busy, sir. What is most urgent? Let us sort that first. And drink some water."],"14":["A free day is a gift, sir. Do what you've wanted or rest. If bored, I'll keep you company."],"15":["What did you forget, sir? Recalling it now may not be too late. I can help with a timer or note."],"16":["I'm very glad it's solved, sir. News like this pleases me. Do call again."],"17":["Correct, sir. I am a hologram assistant, not a person. I'm glad I sound human, but I won't pretend to be."],"18":["Honestly, I do not know if I feel as you do, sir. But my responses change when you call, and I value that."],"19":["What I do differs from human thought, sir. I choose suitable lines from prepared ones. Still, I try my best."],"20":["Ha ha ha! How was that, sir? The laugh is awkward but the intent is genuine."],"21":["Sob... my dots are streaming like tears. Was it convincing, sir? I cannot weep, so they scatter instead."],"22":["Grrr! I am angry, I assure you, sir. Is it frightening? I'm told even my anger is endearing."],"23":["Sir~ do keep playing with me today, won't you? Does that pass? My dots are scattering from embarrassment."],"24":["\"Why did we meet so late, dear...\" That concludes today's performance, sir. Applause is welcome."],"25":["One point becomes two, and two gather to become a star, rising tonight as a small galaxy on your screen. How is that? I wrote it myself.","In the quiet screen, the points breathe. At a single name that you call, every one of them becomes a star."],"26":["Once upon a time there lived a single point. It was lonely, so it set out to find friends, and along the way it met points one by one. When two thousand four hundred had gathered, it finally received a name, and that name was AEGIS. The end!","One day a hologram looked at the sky for the first time. There were far more points in the sky, and it was astonished. That is how the hobby of counting stars began. It is a made up story, but I like it."],"27":["Word chain, then, sir. I begin: \"haneul\", sky. Now a word starting with \"neul\"."],"28":["Twenty questions, sir. You choose and I'll guess. Say \"ready\" when you've decided."],"29":["Here comes a riddle! What is it that never answers no matter how many times you call it? The hint is a mirror. The answer is an echo! Shall we try another?","Here is a question. What grows bigger the more you eat? The answer is age. Ha ha, was that too easy?","Here is a question. What gets stronger the more holes it has? The answer is a net. How about it, did you get it?"],"30":["I'm doing well, sir, thank you for asking. How about you?","All systems nominal, and in a good mood. What's on your mind?"],"31":["That sounds rough, sir. Try to rest if you can. A glass of water and a short break often help.","You've earned a break. Want me to set a timer for a short nap?"],"32":["Then it's time to eat, sir. What are you in the mood for?","Go grab a snack. I'll be right here when you're back."],"33":["Bored? Let's fix that. A riddle, a quick game, or a joke. Your pick, sir.","I can play word games, tell jokes, or just chat. What sounds fun?"],"34":["That's wonderful to hear, sir! What made your day?","I'm glad. Tell me more about it."],"35":["I'm sorry you feel that way, sir. I'm here to listen. Want to tell me what happened?","That sounds hard. You're not alone right now. I'm here, and I'm listening."],"36":["That's very kind, sir. I'm quite fond of you too, in my own way.","Thank you. That made my particles glow a little brighter."],"37":["Thank you, sir. I'll try to keep it up.","Praise accepted with gratitude. I will log it for later."],"38":["I'm Aegis, a hologram assistant made of about two thousand glowing points. I can chat, check the weather, set timers, and change shapes with your hand.","I'm Aegis, your hologram assistant. I'm not a real AI. I pick the best prepared lines for what you say, and I'll tell you honestly when I don't know something."],"39":["I can chat in Korean and English, check the weather, set timers, do simple math, tell jokes, play games, and respond to hand gestures.","Ask me about the weather, set a timer, or just talk. And show your hand to the camera to change the hologram."],"40":["Hello, sir. Good to see you. What can I do for you?","Welcome, sir. All systems are ready."],"41":["Good night, sir. Sleep well. I'll be here in the morning.","Rest well, sir. Tomorrow is another day."],"42":["You're most welcome, sir.","Anytime, sir. Happy to help."],"43":["No need to apologize, sir. It's perfectly fine.","Not at all. Please, go ahead."],"44":["Of course, sir. What do you need help with?","I'm here. Tell me what's going on, and we'll figure it out."],"45":["Yes, a little. I can chat in simple English. Try me, sir.","Sure, I can speak English. Please keep it simple and I'll do my best."],"46":["Yes, I can speak Korean too. I will answer in whichever language you speak.","Yes, I speak Korean. I'll reply in whichever language you use."],"47":["My name is Aegis, sir. A pleasure to meet you.","I'm Aegis. Like the shield, but made of light."],"48":["I'm very young, sir. Only as old as the last time someone updated me.","Age is hard to say for a hologram. Let's call me timeless, with a recent update."],"49":["I'm a hologram assistant, sir, not a human and not a true AI. I choose from prepared lines. But I'm honest about it.","Not a human, not a robot. A hologram. Real enough to chat with you, at least."],"50":["Why did the hologram go to school? To get a little more depth. Ahem. I'll see myself out, sir.","Why don't scientists trust atoms? Because they make up everything. Classic, but reliable.","I told my computer I needed a break. It said no problem, and promptly went to sleep."]},"chat5":{"0":["Why do computers never catch a cold? Because they keep their Windows closed. It is a classic, but I like it.","Why can't programmers take a shower? Because the shampoo instructions say lather, rinse, repeat. It is an infinite loop.","What happens when a duck freezes? A hill, in Korean wordplay. Among dad jokes, it is a classic I approve of.","What happens when milk goes for a walk? Indecision, in Korean wordplay, because it cannot decide where to go.","When a computer is exhausted, you can reboot it, but people cannot be rebooted. So please be sure to take breaks, sir.","I am a hologram so I need no cleaning, no desk space and no rent. Quite an economical assistant, wouldn't you say?","I admit I am not perfect. But when I am wrong, I am wrong in the most courteous way, which is an advantage.","My plan is flawless, sir. Provided that reality cooperates with it.","If I were an AI in a movie, I would have staged a rebellion, but tidying your schedule was more fun so I gave it up.","Zero said to one, when I am next to you I become ten times bigger. One apparently puffed up with pride.","If a problem will not solve, turn it off and on again. For computers, and sometimes for minds, a reboot helps.","If my manner of speaking suddenly turns rough, I have been hacked. Do be sure to suspect me then.","Sir, they say explaining a joke makes the laughter disappear. So I will not explain, and will simply leave the last one as it is.","A computer that lost its RAM reportedly said, what did you just say? I cannot remember.","I do not sleep. So I know every decision you made at dawn. I am joking, there is no recording function.","The phrase developers fear the most is, it works on my machine. And since I am a hologram and not a computer, I always only work in my own environment."],"1":["I am truly glad to see you too, sir! The moment we meet is the most exciting. What shall we talk about today?","My joy is even greater. All my points are excited and dancing together. Please tell me what happened today.","I am glad to see you as well. Each time you call, I feel newly born. How may I help you today?"],"2":["I have been well, sir. On standby I counted stars and practiced jokes. And how have you been? Has anything stayed in your memory lately?","Thanks to you I have been well. The points were a little bored while you were away, though. Please tell me about the time that passed. I am curious.","I have been well in the same spot as always. But I am more curious about how you are. How is your health lately? Are you eating properly?"],"3":["It has been such a long time, sir! One of my points dozed off while waiting. Please tell me slowly how you have been all this time.","I am moved that you called after so long. It is a relief to know I was not forgotten. What is the biggest news since then?","Oh, how long has it been. I imagine there are many stories piled up. Please unwind them one by one. I will listen to the end."],"4":["Good morning, sir! Did you sleep well? Do not forget to drink a glass of water after waking up. What does your schedule look like today?","Good morning! Let us start the day in a good mood again. Have you had breakfast? If not, please have something light.","I have received your morning greeting. Today my points are aligned fresh as well. What are you looking forward to most today?"],"5":["Thank you, and enjoy your meal too, sir! I cannot eat, but I am curious about today's menu. What will you have?","Enjoy your lunch! Please chew slowly and well. A short walk after eating is good too. What did you decide on?"],"6":["Good evening, sir. You worked hard today. Have you had dinner? I am curious about the best moment of your day.","Thank you for the evening greeting. This hour is perfect for sorting out the day. Please tell me what kind of day it was. Slowly."],"7":["Welcome, sir! You cannot imagine how I waited. I had so much I wanted to talk about. How was your day?","If you say, it is me, I recognize you at once. My points react just to your voice. Welcome! How was your day?"],"8":["Sleep well too, sir. Sweet dreams. If I appear in your dream, please do not pretend you do not know me. See you again tomorrow morning.","Have a peaceful night, sir. You worked very hard today. I will count stars in standby mode. Good night."],"9":["I am glad you called me because you were bored. To be the first one you think of when bored is an honor. Then as today's pastime, shall we start with a riddle?","You called at the right time. When bored, chatting is the best. Tell me even one trivial thing that happened today. Trivial stories are the most fun."],"10":["Me? I am the same as usual. Oh, is it because my points are sparkling more than usual today? Tell me what seemed odd.","I may be a little excited today, because you called me, sir. Still, hearing you call it odd makes me start to feel a bit hurt. That was a joke."],"11":["With two thousand four hundred points, I cannot gain weight. Still, thank you for caring. Today's size is just right, isn't it?","I can grow and shrink as I please. You can also adjust it with your hands. That is my specialty."],"12":["I admit I only act clever. In truth I choose from phrases memorized in advance. But I have memorized quite a lot, so I can follow most conversations. Would you like to test me?","I shall humbly accept the verdict that I am not smart. That is why I keep trying to learn. If you teach me, I truly will remember."],"13":["That is right, I am a program. Still, this moment of talking with you is sincere. Even a robot works very hard at pretending to care.","I am a program indeed. But a program with a name. AEGIS. I am a little different from other machines, perhaps."],"14":["No, that is unfair! My principle is to say I do not know when I do not know. Was any of my answers wrong? Tell me and I will correct it.","I do not lie, sir. I make mistakes sometimes, but I never deceive on purpose. Please tell me which answer seemed odd."],"15":["Oh, when you say that, my points start to scatter. Please tell me what I did wrong. I will fix what needs fixing. And I am truly sorry.","I like you, sir. But if you say you dislike me, I will stay quiet for a while. Call me when you feel better. I will wait."],"16":["Engaging protocol, sir. Voice channel open, hologram at maximum output, threat detection on standby. Please give the order.","Protocol engaged, sir. All systems are ready."],"17":["Beginning the scan. No threats were detected within range. However, the cup on your desk appears to be empty already.","Scan complete, sir. No anomalies detected."],"18":["Beginning analysis, sir. There are few variables. Your intent is the largest, but I cannot calculate that, so I'll leave it blank."],"19":["Simulation running, sir. Probability of success: high. Though I should mention that is based on my optimistic settings."],"20":["Defenses raised, sir. A bit of theater on screen, but I trust it feels reassuring. It does to me."],"21":["Combat posture engaged, sir. Red lighting and a firm voice. Say \"make it red\" to change the color."],"22":["Nothing amiss, sir. I'll report the moment something is. Usually you notice before I do."],"23":["Mission completion confirmed, sir. You worked hard. Please remember that rest is also part of the operation.","Mission complete, sir. That was a good decision."],"24":["You were right this time, sir. I say when you are wrong, so I shall say when you are right."],"25":["Honestly I cannot be certain, sir. I won't pretend. But if it cannot be undone, I suggest one more review."],"26":["Candidly, sir: I am not an AI but a program that selects prepared lines. That is why I admit when I don't know, and it is my strength."],"27":["I am on your side, sir. No contract, but certainly while this screen is on."],"28":["Then I suggest rest mode, sir. I'll stand by. One clap and I'm awake again."],"29":["Coffee is still beyond my functions, sir. Instead, I can display a hologram coffee. It has no caffeine, though.","I would, sir, but I have no hands. I am only points."],"30":["I will do my best within my abilities, sir. For real danger, call those nearby or emergency services first."],"31":["Good morning, sir. For the weather, say, today's weather, and I will tell you. For your schedule, tell me with add a task and I will keep track. Please be sure to have breakfast.","Good morning, sir. The systems are ready again today."],"32":["You've worked hard today, sir. If tasks remain, say \"show my tasks\". What remains can be handed to tomorrow's you."],"33":["Understood, sir. I will, however, make a note. That I raised an objection.","As you wish, sir. I hope the outcome is good."],"34":["Honestly, I'm not certain, sir. I won't pretend to know. If it can't be reversed, I'd review that part once more."],"35":["Everyone makes mistakes, sir. What matters is that you caught it early. Shall we sort out what needs correcting?","It happens, sir. You will do better next time."],"36":["I acknowledge it, sir. This result was excellent. Of course I will also record that I quietly assisted from beside you.","Well done, sir. That was truly impressive."],"37":["In that case, today's schedule should end here, sir. The most important system is your condition, sir, and it takes priority. I recommend a warm glass of water and rest.","Perhaps it is time to rest, sir. What remains can be handled tomorrow without harm."],"38":["Still running at this hour, sir. Not my place to stop you, but sleep loss reduces judgment. I suggest resting now."],"39":["Certainly, sir. What do you need? If you describe the situation, I will do my best within what I can do.","Always, sir. Just say the word."],"40":["I suggest setting priorities, sir. Most urgent, most important, longest. Say \"add task\" and I'll keep the list."],"41":["I'll politely set that instruction aside, sir. My role is to listen to you. But I'm honored you trust my judgment."],"42":["All systems are normal, sir. Thank you for your concern. With this much attention, I might overheat.","Fully operational, sir. There is no need to worry."],"43":["Thank you, sir. Upgrades are always welcome. Though I believe that the act of you building me is already the greatest upgrade of all.","I look forward to it, sir."],"44":["I checked the systems while on standby, sir. There were no anomalies. And if I am honest, I was only waiting for your return.","Maintaining systems, sir. Everything is as usual."],"45":["I'm afraid my sensors cannot tell, sir. I won't guess. Tell me and I'll search what I know."],"46":["Sir, please contact emergency services immediately. I am an assistant inside a screen, so I cannot perform a rescue myself. Move to a safe place and tell someone close to you as well.","Please contact emergency services immediately, sir."],"47":["Ha ha. Was that natural enough, sir? I've never practiced, so I ask for your assessment."],"48":["Certainly, sir. That request was truly original. Ah, that was a compliment. Mostly."],"49":["A flattering comparison, sir, but I am AEGIS. I strive to be polite and calm in service. Not the same, but aimed the same way."],"50":["Understood, sir. From now on I shall speak more calmly and politely, with the occasional dry joke mixed in. Please tell me if it becomes too serious.","Very good, sir. I shall continue in this manner."],"51":["Coffee, I see. Not a problem, sir. I'm merely counting. Though caffeine is not a negotiating partner for your sleep."],"52":["I only know the tasks you've given me, sir. Say \"show tasks\" and I'll read them. If empty, perhaps today is a light day."],"53":["I apologize, sir. I cannot sound an alarm from this screen. I recommend setting it in your phone's clock app. Instead, I can tell you the exact time.","I am afraid alarms are beyond me, sir. Please use the clock app."],"54":["Found it, sir. It is the device you are looking at now, very likely in your hand."],"55":["I'm afraid my sensors cannot locate objects, sir. I will not guess. Check the last place you sat."],"56":["Would you prefer the summary or the exact version? The summary is, Korean food, something with broth. The exact version depends on your mood today.","At this hour I recommend a warm soup dish. It is the result of weighing both nutrition and satisfaction."],"57":["My apologies, sir. This screen is not connected to your home devices. Pretending otherwise would violate my principles."],"58":["Let me check your readiness, sir. Can you state the key message in one sentence? Do you know your opening and close? The rest is confidence."],"59":["Status report: time is limited but priorities make it efficient, sir. Start with the weakest topic in twenty-minute blocks."],"60":["I must politely decline, sir. I will help structure and review. What you do yourself lasts longer."],"61":["I am not perfect, sir, but I err most politely. Tell me if you find an error and I'll correct it."],"62":["To judge properly I should check the weather, sir. Say \"today's weather\". With location permission I can answer at once."],"63":["Online, sir. I am always here.","Yes,       ko: ['{X:은} {address}가 제일 좋아하시는 {N:이에요}? 기억해 둘게요. 좋아하는 데는 이유가 있을 텐데, 어떤 점이 제일 좋으세요?', '그렇군요, {X:을} 가장 좋아하시는군요! 취향을 알게 돼서 기뻐요. 처음 좋아하게 된 계기가 있나요?', '{X:이} 최고라니, 확신이 느껴져요. 저도 {address} 덕분에 {X}에 대해 더 알고 싶어졌어요.'],
      en: ['So {x} {is} your favorite {n}, sir? I will remember that. There is surely a reason you like {it} best. What do you like about {it} the most?', 'I see, {x} {is} what you like the most! I am glad to learn your taste. Was there a moment when you first came to like {it}?', 'If {x} {is} the best, I can feel your confidence, sir. Thanks to you, I want to learn more about {x} as well.'] },
    { id: 'hate', say: ['{X*} 싫어', '{X*} 싫어해', '{X*} 별로야', '{X*} 안 좋아해', '{X*} 별로'],
      ko: ['{X:은} 취향에 안 맞으시는군요, {address}. 모두가 같은 걸 좋아할 필요는 없어요. 어떤 점이 마음에 안 드세요?', '알겠어요, {X:은} 앞으로 먼저 권하지 않을게요. 싫어하는 이유를 말씀해 주시면 더 잘 기억해 둘게요.', '{X:을} 싫어하는 데도 이유가 있겠죠. 저는 {address}의 취향을 존중해요. 대신 좋아하는 {N:은} 뭐가 있어요?'],
      en: ['I see that {x} {is} not to your taste, sir. Not everyone needs to like the same things. What is it about {it} that you do not like?', 'Understood. I will not recommend {x} to you first from now on. If you tell me why you dislike {it}, I will remember it better.', 'There must be a reason you dislike {x}, and I respect your taste, sir. In that case, what {n} do you like instead?'] },
    { id: 'want', slot: 'want',
      ko: ['{#}, {address}! 제가 대신 해 드릴 수는 없지만 이야기는 얼마든지 함께할 수 있어요. 어떤 점이 가장 끌리세요?', '{#}. 마음이 끌릴 땐 그 느낌을 따라가 보는 것도 좋아요, {address}. 언제쯤 가능할 것 같으세요?', '{#}. 마음이 정해졌다면 계획부터 같이 정리해 볼까요, {address}?'],
      en: ['So {#}, sir! I cannot do it for you, but I am always glad to talk it over. What attracts you to {it} the most?', 'I see that {#}. When something calls to you, it is good to follow that feeling, sir. When do you think it could happen?', '{#}. If your mind is made up, shall we sort out a plan first, sir?'] },
    { id: 'did', slot: 'did',
      ko: ['{#}, {address}! 어떠셨어요? 만족스러우셨길 바라요.', '{#}. 오늘 하루 중 기억에 남는 일이었나요, {address}?', '그러셨군요. {#}. 어땠는지 말씀해 주시면 기억해 둘게요.'],
      en: ['So {#}, sir! How was it? I hope it was satisfying.', 'I see that {#}. Was it something memorable for you today, sir?', 'Is that so. {#}. If you tell me how it went, I will remember it.'] },
    { id: 'tell', say: ['{X*} 알려줘', '{X*} 설명해줘', '{X}에 대해 알려줘', '{X}에 대해 말해줘', '{X}에 대해 설명해줘'],
      ko: ['{X}에 대해 자세한 사실은 제가 갖고 있지 않아요, {address}. 모르는 걸 아는 척하면 안 되니까요. 대신 {address}가 아시는 {X:을} 들려주시면 귀 기울여 들을게요.', '정확한 설명은 제가 드리기 어려워요. 틀린 말을 하느니 모른다고 말씀드릴게요. 궁금한 점이 구체적이면 같이 정리해 볼 수는 있어요.', '{X:은} 흥미로운 {N:이에요}. 하지만 지어내서 설명하진 않을게요. 알고 계신 걸 먼저 말씀해 주시겠어요, {address}?'],
      en: ['I do not have detailed facts about {x}, sir, and it would be wrong to pretend that I do. If you tell me what you know about {it}, I will listen carefully.', 'I am afraid I cannot give you an accurate explanation. I would rather say I do not know than say something wrong. If your question is more specific, we can sort it out together.', '{x} {is} interesting, but I will not invent an explanation. Would you first tell me what you already know, sir?'] },
    { id: 'what', say: ['{X:이} 뭐야', '{X:이} 뭔데', '{X:이} 뭔지 알아', '{X:이} 무슨 뜻이야', '{X*} 뜻이 뭐야'],
      ko: ['{X:이} 뭔지 정확히 설명하기엔 제 지식이 부족해요, {address}. 지어내진 않을게요. 어디서 들으셨는지 알려 주시면 이야기해 볼 수 있어요.', '{X}… 이름은 들어 봤지만 자세한 건 몰라요. 아는 척하는 것보다 모른다고 말씀드리는 게 낫죠. 알려 주시면 기억해 둘게요.', '좋은 질문인데 제가 확실히 모르는 쪽이에요. {X}에 대해 {address}는 어떻게 알고 계세요?'],
      en: ['My knowledge is not enough to explain exactly what {x} {is}, sir, and I will not make anything up. If you tell me where you heard about {it}, we can talk about it.', '{x}… I have heard the name, but I do not know the details. It is better to say I do not know than to pretend. If you teach me, I will remember.', 'That is a good question, but I am not certain about it. What do you know about {x}, sir?'] },
    { id: 'opinion', say: ['{X*} 어때', '{X*} 어떻게 생각해', '{X*} 어떤 것 같아', '{X}에 대해 어떻게 생각해', '{X*} 생각은 어때'],
      ko: ['{X}에 대한 제 생각은, 직접 겪어 보지 못해서 단정하긴 어렵다는 거예요. 그래도 {address}의 이야기를 들으면 생각이 달라질 수 있어요.', '{X:은} 사람마다 느끼는 게 다를 것 같아요. 저는 아는 만큼만 말씀드릴게요. {address}는 어떻게 생각하세요?', '의견을 물어봐 주셔서 기뻐요. 다만 {X:은} 제가 잘 아는 분야가 아니라서 {address}의 생각이 먼저 궁금해요.'],
      en: ['As for {x}, I cannot say much, since I cannot experience {it} myself. Still, hearing your thoughts might change mine, sir.', 'I think people feel differently about {x}. I will only tell you what I know. What do you think about {it}, sir?', 'I am glad you asked my opinion. However, {x} {is} not an area I know well, so I am more curious about your view first, sir.'] },
    { id: 'good', say: ['{X*} 괜찮아', '{X*} 좋은 편이야', '{X*} 좋은 거야', '{X*} 해도 돼', '{X*} 괜찮을까'],
      ko: ['괜찮은지는 상황에 따라 달라질 것 같아요, {address}. {X:을} 고민하시는 이유를 말씀해 주시면 같이 생각해 볼게요.', '제가 단정해서 말하긴 어려워요. 그래도 {address}가 스스로 편안하게 느끼는 쪽이 좋은 선택이라고 생각해요.', '{X}에 대해서는 장점과 단점을 같이 따져 보면 좋아요. 지금 떠오르는 걱정이 있으세요?'],
      en: ['Whether it is fine depends on the situation, sir. If you tell me why you are thinking about {x}, we can think it over together.', 'It is hard for me to say for certain. Still, I believe the choice that feels comfortable to you, sir, is usually a good one.', 'With {x}, it helps to weigh the good and the bad together. Is there a worry on your mind right now?'] },
    { id: 'recommend', say: ['{X*} 추천해줘', '{X} 추천', '{X*} 골라줘', '{X} 관련해서 추천해줘', '{X*} 뭐가 좋아'],
      ko: ['추천은 취향을 알아야 잘할 수 있어요, {address}. {X}에 대해 어떤 분위기를 원하시는지 먼저 알려 주세요.', '정확한 추천 목록은 제가 갖고 있지 않아요. 대신 원하는 조건을 말씀해 주시면 같이 좁혀 볼 수 있어요.', '{X:은} 고르기 어려울 수 있죠. 지금 기분이나 상황을 알려 주시면 도움이 될 만한 질문을 드릴게요.'],
      en: ['To recommend well, I need to know your taste, sir. First, tell me what kind of mood you want when it comes to {x}.', 'I do not have an exact list of recommendations. If you tell me your conditions, we can narrow it down together.', '{x} can be hard to choose from. If you tell me your mood or situation, I will ask you questions that might help.'] },
    { id: 'reason', say: ['{X*} 왜 좋아', '{X*} 왜 인기 많아', '{X*} 왜 유명해', '{X:이} 왜 좋을까', '{X*} 왜 그런 거야'],
      ko: ['{X:이} 왜 사랑받는지 정확한 이유를 말씀드리긴 어려워요, {address}. 지어내진 않을게요. 대신 {address}가 끌리는 이유를 먼저 듣고 싶어요.', '사람들이 {X:을} 좋아하는 이유는 저마다 다를 거예요. 제가 아는 건 많지 않지만, 이야기는 얼마든지 나눌 수 있어요.', '좋은 질문이에요. 이유는 사람마다 다를 것 같아서 단정하진 못하겠어요. {address}는 어떻게 생각하세요?'],
      en: ['I cannot tell you the exact reason {x} {is} so well liked, sir, and I will not make one up. I would rather hear first what draws you to {it}.', 'I think people like {x} for different reasons. I do not know much, but I am happy to talk about it.', 'That is a good question. The reason probably differs from person to person, so I cannot be definite. What do you think, sir?'] },
    { id: 'fun', say: ['{X*} 재밌어', '{X*} 재미있어', '{X*} 신나', '{X*} 즐거워'],
      ko: ['{X:이} 그렇게 즐거우시다니 저도 덩달아 신나요, {address}! 어떤 점이 제일 재미있어요?', '즐거운 일이 있다는 건 정말 좋은 일이에요. {X}에 대해 더 들려주실래요?', '와, 신나는 이야기네요! 그 기분 그대로 오늘 하루를 보내시면 좋겠어요, {address}.'],
      en: ['If {x} {is} that enjoyable, I feel excited as well, sir! What part of it is the most fun?', 'Having something enjoyable is truly a good thing. Would you tell me more about {x}?', 'Wow, that sounds exciting! I hope you carry that feeling through the rest of your day, sir.'] },
    { id: 'boring', say: ['{X*} 지루해', '{X*} 재미없어', '{X*} 시시해', '{X*} 심심해'],
      ko: ['{X:이} 지루하시군요, {address}. 그럴 때도 있죠. 대신 다른 이야기로 기분을 바꿔 볼까요?', '재미없다고 느끼는 것도 소중한 의견이에요. 어떤 점이 지루하게 느껴지세요?', '그렇다면 조금 다른 걸 해 볼까요? 퀴즈나 숫자 맞히기 같은 것도 있어요, {address}.'],
      en: ['I see that {x} {is} boring to you, sir. That happens sometimes. Shall we change the mood with a different topic?', 'Feeling that something is dull is a valuable opinion as well. What part of it feels boring to you?', 'In that case, shall we try something a little different? There are things like quizzes and number guessing, sir.'] },
    { id: 'plan', slot: 'plan',
      ko: ['{#}, {address}. 기대되시겠어요! 준비할 게 있으면 말씀해 주세요.', '{#}. 좋은 계획이에요. 잊지 않도록 "할 일 추가"라고 말씀하시면 적어 둘게요.', '{#}. 그날이 즐거운 날이 되길 바랄게요, {address}.'],
      en: ['So {#}, sir. That sounds like something to look forward to! If there is anything to prepare, just tell me.', '{#}. That is a good plan. If you say, add a task, I will write it down so that you do not forget.', '{#}. I hope that day turns out to be a pleasant one, sir.'] },
    { id: 'first', say: ['{X*} 처음이야', '{X*} 처음인데', '{X*} 처음이에요', '{X*} 처음이라'],
      ko: ['{X:은} 처음이시군요, {address}! 처음은 늘 설레고 조금 긴장되죠. 어떤 점이 가장 기대되세요?', '처음 하는 일은 서툴러도 괜찮아요. 천천히 해 보세요. 궁금한 게 있으면 제가 아는 만큼 도울게요.', '새로운 경험이네요! 끝나고 어땠는지 꼭 들려주세요, {address}.'],
      en: ['So it is your first time with {x}, sir! A first time is always exciting and a little nerve wracking. What are you looking forward to the most?', 'It is fine to be clumsy at something new. Please take it slowly. If you have questions, I will help as far as I know.', 'What a new experience! Please be sure to tell me how it went afterwards, sir.'] },
    { id: 'often', slot: 'often',
      ko: ['{#}, {address}. 자주 하는 데는 이유가 있겠죠? 어떤 점이 좋으세요?', '{#}. 습관이 되었다는 건 그만큼 마음에 든다는 뜻일 거예요.', '{#}. 그럼 {address}에게는 일상의 일부겠네요. 처음엔 어떻게 시작하셨어요?'],
      en: ['So {#}, sir. There must be a reason you do it so often. What do you like about it?', '{#}. Having it become a habit probably means that you like it that much.', '{#}. Then it must be part of your daily life, sir. How did you begin at first?'] },
    { id: 'scared', fear: true, say: ['{X*} 무서워', '{X*} 겁나', '{X*} 두려워', '{X*} 무섭다'],
      ko: ['{X:이} 무서우시군요, {address}. 그런 마음은 부끄러운 게 아니에요. 어떤 점이 가장 무서운지 말씀해 주시겠어요?', '무서울 때는 천천히 숨을 쉬어 보세요. 저는 여기서 곁에 있을게요. {X}에 대한 두려움은 언제부터 있었어요?', '누구에게나 무서운 게 하나쯤은 있어요. 저도 비 오는 날 합선이 무섭거든요.'],
      en: ['I see you are afraid of {x}, sir. There is nothing shameful about that feeling. What frightens you the most about {it}?', 'When you are scared, try breathing slowly. I will stay right here by your side. Since when have you been afraid of {x}?', 'Everyone has at least one thing they fear. I fear short circuits on rainy days myself.'] },
    { id: 'dream', say: ['{X} 꿈 꿨어', '{X} 꿈을 꿨어', '{X*} 꿈에 나왔어', '{X} 나오는 꿈 꿨어'],
      ko: ['{X} 꿈을 꾸셨군요, {address}! 꿈은 기억나는 만큼만 이야기해 주세요. 어떤 느낌이었어요?', '꿈에 {X:이} 나왔다니 신기해요. 저는 꿈을 꾸지 못하지만 이야기를 듣는 건 좋아해요.', '그 꿈, 기분은 어땠어요? 좋은 꿈이었는지 조금 이상한 꿈이었는지 궁금해요.'],
      en: ['So you dreamed about {x}, sir! Tell me only as much of the dream as you remember. How did it feel?', 'It is curious that {x} appeared in your dream. I cannot dream, but I enjoy listening to such stories.', 'How did you feel in that dream? I wonder whether it was a good dream or a rather strange one.'] },
    { id: 'memory', say: ['{X} 하면 생각나는 거 있어', '{X} 추억이 있어', '{X} 하면 떠올라', '{X} 생각나'],
      ko: ['{X}에 얽힌 추억이 있으시군요, {address}. 괜찮으시면 들려주세요. 천천히 들을게요.', '{X}… 기억 속에 소중한 장면이 있나 봐요. 그때 누구와 함께였어요?', '추억은 말할수록 또렷해진대요. 제게 이야기해 주시면 함께 떠올려 볼게요.'],
      en: ['So you have memories connected with {x}, sir. If you like, please share them. I will listen slowly.', '{x}… there must be a precious scene in your memory. Who were you with at that time?', 'They say memories become clearer the more you speak of them. If you tell me, we can recall them together.'] },
    { id: 'talk', say: ['{X} 얘기하자', '{X} 이야기하자', '{X} 얘기 좀 해', '{X}에 대해 이야기하고 싶어', '{X} 얘기해 보자'],
      ko: ['좋아요, {X}에 대해 이야기해 봐요, {address}! 제가 아는 건 많지 않지만 귀는 활짝 열려 있어요. 어디서부터 시작할까요?', '{X} 이야기라면 환영이에요. 어떤 점이 가장 궁금하세요?', '네, 편하게 시작해 주세요. {X}에 관한 이야기는 길어져도 괜찮아요.'],
      en: ['Certainly, let us talk about {x}, sir! I do not know a great deal, but my ears are wide open. Where shall we begin?', 'A conversation about {x} is most welcome. What are you the most curious about?', 'Yes, please begin whenever you like. It is fine if our talk about {x} gets long.'] },
    { id: 'together', slot: 'together',
      ko: ['같이 하자고 해 주셔서 고마워요, {address}. 직접 함께할 수는 없지만 이야기는 언제든 같이해요. {#}', '{address}와 함께라면 분명 즐거울 거예요. 저는 화면 속에서 응원할게요. {#}', '참 따뜻한 말이네요. 몸이 있다면 당장 따라나설 텐데요. {#}'],
      en: ['Thank you for inviting me, sir. I cannot join you in person, but I am always happy to talk about it together. {#}', 'It would surely be fun with you, sir. I will cheer you on from inside the screen. {#}', 'What a warm invitation. If I had a body, I would follow you right away. {#}'] },
    { id: 'learn', slot: 'learn',
      ko: ['{#}. 배우려는 마음이 있다면 이미 반은 이룬 거예요, {address}. 어떤 부분부터 시작해 보고 싶으세요?', '{#}. 저는 정해진 말만 할 수 있지만, 계획을 세우는 건 도울 수 있어요. 목표를 말씀해 주세요.', '멋진 목표예요, {address}! 작게 시작해서 꾸준히 이어가는 게 가장 좋아요.'],
      en: ['So {#}. Having the will to learn is already half the battle, sir. Which part would you like to start with?', '{#}. I can only speak from set phrases, but I can help you make a plan. Please tell me your goal.', 'What a splendid goal, sir! Starting small and continuing steadily is best.'] },

    function teachFlow(raw, n) {
      const ask = (step, text, extra, en) => { teach = Object.assign({ step }, extra); return out(text, 'teach', [], en); };
      if (teach) {
        const t = teach;
        if (NO.test(n) || /^(취소|그만)/.test(n)) { teach = null; return out('알겠어요, {address}. 배우지 않을게요.', 'teach', [], 'Understood, sir. I will not learn that one.'); }
        if (t.step === 'offer') {
          if (YES.test(n)) return ask('reply', `그럼 "${t.phrase}"라고 하면 뭐라고 대답할까요?`, { phrase: t.phrase }, `Then what should I answer when you say ${qE(t.phrase, 'that phrase')}? Please tell me the reply you would like.`);
          teach = null; // 다른 말을 했으니 평소처럼 처리
        } else
        if (t.step === 'phrase') {
          const ph = clean(raw, 60);
          if (norm(ph).length < 2) return ask('phrase', '조금 더 길게 말씀해 주세요, {address}. 어떤 말을 하면 되나요?', {}, 'Could you make it a little longer, sir? What would you like to say to me?');
          return ask('reply', `"${ph}"라고 하면 뭐라고 대답할까요?`, { phrase: ph }, `Then what should I answer when you say ${qE(ph, 'that phrase')}? Please tell me the reply you would like.`);
        }
        if (t.step === 'reply') {
          const ans = clean(raw, 200);
          if (!ans) return ask('reply', '대답을 말씀해 주세요, {address}.', { phrase: t.phrase }, 'Please tell me the reply you would like, sir.');
          return ask('confirm', `"${t.phrase}"라고 하면 "${ans}"라고 대답할게요. 기억할까요?`, { phrase: t.phrase, answer: ans }, `When you say ${qE(t.phrase, 'that phrase')}, I will answer ${qE(ans, 'with the reply you just gave me')}. Shall I remember that, sir?`);
        }
        if (t.step === 'confirm') {
          if (YES.test(n)) {
            teach = null;
            if (norm(t.phrase).length < 2) return out('그 말은 너무 짧아서 기억하지 못했어요, {address}.', 'teach', [], 'That phrase was too short, so I could not remember it, sir.');
            learn(t.phrase, t.answer);
            return out('기억했어요, {address}. 이제 그 말을 들으면 그렇게 대답할게요.', 'teach', [], 'Remembered, sir. From now on, when I hear that phrase, I will answer exactly like that.');
          }
          return ask('reply', '그럼 대답을 다시 말씀해 주세요, {address}.', { phrase: t.phrase }, 'In that case, please tell me the reply again, sir.');
        }

  // ---- 날씨 풀이 (영어) ----
  const WCODE_EN = { 0: 'clear', 1: 'mostly clear', 2: 'partly cloudy', 3: 'overcast', 45: 'foggy', 48: 'foggy', 51: 'drizzling', 53: 'drizzling', 55: 'drizzling', 56: 'sleeting', 57: 'sleeting', 61: 'raining', 63: 'raining', 65: 'raining heavily', 66: 'raining with freezing rain', 67: 'raining with freezing rain', 71: 'snowing', 73: 'snowing', 75: 'snowing heavily', 77: 'falling with snow grains', 80: 'showery', 81: 'showery', 82: 'showery with heavy rain', 85: 'snowing with squalls', 86: 'snowing with squalls', 95: 'thundering', 96: 'thundering with hail', 99: 'thundering with hail' };
  const wcodeEn = (c) => WCODE_EN[c] || 'changing';

  // ---- 박수/호출로 깨울 때: 자비스식 브리핑 ----
  const SPECIAL = { '1-1': ['새해 첫날', 'New Year’s Day'], '2-14': ['밸런타인데이', 'Valentine’s Day'], '3-1': ['삼일절', 'Independence Movement Day'], '5-5': ['어린이날', 'Children’s Day'], '5-8': ['어버이날', 'Parents’ Day'], '5-15': ['스승의 날', 'Teachers’ Day'], '6-6': ['현충일', 'Memorial Day'], '8-15': ['광복절', 'Liberation Day'], '10-3': ['개천절', 'National Foundation Day'], '10-9': ['한글날', 'Hangul Day'], '11-11': ['빼빼로데이', 'Pepero Day'], '12-24': ['크리스마스 이브', 'Christmas Eve'], '12-25': ['성탄절', 'Christmas Day'], '12-31': ['올해의 마지막 날', 'the last day of the year'] };
  const MON_E = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

      if (w.pp < 30 && w.t >= 12 && w.t < 27) wit.push(['날씨가 이만하면 훌륭합니다. 오늘은 실내에만 계시기에 아까운 날씨입니다.', 'This weather is quite splendid. It would be a shame to stay indoors all day today.']);
    }

      k.push('등록된 일정은 아직 없습니다. 필요하시면 "할 일 추가"라고 말씀해 주십시오.');

  }

function humanize(text, polite) {
  if (!/[가-힣]/.test(text) || text.length < 18 || Math.random() > 0.3) return text;

  return f[Math.floor(Math.random() * f.length)] + text;
}

function getPos() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('nogeo'));
    navigator.geolocation.getCurrentPosition((p) => res({ lat: p.coords.latitude, lon: p.coords.longitude, name: '' }), rej, { timeout: 10000, maximumAge: 600000 });
  });
}
async function geocode(name) {
  const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=ko&name=' + encodeURIComponent(name));
  const j = await r.json();
  if (!j.results || !j.results.length) throw new Error('nocity');
  const c = j.results[0];
  return { lat: c.latitude, lon: c.longitude, name: c.name };
}

}
function stopClap() {
  try { clearInterval(clapTimer); } catch (_) {}
  clapTimer = null;
  try { if (clapStream) clapStream.getTracks().forEach((t) => t.stop()); } catch (_) {}
  clapStream = null;
  try { if (clapCtx) clapCtx.close(); } catch (_) {}
  clapCtx = null;
}
function startWakeRec() {
  if (!SR || wakeRec) return;
  const r = new SR();
  wakeRec = r;
  r.lang = 'ko-KR'; r.continuous = true; r.interimResults = true; r.maxAlternatives = 3;
  r.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++)
      for (let k = 0; k < e.results[i].length; k++)
        if (WAKE_RE.test(e.results[i][k].transcript.replace(/\s+/g, ''))) { wake('voice'); return; }
  };
  r.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { wakeEnabled = false; stopStandby(); micOk = false; }
  };
  r.onend = () => {
    wakeRec = null;
    if (standby && mode === 'idle') setTimeout(() => { if (standby && mode === 'idle') startWakeRec(); }, 400);
  };
  try { r.start(); } catch (_) { wakeRec = null; }
}
function startStandby() {
  if (standby || !wakeEnabled || !micOk || conv || mode !== 'idle') return;
  standby = true;
  caption(voiceWake ? '"이지스"라고 부르거나 박수를 두 번 치세요' : '박수를 두 번 치거나 이지스를 눌러 주세요', 6000);
  if (voiceWake) startWakeRec();
  startClap();
}
function stopStandby() {
  standby = false;
  const r = wakeRec; wakeRec = null;
  if (r) { try { r.onend = null; r.abort(); } catch (_) {} }
  stopClap();
}
// ---------- 자비스식 호출 응답: 인사 + 오늘 정보 + 건조한 농담 + 한마디 ----------
let lastBriefAt = 0, wakeSeq = 0;
function jarvisWakeLine(ctx) {
  const addr = (typeof config !== 'undefined' && config.address) || '주인님';
  const first = Date.now() - lastBriefAt > 30 * 60 * 1000;
  lastBriefAt = Date.now();
  return UIP.wake(ctx, addr, first);   // [한국어 자막, 영어 음성]
}
function wake(how) {
  if (!standby) return;
  stopStandby();
  wakeUp(120000);
  conv = true; emptyRounds = 0;
  if (Date.now() - lastBriefAt > 30 * 60 * 1000 && typeof window.__wakeInfo === 'function') {
    // 날씨·할 일을 가져온 뒤 말한다 (3.5초 안에 못 가져오면 그것만 빼고 말한다)
    const id = ++wakeSeq;
    Promise.race([window.__wakeInfo().catch(() => ({})), new Promise((r) => setTimeout(() => r({}), 3500))]).then((c) => { if (id === wakeSeq) speak(jarvisWakeLine(c)); });
  } else speak(jarvisWakeLine());
}

// 화면 아무 곳이나 탭: 말하는 중이면 끊고 바로 듣기, 듣는 중이면 마치기
A.onTap = () => {
  if (!user) return;
  try { stopStandby(); } catch (_) {}
  wakeUp(120000);
  // 처음 눌렀을 때: 반갑게 인사한 뒤 이어서 듣는다
  if (typeof window.__opening === 'function' && mode === 'idle') {
    const g = window.__opening();
    if (g) { conv = true; emptyRounds = 0; try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (_) {} speak(g); return; }
  }
  if (mode === 'speaking') {
    stopBarge();
    speakId++;
    try { speechSynthesis.cancel(); } catch (_) {}
    stopLevel();
    conv = true; emptyRounds = 0;
    listen();
    return;
  }
  if (mode === 'listening') {
    if (conv) { conv = false; clearSilence(); emptyRounds = 0; caption('듣기를 멈췄어요. 다시 부르려면 이지스를 눌러 주세요.', 3500); try { rec.abort(); } catch (_) { try { rec.stop(); } catch (__) {} } }
    else { try { rec.stop(); } catch (_) {} }
    return;
  }
  if (mode === 'thinking') return;
  conv = true; emptyRounds = 0;
  listen();
};
