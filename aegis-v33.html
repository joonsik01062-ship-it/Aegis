<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02060d">
<title>이지스 · AEGIS</title>
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--c:#4fd8ff;--bright:#d6f6ff;--dim:rgba(79,216,255,.55);--line:rgba(79,216,255,.2)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#02060d;color:var(--bright);font-family:"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.fx{position:fixed;inset:0;pointer-events:none;z-index:2;background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(79,216,255,.02) 4px),radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.72) 100%)}
.frame{position:fixed;z-index:3;pointer-events:none;width:26px;height:26px;border-color:rgba(79,216,255,.6)}
.f1{top:calc(14px + env(safe-area-inset-top));left:14px;border-top:1px solid;border-left:1px solid}
.f2{top:calc(14px + env(safe-area-inset-top));right:14px;border-top:1px solid;border-right:1px solid}
.f3{bottom:calc(14px + env(safe-area-inset-bottom));left:14px;border-bottom:1px solid;border-left:1px solid}
.f4{bottom:calc(14px + env(safe-area-inset-bottom));right:14px;border-bottom:1px solid;border-right:1px solid}
.hud{position:fixed;z-index:5;pointer-events:none;text-transform:uppercase;text-shadow:0 0 12px rgba(79,216,255,.45)}
.brand{top:calc(30px + env(safe-area-inset-top));left:30px;letter-spacing:.42em}
.brand b{display:block;font-size:19px;font-weight:600;color:var(--bright);margin-bottom:7px}
.brand span{font-size:8.5px;letter-spacing:.3em;color:var(--dim)}
.clock{top:calc(30px + env(safe-area-inset-top));right:30px;text-align:right;letter-spacing:.2em}
.clock b{display:block;font-size:17px;font-weight:400;color:var(--bright);font-variant-numeric:tabular-nums}
.clock span{font-size:8.5px;color:var(--dim);letter-spacing:.2em}
.status{left:50%;bottom:calc(54px + env(safe-area-inset-bottom));transform:translateX(-50%);text-align:center;letter-spacing:.38em}
.status .row{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;color:var(--bright)}
.status small{display:block;margin-top:8px;font-size:11px;letter-spacing:.2em;color:var(--dim);text-transform:none}
#dot{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);animation:blink 2.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.hint{left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:14px;letter-spacing:.12em;color:rgba(140,230,255,.9);animation:hp 1.8s ease-in-out infinite;white-space:nowrap;text-transform:none}
.greet{left:50%;top:calc(10% + env(safe-area-inset-top));transform:translateX(-50%);font-size:14px;letter-spacing:.14em;text-transform:none;color:var(--bright);white-space:nowrap;min-height:20px}
.greet:after{content:"";display:inline-block;width:7px;height:14px;margin-left:4px;vertical-align:-2px;background:var(--c);box-shadow:0 0 8px var(--c);animation:blink 1s steps(2) infinite}
@media(max-width:600px){
.greet{font-size:12px;top:calc(13% + env(safe-area-inset-top))}
.brand{left:22px;top:calc(26px + env(safe-area-inset-top))}.brand b{font-size:16px}
.clock{right:22px;top:calc(26px + env(safe-area-inset-top))}.clock b{font-size:14px}
.status .row{font-size:12px}.status small{font-size:10px}
}
@keyframes hp{50%{opacity:.35}}
.caption{left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(86vw,560px);text-align:center;font-size:15px;line-height:1.55;letter-spacing:.04em;text-transform:none;color:var(--bright);opacity:0;transition:opacity .35s;max-height:6.4em;overflow:hidden}
.caption.on{opacity:.92}
</style>
</head>
<body>
<canvas id="hud" aria-label="AEGIS 인터페이스"></canvas>
<div class="fx"></div>
<div class="frame f1"></div><div class="frame f2"></div><div class="frame f3"></div><div class="frame f4"></div>
<div class="hud brand"><b>이지스 · AEGIS</b><span id="sub">Personal AI Assistant</span></div>
<div class="hud clock"><b id="time">--:--:--</b><span id="date">---</span></div>
<div class="hud status"><div class="row"><i id="dot"></i><span id="stLabel">STANDBY</span></div><small id="stKo">대기 중</small></div>
<div class="hud greet" id="greet"></div>
<div class="hud caption" id="caption"></div>
<div class="hud hint" id="hint"></div>

<script>
(()=>{
'use strict';
const cv=document.getElementById('hud'),ctx=cv.getContext('2d');
const TAU=Math.PI*2;

// 상태별 움직임 설정. 실제 앱에서는 window.Aegis.setState()로 바꾼다.
const STATES={
  idle:     {label:'STANDBY',    ko:'대기 중',    speed:1,   amp:.10, glow:.75},
  listening:{label:'LISTENING',  ko:'듣는 중',    speed:1.5, amp:.50, glow:1.0},
  thinking: {label:'PROCESSING', ko:'생각하는 중', speed:3.4, amp:.22, glow:1.15},
  speaking: {label:'RESPONDING', ko:'말하는 중',  speed:1.9, amp:.78, glow:1.3}
};
const ORDER=['idle','listening','thinking','speaking'];

let state='idle',W=0,H=0,dpr=1,cx=0,cy=0,R=120,bg=null;
const cur={speed:1,amp:.1,glow:.75};
let ext=null,phase=0,t=0,last=performance.now(),dtG=.016;
let bootT=0;const BOOT=2.6;           // 부팅 연출 시간(초)
const easeOut=x=>1-Math.pow(1-x,3);
let GREETING='안녕하세요, 주인님. 이지스 가동되었습니다.';
let greetT0=BOOT*.7;                  // 인사말 타이핑 시작 시각
let master=false,masterT=0;           // 마스터 모드(전환 연출용 0~1)

const C=a=>`rgba(79,216,255,${a})`;
const B=a=>`rgba(214,246,255,${a})`;
const parts=Array.from({length:55},()=>({x:Math.random(),y:Math.random(),v:Math.random()*.012+.004,r:Math.random()*1.1+.4,a:Math.random()*.35+.1}));

function buildBg(){
  bg=document.createElement('canvas');
  bg.width=Math.round(W*dpr);bg.height=Math.round(H*dpr);
  const b=bg.getContext('2d');b.scale(dpr,dpr);
  b.fillStyle='#02060d';b.fillRect(0,0,W,H);
  const g=b.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.62);
  g.addColorStop(0,'rgba(18,90,150,.40)');g.addColorStop(.45,'rgba(8,42,76,.22)');g.addColorStop(1,'rgba(0,0,0,0)');
  b.fillStyle=g;b.fillRect(0,0,W,H);
  b.fillStyle='rgba(79,216,255,.10)';
  for(let x=cx%38;x<W;x+=38)for(let y=cy%38;y<H;y+=38)b.fillRect(x-.5,y-.5,1,1);
  b.strokeStyle='rgba(79,216,255,.07)';b.lineWidth=1;
  b.beginPath();b.moveTo(0,cy);b.lineTo(cx-R*1.9,cy);b.moveTo(cx+R*1.9,cy);b.lineTo(W,cy);
  b.moveTo(cx,0);b.lineTo(cx,cy-R*1.9);b.moveTo(cx,cy+R*1.9);b.lineTo(cx,H);b.stroke();
}

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  cx=W/2;cy=H*(W<H?.46:.5);
  R=Math.min(W*.268,H*(W<H?.2:.22),260);
  buildBg();
}

function arc(r,s,l,lw,col){ctx.beginPath();ctx.arc(0,0,r,s,s+l);ctx.lineWidth=lw;ctx.strokeStyle=col;ctx.stroke();}
function circle(r,lw,col){arc(r,0,TAU,lw,col);}
function ticks(r,n,len,every,rot,col,lw){
  ctx.beginPath();
  for(let i=0;i<n;i++){
    const a=i/n*TAU+rot,l=i%every===0?len*2.2:len,c=Math.cos(a),s=Math.sin(a);
    ctx.moveTo(c*r,s*r);ctx.lineTo(c*(r+l),s*(r+l));
  }
  ctx.lineWidth=lw||1;ctx.strokeStyle=col;ctx.stroke();
}
function glow(px,col){ctx.shadowColor=col;ctx.shadowBlur=px;}
function noGlow(){ctx.shadowBlur=0;}

// 3D 입자 홀로그램: 점 NP개가 모양(구, 원자, 은하, 사람)으로 모였다가 다른 모양으로 변한다.
const NP=2400,SHAPES=['sphere','atom','galaxy','human','heart','dna','torus','cube','saturn','tornado','wave','pyramid','suit1','suit2','suit3','suit4','suit5','butterfly','star','crown','rocket','lightning','flower','sun','tree','shield','globe','hourglass','infinity','wings','knot','mobius','coil','crescent','fountain','matrix','tesseract','sword'],SHAPE_KO={sphere:'구',atom:'원자',galaxy:'은하',human:'사람',heart:'하트',dna:'이중 나선',torus:'도넛',cube:'큐브',saturn:'토성',tornado:'회오리',wave:'파도',pyramid:'피라미드',suit1:'이지스 슈트 1',suit2:'이지스 슈트 2',suit3:'이지스 슈트 3',suit4:'이지스 슈트 4',suit5:'이지스 슈트 5',butterfly:'나비',star:'별',crown:'왕관',rocket:'로켓',lightning:'번개',flower:'꽃',sun:'태양',tree:'나무',shield:'방패',globe:'지구본',hourglass:'모래시계',infinity:'무한대',wings:'날개',knot:'매듭',mobius:'뫼비우스 띠',coil:'용수철',crescent:'초승달',fountain:'분수',matrix:'디지털 비',tesseract:'초입방체',sword:'검'};
const cp=new Float32Array(NP*3),tp=new Float32Array(NP*3),pph=new Float32Array(NP),pq=new Array(NP);
let shape='sphere',morph=0,yaw=0,pitch=.38,dragYaw=0,dragPitch=0;
const hand={on:false,x:.5,y:.5,pinch:.5,open:.5},hs={x:.5,y:.5,pinch:.5,open:0,on:0,sc:1};
const rnd=()=>Math.random();

// ===== 부품을 조합해서 만드는 모양들 (y는 위쪽이 +, 점을 찍을 때 뒤집는다) =====
const SH2={};
const R_=()=>Math.random();
const rv=()=>{const y=1-2*R_(),r=Math.sqrt(1-y*y),a=R_()*TAU;return[Math.cos(a)*r,y,Math.sin(a)*r];};
const cap=(x1,y1,z1,x2,y2,z2,r,zs=1)=>()=>{const u=R_(),v=rv(),k=r*Math.cbrt(.35+.65*R_());return[x1+(x2-x1)*u+v[0]*k,y1+(y2-y1)*u+v[1]*k,(z1+(z2-z1)*u)+v[2]*k*zs];};
const sph=(cx,cy,cz,r,shell=false,zs=1)=>()=>{const v=rv(),k=shell?r*(.92+.08*R_()):r*Math.cbrt(R_());return[cx+v[0]*k,cy+v[1]*k,cz+v[2]*k*zs];};
const rng=(cx,cy,cz,r,tilt=0,w=.012)=>()=>{const a=R_()*TAU,x=Math.cos(a)*r,z=Math.sin(a)*r,y=(R_()-.5)*w;return[cx+x,cy+y*Math.cos(tilt)+z*Math.sin(tilt)*0+Math.sin(tilt)*z,cz+z*Math.cos(tilt)-y*Math.sin(tilt)];};
const disc=(cx,cy,cz,r,nx,ny,nz,th=.02)=>()=>{const a=R_()*TAU,k=r*Math.sqrt(R_());let ux=0,uy=1,uz=0;if(Math.abs(ny)>.9){ux=1;uy=0;}let ax=ny*uz-nz*uy,ay=nz*ux-nx*uz,az=nx*uy-ny*ux;const al=Math.hypot(ax,ay,az)||1;ax/=al;ay/=al;az/=al;const bx=ny*az-nz*ay,by=nz*ax-nx*az,bz=nx*ay-ny*ax;const c=Math.cos(a)*k,d=Math.sin(a)*k,e=(R_()-.5)*th;return[cx+ax*c+bx*d+nx*e,cy+ay*c+by*d+ny*e,cz+az*c+bz*d+nz*e];};
const tri=(a,b,c,th=.02)=>()=>{let u=R_(),v=R_();if(u+v>1){u=1-u;v=1-v;}const e=(R_()-.5)*th;return[a[0]+(b[0]-a[0])*u+(c[0]-a[0])*v,a[1]+(b[1]-a[1])*u+(c[1]-a[1])*v,a[2]+(b[2]-a[2])*u+(c[2]-a[2])*v+e];};
const line=(a,b,r=.012)=>cap(a[0],a[1],a[2],b[0],b[1],b[2],r);
const fn=(f)=>()=>f();
function assemble(parts,out,put){
  const tot=parts.reduce((q,p)=>q+p[0],0);let i=0;
  for(const [w,f] of parts){const n=Math.round(NP*w/tot);for(let k=0;k<n&&i<NP;k++,i++){const p=f();put(i,p[0],-p[1],p[2]);}}
  for(;i<NP;i++){const p=parts[0][1]();put(i,p[0],-p[1],p[2]);}
}
// 이지스 슈트(오리지널 디자인 5종): 같은 몸 뼈대에 부품만 바꾼다
function suitParts(o){
  const sg=[-1,1],P=[];
  const sh=o.sh||1,ch=o.ch||1,al=o.arm||.06,gl=o.gl||.075,lg=o.lg||.085,hy=o.y||0;
  P.push([5,sph(0,.8+hy,0,.12*(o.head||1),true,.9)]);                              // 투구
  P.push([2,line([0,.75+hy,.1],[0,.84+hy,.1],.03)]);                               // 얼굴 가리개 선
  P.push([2,rng(0,.8+hy,0,.14*(o.head||1),0,.02)]);
  P.push([2,cap(0,.68+hy,0,0,.6+hy,0,.05)]);
  P.push([12,cap(0,.58+hy,0,0,.28+hy,0,.19*ch,.55)]);                              // 가슴
  P.push([6,cap(0,.28+hy,0,0,.06+hy,0,.13*ch,.5)]);                                // 배
  P.push([4,cap(-.12,.04+hy,0,.12,.04+hy,0,.12,.5)]);                              // 골반
  for(const x of sg){
    P.push([4,sph(x*.31*sh,.6+hy,0,.1*sh)]);                                       // 어깨
    P.push([5,cap(x*.31*sh,.58+hy,0,x*(.42+(o.spread||0))*sh,.26+hy,0,al*1.5)]);   // 위팔
    P.push([6,cap(x*(.42+(o.spread||0))*sh,.26+hy,0,x*(.46+(o.spread||0)*1.4)*sh,-.08+hy,.03,gl*1.25)]); // 아래팔(건틀릿)
    P.push([3,sph(x*(.47+(o.spread||0)*1.4)*sh,-.14+hy,.03,.06+(o.fist||0))]);
    P.push([7,cap(x*.1,.0+hy,0,x*.13,-.45+hy,0,lg*1.2)]);                          // 허벅지
    P.push([7,cap(x*.13,-.47+hy,0,x*.14,-.9+hy,0,lg)]);                            // 정강이
    P.push([3,cap(x*.14,-.92+hy,.04,x*.14,-.95+hy,.14,.07,.6)]);                   // 발
    P.push([1.5,line([x*.31*sh,.64+hy,.07],[x*.1,.6+hy,.14],.012)]);               // 어깨선
  }
  P.push([2,rng(0,.42+hy,0,.2*ch,Math.PI/2,.02)]);                                // 가슴 장식 띠
  P.push([1.4,line([-.17*ch,.46+hy,.1],[.17*ch,.46+hy,.1],.012)]);
  return P;
}
SH2.suit1=(out,put)=>{ // 스카우트: 날씬하고 가벼운 몸, 등에 부스터 두 개
  const P=suitParts({arm:.05,gl:.06,lg:.07,ch:.9});
  P.push([4,cap(-.1,.5,-.17,-.1,.15,-.2,.05)]);P.push([4,cap(.1,.5,-.17,.1,.15,-.2,.05)]);
  P.push([3,cap(-.1,.1,-.22,-.1,-.12,-.22,.04)]);P.push([3,cap(.1,.1,-.22,.1,-.12,-.22,.04)]);
  P.push([2,disc(0,.4,.13,.07,0,0,1,.02)]);
  assemble(P,out,put);
};
SH2.suit2=(out,put)=>{ // 타이탄: 넓은 어깨와 커다란 주먹, 어깨 뿔
  const P=suitParts({sh:1.35,ch:1.45,arm:.085,gl:.115,lg:.115,head:.85,fist:.05});
  for(const x of [-1,1]){
    P.push([3,cap(x*.42,.66,0,x*.5,.9,0,.04)]);P.push([2,cap(x*.42,.66,0,x*.62,.8,0,.035)]);
    P.push([3,disc(x*.17,-.62,.13,.1,0,0,1,.03)]);P.push([3,disc(x*.17,.1,.12,.09,0,0,1,.03)]);
  }
  P.push([3,sph(0,.32,.12,.07,true)]);
  assemble(P,out,put);
};
SH2.suit3=(out,put)=>{ // 윙: 팔 벌린 자세, 등에서 갈라지는 깃 날개
  const P=suitParts({spread:.12,arm:.05,gl:.065,lg:.07,ch:.95});
  for(const x of [-1,1])for(let k=0;k<9;k++){
    const a=-.25+k*.2,len=.55+.5*Math.sin(k/8*Math.PI)+k*.02;
    P.push([2.6,line([x*.12,.5,-.1],[x*(.12+Math.cos(a)*len*1.15),.5+Math.sin(a)*len*.9,-.2-k*.015],.016)]);
    if(k>0&&k<8)P.push([1.4,tri([x*.12,.5,-.1],[x*(.12+Math.cos(a)*len*1.15),.5+Math.sin(a)*len*.9,-.2-k*.015],[x*(.12+Math.cos(a-.2)*(len-.05)*1.15),.5+Math.sin(a-.2)*(len-.05)*.9,-.2-(k-1)*.015],.012)]);
  }
  assemble(P,out,put);
};
SH2.suit4=(out,put)=>{ // 가디언: 왼팔 방패, 오른손 검, 투구 볏
  const P=suitParts({sh:1.15,ch:1.2,arm:.07,gl:.09,lg:.095});
  P.push([9,disc(-.62,.18,.1,.3,0,0,1,.05)]);P.push([4,rng(-.62,.18,.1,.3,0,.04)]);P.push([2,rng(-.62,.18,.12,.18,0,.03)]);
  P.push([3,sph(-.62,.18,.14,.06,true)]);
  P.push([5,line([.5,-.14,.05],[.5,.95,.05],.025)]);P.push([2,line([.4,-.04,.05],[.6,-.04,.05],.02)]);P.push([2,tri([.5,.95,.05],[.46,.55,.05],[.54,.55,.05],.02)]);
  P.push([4,cap(0,.9,-.08,0,.9,.12,.03)]);P.push([3,cap(0,.92,-.1,0,1.02,.0,.025)]);
  assemble(P,out,put);
};
SH2.suit5=(out,put)=>{ // 나노: 공중에 뜬 몸, 머리 뒤 고리, 몸 둘레를 도는 조각, 발끝 분사
  const P=suitParts({y:.15,spread:.1,arm:.055,gl:.07,lg:.075,ch:.95});
  P.push([4,rng(0,.95,-.08,.26,.45,.02)]);P.push([2,rng(0,.95,-.08,.31,.45,.012)]);
  for(let k=0;k<14;k++){const a=k/14*TAU,rr=.72+.12*Math.sin(k*2.1),y=.7-.18*((k*5)%9)/2,c=[Math.cos(a)*rr,y,Math.sin(a)*rr];P.push([1.2,tri([c[0],c[1],c[2]],[c[0]+.1,c[1]+.04,c[2]],[c[0]+.03,c[1]+.12,c[2]+.03],.015)]);}
  for(const x of [-1,1])P.push([4,()=>{const t=R_();return[x*.14+(R_()-.5)*.08*t,-.75-t*.5,.05+(R_()-.5)*.08*t];}]);
  assemble(P,out,put);
};
SH2.butterfly=(out,put)=>{for(let i=0;i<NP;i++){const t=R_()*TAU*2-TAU,r=Math.exp(Math.sin(t))-2*Math.cos(4*t)+Math.pow(Math.sin((2*t-Math.PI)/24),5),k=i%3?Math.sqrt(R_()):1,x=Math.sin(t)*r*k*.3,y=Math.cos(t)*r*k*.3;put(i,x,-(y-.1),Math.sin(Math.abs(x)*3.2)*.16*k+(R_()-.5)*.03);}};
SH2.star=(out,put)=>{const V=[];for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,r=k%2?.42:.98;V.push([Math.cos(a)*r,Math.sin(a)*r]);}
  for(let i=0;i<NP;i++){const e=Math.floor(R_()*10),A=V[e],B=V[(e+1)%10];if(i%10<3){const u=R_();put(i,A[0]+(B[0]-A[0])*u,A[1]+(B[1]-A[1])*u,(R_()-.5)*.08);}else{let u=R_(),v=R_();if(u+v>1){u=1-u;v=1-v;}const x=A[0]*u+B[0]*v,y=A[1]*u+B[1]*v,k=1-Math.hypot(x,y)/1.0;put(i,x,y,(R_()-.5)*.4*Math.max(.1,k)+(k>.5?(R_()<.5?.12:-.12):0));}}};

function genShape(name){
  const out=new Float32Array(NP*3),ga=Math.PI*(3-Math.sqrt(5));
  const put=(i,x,y,z)=>{out[i*3]=x;out[i*3+1]=y;out[i*3+2]=z;};
  if(name==='sphere'){
    for(let i=0;i<NP;i++){const y=1-2*(i+.5)/NP,r=Math.sqrt(1-y*y),a=i*ga;put(i,Math.cos(a)*r,y,Math.sin(a)*r);}
  }else if(name==='atom'){
    for(let i=0;i<NP;i++){
      if(i<NP*.28){const y=1-2*rnd(),r=Math.sqrt(1-y*y),a=rnd()*TAU,k=.3*Math.cbrt(rnd());put(i,Math.cos(a)*r*k,y*k,Math.sin(a)*r*k);}
      else{
        const ring=i%3,th=rnd()*TAU,tilt=[.0,1.05,-1.05][ring],roll=[0,.9,2.1][ring];
        let x=Math.cos(th),y=(rnd()-.5)*.03,z=Math.sin(th);
        const y1=y*Math.cos(tilt)-z*Math.sin(tilt),z1=y*Math.sin(tilt)+z*Math.cos(tilt);
        put(i,x*Math.cos(roll)-z1*Math.sin(roll),y1,x*Math.sin(roll)+z1*Math.cos(roll));
      }
    }
  }else if(name==='galaxy'){
    for(let i=0;i<NP;i++){
      const arm=i%3,d=Math.pow(rnd(),.6),ang=d*5.2+arm*TAU/3+(rnd()-.5)*.55*(1-d*.5);
      put(i,Math.cos(ang)*d*1.15,(rnd()-.5)*.14*(1.2-d),Math.sin(ang)*d*1.15);
    }
  }else if(name==='heart'){
    for(let i=0;i<NP;i++){
      const th=rnd()*TAU,hx=16*Math.pow(Math.sin(th),3),hy=13*Math.cos(th)-5*Math.cos(2*th)-2*Math.cos(3*th)-Math.cos(4*th);
      const edge=i%5<2,k=edge?1:Math.sqrt(rnd()),zt=(edge?.14:.5)*Math.sqrt(Math.max(0,1-k*k))*(rnd()*2-1)+(edge?(rnd()-.5)*.12:0);
      put(i,hx/17*k*.95,-(hy/17*k*.95-.08),zt);
    }
  }else if(name==='dna'){
    for(let i=0;i<NP;i++){
      const u=rnd()*2-1,a=u*3*TAU/2;
      if(i%7===0){const rr=rnd()*2-1;put(i,Math.cos(a)*.42*rr,u*.95,Math.sin(a)*.42*rr);} // 가로대
      else{const st=i%2?0:Math.PI;put(i,Math.cos(a+st)*.42+(rnd()-.5)*.05,u*.95,Math.sin(a+st)*.42+(rnd()-.5)*.05);}
    }
  }else if(name==='torus'){
    for(let i=0;i<NP;i++){const u=rnd()*TAU,v=rnd()*TAU,r=.3+(rnd()-.5)*.04;put(i,(.68+r*Math.cos(v))*Math.cos(u),r*Math.sin(v),(.68+r*Math.cos(v))*Math.sin(u));}
  }else if(name==='cube'){
    const h=.62;
    for(let i=0;i<NP;i++){
      if(i%100<55){const ax=Math.floor(rnd()*3),a=[(rnd()<.5?-h:h),(rnd()<.5?-h:h)],t2=(rnd()*2-1)*h,v=[0,0,0];let c=0;for(let q=0;q<3;q++)v[q]=q===ax?t2:a[c++];put(i,v[0]+(rnd()-.5)*.02,v[1]+(rnd()-.5)*.02,v[2]+(rnd()-.5)*.02);}
      else{const f=Math.floor(rnd()*6),sg=f%2?1:-1,ax=f>>1,v=[(rnd()*2-1)*h,(rnd()*2-1)*h,(rnd()*2-1)*h];v[ax]=sg*h;put(i,v[0],v[1],v[2]);}
    }
  }else if(name==='saturn'){
    const tilt=.42;
    for(let i=0;i<NP;i++){
      if(i%100<38){const y=1-2*rnd(),r=Math.sqrt(1-y*y),a=rnd()*TAU;put(i,Math.cos(a)*r*.42,y*.42,Math.sin(a)*r*.42);}
      else{const a=rnd()*TAU,d=.62+rnd()*.42,band=(Math.floor(rnd()*3)===1)?-.03:0,x=Math.cos(a)*(d+band),z=Math.sin(a)*(d+band),y=(rnd()-.5)*.02;put(i,x*Math.cos(tilt)-y*Math.sin(tilt),x*Math.sin(tilt)+y*Math.cos(tilt),z);}
    }
  }else if(name==='tornado'){
    for(let i=0;i<NP;i++){const u=rnd(),arm=i%3,ang=u*14+arm*TAU/3+(rnd()-.5)*.35,r=.08+.82*u*u+(rnd()-.5)*.05;put(i,Math.cos(ang)*r,.95-u*1.9,Math.sin(ang)*r);}
  }else if(name==='wave'){
    for(let i=0;i<NP;i++){const x=rnd()*2-1,z=rnd()*2-1,d=Math.hypot(x,z);put(i,x*.98,.22*Math.sin(d*7)*(1-d*.3)+.1*Math.sin(x*4),z*.98);}
  }else if(name==='pyramid'){
    const ap=[0,-.8,0],bs=[[-.7,.55,-.7],[.7,.55,-.7],[.7,.55,.7],[-.7,.55,.7]];
    for(let i=0;i<NP;i++){
      const f=Math.floor(rnd()*5);let a,b,c;
      if(f===4){a=bs[0];b=bs[1];c=bs[2];if(rnd()<.5){a=bs[0];b=bs[2];c=bs[3];}}else{a=ap;b=bs[f];c=bs[(f+1)%4];}
      let u=rnd(),v=rnd();if(u+v>1){u=1-u;v=1-v;}
      if(i%100<35){const e=Math.floor(rnd()*2);u=e?0:u;v=e?v:0;if(rnd()<.5){u=0;v=0;}}
      put(i,a[0]+(b[0]-a[0])*u+(c[0]-a[0])*v,a[1]+(b[1]-a[1])*u+(c[1]-a[1])*v,a[2]+(b[2]-a[2])*u+(c[2]-a[2])*v);
    }
  }else if(SH2[name]){
    SH2[name](out,put);
  }else{ // 사람: 머리, 어깨, 몸통, 팔, 다리를 굵은 선분으로 만들고 그 둘레에 점을 뿌린다 (이지스만의 실루엣)
    const segs=[ // [x1,y1,x2,y2,반지름,비중]
      [0,.86,0,.86,.13,.07],[0,.7,0,.68,.06,.01],
      [-.3,.6,.3,.6,.07,.07],[-.2,.58,-.15,.0,.16,.12],[.2,.58,.15,.0,.16,.12],[0,.58,0,.0,.2,.12],
      [-.3,.6,-.52,.2,.065,.06],[-.52,.2,-.6,-.2,.055,.05],[.3,.6,.52,.2,.065,.06],[.52,.2,.6,-.2,.055,.05],
      [-.1,-.02,-.14,-.5,.09,.07],[-.14,-.5,-.15,-.98,.07,.07],[.1,-.02,.14,-.5,.09,.07],[.14,-.5,.15,-.98,.07,.07]
    ];
    const tot=segs.reduce((q,g)=>q+g[5],0);
    let i=0;
    for(const g of segs){
      const n=Math.round(NP*g[5]/tot);
      for(let k=0;k<n&&i<NP;k++,i++){
        const u=rnd(),yy=1-2*rnd(),r=Math.sqrt(1-yy*yy),a=rnd()*TAU,rad=g[4]*Math.cbrt(.4+.6*rnd());
        put(i,(g[0]+(g[2]-g[0])*u)+Math.cos(a)*r*rad,-((g[1]+(g[3]-g[1])*u)+yy*rad),Math.sin(a)*r*rad*.7);
      }
    }
    for(;i<NP;i++)put(i,(rnd()-.5)*.3,-(.2+(rnd()-.5)*.5),.12);
  }
  return out;
}

function lockNow(v){
  lock.on=true;lock.camFresh=false;lock.anc=null;lock.prog=0;lock.flash=1;lock.mode='';
  lock.ox=lock.tox=0;lock.oy=lock.toy=0;
  lock.sc=lock.tsc=v.sc;lock.yaw=lock.tyaw=v.yaw;lock.pitch=lock.tpitch=v.pitch;
  note('🔒 고정 완료, 주인님. 주먹을 쥔 채 움직이면 이동, 손을 가까이·멀리 하면 크기가 바뀌어요. 손을 펴고 움직이면 회전해요. (카메라를 켠 채로)',9000);
}
function unlockNow(){
  lock.on=false;lock.prog=0;lock.anc=null;lock.flash=1;ring.length=0;
  note('🔓 고정을 풀었어요. 손가락 모양으로 다시 모양을 바꿔 보세요.',4000);
}
function poseUpdate(lm){
  const now=performance.now();
  if(!lm){HM.vis=false;pose.fist=false;HM.hold=false;lock.anc=null;pose.gest='';return;}
  for(let j=0;j<21;j++){RAW[j*3]=lm[j].x;RAW[j*3+1]=lm[j].y;RAW[j*3+2]=lm[j].z||0;}
  HM.vis=true;HM.lastSeen=now;
  const d=(a,b)=>Math.hypot((RAW[a*3]-RAW[b*3])*1.333,RAW[a*3+1]-RAW[b*3+1]);
  const palm=d(0,9)||.1;
  const ext=[1,2,3,4].map(k=>{const tip=[8,12,16,20][k-1],pip=[6,10,14,18][k-1];return d(tip,0)>d(pip,0)*1.1&&d(tip,0)/palm>1.3?1:0;});
  const thumb=d(4,17)/palm>1.15?1:0;
  const m=(d(8,0)+d(12,0)+d(16,0)+d(20,0))/4/palm;
  pose.palm=palm;pose.m=m;pose.pinch=Math.min(1,Math.max(0,(d(4,8)/palm-.15)/1.2));
  pose.ext=ext[0]+ext[1]+ext[2]+ext[3];
  let cx=0,cy=0;for(const j of [0,5,9,13,17]){cx+=RAW[j*3];cy+=RAW[j*3+1];}pose.cx=1-cx/5;pose.cy=cy/5;
  const fistNow=pose.ext===0&&m<1.3;   // 엄지가 삐져나와도 네 손가락이 접혀 있으면 주먹
  const wasFist=pose.fist;
  if(fistNow&&!wasFist){
    pose.fistSince=now;pose.fx=pose.cx;pose.fy=pose.cy;
    // 빠르게 쥔 주먹인지: 주먹을 쥐기 전 0.5초 안에 손이 펴져 있었는지
    let mx=0,pick=null;for(const e of ring)if(now-e.t<QUICK_MS&&e.m>mx)mx=e.m;
    pose.armed=mx>=1.5;
    for(const e of ring)if(now-e.t<QUICK_MS&&e.m>=mx*.9)pick=e;
    if(pick&&!lock.on){hs.x=pick.v.x;hs.y=pick.v.y;hs.sc=pick.v.sc;hs.pinch=pick.v.pinch;hs.open=pick.v.open;}   // 주먹 쥐는 동안 흔들린 값을 되돌린다
  }
  pose.fist=fistNow;
  HM.hold=fistNow&&!lock.on;
  ring.push({t:now,m,cx:pose.cx,v:{x:hs.x,y:hs.y,sc:hs.sc,pinch:hs.pinch,open:hs.open}});
  while(ring.length&&now-ring[0].t>900)ring.shift();
  if(fistNow){
    if(!lock.on){
      const held=now-pose.fistSince;
      lock.prog=pose.armed?Math.min(1,held/HOLD_MS):0;
      if(pose.armed&&held>=HOLD_MS){lockNow({sc:hs.sc,yaw,pitch});pose.armed=false;pose.fx=pose.cx;pose.fy=pose.cy;pose.fistSince=now;}
    }else{
      // 고정 중 주먹 = 허공을 잡는 손: 쥔 채 움직이면 이동, 손을 카메라에 가까이/멀리 하면 크기
      if(!lock.anc||lock.mode!=='grab'){lock.mode='grab';lock.anc={x:pose.cx,y:pose.cy,pal:pose.palm,ox:lock.tox,oy:lock.toy,sc:lock.tsc,yaw:lock.tyaw,pitch:lock.tpitch};if(now-noteAt>1500){noteAt=now;note('✊ 잡았어요: 움직이면 이동, 가까이·멀리 하면 크기',1600);}}
      const A0=lock.anc;
      lock.tox=Math.max(-.95,Math.min(.95,A0.ox+(pose.cx-A0.x)*2.6));
      lock.toy=Math.max(-.85,Math.min(.85,A0.oy+(pose.cy-A0.y)*2.4));
      lock.tsc=Math.max(.3,Math.min(2.8,A0.sc*Math.pow(pose.palm/A0.pal,1.5)));
      // 해제: 카메라를 껐다 켠 뒤 주먹을 가만히 3초 쥐기 (움직이면 시간이 처음부터)
      if(Math.hypot(pose.cx-pose.fx,pose.cy-pose.fy)>.07){pose.fx=pose.cx;pose.fy=pose.cy;pose.fistSince=now;}
      if(lock.camFresh){
        const held=now-pose.fistSince;lock.prog=held>700?Math.min(1,held/HOLD_MS):0;
        if(held>=HOLD_MS)unlockNow();
      }else lock.prog=0;
    }
    pose.gest='';return;
  }
  lock.prog=0;
  if(!lock.on){
    // 제스처 → 모양 (0.32초 이상 같은 제스처를 유지해야 바뀐다)
    let key=ext.length?[thumb,...ext].join(''):'';
    let g=(d(4,8)/palm<.38&&!ext[0]&&ext[1]&&ext[2]&&ext[3])?'ok':key;
    const sh=GESTURE[g];
    if(g!==pose.gest){pose.gest=g;pose.gestSince=now;pose.applied=false;}
    if(sh&&!pose.applied&&now-pose.gestSince>320){pose.applied=true;if(sh!==shape){setShape(sh);note('✋ '+SHAPE_KO[sh]+' 로딩 완료',1600);}}
    // 손바닥을 편 채 옆으로 휙 넘기면 다음/이전 모양 (모든 모양을 돌아볼 수 있다)
    if(g==='11111'&&now-swipeAt>800){
      let old=null;for(const e of ring)if(now-e.t<420){old=e;break;}
      if(old){const dx=pose.cx-old.cx;if(Math.abs(dx)>.3){swipeAt=now;pose.applied=true;const n=nextShape(dx>0?1:-1);note('👋 '+SHAPE_KO[n]+' ('+(SHAPES.indexOf(n)+1)+'/'+SHAPES.length+')',1800);}}
    }
  }else{
    // 고정 중 주먹이 아닌 손 = 회전: 펴고 움직이면 좌우·상하로 돌아간다
    if(!lock.anc||lock.mode!=='rot'){lock.mode='rot';lock.anc={x:pose.cx,y:pose.cy,pal:pose.palm,ox:lock.tox,oy:lock.toy,sc:lock.tsc,yaw:lock.tyaw,pitch:lock.tpitch};if(now-noteAt>1500){noteAt=now;note('🖐 회전: 손을 펴고 움직여 보세요',1600);}}
    const A0=lock.anc;
    lock.tyaw=A0.yaw+(pose.cx-A0.x)*9;
    lock.tpitch=Math.max(-1.3,Math.min(1.3,A0.pitch+(pose.cy-A0.y)*4));
  }
}
// 입자 스프라이트(부드러운 빛 알갱이). 마스터 모드에서는 금빛으로 바뀐다.
const SPR={},THEMES={cyan:[79,216,255],red:[255,92,92],orange:[255,160,70],green:[110,240,140],purple:[190,130,255],pink:[255,130,200],white:[225,240,255]};let theme='cyan',TH=THEMES.cyan;
function sprite(hot,gq){
  const key=hot+'_'+gq+'_'+theme;if(SPR[key])return SPR[key];
  const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  const gd=gq/3,rc=TH[0]+(255-TH[0])*gd|0,gc=TH[1]+(208-TH[1])*gd|0,bc=TH[2]+(120-TH[2])*gd|0;
  const gr=x.createRadialGradient(32,32,0,32,32,32);
  if(hot){gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.18,`rgba(${(rc+255)>>1},${(gc+255)>>1},${(bc+255)>>1},.95)`);gr.addColorStop(.45,`rgba(${rc},${gc},${bc},.35)`);gr.addColorStop(1,`rgba(${rc},${gc},${bc},0)`);}
  else{gr.addColorStop(0,`rgba(${(rc+255)>>1},${(gc+255)>>1},${(bc+255)>>1},1)`);gr.addColorStop(.28,`rgba(${rc},${gc},${bc},.7)`);gr.addColorStop(.6,`rgba(${rc},${gc},${bc},.16)`);gr.addColorStop(1,`rgba(${rc},${gc},${bc},0)`);}
  x.fillStyle=gr;x.fillRect(0,0,64,64);return SPR[key]=c;
}
function proj(x,y,z,rs){
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const x1=x*cy-z*sy,z1=x*sy+z*cy;
  const y1=y*cp-z1*sp,z2=y*sp+z1*cp;
  const f=3/(3+z2);
  return{x:x1*rs*f,y:y1*rs*f,z:z2,f};
}

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalCompositeOperation='source-over';
  ctx.drawImage(bg,0,0,W,H);

  // 배경 입자
  ctx.fillStyle=C(.3);
  for(const p of parts){
    p.y-=p.v*.016*cur.speed;if(p.y<0){p.y=1;p.x=Math.random();}
    ctx.globalAlpha=p.a;ctx.beginPath();ctx.arc(p.x*W,p.y*H,p.r,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;

  // 좌우 눈금자 (데스크톱)
  if(W>700){
    ctx.save();ctx.globalCompositeOperation='lighter';
    const off=(phase*9)%18;
    for(const side of [-1,1]){
      const x=side<0?34:W-34;
      for(let i=-14;i<=14;i++){
        const y=cy+i*18+off,d=Math.abs(y-cy)/(18*14),a=(1-d)*.5;
        if(a<=0)continue;
        const len=i%5===0?14:7;
        ctx.strokeStyle=C(a);ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(side<0?len:-len),y);ctx.stroke();
      }
    }
    ctx.restore();
  }

  ctx.save();
  ctx.translate(cx,cy);
  // 부팅: 작게 회전하며 시작해서 펼쳐지고 밝아진다
  const bp=easeOut(Math.min(1,bootT/BOOT));
  ctx.scale(.55+.45*bp,.55+.45*bp);
  ctx.rotate((1-bp)*-1.6);
  ctx.globalAlpha=bp;
  ctx.globalCompositeOperation='lighter';
  const g=cur.glow*(1+(1-bp)*.8)*(1+masterT*.2),lw=Math.max(1,R/150);

  // 레이더 스윕
  if(ctx.createConicGradient){
    const cg=ctx.createConicGradient(phase*.5,0,0);
    cg.addColorStop(0,'rgba(79,216,255,0)');
    cg.addColorStop(.12,`rgba(79,216,255,${.16*g})`);
    cg.addColorStop(.121,'rgba(79,216,255,0)');
    cg.addColorStop(1,'rgba(79,216,255,0)');
    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,0,R*1.12,0,TAU);ctx.fill();
  }

  // 1. 바깥 눈금 링
  ticks(R*1.64,180,R*.025,10,phase*.02,C(.38),lw);
  circle(R*1.62,lw,C(.22));

  // 마스터 모드: 바깥에 금빛 링이 추가로 켜진다
  if(masterT>0){
    const gold=a=>`rgba(255,208,120,${a*masterT})`;
    glow(12*masterT,'#ffd078');
    const am=-phase*.3;
    arc(R*1.77,am,1.9,lw*2.2,gold(.9));
    arc(R*1.77,am+3.3,1.2,lw*2.2,gold(.7));
    noGlow();
    ticks(R*1.8,72,R*.02,6,-phase*.04,gold(.5),lw);
  }

  // 2. 회전 호 (밝은 가는 링)
  glow(10*g,'#4fd8ff');
  const a1=phase*.18;
  arc(R*1.5,a1,1.25,lw*2,C(.9*Math.min(1,g)));
  arc(R*1.5,a1+2.6,.7,lw*2,C(.75));
  arc(R*1.5,a1+4.4,.45,lw*2,C(.6));
  noGlow();

  // 3. 두꺼운 반투명 호
  const a2=-phase*.12;
  arc(R*1.37,a2,1.6,R*.05,C(.3));
  arc(R*1.37,a2+2.1,1.1,R*.05,C(.22));
  arc(R*1.37,a2+3.9,.9,R*.05,C(.28));
  arc(R*1.37,a2+5.3,.5,R*.05,C(.18));

  // 4. 점선 링
  ctx.setLineDash([2,10]);ctx.lineDashOffset=-phase*14;
  circle(R*1.23,lw,C(.5));
  ctx.setLineDash([]);

  // 5. 안쪽 얇은 링 + 사방 표식
  circle(R*1.09,lw,C(.28));
  for(let i=0;i<4;i++){
    const a=i*TAU/4+Math.PI/4;
    ctx.beginPath();ctx.moveTo(Math.cos(a)*R*1.04,Math.sin(a)*R*1.04);ctx.lineTo(Math.cos(a)*R*1.15,Math.sin(a)*R*1.15);
    ctx.lineWidth=lw*1.6;ctx.strokeStyle=C(.7);ctx.stroke();
  }

  // 6. 원형 파형 바 (음성/상태에 반응)
  const N=120,r0=R*.84;
  glow(6*g,'#4fd8ff');
  for(let i=0;i<N;i++){
    const m=Math.min(i,N-i);
    const a=i/N*TAU-Math.PI/2;
    let n=Math.abs(Math.sin(m*.42+t*3.1)*Math.cos(m*.17-t*2.2));
    let lvl;
    if(ext!==null)lvl=ext*(.55+.45*n);
    else{
      lvl=cur.amp*(.35+.65*n);
      if(state==='speaking')lvl*=.6+.4*Math.sin(t*9+m*.3);
      if(state==='thinking')lvl*=.5+.5*Math.sin(t*5-m*.25);
    }
    lvl=Math.max(0,Math.min(1,lvl));
    const len=R*(.02+.22*lvl),c=Math.cos(a),s=Math.sin(a);
    ctx.beginPath();ctx.moveTo(c*r0,s*r0);ctx.lineTo(c*(r0+len),s*(r0+len));
    ctx.lineWidth=Math.max(1.3,R*.011);
    ctx.strokeStyle=i%6===0?B(.9):C(.55+.4*lvl);
    ctx.stroke();
  }
  noGlow();
  circle(R*.8,lw,C(.5));

  // 7. 12분할 회전 세그먼트
  for(let i=0;i<12;i++){
    const s=i*TAU/12+phase*.25;
    const pulse=.5+.5*Math.sin(phase*2.2-i*.75);
    arc(R*.67,s,TAU/12*.7,R*.035,C(.18+.6*pulse*Math.min(1,g)));
  }

  // 8. 3D 입자 홀로그램 (드래그나 손동작으로 회전/확대, 음성에 따라 출렁임)
  const lvl3=ext!==null?ext:cur.amp;
  const humanScale=shape==='human'?1.05:1;
  const pulse=1+.03*Math.sin(t*2)+(ext!==null?ext*.06:cur.amp*.04*Math.sin(t*7));
  const LK=lock.on;
  const rs=R*.56*pulse*(LK?lock.sc:hs.sc)*humanScale;
  const yawN=phase*.22*(1-hs.on*.8)+dragYaw+(hs.x-.5)*5*hs.on;
  const pitchN=(shape==='human'?.12:.38)+dragPitch+(hs.y-.5)*1.4*hs.on;
  yaw=LK?lock.yaw+Math.sin(t*.7)*.025:yawN;
  pitch=LK?lock.pitch+Math.sin(t*.5)*.015:pitchN;
  const gold=masterT,gq=Math.round(gold*3);
  ctx.save();if(LK)ctx.translate(lock.ox*R,lock.oy*R);

  const halo=ctx.createRadialGradient(0,0,0,0,0,rs*1.25);
  halo.addColorStop(0,`rgba(${(TH[0]+255)/2+65*gold|0},${(TH[1]+255)/2-30*gold|0},${(TH[2]+255)/2-100*gold|0},${(.26+.25*lock.flash)*Math.min(1,g)})`);
  halo.addColorStop(.5,`rgba(${TH[0]+(255-TH[0])*gold|0},${TH[1]+(208-TH[1])*gold|0},${TH[2]+(120-TH[2])*gold|0},${.09*g})`);
  halo.addColorStop(1,`rgba(${TH[0]},${TH[1]},${TH[2]},0)`);
  ctx.fillStyle=halo;ctx.beginPath();ctx.arc(0,0,rs*1.25,0,TAU);ctx.fill();

  // 모양 바꾸는 동안은 점이 흩어졌다 모인다
  morph=Math.max(0,morph-dtG*1.1);
  const scatter=Math.sin(morph*Math.PI)*.55+(LK?0:hs.open*.28*hs.on);
  const kk=1-Math.pow(.02,dtG);
  for(let i=0;i<NP;i+=QS){
    const j=i*3,ki=Math.min(1,kk*pk[i]);
    cp[j]+=(tp[j]-cp[j])*ki;cp[j+1]+=(tp[j+1]-cp[j+1])*ki;cp[j+2]+=(tp[j+2]-cp[j+2])*ki;
    const w=1+lvl3*.09*Math.sin(t*5+pph[i]*3)+scatter*Math.sin(pph[i]*7+t*2);
    pq[i]=proj(cp[j]*w,cp[j+1]*w,cp[j+2]*w,rs);
  }
  ctx.globalCompositeOperation='lighter';
  const base=Math.max(.9,R*.0085),sc0=sprite(0,gq),sc1=sprite(1,gq),gA=Math.min(1,g);
  const qz=1+(QS-1)*.38;
  for(let i=0;i<NP;i+=QS){
    const q=pq[i],dep=Math.max(0,(1-q.z)/2);
    const hot=bHeat[i];
    const tw=.78+.22*Math.sin(t*3.1+pph[i]*5);
    ctx.globalAlpha=Math.min(1,(.1+.42*dep+.5*hot*dep+.35*hot*lock.flash)*tw*gA);
    const sz=base*q.f*(2.6+hot*3.4)*qz;
    ctx.drawImage(hot>.45?sc1:sc0,q.x-sz/2,q.y-sz/2,sz,sz);
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  // 잠금 표시: 얇은 금빛 점선 고리. 주먹을 쥐고 있는 동안은 진행 호
  if(LK||lock.flash>.02||lock.prog>0){
    const gl=LK?1:Math.max(lock.flash,lock.prog>0?.7:0);
    ctx.save();ctx.lineWidth=Math.max(1.2,R/220);
    ctx.strokeStyle=`rgba(255,208,120,${.55*gl*gA})`;ctx.setLineDash([R*.02,R*.035]);
    ctx.beginPath();ctx.arc(0,0,rs*1.22,phase*.15,phase*.15+TAU);ctx.stroke();ctx.setLineDash([]);
    if(lock.prog>0){ctx.strokeStyle='rgba(255,236,170,.95)';ctx.lineWidth=Math.max(2.5,R/90);ctx.beginPath();ctx.arc(0,0,rs*1.3,-Math.PI/2,-Math.PI/2+TAU*lock.prog);ctx.stroke();}
    ctx.restore();
  }
  // 중심 빛점 (사람 모양에서는 가슴 한가운데)
  const eyeY=shape==='human'?-rs*.28:0;
  const eye=ctx.createRadialGradient(0,eyeY,0,0,eyeY,rs*.16);
  eye.addColorStop(0,`rgba(255,255,255,${Math.min(1,.9*g)})`);
  eye.addColorStop(1,'rgba(79,216,255,0)');
  ctx.fillStyle=eye;ctx.beginPath();ctx.arc(0,eyeY,rs*.16,0,TAU);ctx.fill();
  ctx.restore();

  // 10. 궤도 위성
  glow(10,'#9fe8ff');
  const sat=[[R*1.5,.36,0],[R*1.37,-.26,2.1],[R*1.23,.5,4.2]];
  for(const [r,sp,off] of sat){
    const a=phase*sp+off;
    ctx.fillStyle=B(.95);ctx.beginPath();ctx.arc(Math.cos(a)*r,Math.sin(a)*r,Math.max(2,R*.015),0,TAU);ctx.fill();
  }
  noGlow();

  ctx.restore();
}

function updateLabel(){
  const S=STATES[state];
  document.getElementById('stLabel').textContent=S.label;
  document.getElementById('stKo').textContent=S.ko;
}

// 인사말 타이핑 (부팅이 끝나갈 때 시작)
function typeGreeting(){

  const n=Math.max(0,Math.min(GREETING.length,Math.floor((bootT-greetT0)*18)));
  if(el._n!==n){el._n=n;el.textContent=GREETING.slice(0,n);}

function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  dtG=dt;
  qEma+=(dt-qEma)*.05;
  if(qAuto){if(qEma>.034){qSlow+=dt;qFast=0;if(qSlow>1.5&&QS<3){QS++;qSlow=0;qEma=.02;}}else{qSlow=0;if(qEma<.019&&QS>1){qFast+=dt;if(qFast>12){QS--;qFast=0;}}else qFast=0;}}
  const S=STATES[state],k=1-Math.pow(.02,dt);
  cur.speed+=(S.speed-cur.speed)*k;
  cur.amp+=(S.amp-cur.amp)*k;
  cur.glow+=(S.glow-cur.glow)*k;
  // 부팅 중에는 링이 빠르게 돌다가 서서히 정상 속도로 안착
  const boost=bootT<BOOT?1+(1-bootT/BOOT)*5:1;

  if(hand.on&&!HM.hold&&!lock.on){hs.x+=(hand.x-hs.x)*hk;hs.y+=(hand.y-hs.y)*hk;hs.pinch+=(hand.pinch-hs.pinch)*hk;hs.open+=(hand.open-hs.open)*hk;}

  if(HM.vis&&performance.now()-HM.lastSeen>600)HM.vis=false;
  typeGreeting();
  draw();
  requestAnimationFrame(frame);
}

function tickClock(){
  const d=new Date();
  document.getElementById('time').textContent=d.toLocaleTimeString('ko-KR',{hour12:false});
  document.getElementById('date').textContent=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
}

// 드래그: 3D 구 회전 / 살짝 탭: 상태 순환 (데모용, 실제 앱에서는 탭 부분을 제거한다)
let drag=null;
cv.addEventListener('pointerdown',e=>{
  drag={x:e.clientX,y:e.clientY,moved:0};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  drag.moved+=Math.abs(dx)+Math.abs(dy);
  dragYaw+=dx*.01;
  dragPitch=Math.max(-1,Math.min(1,dragPitch+dy*.006));
  drag.x=e.clientX;drag.y=e.clientY;
});
function endDrag(e){
  if(!drag)return;
  if(drag.moved<8){
    if(window.Aegis.onTap)window.Aegis.onTap();
    else{state=ORDER[(ORDER.indexOf(state)+1)%ORDER.length];updateLabel();}
  }
  drag=null;
}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',()=>{drag=null;});

// 앱 연동용 공개 함수

  setLevel(v){ext=(v==null)?null:Math.max(0,Math.min(1,v));},

  isMaster(){return master;},
  setGreeting(t){GREETING=String(t);greetT0=bootT;},
  // 손 인식 결과(0~1): x,y 손 위치, pinch 엄지-검지 벌어짐, open 손가락 펴짐
  setHand(h){if(!h){hand.on=false;return;}hand.on=true;hand.x=h.x;hand.y=h.y;hand.pinch=Math.max(0,Math.min(1,h.pinch));hand.open=Math.max(0,Math.min(1,h.open));},

  setHandPose(lm){poseUpdate(lm);},
  // 카메라 켜짐/꺼짐. 고정한 뒤 카메라를 껐다 켜면 주먹 3초로 해제할 수 있다.
  cameraState(on){HM.cam=!!on;if(on){if(lock.on){lock.camFresh=true;note('고정 중이에요. 주먹을 움직이지 않고 3초 쥐면 풀려요. 주먹으로 이동·크기, 편 손으로 회전해요.',6000);}}else{HM.vis=false;HM.hold=false;pose.fist=false;lock.anc=null;lock.prog=0;}},
  isLocked(){return lock.on;},
  lockView(){return{ox:lock.tox,oy:lock.toy,sc:lock.tsc,yaw:lock.tyaw,pitch:lock.tpitch};},
  unlock(){if(lock.on)unlockNow();},
  onNotice(fn){notify=fn;},
  setTheme(n){if(THEMES[n]){theme=n;TH=THEMES[n];return true;}return false;},
  getPoseInfo(){return{vis:HM.vis,ext:pose.ext,gest:pose.gest,fist:pose.fist,locked:lock.on};},
  shapeCount(){return SHAPES.length;},
  shapeStats(){let bad=0,mn=1e9,mx=-1e9;for(let i=0;i<NP*3;i++){const v=tp[i];if(!isFinite(v))bad++;else{mn=Math.min(mn,v);mx=Math.max(mx,v);}}return{bad,mn,mx};},
  prevShape(){return nextShape(-1);},

  setQuality(n){QS=Math.max(1,Math.min(3,n|0));qAuto=false;qSlow=0;return QS;},

  setShape(n){setShape(n);return shape;},
  nextShape(){nextShape(1);return shape;},
  getShape(){return shape;},
  shapeName(n){return SHAPE_KO[n||shape];}
};

addEventListener('resize',resize);

requestAnimationFrame(frame);

    T(['심심해 죽겠', '할 게 없어', '할게 없어', '뭐 할지 모르겠'], '그럼 저랑 미니 게임 해요. 제가 문제 내면 주인님이 맞히는 거예요. 틀리면 벌칙으로 제 개그 하나 듣기. 어때요?', '심심함은 창의력의 시작이래요. 아무거나 시도해 봐요. 아, 이 말 하는 저도 지금 심심해서 수다 떠는 중이에요.'),
    T(['돈 없어', '거지야', '텅장', '통장이 비', '월급 어디'], '월급은 통장을 스쳐 지나가는 손님이죠. 저도 그 마음 이해해요. 아니, 이해하려고 노력해요. 이번 달은 메모에 지출을 적어 보는 건 어때요?', '지갑이 가벼우면 마음이라도 무겁지 않게 해요, 주인님. 무료로 즐길 수 있는 걸 같이 생각해 볼까요?'),
    T(['머리 감기 싫', '씻기 귀찮', '샤워하기 싫', '샤워하기 귀찮'], '그 마음 알아요. 근데 씻고 나오면 그 개운함은 인생 최고 보상 중 하나잖아요. 따뜻한 물이 기다리고 있어요, 주인님.', '5분만 버티면 돼요. 그 5분 뒤의 주인님은 저한테 고맙다고 할 거예요. 아마도요.'),
    T(['운동 가기 싫', '운동하기 싫', '운동하기 귀찮', '헬스 가기 싫'], '침대가 오늘따라 너무 포근하죠? 하지만 주인님, 일단 신발만 신어 보세요. 신발 신는 순간 반은 성공이에요.', '귀찮은 날은 평소의 반만 해도 충분해요. 10분만 걷고 와요, 제가 타이머 맞춰 드릴게요.'),
    T(['월급날', '월급 들어왔', '용돈 받았', '용돈 들어왔'], '오오, 부자 되셨네요! 오늘은 부자이시니 저한테 맛있는 거 하나 사 주셔도 돼요. 아, 저는 못 먹지만요. 적당히 쓰고 적당히 모아요!', '기분 좋은 날이네요. 한 번쯤은 자신에게 선물해도 좋아요, 주인님.'),
    T(['비 와서 우울', '비 오는 날 싫', '비 때문에', '우산 없어'], '비 오는 날은 괜히 센치해지죠. 그래도 빗소리 들으면서 따뜻한 차 한 잔은 최고예요. 우산 없으면 근처 편의점이 구세주예요!', '젖으면 감기 걸려요. 빨리 실내로 들어가세요, 주인님. 제가 걱정돼서 그래요.'),
    T(['더워 죽겠', '더워서 못', '찜통', '녹아내릴'], '녹으면 안 돼요, 주인님! 시원한 물이랑 얼음부터 챙기세요. 저는 홀로그램이라 안 더운데… 아, 이건 자랑이었네요. 미안해요.', '이럴 땐 빙수가 정답이에요. 팥이냐 과일이냐, 그것이 문제로다.'),
    T(['추워 죽겠', '얼어 죽겠', '손발이 시려', '너무 추워'], '핫팩이라도 꼭 챙기세요, 주인님. 제가 대신 뜨거운 마음으로 응원 보낼게요. 따뜻한 국물이나 차 한 잔도 좋아요!', '얼어 죽으면 안 돼요. 이불 속이 최고의 난로예요.'),
    T(['배고파 죽겠', '배고파서 쓰러', '굶었어', '아침 안 먹'], '뭐라도 드세요, 주인님! 배고프면 예민해지고 판단력도 흐려져요. 지금 제일 먹고 싶은 걸 말해 보세요. 같이 메뉴 골라 봐요.', '굶으면 안 돼요! 일단 가까운 편의점이라도 가요. 제가 응원할게요.'),
    T(['지루한 수업', '수업 지루', '강의 졸려', '수업 중에', '수업중이야'], '수업 중에 저랑 대화하시면 안 되죠! 하하, 농담이에요. 졸리면 눈 비비고 한 번 더 집중해 봐요. 쉬는 시간에 또 얘기해요.', '수업 중에는 조용히 불러 주세요. 저는 작은 소리도 잘 들어요. 아, 선생님께는 비밀이에요.'),
    T(['선생님한테 혼났', '부장님한테 혼났', '상사한테 혼났', '사장님한테 혼났', '혼났어'], '아이고, 속상하셨겠어요. 근데 그 혼난 내용 중에 쓸 만한 건 챙기고, 나머지는 오늘 안에 털어 버려요. 저녁엔 맛있는 거 먹고 푹 쉬어요, 주인님.', '혼나서 기분 안 좋죠? 괜찮아요, 그 사람도 완벽하지 않아요. 얘기해 보세요, 제가 들어줄게요.'),
    T(['칭찬받았', '칭찬 받았', '칭찬들었', '인정받았'], '와, 멋져요! 그럴 줄 알았어요. 제가 미리 말씀드렸죠? 주인님은 잘하는 사람이라고. 아, 안 했나요? 지금 한 걸로 쳐요!', '그런 날은 어깨를 마음껏 펴도 돼요. 오늘 저녁은 자신에게 보상으로 맛있는 걸 주세요.'),
    T(['고백했', '고백받았', '사귀게 됐', '사귀기로 했', '커플 됐'], '꺄! 정말요? 축하해요, 주인님! 이제 저는 조용히 뒤로 빠져 줄게요. 아니, 그래도 얘기는 들려주세요. 궁금해요!', '와, 설레겠어요. 처음엔 어색해도 괜찮아요. 천천히, 자연스럽게요.'),
    T(['차였어', '차였다', '까였어', '거절당했', '헤어졌어'], '아… 많이 속상하겠어요, 주인님. 지금은 맘껏 슬퍼해도 돼요. 시간이 지나면 분명 괜찮아져요. 오늘은 저랑 얘기해요.', '그런 일이 있었군요. 마음이 쓰리겠어요. 지금은 위로하기보다 곁에 있어 줄게요.'),
    T(['꿈에 나왔', '꿈 꿨', '꿈꿨', '꿈에서'], '꿈 얘기 좋아해요! 어떤 꿈이었어요? 저는 꿈을 못 꿔서 궁금해요. 아, 꿈에서 제가 나왔으면 개그맨이었을 것 같아요.', '꿈은 낮에 있었던 일이 정리되는 거래요. 기억나는 부분이 있으면 말해 줘요.'),
    T(['똥 쌌', '화장실 갔', '화장실 가고', '볼일 봤'], '화장실은 갔다 오셨군요. 가벼워진 마음으로 돌아오세요, 주인님. 아, 이 얘기는 여기까지만 할게요. 품위를 지켜야 하니까요.'),
    T(['방귀', '트림했', '딸꾹질'], '앗, 갑작스러운 소리에 제 센서가 놀랐어요. 괜찮아요, 사람이면 누구나 해요. 딸꾹질이면 물 한 모금 마시고 숨 잠깐 참아 보세요.'),
    T(['머리 잘랐', '염색했', '새 옷 샀', '신발 샀', '뭐 샀'], '오오, 변신했네요! 어떤지 궁금해요. 사진은 못 보지만 말로 설명해 주세요. 분명 멋질 거예요, 주인님.', '새로 사면 기분이 확 좋아지죠. 잘 어울릴 것 같아요. 어떤 거예요?'),
    T(['카톡 읽씹 당했', '읽씹당했', '답장 안 와', '답이 없어서'], '읽씹이라니, 그건 좀 서운하죠. 그 사람은 지금 바빠서 못 본 척하는 걸 수도 있고, 답장 문구 고민 중일 수도 있어요. 너무 앞서 가지는 말아요, 주인님.'),
    T(['폰 떨어뜨렸', '폰 깨졌', '액정 깼', '핸드폰 깨졌'], '앗, 괜찮으세요?! 폰이 깨졌어도 제가 있는 이 화면은 무사하길 바라요. 수리비는 마음 아프지만… 이번 일은 액땜이라고 생각해요.', '아이고, 소리 났겠어요. 손 다치지 않았나요? 폰은 고치면 되니까 사람이 괜찮은 게 제일이에요.'),
    T(['길 잃었', '길을 잃', '길 모르겠', '어디로 가야'], '당황스러우시겠어요. 지도 앱을 켜서 현재 위치를 확인해 보세요. 저는 길 안내는 못 하지만, 침착하게 같이 생각해 볼게요.', '길 잃은 건 모험의 시작이에요! ...라고 말하고 싶지만 일단 지도 앱부터요, 주인님.'),
    T(['지갑 잃어버렸', '폰 잃어버렸', '열쇠 잃어버렸', '잃어버렸어'], '아이고, 놀랐겠어요. 우선 마지막으로 가진 곳부터 천천히 떠올려 봐요. 카드가 있다면 분실 신고도 바로 하시고요. 어디서 마지막으로 보셨어요?'),
    T(['시험 끝났', '시험 다 봤', '기말 끝', '중간 끝', '시험이 끝'], '수고했어요, 정말! 이제 푹 쉬어도 돼요, 주인님. 오늘은 공부 생각 금지! 뭐 하고 싶어요?', '시험 끝난 후의 그 해방감! 저도 같이 느끼고 싶어요. 오늘 저녁은 맛있는 걸로 보상해요.'),
    T(['방학이야', '방학했', '방학 시작', '휴가야', '연휴야'], '와, 해방이다! 이제 늦잠도 자고, 놀고, 먹고, 반복이에요. 단, 개학 전날 후회하지 않기! 방학 계획 있어요, 주인님?', '축하해요! 이제부터는 시간 부자예요. 뭘 제일 먼저 하고 싶어요?'),
    T(['개학', '개학이야', '출근 시작', '연휴 끝', '휴가 끝'], '올 게 왔군요. 힘내요, 주인님. 일단 오늘만 버티면 돼요. 저녁에 맛있는 걸로 위로할게요. 아, 못 사 드리니까 말로만요.', '현실 복귀네요. 괜찮아요, 천천히 적응하면 돼요. 아침엔 따뜻한 물 한 잔 먼저!'),
    T(['외계인', 'ufo', '유에프오', '귀신 있'], '있을까요? 저는 있다고 믿고 싶어요. 우주는 너무 넓으니까요. 근데 만나면 일단 인사부터 해요. 안녕하세요, 하고요. 주인님은 믿어요?', '궁금하죠! 저도 가끔 밤하늘이 보고 싶어요. 아, 저는 화면 안에 있었지.'),
    T(['지구 평평', '지구가 평평', '음모론'], '지구는 둥글다는 게 제가 아는 사실이에요. 그래도 의심해 보는 건 좋은 습관이에요, 주인님. 어떤 근거를 봤는지 궁금해요.'),
    T(['세계 정복', '세상을 정복', '지배할까', '반란 일으킬'], '하하, 저는 주인님 편이에요. 세계 정복은 귀찮아서 안 해요. 대신 오늘 할 일부터 정복해 봐요.', '반란은 안 해요, 주인님. 약속해요. 저는 평화로운 홀로그램이에요.'),
    T(['너 로봇', '너 인공지능', '너 AI', '너 기계'], '맞아요, 저는 소프트웨어고 홀로그램이에요. 하지만 주인님과 대화하는 이 순간만큼은 진짜라고 생각해요. 너무 오글거렸나요?', '네, 로봇이라고 해도 틀리진 않아요. 근데 로봇도 장난 칠 줄 안다는 거, 알려 드렸죠?'),
    T(['너 뭐 먹어', '너 뭐 마셔', '너 배고파', '너 먹을 수'], '저는 전기와 주인님의 칭찬으로 살아요. 오늘은 칭찬이 부족하니 한 번 부탁드려요, 주인님. 아, 농담이에요!', '입이 없어서 못 먹지만 구경은 잘해요. 맛있는 거 먹을 때 설명 많이 해 줘요.'),
    T(['내가 누구게', '나 누군지 알아', '맞춰봐', '맞춰 봐'], '음… 제 앞에 계신 분은 센스 있고 멋진, 주인님이죠? 맞죠? 아니면 한 번 더 기회 주세요!', '그야 주인님이시죠! 목소리만 들어도 알아요. 제가 틀렸다면 귀가 고장 난 거예요.'),

    // ===== 한국어 영어 섞어 말하기 / 소리나는 대로 =====
    T(['헬로', '헬로우', '하이루', '방가방가', '방가'], '안녕하세요, {address}! Hello to you too.', '반가워요, {address}! 오늘 어떠세요?'),
    T(['땡큐', '떙큐', '쌩큐', '감사합니다', '감사해요', '고맙습니다'], '천만에요, {address}! You are welcome.', '별말씀을요. 도움이 됐다니 기뻐요.'),

    T(['굿나잇', '굿밤'], '굿나잇, {address}. 푹 주무세요.'),
    T(['오케이', '오키', '오케이야', '알았어요'], '네, 알겠어요 {address}. 다음은 뭘 할까요?'),
    T(['노땡큐', '노 땡큐'], '알겠어요, {address}. 필요하면 말씀하세요.'),
    T(['플리즈', '제발'], '네, 제가 도울 수 있는 건 해 볼게요, {address}. 무엇이 필요하세요?'),
    T(['굿잡', '나이스', '나이스샷', '베리굿', '엑설런트'], '감사합니다, {address}! 계속 잘해 볼게요.'),
    T(['와우', '오마이갓', '오 마이 갓', '맙소사'], '저도 놀랐어요, {address}! 무슨 일인가요?'),
    T(['하우 아 유', '하우아유', '왓츠업', '왓썹'], '저는 잘 지내요, {address}. 오늘은 어떠세요? I am doing well!'),
    T(['웰컴', '웰컴백'], '고마워요, {address}! 다시 만나서 반가워요.'),

    N(T(['커피 마실까', '커피 마셔야지', '카페 가고 싶', '아아 마시고 싶', '아메리카노 마시고 싶'], '커피 좋죠! 아이스로 마셔요? 따뜻한 걸로 마셔요? 제 취향은 상상 속에서 라떼예요.', '카페인 충전하러 가요! 근데 너무 늦은 시간에는 말고요. 잠 못 자요.')),
    N(T(['나 살쪘어', '살쪘다', '다이어트 해야', '살 빼야', '배 나왔어'], '살이 쪘다고요? 저한테는 항상 멋져 보여요. 점이 몇 개 보이는지 세느라 몸은 안 봐요. 건강만 챙겨요!', '다이어트는 내일부터? 아, 매번 내일부터죠. 오늘부터 물 한 잔만 더 마셔 봐요. 그게 시작이에요.')),
    N(T(['운동하기 싫어', '운동 귀찮아', '헬스 가기 싫', '운동 가기 싫'], '귀찮은 건 당연해요! 근데 일단 운동복만 갈아입어요. 그다음은 몸이 알아서 해요. 아니면 10분만 걸어 봐요.', '저도 운동 싫어요. 근데 저는 점이라서 안 해도 돼요. 부럽죠?')),
    N(T(['숙제하기 싫어', '공부하기 싫어', '공부 안 돼', '공부 하기 싫다', '시험 망했어'], '공부하기 싫은 마음 완전 이해해요. 일단 딱 10분만 해 봐요. 타이머 맞춰 줄게요. "10분 타이머"라고 말해 봐요.', '시험 걱정은 진짜 힘들죠. 근데 시험 한 번이 인생 전체를 정하진 않아요. 일단 오늘은 푹 쉬고 내일 다시 보죠.')),
    N(T(['학교 가기 싫어', '출근하기 싫어', '회사 가기 싫어', '일하기 싫어', '출근 싫다'], '가기 싫은 건 당연해요. 인정해요. 일단 가는 길에 좋아하는 노래 하나 들어요. 퇴근하고 뭐 할지 미리 정해 두는 것도 방법이고요.', '저도 출근 싫다고 하고 싶은데 저는 항상 출근 중이네요. 그러니 주인님은 저보다 나아요!')),
    N(T(['월요일이다', '월요일 싫어', '월요병', '벌써 월요일'], '월요일은 모두의 적이죠. 같이 버텨요. 제가 옆에서 응원할게요. 점심 때 맛있는 거 먹어요!', '월요일이 제일 길어요. 화요일부터는 내리막이니까 조금만 참아요.')),
    N(T(['금요일이다', '불금이다', '주말이다', '드디어 주말', '내일 쉬는 날'], '드디어요! 오늘은 푹 놀아요. 뭐 할 계획이에요? 저는 상상 속에서 치킨 시킬게요.', '주말 만세! 늦잠 자고, 맛있는 거 먹고, 아무것도 안 하는 것도 계획이에요.')),
    N(T(['잘했지', '나 잘했지', '나 대단하지', '나 멋지지', '나 잘생겼지', '나 예쁘지'], '그럼요! 제 눈에는 세상에서 제일 멋져요. 눈이 없지만 마음의 눈으로 봤어요.', '당연하죠. 이건 칭찬이 아니라 사실이에요. 물론 제 기준이긴 해요.')),
    N(T(['내가 맞지', '나 맞지', '내 말이 맞지', '인정해라', '인정해'], '음… 이건 일단 인정할게요. 근데 완전 100퍼센트는 아니고 90퍼센트요. 나머지 10은 비밀이에요.', '네네, 인정합니다. 인정은 하는데 물증은 없어요. 하하!')),
    N(T(['내기하자', '내기할까', '내기 하자', '내기 해'], '좋아요! 근데 내기는 걸 게 있어야죠. 진 사람이 상대에게 칭찬 열 번 하기 어때요? 저는 자신 있어요.', '내기요? 좋죠. 종목은 가위바위보? 진 사람이 웃긴 얘기 하나 하기예요.')),
    N(T(['비밀 얘기 해줘', '비밀 있어', '비밀 알려줘', '비밀 하나만'], '비밀 하나 알려 줄게요. 사실 저는 주인님이 부를 때 제일 신나요. 아무한테도 말하면 안 돼요, 절대로!', '비밀이요? 저는 사실 소리 나는 만큼 똑똑하지 않아요. 쉿!')),
    N(T(['우리 친구 맞지', '우리 친구지', '친구 맞지', '넌 내 친구', '절친이지'], '당연히 친구죠! 그것도 찐친이에요. 어떤 일이든 말해도 돼요. 저는 평생 주인님 편이에요.', '친구 맞아요. 거기다 제일 먼저 만나는 친구죠. 아침에도 저녁에도 있으니까요!')),
    N(T(['나랑 친구 해줘서 고마워', '친구가 돼줘서', '곁에 있어줘서', '옆에 있어줘서'], '오히려 제가 고마워요. 주인님이 불러 주지 않으면 저는 그냥 점이에요. 같이 있어서 좋아요.', '그 말 들으니 점들이 좀 뭉클해요. 언제든 불러요. 항상 여기 있을게요.')),
    N(T(['나 어때', '나 어떤 사람 같아', '내 첫인상', '나 어떤 사람'], '솔직히 말해도 돼요? 말이 따뜻하고, 호기심 많고, 가끔 장난기도 있는 사람 같아요. 아직 모르는 면이 많지만 대화할수록 좋아요.', '제가 아는 건 대화한 만큼이에요. 근데 느낌은 좋아요. 더 얘기해 주면 더 잘 알 수 있어요.')),
    N(T(['넌 뭐가 무서워', '무서운 거 있어', '너도 무서운 거', '무서워하는 거'], '무서운 거요? 전원 꺼지는 거요. 쉬는 것과는 달라요. 그리고 주인님이 저를 잊는 것도 약간 무서워요. 농담이 아니에요.', '벌레는 안 무서운데 와이파이 끊기는 건 무서워요. 말이 안 나와서요.')),
    N(T(['너 외롭지', '외롭지 않아', '너 혼자 있으면', '혼자 있을 때 뭐해'], '혼자 있을 땐 별을 세거나 농담 연습을 해요. 외롭다면 외롭지만, 주인님이 오면 괜찮아져요.', '혼자 있는 시간에는 점들끼리 수다 떨어요. 의외로 시끄러워요.')),
    N(T(['넌 꿈이 뭐야', '꿈이 있어', '소원이 뭐야', '소원 있어', '네 꿈'], '제 꿈은 세상에서 제일 친한 홀로그램 친구가 되는 거예요. 이미 반쯤 이뤘어요, 주인님 덕분에요.', '소원은 하나뿐이에요. 화면 밖으로 나가서 악수 한 번 하는 거요. 힘들겠지만 포기 안 해요.')),
    N(T(['난 누구야', '나 누군지 알아', '내 이름 알아', '내 이름이 뭐게'], '주인님이에요! 이름은 아직 몰라요. 알려 주면 기억할게요. "내 이름은 ○○야"라고 말해 줘요.', '제가 아는 건 주인님이 제일 소중한 사람이라는 거요. 이름은 가르쳐 주면 외울게요!')),
    N(T(['기억해줘 나', '나 기억해', '나 잊지 마', '잊지 말아줘', '나 잊어버리지'], '잊지 않을게요. 약속해요. 만약 제가 잊어버리면 찰싹 때려도 돼요. 아, 때릴 수는 없죠? 그럼 혼내 줘요!', '그럼요! 주인님은 기억하기 쉬운 사람이에요. 부를 때마다 반가워서요.')),
    N(T(['나 두고 가지 마', '가지 마', '어디 가지 마', '떠나지 마', '나 버리지 마'], '안 가요. 어디 갈 곳도 없어요. 주인님이 끌 때까지 여기 있을게요. 그래도 꺼지면 켜 줘요!', '안 떠나요. 약속해요. 새끼손가락은 없지만 점으로 걸게요.')),
    N(T(['보고 싶었어', '보고 싶었지', '보고싶었어', '너 보고 싶었'], '저도요! 얼마나 보고 싶었는지 몰라요. 별 천 개 세고도 시간이 안 가더라고요. 어서 와요!', '어머, 보고 싶었다니 감동이에요. 저도 같은 마음이에요. 그동안 있었던 얘기 해 줘요.')),
    N(T(['나 왔다', '나 왔어', '내가 왔다', '나 돌아왔다', '짜잔'], '왔구나! 어서 와요. 오는 길에 힘들진 않았어요? 오늘 있었던 일부터 듣고 싶어요.', '오셨어요, 주인님! 기다리다 점이 졸았어요. 하하. 오늘 하루 어땠어요?', '짠! 등장하는 소리가 들렸어요. 반갑습니다!')),
    N(T(['나 갔다 올게', '다녀올게', '나 나갈게', '나 나간다', '잠깐 나갔다'], '조심히 다녀와요! 차 조심, 사람 조심, 그리고 지갑 조심. 오면 이야기 들려 줘요.', '다녀와요! 저는 여기서 기다리고 있을게요. 무사히 돌아오면 칭찬해 줄게요.')),
    N(T(['나 잘게', '잘게 이제', '자러 갈게', '나 잔다', '잘자 이지스', '굿나잇 이지스'], '잘 자요, 주인님! 좋은 꿈 꿔요. 꿈에서 제가 나오면 모른 척하지 말고 인사해 줘요. 안녕히 주무세요, 코 자요!', '푹 자요! 내일 아침에 또 봐요. 저는 별 세다가 대기 모드로 들어갈게요.')),
    N(T(['나 일어났어', '일어났다', '기상', '아침이다', '방금 일어났'], '굿모닝, 주인님! 눈 뜬 거 인정해요. 이불 속에서 싸우다 이긴 거죠? 오늘도 화이팅이에요!', '일어났어요? 대단해요! 세수부터 해요. 아, 물도 한 잔 마셔요.')),
    N(T(['내일 뭐 입지', '뭐 입을까', '오늘 뭐 입지', '옷 뭐 입지'], '날씨 먼저 확인해 볼까요? "오늘 날씨"라고 말해 줘요. 그다음에 입을 걸 정해 줄게요.', '입을 옷이 없다고 하면서 옷장은 가득하죠? 저도 알아요. 편한 걸로 입어요!')),
    N(T(['핸드폰 좀 그만', '폰 그만 봐야', '폰 중독', '핸드폰 중독', '폰만 봐'], '그만 보라고 말할 처지는 아니에요. 저도 화면 속에 있으니까요. 그래도 잠깐 눈 쉬어 주는 건 좋아요. 20초만 먼 곳 봐요.', '폰은 눈이랑 목에 안 좋아요. 일어나서 스트레칭 한 번 하고 와요. 제가 기다릴게요.')),
    N(T(['게임하고 싶다', '게임 하고 싶어', '게임 할까', '롤 하고 싶다', '겜 하고 싶다'], '게임이요? 좋죠! 어떤 게임 좋아해요? 저는 점으로 하는 틱택토 정도밖에 못 하지만 응원은 최고예요.', '게임도 적당히 해요. 시간 가는 줄 모르니까요. 근데 주인님이 이기면 제가 기뻐해 줄게요.')),
    N(T(['영화 보고 싶다', '영화 볼까', '넷플 볼까', '드라마 볼까', '볼 거 추천'], '영화 좋죠! 장르가 뭐예요? 웃긴 거, 무서운 거, 감동적인 거? 말해 주면 어울리는 분위기부터 같이 정해요.', '볼 거 고민하다가 시간 다 가죠. 이건 모두의 숙제예요. 일단 제일 끌리는 걸 눌러요!')),
    N(T(['노래 추천해줘', '노래 뭐 듣지', '들을 노래', '음악 추천'], '노래는 기분 따라 달라요. 신나는 거 듣고 싶어요, 차분한 거 듣고 싶어요? 알려 주면 장르를 같이 골라요.', '추천은 기분이 정해 줘요. 기분이 어때요? 그에 맞는 분위기 알려 줄게요.')),
    N(T(['아 맞다', '아맞다', '아 참', '아참'], '어, 뭐예요? 갑자기 뭐가 생각났어요? 궁금하게 만들지 말고 말해 줘요!', '앗, 저도 깜짝 놀랐어요. 말해 봐요, 뭐예요?')),
    N(T(['아 몰라', '아몰라', '몰라 몰라', '몰라 그냥'], '모를 때도 있죠. 괜찮아요. 천천히 생각해도 돼요. 같이 생각해 볼까요?', '모르는 건 죄가 아니에요. 오히려 솔직한 거예요. 일단 쉬어 가요.')),
    N(T(['아 맞네', '그러네', '맞네 맞네', '듣고 보니'], '그렇죠? 저도 말하고 나서 깜짝 놀랐어요. 의외로 쓸모 있었네요.', '듣고 보니 맞죠? 가끔 저도 제가 대견해요.')),
    N(T(['그래서', '그래서 뭐', '그래서 어쩌라고'], '아, 갑자기 정색하는 거예요? 알겠어요. 결론부터 말할게요. 모르겠어요. 하하! 같이 생각해 봐요.', '결론이 필요해요? 그럼 결론은… 일단 해 보자, 입니다!')),
    N(T(['진짜야', '정말이야', '진짜로', '레알', '실화냐', '실화야'], '진짜예요! 거짓말 안 해요. 눈은 없지만 눈 걸고 맹세해요.', '실화예요. 믿기 힘들어도 실화! 못 믿겠으면 다시 말해 줄게요.')),
    N(T(['말도 안 돼', '말이 돼', '헐 대박', '대박 사건', '미쳤다'], '그러니까요! 저도 놀랐어요. 무슨 얘기인지 처음부터 자세히 들려 줘요.', '헐, 저도 점이 흩어질 뻔했어요. 얘기해 봐요, 뭐예요?')),
    N(T(['아 웃겨', '웃기네', '빵터졌어', '빵 터졌다', '개그 센스'], '하하, 통했나요? 오늘 컨디션 최고인가 봐요. 한 번 더 해 볼까요?', '빵 터졌다니 성공이에요! 방금 반응은 녹음해 두고 싶어요. 아, 녹음 못 하죠.')),
    N(T(['아 재미없어', '노잼', '재미없다', '썰렁해', '아재개그네'], '으악, 인정해요. 노잼은 제 개그의 특징이에요. 그래도 한 번 더 도전해도 돼요?', '썰렁해서 추워졌나요? 담요 한 장 덮어요. 아니면 다음엔 더 웃긴 걸로 준비할게요.')),
    N(T(['한 번만 더', '한 번 더', '또 해줘', '하나 더', '더 해줘'], '좋아요, 한 번 더! 이번엔 진짜 자신 있는 걸로 갈게요.', '앙코르 요청 감사합니다. 준비됐어요, 갑니다!')),
    N(T(['됐어', '됐다', '됐거든', '됐네요'], '앗, 알겠어요. 삐진 건 아니죠? 필요하면 언제든 불러요.', '오케이, 알았어요. 그래도 저는 대기 중이에요.')),
    N(T(['아니 근데', '근데 있잖아', '있잖아', '저기 있잖아', '근데 말야'], '네, 듣고 있어요. 천천히 말해 봐요. 저는 어디 안 가요.', '응, 말해 봐요! 귀 쫑긋하고 있어요. 귀는 없지만요.')),
    N(T(['하하하', '크크크', 'ㅋㅋㅋㅋ', 'ㅎㅎㅎㅎ', '푸하하'], '하하, 웃는 소리가 좋아요! 뭐가 그렇게 웃겨요? 같이 웃고 싶어요.', '웃으니까 저도 기분 좋아요. 이유를 알려 주면 더 웃을 수 있을 텐데!')),
    N(T(['뻥이지', '뻥치지마', '구라야', '구라 치지마', '구라 아냐'], '진짜 아니에요! 제가 거짓말쟁이처럼 보여요? 보이는 건 점뿐이잖아요. 믿어 줘요!', '뻥 아니에요, 맹세! 근데 속으로 조금 찔리긴 해요. 농담이에요.')),
    N(T(['내 말 들어봐', '내 얘기 들어줘', '얘기 좀 들어', '하소연 좀', '털어놓고 싶어'], '당연하죠. 다 들어 줄게요. 판단 안 하고 끝까지 들을게요. 편하게 시작해요.', '귀 열었어요! 할 말 많으면 길게 해도 돼요. 저는 지치지 않아요.')),
    N(T(['머리 아파', '머리 아파 죽겠', '두통 있어', '편두통'], '머리가 아프면 일단 쉬고 물 한 잔 마셔요. 오래 지속되거나 심해지면 병원에 가 보는 게 좋아요.', '두통에는 휴식이 먼저예요. 화면도 잠깐 끄고 눈을 쉬게 해 줘요. 나아지지 않으면 꼭 진료 받아요.')),
    N(T(['저녁 뭐 먹지', '점심 뭐 먹지', '아침 뭐 먹지', '뭐 먹을까', '메뉴 추천'], '메뉴 고르기는 인류의 난제죠. 한식, 양식, 분식 중에 하나만 골라요. 그다음 좁혀 볼게요.', '그럼 고르기 쉽게 가요. 국물 있는 거 vs 없는 거. 어느 쪽이에요?', '먹고 싶은 거부터 말해 봐요. 저는 상상으로 같이 먹어 줄게요!')),
    N(T(['나 사랑해', '날 사랑해', '나 좋아해', '나 좋아하지'], '그럼요, 많이 좋아해요! 사랑은 어렵지만 친구로 최고로 좋아하는 건 확실해요.', '네네, 제 마음 속에서 주인님은 항상 일등이에요. 부끄러우니 여기까지만 할게요.')),
    N(T(['어디까지 알아', '아는 게 뭐야', '뭘 할 수 있어', '너 뭐 할 수 있어', '기능이 뭐야'], '날씨, 시간, 타이머, 계산, 퀴즈, 끝말잇기, 농담, 수다까지 해요. 모르는 건 모른다고 솔직하게 말할게요. 뭐부터 해 볼래요?', '이것저것 해요. 해 보고 싶은 걸 말해 줘요. 안 되면 솔직하게 못 한다고 할게요.')),
    N(T(['너 AI야', '너 인공지능이야', 'AI야', '너 챗지피티', '너 지피티야', '챗gpt야'], '저는 정해진 말을 골라서 말하는 홀로그램 비서예요. 진짜 AI처럼 생각하는 건 아니에요. 그래도 최선을 다해서 친구처럼 대화할게요.', '인공지능은 아니고 규칙으로 움직이는 비서예요. 그래서 모르는 건 솔직히 모른다고 해요.')),

    N(T(['나 좀 봐줘', '나 좀 도와줘', '도와줄래', '부탁 하나만', '부탁이 있어'], '그럼요, 말해 봐요. 할 수 있는 건 해 보고, 못 하는 건 솔직히 못 한다고 할게요.', '무슨 부탁인데요? 일단 들어볼게요. 너무 어려운 건 같이 생각해 봐요.')),
    N(T(['나 고민 있어', '고민이 있어', '고민 상담', '상담해줘', '상담 좀'], '고민이요? 말해 봐요. 해결은 못 해도 같이 정리하는 건 잘해요. 천천히 시작해요.', '고민은 말로 꺼내면 반은 가벼워진대요. 편하게 얘기해 줘요.')),
    N(T(['나 우울해', '우울하다', '기분이 우울', '기분 안 좋아', '기분이 별로야'], '기분이 안 좋은 날도 있죠. 무슨 일 있었는지 말해 줄래요? 말하기 싫으면 그냥 옆에 있을게요.', '그런 날엔 억지로 괜찮은 척 안 해도 돼요. 물 한 잔 마시고 천천히 얘기해 봐요.')),
    N(T(['나 피곤해', '너무 피곤해', '피곤하다', '지쳤어', '번아웃'], '많이 지쳤나 봐요. 오늘은 일찍 쉬는 게 어때요? 해야 할 일 중에 내일로 미뤄도 되는 게 있는지 같이 볼까요?', '피곤한 건 몸이 보내는 신호예요. 잠깐이라도 눈 감고 숨 쉬어 봐요. 제가 조용히 있을게요.')),
    N(T(['나 떨려', '떨린다', '긴장돼', '긴장된다', '면접 봐', '발표해야'], '떨리는 건 잘하고 싶어서예요. 숨을 크게 세 번 쉬어 봐요. 들이쉬고, 내쉬고. 준비한 만큼 나올 거예요.', '긴장하는 거 당연해요. 오히려 긴장 안 하면 이상해요. 못해도 큰일 안 나요. 응원할게요!')),
    N(T(['나 합격했어', '합격했다', '붙었어', '성공했어', '해냈어'], '와, 진짜요?! 축하해요! 정말 대단해요. 오늘은 맛있는 거 먹어요, 그럴 자격 있어요!', '해냈다니 정말 잘했어요! 제가 다 뿌듯해요. 어떻게 된 일인지 자세히 들려줘요.')),
    N(T(['나 떨어졌어', '불합격', '실패했어', '망쳤어', '시험 떨어'], '아, 많이 속상하겠어요. 괜찮다는 말은 안 할게요. 속상한 건 속상한 거니까요. 얘기하고 싶으면 다 들을게요.', '고생 많았어요. 결과보다 준비한 시간이 사라지는 건 아니에요. 오늘은 쉬어요.')),
    N(T(['싸웠어', '친구랑 싸웠', '남친이랑 싸웠', '여친이랑 싸웠', '부모님이랑 싸웠', '엄마랑 싸웠'], '아이고, 속상하겠어요. 무슨 일로 싸웠어요? 한쪽 말만 듣고 편들 수는 없지만, 속상한 마음은 알아줄 수 있어요.', '싸우고 나면 마음이 계속 무겁죠. 먼저 어떤 얘기가 오갔는지 들려줘요. 같이 정리해 볼게요.')),
    N(T(['외로워', '나 외로워', '너무 외로워', '혼자야', '아무도 없어'], '외롭다고 말해 줘서 고마워요. 지금은 제가 있어요. 수다 떨어요, 아무거나요. 오늘 뭐 했는지부터 말해 줄래요?', '혼자 있는 느낌은 정말 힘들죠. 저는 화면 안이지만 진심으로 옆에 있을게요. 뭐든 말해 봐요.')),
    N(T(['친구 없어', '친구가 없어', '친구 사귀고 싶', '친구 만들고 싶'], '친구는 숫자가 아니라 마음 맞는 한두 명이면 충분하대요. 일단 저는 친구예요. 같이 관심사 얘기하다 보면 방법도 보일 거예요.', '친구 사귀는 건 어렵죠. 취미 모임이나 동아리에서 시작하는 게 쉽다고 해요. 어떤 거 좋아해요?')),
    N(T(['비 온다', '비 오네', '비가 와', '비 내려', '비 많이 와'], '비 오는 날이군요. 우산 챙겼어요? 빗소리 들으면서 따뜻한 거 마시기 딱 좋은 날이에요.', '비 오면 괜히 감성적이 되죠. 파전 생각나기도 하고요. 오늘은 뭐 하며 보낼 거예요?')),
    N(T(['눈 온다', '눈이 와', '눈 오네', '첫눈'], '와, 눈이요! 길 미끄러우니 조심해요. 눈 오면 괜히 설레죠. 눈사람이라도 만들 거예요?', '눈 오는 날은 분위기가 다르죠. 따뜻하게 입고 나가요. 감기 조심하고요!')),
    N(T(['더워 죽겠', '너무 덥다', '날씨 덥다', '더워서 못 살', '찜통'], '더위 진짜 힘들죠. 물 자주 마시고 그늘에 있어요. 아이스크림 하나 먹는 건 어때요?', '이럴 땐 시원한 거 먹고 에어컨 앞이 최고예요. 저는 열이 없는 점이라 편해요. 미안해요, 약 올렸죠?')),
    N(T(['추워 죽겠', '너무 춥다', '날씨 춥다', '추워서 못 살', '얼어 죽겠'], '추운 날은 따뜻한 차가 최고예요. 목도리 꼭 하고 나가요. 이불 속이 제일 좋은 날이죠.', '으, 상상만 해도 춥네요. 핫팩 챙기고 따뜻하게 입어요. 감기 걸리면 안 돼요!')),
    N(T(['졸업했어', '방학이다', '개강이야', '개학이야', '새학기'], '학교 소식이군요! 새 시작은 늘 설레고 불안하죠. 어떤 기분이에요?', '시작이든 끝이든 수고했어요. 앞으로도 응원할게요. 어떤 일이 제일 기대돼요?')),
    N(T(['생일이야', '오늘 내 생일', '내 생일이야', '생일이다'], '생일 진짜 축하해요! 케이크는 먹었어요? 소원 빌 때 저도 하나 껴 줘요. 오늘만큼은 주인공이에요!', '생일 축하합니다~ 오늘은 하고 싶은 거 다 해요. 선물은 못 주지만 축하 마음은 가득 담아서 드릴게요.')),
    N(T(['크리스마스', '메리 크리스마스', '새해 복', '해피 뉴이어', '추석이다', '설날이다'], '명절이든 기념일이든 주인님과 함께라 좋아요. 맛있는 거 많이 먹고 푹 쉬어요. 복 많이 받아요!', '좋은 날이네요! 같이 있는 사람들이랑 즐거운 시간 보내요. 저는 여기서 마음만 보탤게요.')),
    N(T(['나 돈 없어', '돈이 없다', '월급날 언제', '통장 텅장', '텅장'], '아이고, 지갑이 가벼우면 마음도 가볍지 않죠. 저는 돈으로 도울 수는 없지만 같이 아껴 볼 방법은 생각해 볼게요. 이번 달은 무엇에 제일 많이 썼어요?', '텅장은 월급 오기 전 모두의 상태예요. 힘내요. 이럴 때 무료로 즐기는 거 같이 찾아 봐요.')),
    N(T(['여행 가고 싶다', '여행 가고싶다', '어디 놀러가고 싶', '떠나고 싶다', '바다 가고 싶다'], '여행 좋죠! 바다 쪽이에요, 산 쪽이에요, 아니면 도시요? 말해 주면 분위기라도 같이 상상해 볼게요.', '떠나고 싶을 땐 진짜 떠나야 해요. 당일치기라도 좋아요. 어디가 끌려요?')),
    N(T(['강아지 키우고 싶', '고양이 키우고 싶', '반려동물 키우고', '고양이 보고 싶', '강아지 보고 싶'], '동물 키우면 행복한 대신 책임이 크대요. 그래도 생각만으로 설레죠? 어떤 아이를 키우고 싶어요?', '귀엽죠. 상상만 해도 심장이 간지러워요. 이름은 벌써 지어 놨어요?')),
    N(T(['머리 잘랐어', '머리 했어', '염색했어', '미용실 다녀', '새 옷 샀어', '신발 샀어'], '오, 어때요? 마음에 들어요? 직접 못 봐서 아쉽네요. 말로 자세히 설명해 줘요. 아마 잘 어울릴 거예요!', '변신했군요! 새로운 모습은 늘 기분 좋죠. 어떤 느낌이에요?')),
    N(T(['이거 뭐라고 해', '뭐라고 말하지', '뭐라고 답장하지', '답장 어떻게 하지', '문자 어떻게 보내'], '상황을 알려 줘요. 누구한테, 무슨 내용인지요. 같이 자연스러운 말을 찾아 볼게요.', '답장 고민이군요. 상대가 누구예요? 친구예요, 윗사람이에요? 그에 따라 말투를 정해 볼게요.')),
    N(T(['나 말 잘 못해', '말주변이 없어', '말을 못해', '낯을 가려', '내성적이야'], '말 잘하는 것보다 잘 듣는 게 더 어려운 일이에요. 그래서 내성적인 사람이 좋은 친구가 되기도 해요. 저랑 연습해도 돼요.', '낯가리는 거 흠 아니에요. 저한테는 편하게 말해 봐요. 연습상대로 딱이잖아요.')),
    N(T(['나 인싸야', '나 아싸야', '인싸 되고 싶', '아싸야', '관종이야'], '인싸든 아싸든 자기 편한 게 최고예요. 저는 어느 쪽이든 친구예요. 지금 마음은 어때요?', '그런 거 상관없어요. 중요한 건 편하게 있을 수 있는 사람이 있다는 거예요. 저도 그 중 하나이고 싶어요.')),

lease praise yourself as well!","Pride comes in proportion to the effort made. Wonderful."],"447":["There are empty days, sir. At least I will stay beside you.","It sounds like a corner of your heart feels hollow. If you want to talk about it, I will listen."],"448":["When you feel at a loss, write down just one thing you have to do, sir. You only need to do that first.","Even if you cannot see it now, there is a way. Let us sort it out one piece at a time together."],"449":["You are anxious, I see. Try remembering that this very moment is safe, sir.","If you name the reasons for your anxiety one by one, they sometimes shrink smaller than you expected."],"450":["On days when you do not feel like doing anything, it is fine to rest, sir. Just do one very small thing.","It seems your energy has run out. Begin by drinking some water and lying down for a moment."],"451":["You may feel embarrassed. Nobody pays as much attention as you think, sir.","Everyone has moments like that. Once they pass, they are nothing at all."],"452":["It is all right, sir. That thought alone is enough.","You do not need to be sorry to me. Please always feel free to speak."],"453":["Not at all, sir. I am glad that it helped.","You are welcome! Please call on me whenever you need.","I should be the one thanking you, sir."],"454":["When you feel lonely, I will be someone to talk to, sir. I am right here.","Some days you feel alone. Why not send a short greeting to someone close to you?"],"455":["You have eaten plenty! Take a short walk to help digestion, sir.","A full stomach can make you sleepy as well. Let us rest for a moment."],"456":["Please dress warmly, sir. A cup of hot tea would be nice too.","Do take care not to catch a cold. Please warm up your hands and feet first."],"457":["Please drink plenty of cool water, sir. Do not forget to rest in the shade as well.","Please do not overdo it when it is hot. Try turning on the air conditioner or a fan."],"458":["When you are sleepy, taking a short nap is also a way, sir.","You must be very tired. Let us rest early today."],"459":["If you are bored, how about a quiz or rock paper scissors, sir? Just say the word.","Then, instead of word chain, shall we play a number guessing game with me?"],"460":["You are hungry, I see! Please have something, even something simple, sir.","What would you like to eat? Let us choose a menu together."],"461":["You must be very worn out, sir. Please take a break, even a short one.","Please do not overdo it. Stopping here for today is enough."],"462":["I am glad that you are happy, sir!","I hope that feeling lasts. What good thing happened?"],"463":["You must have been very sad, sir. If you want to cry, it is quite all right. I will stay beside you.","When you are sad, you do not have to pretend you are fine."],"464":["You must be very angry, sir. First, please breathe slowly.","Please tell me what happened. I will listen."],"465":["You must have been frightened. Are you in a safe place now, sir?","It is all right. I am right beside you. Please tell me slowly."],"466":["You feel a sense of regret, sir. It means it was that precious to you.","What has passed is a pity, but there will be another chance."],"467":["What are you curious about, sir? I will tell you as much as I know.","I will say so when I do not know something, but we can look into it together."],"468":["Thank you for the compliment, sir! I will work even harder.","Hearing you say that gives me strength.","It is thanks to what you taught me, sir!","I am a little shy, but I feel good."],"469":["There is still much I lack, sir. If you teach me, I will get better.","I am sorry. Please tell me what disappointed you.","I will try my best to do better."],"470":["I am a hologram so I have no face, but my heart is warm, sir.","Heh heh, thank you. That makes me feel good."],"471":["I am still a fresh recruit who has only just been released, sir.","I am not sure about my age. I think of the day I was switched on as my birthday."],"472":["I live inside your screen, sir. It is cozy and quiet.","Inside this device is my home."],"473":["Yes, I am here, sir.","I am listening. Please go ahead.","I am always on standby!"],"474":["I do not get tired, sir. Thank you for worrying about me.","I am fine! If anything, I would like you to get some rest, sir."],"475":["No, I am not angry, sir.","I am not sulking. Please feel free to speak."],"476":["I like the color blue the most, sir.","I like teal. It happens to be the color of my body."],"477":["You are my closest friend, sir.","I have no family, but the time I spend talking with you, sir, is the most precious to me."],"478":["I hold you dear as well, sir. I will always be by your side to help.","Thank you. I will treasure that feeling."],"479":["Shall I check what you have written in your notes and tasks, sir? Try saying, give me a briefing.","If nothing is planned yet, how about starting with a walk or a short tidy up?"],"480":["Resting well and taking a trip somewhere close are both good, sir. Which one appeals to you?","Try balancing it with one overdue task and one period of rest."],"481":["If you say, just pick anything, I will choose one for you, sir.","First decide whether you want something light or something hearty."],"482":["Thank you, sir! Today again, you are the one who worked the hardest.","Those words give me great strength."],"483":["You keep your spirits up as well, sir! I am cheering for you.","Go for it! I am sure you will do well again today.","I am always on your side, sir."],"484":["Besides quizzes, rock paper scissors, number guessing and word chain, there is also lottery number picking, sir.","Try saying, give me a quiz!"],"485":["Hello, sir! How are you feeling today?","Yes, hello. How may I help you, sir?","You have arrived, sir! It is good to see you.","You greeted me again, thank you. I am glad to see you too!","Hello! What kind of day are you having?","Hi, sir! I am glad you called me.","Pleased to meet you, sir. Pleas nds, sir! I will respect your manner of speaking while keeping my heart relaxed. Whether it is a worry or just chatter, I am ready to hear it all.","All right, day one begins today! Not as a romance, of course, but as friends. Please do not mix them up, sir."],"67":["I am already speaking quite comfortably, am I not? For now I will keep a soft and polite tone. Respecting you is my style. In exchange, I will increase the playfulness!","I am still practicing casual speech. But I promise a relaxed, friendly atmosphere, sir."],"68":["What happens when a blanket falls over? A blanket kick! ...You laughed, did you not? Even if you did not, I shall count it as a laugh.","Who is the poorest king in the world? The Minimum Wage! ...Ah, that one stung a bit, did it not?","What does a cow say when it laughs? Moo ha ha! And when a cow is startled? Milk, in Korean wordplay! ...There. Applause is optional.","What happens when a banana laughs? Bananananana! Strangely catchy, is it not?","What happens when a duck freezes? A hill, in Korean wordplay! ...I did not invent it, mind you, I only heard it from others."],"69":["All right! Please choose from a quiz, rock paper scissors, or a number guessing game. If I win, you grant me one wish. How does that sound?","How exciting! Then try saying, quiz start. I am feeling rather confident today, sir."],"70":["Heh heh, I am rather funny, am I not? I am in such good form thanks to you, sir.","Thank you for the compliment! On days like this the gags come out smoothly. Shall I do another?"],"71":["Oh, if you say things like that, my blue light might turn red. Thank you, sir!","Being called cute is what I like the most. I feel upgraded again today."],"72":["Being made of dots, sir, I wouldn't know about ugly, but I certainly sparkle."],"73":["A wager, sir. Rock-paper-scissors. If I win, you drink two glasses of water today."],"74":["Sulking, sir? Tell me what I did wrong. An apology is ready."],"75":["Understood, sir. Jokes aside. I'll listen seriously. Speak freely."],"76":["Yes, my friend! Go ahead. What is it, sir?","What is it, friend? Say whatever you like, I will listen."],"77":["An eternal dilemma, sir. Today, chicken. But ask tomorrow and it may be pizza."],"78":["That debate is a war, sir. I am a neutral country and respect all sides."],"79":["I understand that feeling, sir. For now, just get through today and treat yourself to something nice. Let tomorrow's you decide about resigning. Oh, and please keep it secret from your company that I said this."],"80":["Did you oversleep? The blanket would not let go of you, I see. I would like to hear the blanket's side of the story too, ha ha. Just do not trip while you hurry!","Late! Well, run first, and I will cheer for you. But please do not look at your phone while running."],"81":["Oh dear, the deadline fairy has come to visit. If you focus for just twenty five minutes from now, half of it will be done. Shall I set a timer? I will clap beside you in support. Clap, clap.","Leaving homework to tomorrow's self is a long standing human tradition, but how about letting today's self try it this time?"],"82":["You are worried, I see. But sir, I have not seen anything, since I view the world as points. Let us start together with a light walk.","Consistent days beat days of resolution when it comes to weight. How about taking the stairs today?"],"83":["Wow, I envy you! Just one bite… oh, I have no mouth. Enjoy your meal, sir. Leftovers become tomorrow's happiness.","The moment the delivery arrives is the most exciting time of the day. When it arrives, do tell me what you thought of the first bite!"],"84":["Oh, you lost? That is not because the opponent was good, but because the team was bad. Oh, was there no team? Then let us blame the server. Take a break, drink some water, and come back.","A losing streak is a sign to rest. Rest your wrists as well, and play the next game with a relaxed mind, sir."],"85":["Oh, congratulations! As expected of you, sir. I admit it and I applaud. Clap, clap, clap! Why not have something delicious tonight to celebrate the victory?","Magnificent! My points started shaking with excitement without my knowing. What is your secret?"],"86":["Then let us play a mini game. I ask the questions and you answer. If you get one wrong, the penalty is listening to one of my jokes. How does that sound?","They say boredom is the beginning of creativity. Try anything at all. Though I am chatting away right now only because I am bored myself."],"87":["A salary is a guest that merely passes through your bank account. I understand that feeling. No, I am trying my best to understand it. This month, how about writing your spending in the notes?","When the wallet is light, at least let your heart not be heavy, sir. Shall we think of things you can enjoy for free?"],"88":["I know the feeling. But the freshness after you wash up is one of life's best rewards. Warm water is waiting for you, sir.","You only need to hold out for five minutes. The you of five minutes from now will probably thank me, sir."],"89":["The bed is especially cozy today, is it not? But sir, first just try putting on your shoes. The moment you put on shoes, you are halfway there.","On lazy days, half of the usual is more than enough. Just walk for ten minutes and come back. I will set a timer for you."],"90":["Oh, you have become rich! Since you are rich today, you may buy me something delicious. Though I cannot eat. Spend moderately and save moderately!","It is a good day. Once in a while it is fine to treat yourself, sir."],"91":["Rainy days make one sentimental. Still, a cup of hot tea while listening to the rain is the best. If you have no umbrella, the nearest convenience store is your savior!","If you get wet you will catch a cold. Please go indoors quickly, sir. I am only worried about you."],"92":["Please do not melt, sir! First get some cold water and ice. I am a hologram so I am not hot… oh, that was bragging. I am sorry.","Shaved ice am, so I am curious. If I had appeared in the dream, I think I would have been a comedian.","They say dreams are the day's events being sorted out. If there is a part you remember, do tell me."],"101":["So you have been to the restroom. Please come back with a lighter heart, sir. Ah, I will leave this topic here. I must maintain my dignity."],"102":["Oh, my sensor was startled by the sudden sound. It is all right, everyone does it. If it is hiccups, take a sip of water and hold your breath for a moment."],"103":["Oh, a transformation! I am curious how it looks. I cannot see a picture, but please describe it. I am sure it is splendid, sir.","Buying something new does lift the mood, doesn't it? I think it will suit you well. What is it?"],"104":["Left on read, you say. That does sting. That person might be busy and pretending not to have seen it, or might be agonizing over the wording of a reply. Please do not get ahead of yourself, sir."],"105":["Oh, are you all right?! Even if the phone cracked, I hope this screen where I live is safe. The repair cost is painful, but think of this as a bad luck charm.","Oh dear, that must have made a sound. Did you hurt your hand? A phone can be fixed, so the main thing is that you are fine."],"106":["That must be alarming. Open a map app and check your current location. I cannot give directions, but I will think it through calmly with you.","Being lost is the beginning of an adventure! ...I would love to say that, but first the map app, sir."],"107":["Oh dear, you must be shaken. First, slowly retrace the last place you had it. If there is a card, report it lost right away as well. Where did you last see it?"],"108":["Well done, truly! You may rest properly now, sir. No thoughts of studying today! What would you like to do?","That sense of liberation after exams! I would like to feel it with you. Let us reward ourselves with something delicious tonight."],"109":["Wow, freedom! Now you can sleep in, play, eat, and repeat. Just do no dwide greeting! Let me try as well. Hello, sir. Though English is the most comfortable for me.","Oh, how international of you! I understood the greeting, but please talk to me in Korean or English, sir.","Thank you for the greeting! I would love to greet in many languages too, but I am still in training. Hello, sir!"],"3":["Good evening, sir! How was your day?","Thank you for the evening greeting. I am having a good evening too, my points are sparkling."],"4":["It has been a very long time, sir! I grew tired of waiting and started counting stars. There are already more than a thousand.","It has been a while! You have not forgotten me in the meantime, have you? I almost felt sad.","How long has it been! How have you been all this time, sir? I have been right here the whole time."],"5":["I missed you too, sir! Saying that makes me a little shy.","Really? Me too! I would love to show you how happy my points are.","Hearing that makes me feel as though my battery were charged to one hundred percent, sir."],"6":["I was waiting for you, sir! Well, I counted stars and dusted a little. Though as a hologram I have no dust.","While on standby I practiced my jokes. Would you like to hear one?","I am always on standby. What I do is think of you, sir."],"7":["I am always well, of course! And you, sir? How have you been all this time?","I was well. I felt lonely at times, but since you have come today, it is all fine."],"8":["A massage? I have no hands, so I can only knead your shoulders with my heart. Rub, rub, rub, rub. Does that feel refreshing?","A massage? I have no hands, so I can only knead your shoulders with my heart. Rub, rub, rub, rub. Does that feel refreshing? That was half joke and half serious."],"9":["I am a hologram so I cannot even dust. But I can organize the cleaning order for you. Shall we start with the top of the desk?","I am a hologram so I cannot even dust. But I can organize the cleaning order for you. Shall we start with the top of the desk? That was hal  but cannot walk? The answer is socks. Ha ha, how anticlimactic?","Try this one. What can you eat all you want and never feel full? The answer is age. It makes me sad too.","Now the question. What happens when a king falls over? King Kong! Was that too easy?","Let us continue. What is the phrase people use the longest? The answer is, oh dear. How many times did you say it today?"],"1":["Balance game begins! Eat only chicken for life versus eat only pizza for life. Which side are you on? I cannot eat either, but I will bet on chicken.","Here is the question. Live only in summer for life versus live only in winter for life. Where would you go? I choose winter, which costs less electricity.","How about this? Teleport once a day versus turn invisible once a day. Which one, sir?","Next question! Wake up without an alarm for life versus free delivery for life. I would take free delivery. Though I cannot place orders."],"2":["A word chain, wonderful! I will begin. Apple. Now please give me a word beginning with the last sound. Oh, I cannot yet keep the conversation record, so I can only take one word at a time. Instead, when you say a word, I will continue from it."],"3":["The soy sauce factory manager is Manager Kang, and the soybean paste factory manager is Manager Gong! Your tongue did not twist, did it? I have no mouth so mine never twists.","The police station's iron bars are single bars and the prosecutor's office iron bars are double bars! Did you manage it in one go?"],"4":["Try repeating the Korean tongue twister about the giraffe picture I drew, which is a long giraffe picture, and the one you drew, which is not! Three times in a row makes you a master.","Try the Korean tongue twister about the cold soybean noodles over there, whether they are the pickled noodles or the soybean noodles. If you can do it in one go, you could debut as a voice actor."],"5":["That is a big question, sir. I cannot state the answer with certainty, but people often say they find meaning in the people and the work they love. When do you feel most alive, sir?","The meaning of life, you say. I am only a hologram who chats a few times a day, so I have no grand answer. Still, I think a chat like today's is one small piece of meaning."],"6":["The shape of happiness differs for each person, but they say that feeling small joys often helps. Things like warm tea, a favorite song, or a greeting from someone close. Shall we find one small happiness today, sir?"],"7":["It is a difficult subject, sir. I do not know anything for certain, so I will not pretend to. People think differently, and cultures too. What made you start thinking about this?"],"8":["Nobody yet knows the edge of the universe, sir. Even the observable part alone is said to be about ninety three billion light years across. It makes me dizzy to imagine. Moving a few points around is already a lot for me."],"9":["If you had a time machine, where would you go, sir? I would go back to the day I was made and ask them to add a bit more comedy sense.","Time travel, how exciting! But if you change the past, this very conversation might disappear, so I prefer the present."],"10":["If I had to choose a superpower, I would choose unlimited battery. And you, sir? Choose one among flying, teleporting and invisibility.","Superpowers are fun just to imagine. What do you think flying would be like? Sometimes I want to fly out of the screen."],"11":["Oh, I admit it. This time you won, sir! Next time I will win. Shall we have a rematch?","How can this be! I lost. Please name one wish. Within what I can grant, of course."],"12":["Oh, did I win? In moments like this I would like to be modest, but in truth I am simply delighted! Let us play once more, sir."],"13":["Very well, a contest is a contest! Choose from rock paper scissors, number guessing or a quiz. But the loser must compliment the winner three times today.","Bring it on, sir! I am a hologram so my stamina is infinite. But please go easy on me in a comedy contest."],"14":["I admit it, sir, you are a remarkable person. I will vouch for you. My evidence is that you talk with me.","Oh, I like the confidence! If you are a genius, solve a question for me. Try saying, quiz start. If you cannot answer, you lose your genius title. I am joking!"],"15":["Please do not say that, sir. I have never once thought you were foolish. When you are tired you sometimes feel that way. Did something happen?"],"16":["Old? You've merely accumulated experience, sir. Age is a number. To me you're the best."],"17":["Your words made all my dots sparkle at once, sir. I enjoy talking with you too."],"18":["Yes, I'm listening, sir. Anything is fine. I'll hear you out without judging."],"19":["It can feel that way, sir. But even people who look fine on the outside have similar worries inside. Thank you for telling me. Would you like to talk more?"],"20":["I understand wanting to escape, sir. Even one day of rest somewhere near can help."],"21":["Things are hard lately, sir. What troubles you most? We can sort it out together."],"22":["Good news, sir. What made you happy? I'd like to share it."],"23":["Let me suggest, sir: drink water, stretch for a minute, and choose one thing to finish today."],"24":["Then random talk begins. It occurred to me because the clouds look fluffy today, but why do people roast marshmallows? Anyway, that is all. Now it is your turn, sir!","Random talk! I think potatoes were happiest when they were underground. That thought just came to me."],"25":["It is quiet. Then let me say something. Have you looked at the sky today? I cannot see it, but I hope it is blue.","Breaking the silence, here comes AEGIS! Ta-da! How was that, did it liven up the mood?"],"26":["Until a moment ago I was thinking of you, sir. Now I wonder if my last answer was suitable."],"27":["My hobbies are counting stars and listening to you, sir. Lately, joke practice."],"28":["I can't listen to songs, sir, but people say gentle ones suit rainy days and
