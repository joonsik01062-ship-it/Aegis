<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>파이썬 첫걸음</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#EDF1F8;--surface:#FFFFFF;--surface2:#F5F7FB;--ink:#152033;--mute:#63728C;--line:#DDE4EF;
--acc:#2F6DB5;--acc2:#245A98;--accink:#FFFFFF;--accsoft:#E8F0FB;--yellow:#FFD43B;
--red:rgba(222,62,62,.12);--redn:#D23B3B;--yel:rgba(255,190,0,.24);--yeln:#A86F00;--ok:#1B8A5A;
--sh:0 1px 2px rgba(18,28,48,.06),0 10px 28px rgba(18,28,48,.08);
--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,"Noto Sans KR","Malgun Gothic",monospace;
--sans:"Noto Sans KR",system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
--g:46px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0B111D;--surface:#131B2B;--surface2:#182234;--ink:#E7EDF8;--mute:#92A0BA;--line:#25324B;
--acc:#5BA6EE;--acc2:#3F8DDB;--accink:#06121F;--accsoft:#16263D;
--red:rgba(255,92,92,.17);--redn:#FF7B7B;--yel:rgba(255,205,60,.15);--yeln:#F0C24A;--ok:#55D19A;
--sh:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B111D;--surface:#131B2B;--surface2:#182234;--ink:#E7EDF8;--mute:#92A0BA;--line:#25324B;--acc:#5BA6EE;--acc2:#3F8DDB;--accink:#06121F;--accsoft:#16263D;--red:rgba(255,92,92,.17);--redn:#FF7B7B;--yel:rgba(255,205,60,.15);--yeln:#F0C24A;--ok:#55D19A;--sh:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.4);color-scheme:dark}
*{-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html,body,textarea,#gut,#pre{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
button{font-family:inherit}
/* 상단 */
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{flex:none;width:34px;height:34px;border-radius:10px;display:block;box-shadow:0 3px 10px rgba(36,90,152,.35)}
.bt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.bt strong{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.bt span{font-size:11px;color:var(--mute);white-space:nowrap}
.btns{display:flex;gap:6px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;transition:transform .08s,background .15s,border-color .15s}
.btn svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:active{transform:scale(.97)}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--accink);border-color:transparent;font-weight:700;box-shadow:0 4px 14px rgba(47,109,181,.35)}
.btn.primary svg{fill:currentColor;stroke:none}
.btn.wide{width:100%;height:44px;font-size:15px}
.btn:focus-visible,.chip:focus-visible,.x:focus-visible,.btn2:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (max-width:440px){.btn .l{display:none}.btn{padding:0 10px}.bt span{display:none}}
@media (min-width:441px){.btn .s{display:none}}
@media (max-width:370px){.bt{display:none}}
/* 추천 */
#sug{flex:none;display:flex;gap:6px;overflow-x:auto;padding:0 14px;height:46px;align-items:center;font-size:12.5px;color:var(--mute);scrollbar-width:none}
#sug::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:var(--mono);font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--acc);cursor:pointer;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--acc);background:var(--accsoft)}
/* 에디터 */
.stage{flex:1;min-height:0;display:flex;padding:0 12px 10px}
.wrap{flex:1;min-height:0;display:flex;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}
#gut{position:sticky;left:0;flex:none;width:var(--g);box-sizing:border-box;padding:12px 8px 120px 0;text-align:right;background:var(--surface2);border-right:1px solid var(--line);z-index:2;font-family:var(--mono);font-size:13px;line-height:var(--lh,24px);color:var(--mute);user-select:none}
#gut .n{height:var(--lh,24px)}#gut .r{color:var(--redn);font-weight:600}#gut .y{color:var(--yeln);font-weight:600}
.ed{position:relative;flex:1 0 auto}
#pre{position:absolute;left:0;right:0;top:0;padding:12px 0;pointer-events:none}
#pre div{height:var(--lh,24px)}#pre .r{background:var(--red);box-shadow:inset 3px 0 0 var(--redn)}#pre .y{background:var(--yel);box-shadow:inset 3px 0 0 var(--yeln)}
#ta{position:relative;display:block;box-sizing:border-box;min-width:calc(100vw - var(--g) - 26px);margin:0;padding:12px 12px 120px 12px;border:0;outline:0;resize:none;overflow:hidden;white-space:pre;background:transparent;color:var(--ink);caret-color:var(--acc);font-family:var(--mono);font-size:14px;line-height:24px;tab-size:4}
/* 바이브 */
#vp{display:none;flex:none;flex-direction:column;gap:8px;margin:0 12px 8px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}
#vp.open{display:flex}
.vr{display:flex;gap:8px}
#vin{flex:1;min-width:0;font-family:var(--sans);font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);outline:none}
#vin:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accsoft)}
#vgo{height:auto;padding:0 16px}
#vgo:disabled{opacity:.5}
#vex{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
#vex::-webkit-scrollbar{display:none}
#vex .chip{font-family:var(--sans);font-size:12px;color:var(--mute)}
#vh{font-size:12.5px;line-height:1.55;color:var(--mute);height:72px;overflow:auto}
#vundo{font-size:12px;padding:0 10px;height:auto}
/* 상태줄 */
#msg{flex:none;display:flex;align-items:flex-start;gap:10px;padding:11px 14px;background:var(--surface);border-top:1px solid var(--line);font-size:13px;line-height:1.55;color:var(--mute);height:66px;overflow:auto;box-sizing:border-box}
#msg .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--mute);margin-top:7px}
#msg.r{color:var(--redn)}#msg.r .dot{background:var(--redn)}
#msg.y{color:var(--yeln)}#msg.y .dot{background:var(--yeln)}
#msg.ok{color:var(--ok)}#msg.ok .dot{background:var(--ok)}
#mt{flex:1}
#mfix{flex:none;height:32px;padding:0 12px;border-radius:9px;border:0;background:var(--acc);color:var(--accink);font-size:13px;font-weight:700;cursor:pointer}
/* 시트 */
#bk{position:fixed;inset:0;background:rgba(8,14,28,.55);display:none;z-index:25;backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;display:none;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -12px 48px rgba(6,12,26,.35);z-index:30;max-width:780px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{display:flex}
#fx{top:30%}#ex{top:8%}
.grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0}
.sh{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 6px}
.sh strong{font-size:17px;font-weight:700;letter-spacing:-.01em}
.x{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface2);color:var(--mute);font-size:15px;cursor:pointer}
.sb{flex:1;overflow:auto;padding:4px 18px 18px}
.sa{padding:10px 18px 14px;border-top:1px solid var(--line)}
.sq{padding:4px 18px 8px}
#exq{width:100%;box-sizing:border-box;font-family:var(--sans);font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);outline:none}
#exq:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accsoft)}
.su{padding:0 18px}
.fxw{margin:4px 0 8px;font-size:14.5px;line-height:1.7}
.fxl{font-size:12px;font-weight:700;color:var(--mute);margin:14px 0 6px;letter-spacing:.02em}
.sn{margin:0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);font-family:var(--mono);font-size:13px;line-height:1.65;overflow:auto}
.sn div{white-space:pre}.sn .mk{background:var(--yel);border-radius:4px}
.gc h4{font-size:12px;font-weight:700;color:var(--mute);margin:18px 0 6px;letter-spacing:.02em}
.gc p{margin:0;font-size:14.5px;line-height:1.75}
.gh{padding:12px 14px;background:var(--accsoft);border-radius:12px}
.gh code{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--acc)}
.gw{display:flex;flex-wrap:wrap;gap:6px}
.gx{white-space:pre}
.btn2{margin-top:8px;width:100%;height:40px;border-radius:10px;border:1px solid var(--acc);background:transparent;color:var(--acc);font-size:13.5px;font-weight:700;cursor:pointer}
.btn2:hover{background:var(--accsoft)}
.gl0{margin:6px 0 12px;color:var(--mute);line-height:1.7}
/* 실행 결과 */
#panel{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);z-index:40;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
#panel.open{display:flex}#panel.half{top:48%;border-radius:20px 20px 0 0;box-shadow:0 -12px 48px rgba(6,12,26,.4)}#panel.small{top:72%;border-radius:20px 20px 0 0;box-shadow:0 -12px 48px rgba(6,12,26,.4)}
.ph{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.ph strong{font-size:15px}
.ph .t{display:flex;gap:6px;align-items:center}
.ph select,.ph button{font-size:12.5px;height:32px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
#pstop{color:var(--redn);border-color:var(--redn);background:transparent}
#out{flex:1;margin:10px 12px;padding:14px;border-radius:14px;overflow:auto;white-space:pre-wrap;word-break:break-word;background:#0B1020;color:#E6EDF7;font-family:var(--mono);font-size:13.5px;line-height:1.7;box-shadow:var(--sh)}
#out .e{color:#FF9B9B;font-weight:600}#out .ok{color:#8FA3BF}
#out .chip{background:#16203A;border-color:#2A3A5E;color:#9CC8FF;margin-top:8px}
#ir{display:none;gap:8px;padding:8px 12px 12px;background:transparent}#ir.open{display:flex}
#iin{flex:1;min-width:0;font-family:var(--mono);font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);outline:none}
#iin:focus{border-color:var(--acc)}
#isend{padding:0 16px;border-radius:10px;border:0;background:var(--acc);color:var(--accink);font-weight:700;cursor:pointer}

.hlon #ta{color:transparent;-webkit-text-fill-color:transparent}
#ta::selection{background:rgba(91,166,238,.35)}
#pre div{white-space:pre;padding-left:12px;font-family:var(--mono);font-size:14px;overflow:hidden}
.tk{color:var(--tk);font-weight:600}.ts{color:var(--ts)}.tn{color:var(--tn)}.tc{color:var(--tc);font-style:italic}.tb{color:var(--tb)}
:root{--tk:#C2255C;--ts:#0B7A55;--tn:#B35A00;--tc:#7A8AA3;--tb:#6741D9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tk:#FF7AA8;--ts:#7EE0A8;--tn:#F2B866;--tc:#7C8BA6;--tb:#C6A8FF}}
:root[data-theme="dark"]{--tk:#FF7AA8;--ts:#7EE0A8;--tn:#F2B866;--tc:#7C8BA6;--tb:#C6A8FF}

.sq{display:flex;gap:8px;align-items:stretch}
#exall{flex:none;height:auto;padding:0 14px}
.eh{padding:12px 14px;background:var(--accsoft);border-radius:12px;margin:4px 0;line-height:1.7;font-size:14px}
.eh strong{display:block;font-size:15px;margin-bottom:4px}
.ov{margin:8px 0 0;padding-left:20px;line-height:1.75}
.ec{margin:10px 0;padding:12px 12px 12px 14px;border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;background:var(--surface)}
.ecl{font-size:11.5px;color:var(--mute);font-weight:700;margin-bottom:4px}
.ecc{font-family:var(--mono);font-size:13px;white-space:pre-wrap;word-break:break-all;background:var(--surface2);padding:6px 8px;border-radius:8px;margin-bottom:8px}
.ecw{margin:0 0 6px;line-height:1.75;font-size:14px}
.ecy{margin:0;line-height:1.7;font-size:13px;color:var(--mute)}
.ecw code,.ecy code,.eh code,.ov code,.hc code{font-family:var(--mono);font-size:12.5px;background:var(--surface2);padding:1px 5px;border-radius:5px}
.hc{margin:8px 0;padding:12px;border-radius:12px;border:1px solid var(--acc);background:var(--accsoft);line-height:1.7;font-size:13.5px}
.hc .btn2{margin-top:8px}
.alt-t{font-weight:700;font-size:13.5px;margin:12px 0 6px}
.alt-n{margin:6px 0 0;font-size:13px;color:var(--mute);line-height:1.7}
#msg.i{color:var(--acc)}#msg.i .dot{background:var(--acc)}
#vann{font-size:12px;padding:0 10px;height:auto}
/* ===== 3단계 도구들 ===== */
:root{--cur:rgba(47,109,181,.16);--add:rgba(27,138,90,.16);--del:rgba(210,59,59,.14);--chg:rgba(255,190,0,.28)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cur:rgba(91,166,238,.22);--add:rgba(85,209,154,.16);--del:rgba(255,123,123,.16);--chg:rgba(255,205,60,.2)}}
:root[data-theme="dark"]{--cur:rgba(91,166,238,.22);--add:rgba(85,209,154,.16);--del:rgba(255,123,123,.16);--chg:rgba(255,205,60,.2)}
/* 도구 줄 */
#tools{flex:none;display:flex;gap:6px;align-items:center;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.tbn{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
.tbn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tbn:hover{border-color:var(--acc)}.tbn:active{transform:scale(.97)}
.tbn[disabled]{opacity:.4;cursor:default}.tbn[disabled]:hover{border-color:var(--line)}
.tbn.on{background:var(--accsoft);border-color:var(--acc);color:var(--acc)}
.tbn.ic{padding:0;width:32px;justify-content:center}
.tbn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#sv{flex:none;margin-left:auto;padding-left:8px;font-size:11.5px;color:var(--mute);white-space:nowrap}
/* 현재 실행 줄 */
#pre div.cur{background:var(--cur);box-shadow:inset 3px 0 0 var(--acc)}
#pre div.cur.r{background:var(--red);box-shadow:inset 3px 0 0 var(--redn)}
#gut .n.cur{color:var(--acc);font-weight:700}
.stepping #ta{caret-color:transparent}
/* 단계 실행 창 */
#dbg{display:none;flex:none;flex-direction:column;height:min(48vh,440px);margin:0 12px 8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
#dbg.open{display:flex}
.dh{flex:none;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface2)}
.dh strong{font-size:13.5px;margin-right:auto;white-space:nowrap}
.db{height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.db:hover{border-color:var(--acc)}.db[disabled]{opacity:.4;cursor:default}
.db.p{background:var(--acc);color:var(--accink);border-color:transparent}
.db.on{background:var(--accsoft);border-color:var(--acc);color:var(--acc)}
.dsel{height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:12.5px;padding:0 4px}
.dbody{flex:1;min-height:0;overflow:auto;padding:10px 12px 12px;overflow-wrap:anywhere}
.dtabs{display:flex;gap:4px;margin:0 0 10px}
.dtab{flex:1;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--mute);font-size:12.5px;font-weight:600;cursor:pointer}
.dtab.on{background:var(--accsoft);border-color:var(--acc);color:var(--acc)}
.dcur{padding:10px 12px;border-radius:12px;background:var(--accsoft);border:1px solid var(--line);margin-bottom:10px;line-height:1.7;font-size:13.5px}
.dcur .dl{font-size:11.5px;font-weight:700;color:var(--mute);margin-bottom:2px}
.dcur code,.dnote code,.dres code{font-family:var(--mono);font-size:12.5px;background:var(--surface);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
.dcur .cd{font-family:var(--mono);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;margin:2px 0 6px;font-weight:600}
.dres{padding:9px 12px;border-radius:12px;border:1px solid var(--line);margin-bottom:10px;font-size:13px;line-height:1.7;background:var(--surface2)}
.dres .ch{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;margin-top:2px}
.dres .ch span{font-family:var(--mono);font-size:12.5px}
.dres .ar{color:var(--mute)}
.dres .nv{color:var(--ok);font-weight:700}.dres .ov2{color:var(--mute);text-decoration:line-through}
.dnote{margin:0 0 10px;font-size:12.5px;color:var(--mute);line-height:1.65}
.dlp{margin:0 0 10px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;font-size:13px;line-height:1.6}
.dlp .bar{height:7px;border-radius:7px;background:var(--surface2);margin-top:6px;overflow:hidden}
.dlp .bar i{display:block;height:100%;background:var(--acc);border-radius:7px;transition:width .2s}
.dst{font-size:12px;color:var(--mute);margin:0 0 6px}
.vt{width:100%;border-collapse:collapse;font-size:13px;margin:0 0 10px;table-layout:fixed}
.vt caption{text-align:left;font-size:12px;font-weight:700;color:var(--mute);padding:2px 0 4px}
.vt th{font-size:11.5px;color:var(--mute);font-weight:600;text-align:left;padding:3px 6px;border-bottom:1px solid var(--line)}
.vt td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top;font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere;word-break:break-word}
.vt td.ty{font-family:var(--sans);color:var(--mute);font-size:11.5px}
.vt tr.nw td{background:var(--add)}.vt tr.ch td{background:var(--chg)}

function prt(c,ctx){
 const m=c.match(/^(.*?)\s*(?:을|를|은|는)?\s*(출력|프린트|보여|표시|찍어|말해|알려)/);
 if(!m||!m[1].trim())return null;
 if(m[2]==='알려'&&!(ISV(clean(m[1]))||ctx.vars.has(clean(m[1]))||NOUN[clean(m[1])]||/^(결과|합|합계|답)/.test(m[1].trim())))return null;
 const e=m[1].trim().replace(/^(?:이?라고|라고)\s*/,'');
 const pv=x=>{x=x.trim();const q=x.match(/^["“”‘’'](.*)["“”‘’']$/);if(q)return JSON.stringify(q[1]);
  const cx=clean(x);
  if(/^-?\d+(\.\d+)?$/.test(cx))return cx;
  if(/^(결과|합|합계|답)$/.test(cx)&&ctx.res)return ctx.res;
  if(ctx.vars.has(cx))return cx;
  if(NOUN[cx]&&ctx.vars.has(NOUN[cx]))return NOUN[cx];
  return JSON.stringify(x.replace(/(을|를)$/,''))};
 const parts=e.split(/\s*(?:와|과|,|랑)\s*/);
 if(parts.length>1&&parts.every(p=>{const q=clean(p);return ISV(q)||ctx.vars.has(q)||NOUN[q]}))return ['print('+parts.map(pv).join(', ')+')'];
 return ['print('+pv(e)+')']}

{k:'fstring',al:['f-string','f"','f문자열','포맷 문자열','중괄호 출력','f 출력'],rx:'\\bf["\']',t:'f-string  ·  글자 속에 값 넣기',what:'글자 앞에 f 를 붙이고 중괄호 { } 안에 변수나 계산을 쓰면, 그 값이 글자 안에 바로 들어가요.',when:'"철수님은 20살이에요"처럼 값과 글자를 섞어서 출력할 때 가장 읽기 쉬운 방법이에요.',use:['print','f','변수'],ex:'name = "철수"\nage = 20\nprint(f"{name}님은 {age}살이에요")\nprint(f"내년에는 {age + 1}살이에요")',warn:'f 를 빼먹으면 {name} 이 그대로 글자로 출력돼요. 이 연습장의 실행기(Skulpt)는 f-string 을 지원하지 않을 수 있어요. 그럴 땐 format 이나 쉼표를 쓰세요.',alt:[{t:'format 으로 쓰기',code:'name = "철수"\nage = 20\nprint("{}님은 {}살이에요".format(name, age))\nprint("내년에는 {}살이에요".format(age + 1))',note:'f-string 이 나오기 전부터 쓰던 방법이에요. 값은 format 안에 순서대로 넣어요.'},{t:'str() 과 + 로 이어 붙이기',code:'name = "철수"\nage = 20\nprint(name + "님은 " + str(age) + "살이에요")\nprint("내년에는 " + str(age + 1) + "살이에요")',note:'숫자는 str() 로 글자로 바꿔야 + 로 이어 붙일 수 있어요. 빈칸도 글자 안에 직접 적어요.'}]},
{k:'isinstance',al:['isinstance','type 확인','자료형 검사','타입 검사','타입 체크'],rx:'\\bisinstance\\b',t:'isinstance()  ·  값의 종류 검사',what:'값이 어떤 종류(int, str, list ...)인지 True / False 로 알려줘요.',when:'입력이나 값이 숫자인지 글자인지에 따라 다르게 처리하고 싶을 때 써요.',use:['int','if','리스트'],ex:'x = 5\nprint(isinstance(x, int))\nprint(isinstance("글자", str))\nprint(isinstance(x, str))',warn:'True 와 False 도 정수(int)의 한 종류로 취급돼서 isinstance(True, int) 는 True 예요.',alt:[{t:'type() 으로 비교하기',code:'x = 5\nprint(type(x) == int)\nprint(type("글자") == str)\nprint(type(x) == str)',note:'type 은 정확한 종류를 비교해요. isinstance 는 "그 종류의 한 갈래"까지 함께 인정해서 보통 isinstance 를 더 많이 써요.'}]},
{k:'raise',al:['raise','오류 일으키기','예외 발생','에러 내기','assert'],rx:'\\b(raise|assert)\\b',t:'raise / assert  ·  일부러 오류 내기',what:'조건이 잘못됐을 때 일부러 오류를 일으켜서 잘못된 값이 계속 쓰이지 않게 막아요. raise 오류종류("메시지") 모양이고, assert 조건, "메시지" 는 조건이 거짓일 때 오류를 내요.',when:'함수에 이상한 값(음수 나이 등)이 들어오는 것을 막고 싶을 때 써요.',use:['try','def','if'],ex:'def check_age(age):\n    if age < 0:\n        raise ValueError("나이는 0 이상이어야 해요")\n    return age\n\ntry:\n    check_age(-1)\nexcept ValueError as e:\n    print("오류:", e)',warn:'raise 한 오류를 받아 처리하지 않으면 프로그램이 멈춰요. 그래서 보통 try / except 와 함께 써요.',alt:[{t:'assert 로 쓰기',code:'def check_age(age):\n    assert age >= 0, "나이는 0 이상이어야 해요"\n    return age\n\ntry:\n    check_age(-1)\nexcept AssertionError as e:\n    print("오류:", e)',note:'assert 는 "이 조건은 꼭 참이어야 해요"라는 선언이에요. 짧지만 오류 종류가 AssertionError 로 고정돼요.'}]},
{k:'with',al:['with','open','파일','파일 읽기','파일 쓰기','with open'],rx:'\\b(with|open)\\b',t:'with open()  ·  파일 읽고 쓰기',what:'파일을 열어서 글자를 쓰거나 읽어요. with 로 열면 안쪽 일이 끝났을 때 파일이 자동으로 닫혀요. "w" 는 쓰기, "r" 는 읽기예요.',when:'점수 기록, 메모 저장처럼 프로그램이 꺼져도 남겨야 하는 내용을 저장할 때 써요.',use:['try','문자열'],ex:'with open("memo.txt", "w") as f:\n    f.write("안녕하세요\\n")\nwith open("memo.txt", "r") as f:\n    print(f.read())',warn:'"w" 로 열면 기존 내용이 지워져요. 이어서 쓰려면 "a" 로 열어요. 이 연습장(브라우저)에서는 파일을 읽고 쓸 수 없어서 내 컴퓨터의 파이썬에서 해 보세요.',alt:[{t:'open 과 close 로 직접 열고 닫기',code:'f = open("memo.txt", "w")\nf.write("안녕하세요\\n")\nf.close()\nf = open("memo.txt", "r")\nprint(f.read())\nf.close()',note:'with 가 자동으로 해주는 close() 를 직접 써요. close 를 빼먹으면 파일이 열린 채 남을 수 있어서 with 가 더 안전해요.'}]},
{k:'컴프리헨션',al:['컴프리헨션','comprehension','리스트 컴프리헨션','한 줄 반복','리스트 만들기 한 줄'],rx:'\\[[^\\]]*\\bfor\\b[^\\]]*\\]|\\{[^}]*\\bfor\\b[^}]*\\}',t:'컴프리헨션  ·  한 줄로 리스트 만들기',what:'[만들 값 for 변수 in 묶음 if 조건] 모양으로 for 와 append 를 한 줄에 쓰는 방법이에요. 조건(if)을 붙이면 맞는 것만 골라요.',when:'리스트의 값을 모두 바꾸거나, 조건에 맞는 값만 골라 새 리스트를 만들 때 써요.',use:['리스트','for','if'],ex:'nums = [1, 2, 3, 4, 5]\nsquares = [n * n for n in nums]\nevens = [n for n in nums if n % 2 == 0]\nprint(squares)\nprint(evens)',warn:'너무 길어지면 읽기 어려워요. 그럴 땐 for 반복문으로 풀어서 쓰는 게 좋아요.',alt:[{t:'for 반복문과 append',code:'nums = [1, 2, 3, 4, 5]\nsquares = []\nevens = []\nfor n in nums:\n    squares.append(n * n)\n    if n % 2 == 0:\n        evens.append(n)\nprint(squares)\nprint(evens)',note:'컴프리헨션이 하는 일을 풀어 쓴 모양이에요. 처음에는 이쪽이 이해하기 쉬워요.'},{t:'map 과 filter',code:'nums = [1, 2, 3, 4, 5]\nsquares = list(map(lambda n: n * n, nums))\nevens = list(filter(lambda n: n % 2 == 0, nums))\nprint(squares)\nprint(evens)',note:'map 은 모든 값에 계산을, filter 는 조건에 맞는 값만 골라요. 컴프리헨션이 더 읽기 쉬워서 많이 써요.'}]},
{k:'슬라이싱',al:['슬라이싱','slice','[::]','일부 자르기','[1:3]','뒤집기 [::-1]'],rx:'\\[[^\\]\\n]*:[^\\]\\n]*\\]',t:'슬라이싱  ·  [시작:끝:간격] 으로 자르기',what:'리스트나 글자의 일부를 잘라 와요. [시작:끝] 은 시작 번호부터 끝 번호 앞까지, [::2] 는 두 칸씩, [::-1] 은 거꾸로예요. 번호는 0부터 세요.',when:'앞의 몇 개만 보거나, 글자를 뒤집거나, 홀수 번째만 뽑을 때 써요.',use:['리스트','문자열','range'],ex:'s = "파이썬프로그래밍"\nnums = [10, 20, 30, 40, 50]\nprint(s[:3])\nprint(nums[1:4])\nprint(nums[::2])\nprint(nums[::-1])',warn:'끝 번호는 포함되지 않아요. nums[1:4] 는 번호 1, 2, 3 이에요.',alt:[{t:'번호로 하나씩 꺼내기와 reversed',code:'s = "파이썬프로그래밍"\nnums = [10, 20, 30, 40, 50]\nprint(s[0] + s[1] + s[2])\nprint([nums[1], nums[2], nums[3]])\nprint([nums[0], nums[2], nums[4]])\nprint(list(reversed(nums)))',note:'슬라이싱이 해주는 일을 번호로 직접 꺼내서 써요. 길어질수록 슬라이싱이 훨씬 편해요.'}]},
{k:'재귀',al:['재귀','recursion','재귀 함수','자기 자신 호출'],rx:'\\bdef\\s+(\\w+)\\([^)]*\\):[\\s\\S]*?\\b\\1\\(',t:'재귀  ·  자기 자신을 부르는 함수',what:'함수 안에서 자기 자신을 다시 부르는 방법이에요. 문제를 더 작은 문제로 나눠 풀 때 써요. 반드시 멈추는 조건이 있어야 해요.',when:'팩토리얼, 피보나치, 하노이 탑처럼 같은 모양이 계속 반복되는 문제에 써요.',use:['def','if','while'],ex:'def countdown(n):\n    if n == 0:\n        print("끝!")\n        return\n    print(n)\n    countdown(n - 1)\n\ncountdown(3)',warn:'멈추는 조건(여기서는 n == 0)이 없으면 끝나지 않고 RecursionError 오류가 나요.',alt:[{t:'while 반복문으로 같은 일',code:'n = 3\nwhile n > 0:\n    print(n)\n    n -= 1\nprint("끝!")',note:'재귀로 푸는 문제는 대부분 반복문으로도 풀 수 있어요. 반복문이 더 빠르고 단순할 때가 많아요.'}]},
{k:'yield',al:['yield','제너레이터','generator','값을 하나씩 만들기'],rx:'\\byield\\b',t:'yield  ·  값을 하나씩 만들어 주는 함수',what:'return 대신 yield 를 쓰면 함수가 값을 하나 내보내고 잠깐 멈췄다가, 다음 값을 요청받으면 이어서 실행돼요. 이런 함수를 제너레이터라고 해요.',when:'아주 많은 값을 한꺼번에 만들지 않고 하나씩 처리하고 싶을 때 써요.',use:['def','for','range'],ex:'def count_up(n):\n    for i in range(1, n + 1):\n        yield i\n\nfor x in count_up(3):\n    print(x)',warn:'처음에는 어려울 수 있어요. 값 전체가 필요하면 list(count_up(3)) 처럼 리스트로 바꿔 쓸 수 있어요.',alt:[{t:'리스트에 모아서 돌려주기',code:'def count_up(n):\n    result = []\n    for i in range(1, n + 1):\n        result.append(i)\n    return result\n\nfor x in count_up(3):\n    print(x)',note:'yield 대신 값을 리스트에 모아서 return 해요. 값이 아주 많으면 메모리를 더 쓰지만 이해하기는 쉬워요.'}]},
{k:'args',al:['args','kwargs','*args','**kwargs','가변 인자','여러 개 받는 함수'],rx:'\\*\\*?[A-Za-z_]\\w*\\s*[,)]',t:'*args / **kwargs  ·  개수가 정해지지 않은 값 받기',what:'함수의 괄호 안에 *이름 을 쓰면 값을 몇 개든 튜플로 받고, **이름 을 쓰면 이름=값 짝을 몇 개든 딕셔너리로 받아요.',when:'더하는 숫자가 몇 개인지 미리 모르는 함수처럼 값의 개수가 달라지는 함수를 만들 때 써요.',use:['def','dict','tuple'],ex:'def total(*nums):\n    return sum(nums)\n\ndef show(**info):\n    for k, v in info.items():\n        print(k, v)\n\nprint(total(1, 2, 3))\nshow(name="철수", age=20)',warn:'*args 는 이름 앞의 별(*)이 중요하고 이름 자체(args)는 바꿔도 돼요.',alt:[{t:'리스트와 딕셔너리를 직접 넘기기',code:'def total(nums):\n    return sum(nums)\n\ndef show(info):\n    for k, v in info.items():\n        print(k, v)\n\nprint(total([1, 2, 3]))\nshow({"name": "철수", "age": 20})',note:'받는 값을 하나의 리스트, 딕셔너리로 정해 두는 방법이에요. 부를 때 괄호 [ ] 와 { } 를 직접 써야 해요.'}]},
{k:'__str__',al:['__str__','str 메서드','객체 출력','print(객체)','repr'],rx:'__str__',t:'__str__  ·  객체를 출력할 때의 모양',what:'클래스 안에 __str__ 이라는 메서드를 만들어 두면, print(객체) 를 할 때 그 메서드가 돌려주는 글자가 출력돼요.',when:'객체를 그냥 출력했을 때 알아볼 수 없는 주소 대신 읽기 좋은 글자가 나오게 하고 싶을 때 써요.',use:['class','print','def'],ex:'class Dog:\n    def __init__(self, name):\n        self.name = name\n    def __str__(self):\n        return "강아지 " + self.name\n\nd = Dog("초코")\nprint(d)',warn:'__str__ 은 print 하는 대신 글자를 return 해야 해요.',alt:[{t:'보여주는 메서드를 따로 만들기',code:'class Dog:\n    def __init__(self, name):\n        self.name = name\n    def show(self):\n        return "강아지 " + self.name\n\nd = Dog("초코")\nprint(d.show())',note:'이름을 마음대로 정한 메서드(show)로 같은 글자를 만들 수 있어요. 대신 print(d) 만으로는 보이지 않아요.'}]},
{k:'정렬기준',al:['정렬 기준','key','sorted key','길이순 정렬','key=lambda','여러 기준 정렬'],rx:'key\\s*=',t:'정렬 기준  ·  sorted(key=...)',what:'sorted 나 sort 의 key= 에 함수를 넣으면 그 함수가 돌려주는 값을 기준으로 정렬해요. reverse=True 는 큰 것부터예요.',when:'글자 길이순, 점수순, 나이순처럼 원하는 기준으로 정렬하고 싶을 때 써요.',use:['sum','lambda','리스트'],ex:'words = ["banana", "kiwi", "apple"]\nprint(sorted(words, key=len))\npeople = [("철수", 20), ("영희", 18)]\nprint(sorted(people, key=lambda p: p[1]))\nprint(sorted(words, reverse=True))',warn:'key=len() 처럼 괄호를 붙이면 안 돼요. 함수 이름만 써요.',alt:[{t:'기준 함수를 def 로 만들기',code:'def by_len(w):\n    return len(w)\n\ndef by_age(p):\n    return p[1]\n\nwords = ["banana", "kiwi", "apple"]\nprint(sorted(words, key=by_len))\npeople = [("철수", 20), ("영희", 18)]\nprint(sorted(people, key=by_age))\nprint(sorted(words, reverse=True))',note:'lambda 는 이름 없는 한 줄 함수예요. def 로 같은 일을 하는 함수를 만들어 넣어도 결과가 같아요.'}]},
{k:'any',al:['any','all','하나라도','모두 만족','전부 참인지'],rx:'\\b(any|all)\\s*\\(',t:'any / all  ·  조건 한꺼번에 확인',what:'all(묶음)은 안의 값이 전부 참일 때, any(묶음)은 하나라도 참일 때 True 예요.',when:'"모든 점수가 60점 이상인가?", "하나라도 0이 있나?"를 한 줄로 확인할 때 써요.',use:['if','리스트','컴프리헨션'],ex:'nums = [2, 4, 6]\nprint(all(n % 2 == 0 for n in nums))\nprint(any(n > 5 for n in nums))\nprint(any(n > 10 for n in nums))',warn:'빈 묶음에서는 all 이 True, any 가 False 예요.',alt:[{t:'for 반복문으로 직접 확인',code:'nums = [2, 4, 6]\nok = True\nfor n in nums:\n    if n % 2 != 0:\n        ok = False\nprint(ok)\nfound = False\nfor n in nums:\n    if n > 5:\n        found = True\nprint(found)\nfound = False\nfor n in nums:\n    if n > 10:\n        found = True\nprint(found)',note:'all 과 any 가 해주는 일을 반복문과 True/False 변수로 직접 해요.'}]},
{k:'2차원',al:['2차원','이차원 리스트','행렬','리스트 안의 리스트','grid','표'],rx:'\\[\\s*\\[',t:'2차원 리스트  ·  리스트 안의 리스트',what:'리스트 안에 리스트를 넣어 표(행과 열)처럼 만든 거예요. grid[행][열] 로 한 칸을 꺼내요. 번호는 0부터예요.',when:'점수표, 게임판(빙고, 오목), 행렬 계산처럼 표 모양 데이터를 다룰 때 써요.',use:['리스트','for','range'],ex:'grid = [[1, 2, 3], [4, 5, 6]]\nprint(grid[1][2])\nfor row in grid:\n    for v in row:\n        print(v, end=" ")\n    print()',warn:'grid[1][2] 는 두 번째 줄의 세 번째 칸이에요 (둘 다 0부터 세요).',alt:[{t:'번호로 돌아서 꺼내기',code:'grid = [[1, 2, 3], [4, 5, 6]]\nprint(grid[1][2])\nfor i in range(len(grid)):\n    for j in range(len(grid[i])):\n        print(grid[i][j], end=" ")\n    print()',note:'값을 바로 꺼내는 대신 행 번호(i)와 열 번호(j)를 직접 돌려요. 번호가 필요할 때 이 방법을 써요.'}]}
);

function glFind(q){
 q=(q||'').trim().toLowerCase();
 if(!q)return[];
 if(GLK[q])return[GLK[q],...GL.filter(g=>g!==GLK[q]&&(g.use||[]).includes(GLK[q].k)).slice(0,0)];
 const sc=[];
 GL.forEach(g=>{let best=0;[g.k,g.t,...g.al].forEach(a=>{a=a.toLowerCase();if(a.includes(q)||q.includes(a))best=Math.max(best,1.5+Math.min(a.length,q.length)/Math.max(a.length,q.length));else{const A=bg(norm(a)),B=bg(norm(q));if(A.size&&B.size){let n=0;A.forEach(x=>{if(B.has(x))n++});best=Math.max(best,2*n/(A.size+B.size))}}});if(best>=0.35)sc.push([best,g])});
 sc.sort((a,b)=>b[0]-a[0]);return sc.slice(0,5).map(x=>x[1])}

function scanText(text){
 let depth=0,q=null,tri=null,cmt=-1;
 for(let i=0;i<text.length;i++){
  const ch=text[i];
  if(tri){if(text.startsWith(tri,i)){tri=null;i+=2}continue}
  if(q){if(ch==='\\'){i++;continue}if(ch===q)q=null;continue}
  if(ch==='#'){cmt=i;break}
  if(ch==='"'||ch==="'"){if(text.startsWith(ch+ch+ch,i)){tri=ch+ch+ch;i+=2}else q=ch;continue}
  if('([{'.includes(ch))depth++;else if(')]}'.includes(ch))depth--}
 return{depth,tri,cmt}}
function stripCmt(text){const r=scanText(text);return r.cmt>=0?text.slice(0,r.cmt).trimEnd():text}
function splitTop(s,sep){
 const out=[];let d=0,q=null,cur='';
 for(let i=0;i<s.length;i++){const ch=s[i];
  if(q){cur+=ch;if(ch==='\\'){cur+=s[++i]||'';continue}if(ch===q)q=null;continue}
  if(ch==='"'||ch==="'"){q=ch;cur+=ch;continue}
  if('([{'.includes(ch))d++;else if(')]}'.includes(ch))d--;
  if(ch===sep&&d===0){out.push(cur);cur=''}else cur+=ch}
 out.push(cur);return out}
function noStr(s){return s.replace(/"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'/g,'""')}
function parseStmts(src){
 const L=src.split('\n'),st=[];let i=0;
 while(i<L.length){
  const raw=L[i],t=raw.trim();
  if(!t){i++;continue}
  const ind=raw.match(/^ */)[0].length;
  if(t.startsWith('#')){st.push({i,end:i,ind,t,k:'comment'});i++;continue}
  let text=t,end=i,sc=scanText(text);
  while((sc.depth>0||sc.tri)&&end+1<L.length){end++;text+='\n'+L[end].trim();sc=scanText(text)}

add(/(?:숫자(?:가)?아니면|숫자(?:가)?아닌|숫자만|잘못.*입력).*(?:다시|재입력)|(?:다시|재입력).*(?:숫자|입력)|입력.*다시|입력.*(?:검증|확인).*숫자/,()=>J(['while True:','    text = input("숫자를 입력하세요: ")','    try:','        number = int(text)','        break  # 숫자로 바꾸기에 성공하면 반복을 끝내요','    except ValueError:','        print("숫자가 아니에요. 다시 입력해 주세요.")','print("입력한 숫자:", number)']));

add(/(?:사용자|직접|내가).*(?:만든|정의).*(?:예외|오류|에러)|예외.*(?:직접|새로).*만들|raise/,()=>J(['class NegativeError(Exception):','    """음수일 때 쓰는 나만의 오류"""','    pass','','def check(n):','    if n < 0:','        raise NegativeError("음수는 안 돼요: " + str(n))','    return n','','try:','    check(-5)','except NegativeError as e:','    print("오류:", e)']));
add(/(?:예외|오류|에러).*(?:처리|잡아).*(?:finally|마지막|항상)|finally/,()=>J(['try:','    number = int(input("숫자: "))','    print(10 / number)','except ValueError:','    print("숫자가 아니에요")','except ZeroDivisionError:','    print("0으로는 나눌 수 없어요")','finally:','    print("끝났어요 (오류가 나도 항상 실행돼요)")']));

 ["(?:자기소개|프로필|명함).*(?:웹|페이지|사이트|카드|html)",false,"profile","# 웹페이지 만들기: 자기소개 페이지\n# 파이썬이 HTML 글자를 파일에 써 줘요. 실행한 뒤 [웹 미리보기] 버튼으로 바로 볼 수 있어요.\nhtml = r\"\"\"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>내 소개</title>\n<\style>\n  * { box-sizing: border-box; }\n  body { margin: 0; font-family: system-ui, sans-serif; background: #eef2ff; display: grid; place-items: center; min-height: 100vh; padding: 16px; }\n  .card { background: #fff; width: 100%; max-width: 380px; border-radius: 20px; padding: 28px 24px; text-align: center; box-shadow: 0 10px 30px rgba(60, 60, 140, .15); }\n  .avatar { width: 96px; height: 96px; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #ec4899); margin: 0 auto 14px; display: grid; place-items: center; font-size: 44px; }\n  h1 { margin: 0 0 4px; font-size: 24px; }\n  .job { color: #6b7280; margin: 0 0 16px; }\n  .tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 16px; }\n  .tags span { background: #eef2ff; color: #4338ca; padding: 4px 10px; border-radius: 999px; font-size: 13px; }\n  button { background: #4f46e5; color: #fff; border: 0; padding: 10px 18px; border-radius: 10px; font-size: 15px; cursor: pointer; }\n  #msg { margin-top: 12px; min-height: 22px; color: #4338ca; }\n<\/style>\n</head>\n<body>\n  <div class=\"card\">\n    <div class=\"avatar\">😀</div>\n    <h1>홍길동</h1>            <\!-- 여기에 내 이름을 쓰세요 -->\n    <p class=\"job\">파이썬을 배우는 학생</p>\n    <div class=\"tags\"><span>파이썬</span><span>게임</span><span>음악</span></div>\n    <button id=\"hello\">인사하기</button>\n    <div id=\"msg\"></div>\n  </div>\n  <\script>\n    document.getElementById('hello').onclick = function () {\n      document.getElementById('msg').textContent = '안녕하세요! 만나서 반가워요 👋';\n    };\n  <\/script>\n</body>\n</html>\n\"\"\"\n\nwith open(\"index.html\", \"w\", encoding=\"utf-8\") as f:\n    f.write(html)\n\nprint(\"index.html 을 만들었어요!\")\nprint(\"아래의 [만든 웹페이지 보기] 또는 위쪽의 [웹 미리보기] 버튼을 눌러 보세요.\")"],
 ["(?:뱀게임|스네이크|snake)",false,"snake","# 웹페이지 만들기: 뱀 게임\n# 파이썬이 HTML 글자를 파일에 써 줘요. 실행한 뒤 [웹 미리보기] 버튼으로 바로 볼 수 있어요.\nhtml = r\"\"\"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>뱀 게임</title>\n<\style>\n  body { font-family: system-ui, sans-serif; text-align: center; background: #052e16; color: #fff; margin: 0; padding: 12px; touch-action: manipulation; }\n  canvas { background: #14532d; border-radius: 10px; max-width: 100%; }\n  #pad { display: grid; grid-template-columns: repeat(3, 64px); gap: 6px; justify-content: center; margin-top: 10px; }\n  #pad button { height: 54px; font-size: 22px; border: 0; border-radius: 10px; background: #166534; color: #fff; }\n  #start { margin: 8px; padding: 10px 22px; border: 0; border-radius: 999px; background: #facc15; font-size: 16px; cursor: pointer; }\n<\/style>\n</head>\n<body>\n  <h3 style=\"margin:6px\">🐍 뱀 게임 <span id=\"score\">점수 0</span></h3>\n  <canvas id=\"c\" width=\"320\" height=\"320\"></canvas><br>\n  <button id=\"start\">시작 / 다시 하기</button>\n  <div style=\"font-size:13px;color:#bbf7d0\">방향키 또는 아래 버튼으로 움직여요</div>\n  <div id=\"pad\"><span></span><button data-d=\"up\">▲</button><span></span><button data-d=\"left\">◀</button><button data-d=\"down\">▼</button><button data-d=\"right\">▶</button></div>\n  <\script>\n    var cv = document.getElementById('c'), ctx = cv.getContext('2d'), N = 16, S = cv.width / N;\n    var snake, dir, next, food, score, timer, alive;\n    var VEC = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };\n    function place() { do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; } while (snake.some(function (p) { return p.x === food.x && p.y === food.y; })); }\n    function draw() {\n      ctx.fillStyle = '#14532d'; ctx.fillRect(0, 0, cv.width, cv.height);\n      ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(food.x * S + S / 2, food.y * S + S / 2, S / 2 - 2, 0, 7); ctx.fill();\n      snake.forEach(function (p, i) { ctx.fillStyle = i ? '#4ade80' : '#bbf7d0'; ctx.fillRect(p.x * S + 1, p.y * S + 1, S - 2, S - 2); });\n      if (!alive) { ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.fillStyle = '#fff'; ctx.font = '28px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('게임 오버', cv.width / 2, cv.height / 2); }\n    }\n    function step() {\n      dir = next;\n      var h = { x: snake[0].x + VEC[dir][0], y: snake[0].y + VEC[dir][1] };\n      if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(function (p) { return p.x === h.x && p.y === h.y; })) { alive = false; clearInterval(timer); draw(); return; }\n      snake.unshift(h);\n      if (h.x === food.x && h.y === food.y) { score++; document.getElementById('score').textContent = '점수 ' + score; place(); } else snake.pop();\n      draw();\n    }\n    function start() { clearInterval(timer); snake = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }]; dir = next = 'right'; score = 0; alive = true; document.getElementById('score').textContent = '점수 0'; place(); draw(); timer = setInterval(step, 130); }\n    function turn(d) { var opp = { up: 'down', down: 'up', left: 'right', right: 'left' }; if (d !== opp[dir]) next = d; }\n    document.addEventListener('keydown', function (e) { var m = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }[e.key]; if (m) { e.preventDefault(); turn(m); } });\n    document.querySelectorAll('#pad button').forEach(function (b) { b.onclick = function () { turn(b.dataset.d); }; });\n    document.getElementById('start').onclick = start;\n    snake = [{ x: 8, y: 8 }]; dir = next = 'right'; alive = true; place(); draw();\n  <\/script>\n</body>\n</html>\n\"\"\"\n\nwith open(\"index.html\", \"w\", encoding=\"utf-8\") as f:\n    f.write(html)\n\nprint(\"index.html 을 만들었어요!\")\nprint(\"아래의 [만든 웹페이지 보기] 또는 위쪽의 [웹 미리보기] 버튼을 눌러 보세요.\")"],
 ["벽돌깨기|브레이크아웃",false,"breakout","# 웹페이지 만들기: 벽돌깨기\n# 파이썬이 HTML 글자를 파일에 써 줘요. 실행한 뒤 [웹 미리보기] 버튼으로 바로 볼 수 있어요.\nhtml = r\"\"\"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>벽돌깨기</title>\n<\style>\n  body { font-family: system-ui, sans-serif; text-align: center; background: #111827; color: #fff; margin: 0; padding: 10px; touch-action: none; }\n  canvas { background: #1f2937; border-radius: 10px; max-width: 100%; }\n  button { padding: 8px 20px; border: 0; border-radius: 999px; background: #facc15; font-size: 15px; cursor: pointer; margin: 6px; }\n<\/style>\n</head>\n<body>\n  <h3 style=\"margin:6px\">🧱 벽돌깨기 <span id=\"info\"></span></h3>\n  <canvas id=\"c\" width=\"360\" height=\"420\"></canvas><br>\n  <button id=\"start\">시작 / 다시 하기</button>\n  <div style=\"font-size:13px;color:#9ca3af\">마우스·터치로 막대를 움직이거나 ◀ ▶ 키를 써요</div>\n  <\script>\n    var cv = document.getElementById('c'), ctx = cv.getContext('2d');\n    var W = cv.width, H = cv.height, PW = 70, PH = 10, R = 7;\n    var px, bx, by, vx, vy, bricks, score, lives, running, raf;\n    function reset() {\n      px = W / 2 - PW / 2; bx = W / 2; by = H - 50; vx = 3; vy = -3.6; score = 0; lives = 3;\n      bricks = []; for (var r = 0; r < 5; r++) for (var c = 0; c < 8; c++) bricks.push({ x: 12 + c * 43, y: 40 + r * 22, w: 38, h: 16, alive: true, color: ['#ef4444','#f97316','#eab308','#22c55e','#3b82f6'][r] });\n    }\n    function draw(msg) {\n      ctx.clearRect(0, 0, W, H);\n      bricks.forEach(function (b) { if (b.alive) { ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, b.w, b.h); } });\n      ctx.fillStyle = '#fff'; ctx.fillRect(px, H - 24, PW, PH);\n      ctx.beginPath(); ctx.arc(bx, by, R, 0, 7); ctx.fill();\n      document.getElementById('info').textContent = '점수 ' + score + ' · 목숨 ' + lives;\n      if (msg) { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#fff'; ctx.font = '28px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(msg, W / 2, H / 2); }\n    }\n    function loop() {\n      bx += vx; by += vy;\n      if (bx < R || bx > W - R) vx = -vx;\n      if (by < R) vy = -vy;\n      if (by > H - 24 - R && by < H - 14 && bx > px - R && bx < px + PW + R && vy > 0) { vy = -vy; vx += (bx - (px + PW / 2)) / 14; }\n      bricks.forEach(function (b) { if (b.alive && bx > b.x - R && bx < b.x + b.w + R && by > b.y - R && by < b.y + b.h + R) { b.alive = false; vy = -vy; score += 10; } });\n      if (by > H) { lives--; if (lives <= 0) { running = false; draw('게임 오버'); return; } bx = W / 2; by = H - 50; vx = 3; vy = -3.6; }\n      if (bricks.every(function (b) { return !b.alive; })) { running = false; draw('클리어! 🎉'); return; }\n      draw(); raf = requestAnimationFrame(loop);\n    }\n    function start() { cancelAnimationFrame(raf); reset(); running = true; loop(); }\n    function moveTo(clientX) { var rect = cv.getBoundingClientRect(); px = Math.max(0, Math.min(W - PW, (clientX - rect.left) * W / rect.width - PW / 2)); }\n    cv.addEventListener('mousemove', function (e) { moveTo(e.clientX); });\n    cv.addEventListener('touchmove', function (e) { e.preventDefault(); moveTo(e.touches[0].clientX); }, { passive: false });\n    document.addEventListener('keydown', function (e) { if (e.key === 'ArrowLeft') px = Math.max(0, px - 26); if (e.key === 'ArrowRight') px = Math.min(W - PW, px + 26); });\n    document.getElementById('start').onclick = start;\n    reset(); draw('시작을 눌러요');\n  <\/script>\n</body>\n</html>\n\"\"\"\n\nwith open(\"index.html\", \"w\", encoding=\"utf-8\") as f:\n    f.write(html)\n\nprint(\"index.html 을 만들었어요!\")\nprint(\"아래의 [만든 웹페이지 보기] 또는 위쪽의 [웹 미리보기] 버튼을 눌러 보세요.\")"],
 ["(?:공룡|점프|러너|달리기)게임|dino",false,"dino","# 웹페이지 만들기: 점프 게임\n# 파이썬이 HTML 글자를 파일에 써 줘요. 실행한 뒤 [웹 미리보기] 버튼으로 바로 볼 수 있어요.\nhtml = r\"\"\"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>점프 게임</title>\n<\style>\n  body { font-family: system-ui, sans-serif; text-align: center; background: #f7f7f7; margin: 0; padding: 12px; user-select: none; touch-action: manipulation; }\n  canvas { background: #fff; border: 2px solid #ddd; border-radius: 10px; max-width: 100%; }\n  button { padding: 10px 24px; border: 0; border-radius: 999px; background: #374151; color: #fff; font-size: 16px; cursor: pointer; margin: 6px; }\n<\/style>\n</head>\n<body>\n  <h3 style=\"margin:6px\">🦖 점프 게임 <span id=\"score\">0</span></h3>\n  <canvas id=\"c\" width=\"480\" height=\"180\"></canvas><br>\n  <button id=\"jump\">점프 (스페이스 · 화면 터치)</button><button id=\"start\">다시 시작</button>\n  <\script>\n    var cv = document.getElementById('c'), ctx = cv.getContext('2d'), G = 140;\n    var y, vy, obs, speed, score, alive, frame, raf;\n    function reset() { y = G; vy = 0; obs = []; speed = 5; score = 0; alive = true; frame = 0; }\n    function jump() { if (alive && y >= G) vy = -12.5; }\n    function loop() {\n      frame++; vy += 0.7; y = Math.min(G, y + vy); if (y >= G) vy = 0;\n      if (frame % Math.max(45, 95 - Math.floor(score / 80)) === 0) obs.push({ x: cv.width, w: 16 + Math.random() * 14, h: 24 + Math.random() * 22 });\n      obs.forEach(function (o) { o.x -= speed; });\n      obs = obs.filter(function (o) { return o.x + o.w > 0; });\n      score += 1; speed = 5 + score / 400;\n      obs.forEach(function (o) { if (o.x < 44 && o.x + o.w > 14 && y > G - o.h + 4) alive = false; });\n      ctx.clearRect(0, 0, cv.width, cv.height);\n      ctx.fillStyle = '#9ca3af'; ctx.fillRect(0, G + 30, cv.width, 2);\n      ctx.fillStyle = '#374151'; ctx.fillRect(14, y, 30, 30);\n      ctx.fillStyle = '#16a34a'; obs.forEach(function (o) { ctx.fillRect(o.x, G + 30 - o.h, o.w, o.h); });\n      document.getElementById('score').textContent = Math.floor(score / 5);\n      if (!alive) { ctx.fillStyle = '#111'; ctx.font = '26px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('게임 오버', cv.width / 2, 80); return; }\n      raf = requestAnimationFrame(loop);\n    }\n    function start() { cancelAnimationFrame(raf); reset(); loop(); }\n    document.addEventListener('keydown', function (e) { if (e.code === 'Space' || e.key === 'ArrowUp') { e.preventDefault(); jump(); } });\n    cv.addEventListener('touchstart', function (e) { e.preventDefault(); jump(); }, { passive: false });\n    cv.addEventListener('mousedown', jump);\n    document.getElementById('jump').onclick = jump; document.getElementById('start').onclick = start;\n    start();\n  <\/script>\n</body>\n</html>\n\"\"\"\n\nwith open(\"index.html\", \"w\", encoding=\"utf-8\") as f:\n    f.write(html)\n\nprint(\"index.html 을 만들었어요!\")\nprint(\"아래의 [만든 웹페이지 보기] 또는 위쪽의 [웹 미리보기] 버튼을 눌러 보세요.\")"],
 ["카드(?:짝|뒤집|맞추기)|짝맞추기|메모리게임|기억력게임",false,"memory","# 웹페이지 만들기: 카드 짝 맞추기\n# 파이썬이 HTML 글자를 파일에 써 줘요. 실행한 뒤 [웹 미리보기] 버튼으로 바로 볼 수 있어요.\nhtml = r\"\"\"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>카드 짝 맞추기</title>\n<\style>\n  body { font-family: system-ui, sans-serif; text-align: center; background: #fdf4ff; margin: 0; padding: 16px; }\n  #grid { display: grid; grid-template-columns: repeat(4, 70px); gap: 8px; justify-content: center; margin: 14px 0; }\n  .card { width: 70px; height: 70px; font-size: 34px; border: 0; border-radius: 12px; background: #a855f7; color: transparent; cursor: pointer; }\n  .card.open, .card.done { background: #fff; color: #000; box-shadow: 0 2px 6px rgba(0,0,0,.15); }\n  .card.done { opacity: .55; }\n  button.r { padding: 10px 20px; border: 0; border-radius: 8px; background: #7e22ce; color: #fff; cursor: pointer; font-size: 15px; }\n<\/style>\n</head>\n<body>\n  <h2>🃏 카드 짝 맞추기</h2>\n  <div>시도 <b id=\"tries\">0</b>번 · 맞춘 짝 <b id=\"pairs\">0</b>/8</div>\n  <div id=\"grid\"></div>\n  <button class=\"r\" id=\"reset\">다시 섞기</button>\n  <\script>\n    var EMOJI = ['🐶','🐱','🐰','🦊','🐻','🐼','🐸','🐵'];\n    var first = null, lock = false, tries = 0, pairs = 0;\n    function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }\n    function setup() {\n      var grid = document.getElementById('grid'); grid.innerHTML = ''; first = null; lock = false; tries = 0; pairs = 0;\n      document.getElementById('tries').textContent = 0; document.getElementById('pairs').textContent = 0;\n      shuffle(EMOJI.concat(EMOJI)).forEach(function (e) {\n        var b = document.createElement('button'); b.className = 'card'; b.textContent = e; b.dataset.e = e;\n        b.onclick = function () {\n          if (lock || b.classList.contains('open') || b.classList.contains('done')) return;\n          b.classList.add('open');\n          if (!first) { first = b; return; }\n          tries++; document.getElementById('tries').textContent = tries;\n          if (first.dataset.e === b.dataset.e) { first.className = b.className = 'card done'; pairs++; document.getElementById('pairs').textContent = pairs; first = null;\n            if (pairs === 8) setTimeout(function () { alert(tries + '번 만에 모두 맞혔어요! 🎉'); }, 200); }\n          else { lock = true; var a = first; first = null; setTimeout(function () { a.classList.remove('open'); b.classList.remove('open'); lock = false; }, 700); }\n        };\n        grid.appendChild(b);\n      });\n    }\n    document.getElementById('reset').onclick = setup; setup();\n  <\/script>\n</body>\n</html>\n\"\"\"\n\nwith open(\"index.html\", \"w\", encoding=\"utf-8\") as f:\n    f.write(html)\n\nprint(\"index.html 을 만들었어요!\")\nprint(\"아래의 [만든 웹페이지 보기] 또는 위쪽의 [웹 미리보기] 버튼을 눌러 보세요.\")"],
 ["(?:틱택토|삼목|tictactoe)",true,"tictactoe","# 웹페이지 만들기: 틱택토\n# 파이썬이 HTML 글자를 파일에 써 줘요. 실행한 뒤 [웹 미리보기] 버튼으로 바로 볼 수 있어요.\nhtml = r\"\"\"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>틱택토</title>\n<\style>\n  body { font-family: system-ui, sans-serif; text-align: center; background: #f5f3ff; margin: 0; padding: 20px; }\n  #board { display: grid; grid-template-columns: repeat(3, 92px); gap: 6px; justify-content: center; margin: 16px 0; }\n  .cell { width: 92px; height: 92px; font-size: 48px; border: 0; border-radius: 12px; background: #fff; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.1); }\n  .cell.win { background: #fde68a; }\n  button.r { padding: 10px 20px; border: 0; border-radius: 8px; background: #7c3aed; color: #fff; font-size: 15px; cursor: pointer; }\n  label { margin: 0 8px; }\n<\/style>\n</head>\n<body>\n  <h2>⭕ 틱택토 ❌</h2>\n  <div><label><input type=\"radio\" name=\"mode\" value=\"ai\" checked> 컴퓨터와 대결</label><label><input type=\"radio\" name=\"mode\" value=\"two\"> 둘이서</label></div>\n  <div id=\"status\" style=\"font-size:18px;margin-top:10px\"></div>\n  <div id=\"board\"></div>\n  <button class=\"r\" id=\"reset\">다시 하기</button>\n  <\script>\n    var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];\n    var board, turn, over;\n    function winner(b) { for (var i = 0; i < LINES.length; i++) { var l = LINES[i]; if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return l; } return null; }\n    function render() {\n      var cells = document.querySelectorAll('.cell'), w = winner(board);\n      board.forEach(function (v, i) { cells[i].textContent = v; cells[i].className = 'cell' + (w && w.indexOf(i) >= 0 ? ' win' : ''); });\n      document.getElementById('status').textContent = w ? board[w[0]] + ' 승리! 🎉' : board.indexOf('') < 0 ? '비겼어요' : turn + ' 차례';\n    }\n    function aiMove() {\n      // 1) 이길 수 있으면 이기고 2) 막아야 하면 막고 3) 가운데 4) 아무 빈칸\n      function find(p) { for (var i = 0; i < LINES.length; i++) { var l = LINES[i], vals = l.map(function (k) { return board[k]; });\n        if (vals.filter(function (v) { return v === p; }).length === 2 && vals.indexOf('') >= 0) return l[vals.indexOf('')]; } return -1; }\n      var m = find('X'); if (m < 0) m = find('O'); if (m < 0 && board[4] === '') m = 4;\n      if (m < 0) { var empty = []; board.forEach(function (v, i) { if (!v) empty.push(i); }); m = empty[Math.floor(Math.random() * empty.length)]; }\n      board[m] = 'X'; turn = 'O';\n    }\n    function click(i) {\n      if (over || board[i]) return;\n      board[i] = turn;\n      var vsAI = document.querySelector('input[name=mode]:checked').value === 'ai';\n      if (winner(board) || board.indexOf('') < 0) { over = true; }\n      else if (vsAI) { turn = 'X'; aiMove(); if (winner(board) || board.indexOf('') < 0) over = true; }\n      else turn = turn === 'O' ? 'X' : 'O';\n      render();\n    }\n    function reset() { board = Array(9).fill(''); turn = 'O'; over = false; render(); }\n    var boardEl = document.getElementById('board');\n    for (var i = 0; i < 9; i++) { (function (i) { var b = document.createElement('button'); b.className = 'cell'; b.onclick = function () { click(i); }; boardEl.appendChild(b); })(i); }\n    document.getElementById('reset').onclick = reset;\n    document.querySelectorAll('input[name=mode]').forEach(function (r) { r.onchange = reset; });\n    reset();\n  <\/script>\n</body>\n</html>\n\"\"\"\n\nwith open(\"index.html\", \"w\", encoding=\"utf-8\") as f:\n    f.write(html)\n\nprint(\"index.html 을 만들었어요!\")\nprint(\"아래의 [만든 웹페이지 보기] 또는 위쪽의 [웹 미리보기] 버튼을 눌러 보세요.\")"],
 ["가위바위보",true,"rps","# 웹페이지 만들기: 가위바위보\n# 파이썬이 HTML 글자를 파일에 써 줘요. 실행한 뒤 [웹 미리보기] 버튼으로 바로 볼 수 있어요.\nhtml = r\"\"\"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>가위바위보</title>\n<\style>\n  body { font-family: system-ui, sans-serif; text-align: center; background: #ecfeff; margin: 0; padding: 20px; }\n  .hands button { font-size: 52px; margin: 6px; padding: 10px 16px; border: 0; border-radius: 16px; background: #fff; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,.12); }\n  #result { font-size: 22px; margin: 16px 0; min-height: 34px; }\n  .vs { font-size: 54px; }\n<\/style>\n</head>\n<body>\n  <h2>✌️ 가위바위보</h2>\n  <div>이김 <b id=\"w\">0</b> · 비김 <b id=\"d\">0</b> · 짐 <b id=\"l\">0</b></div>\n  <div class=\"vs\" id=\"vs\">❔ vs ❔</div>\n  <div id=\"result\">하나를 골라 주세요</div>\n  <div class=\"hands\" id=\"hands\"></div>\n  <\script>\n    var HANDS = ['✌️', '✊', '🖐️'];       // 가위, 바위, 보\n    var NAMES = ['가위', '바위', '보'];\n    var score = { w: 0, d: 0, l: 0 };\n    HANDS.forEach(function (h, me) {\n      var b = document.createElement('button'); b.textContent = h; b.title = NAMES[me];\n      b.onclick = function () {\n        var com = Math.floor(Math.random() * 3);\n        var diff = (me - com + 3) % 3;          // 0 이면 같은 손\n        // 가위(0) 바위(1) 보(2): 상대보다 번호가 1 큰 손이 이겨요 (바위1 > 가위0, 보2 > 바위1, 가위0 > 보2)\n        var res = diff === 0 ? 'd' : diff === 1 ? 'w' : 'l';\n        score[res]++;\n        document.getElementById('vs').textContent = HANDS[me] + ' vs ' + HANDS[com];\n        document.getElementById('result').textContent = res === 'w' ? '이겼어요! 🎉' : res === 'd' ? '비겼어요' : '졌어요 😢';\n        ['w', 'd', 'l'].forEach(function (k) { document.getElementById(k).textContent = score[k]; });\n      };\n      document.getElementById('hands').appendChild(b);\n    });\n  <\/script>\n</body>\n</html>\n\"\"\"\n\nwith open(\"index.html\", \"w\", encoding=\"utf-8\") as f:\n    f.write(html)\n\nprint(\"index.html 을 만들었어요!\")\nprint(\"아래의 [만든 웹페이지 보기] 또는 위쪽의 [웹 미리보기] 버튼을 눌러 보세요.\")"],
 ["(?:숫자|수)(?:맞추기|맞히기|업다운|맞춰)|업다운",true,"guess","# 웹페이지 만들기: 숫자 맞추기\n# 파이썬이 HTML 글자를 파일에 써 줘요. 실행한 뒤 [웹 미리보기] 버튼으로 바로 볼 수 있어요.\nhtml = r\"\"\"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>숫자 맞추기</title>\n<\style>\n  body { font-family: system-ui, sans-serif; text-align: center; background: #fffbeb; margin: 0; padding: 24px; }\n  input { font-size: 22px; width: 120px; text-align: center; padding: 8px; border: 2px solid #fcd34d; border-radius: 10px; }\n  button { font-size: 18px; padding: 10px 18px; border: 0; border-radius: 10px; background: #f59e0b; color: #fff; cursor: pointer; }\n  #hint { font-size: 24px; margin: 18px 0; min-height: 36px; }\n  #log { color: #92400e; }\n<\/style>\n</head>\n<body>\n  <h2>🎯 숫자 맞추기 (1 ~ 100)</h2>\n  <input id=\"n\" type=\"number\" min=\"1\" max=\"100\"> <button id=\"go\">확인</button>\n  <div id=\"hint\">숫자를 입력해 보세요</div>\n  <div id=\"log\"></div>\n  <button id=\"again\" style=\"display:none;background:#10b981\">다시 하기</button>\n  <\script>\n    var answer, tries, guesses;\n    function init() { answer = Math.floor(Math.random() * 100) + 1; tries = 0; guesses = []; document.getElementById('hint').textContent = '숫자를 입력해 보세요'; document.getElementById('log').textContent = ''; document.getElementById('again').style.display = 'none'; document.getElementById('n').value = ''; document.getElementById('go').disabled = false; }\n    function guess() {\n      var v = parseInt(document.getElementById('n').value, 10);\n      if (isNaN(v) || v < 1 || v > 100) { document.getElementById('hint').textContent = '1부터 100 사이의 숫자를 써 주세요'; return; }\n      tries++; guesses.push(v);\n      var hint = document.getElementById('hint');\n      if (v === answer) { hint.textContent = tries + '번 만에 맞췄어요! 🎉'; document.getElementById('again').style.display = 'inline-block'; document.getElementById('go').disabled = true; }\n      else hint.textContent = v < answer ? '⬆️ 더 커요' : '⬇️ 더 작아요';\n      document.getElementById('log').textContent = '지금까지: ' + guesses.join(', ');\n      document.getElementById('n').value = '';\n    }\n    document.getElementById('go').onclick = guess;\n    document.getElementById('n').onkeydown = function (e) { if (e.key === 'Enter') guess(); };\n    document.getElementById('again').onclick = init;\n    init();\n  <\/script>\n</body>\n</html>\n\"\"\"\n\nwith open(\"index.html\", \"w\", encoding=\"utf-8\") as f:\n    f.write(html)\n\nprint(\"index.html 을 만들었어요!\")\nprint(\"아래의 [만든 웹페이지 보기] 또는 위쪽의 [웹 미리보기] 버튼을 눌러 보세요.\")"],
 ["퀴즈",true,"quiz","# 웹페이지 만들기: 퀴즈\n# 파이썬이 HTML 글자를 파일에 써 줘요. 실행한 뒤 [웹 미리보기] 버튼으로 바로 볼 수 있어요.\nhtml = r\"\"\"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>퀴즈</title>\n<\style>\n  body { font-family: system-ui, sans-serif; background: #eff6ff; margin: 0; padding: 20px; }\n  .box { max-width: 440px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 22px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }\n  #q { font-size: 20px; margin: 10px 0 16px; }\n  .opt { display: block; width: 100%; text-align: left; margin: 8px 0; padding: 12px; border: 2px solid #dbeafe; border-radius: 10px; background: #fff; font-size: 16px; cursor: pointer; }\n  .opt.right { background: #dcfce7; border-color: #22c55e; } .opt.wrong { background: #fee2e2; border-color: #ef4444; }\n  #next { margin-top: 10px; padding: 10px 18px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 15px; cursor: pointer; display: none; }\n<\/style>\n</head>\n<body>\n  <div class=\"box\">\n    <div id=\"no\" style=\"color:#6b7280\"></div>\n    <div id=\"q\"></div>\n    <div id=\"opts\"></div>\n    <button id=\"next\">다음 문제</button>\n  </div>\n  <\script>\n    // 질문을 마음대로 바꿔 보세요: [질문, [보기들], 정답 번호(0부터)]\n    var quiz = [\n      ['대한민국의 수도는?', ['부산', '서울', '대구'], 1],\n      ['파이썬에서 글자를 화면에 보여 주는 함수는?', ['show', 'print', 'echo'], 1],\n      ['2 + 3 * 4 는?', ['20', '14', '24'], 1],\n      ['물의 화학식은?', ['CO2', 'O2', 'H2O'], 2]\n    ];\n    var idx = 0, score = 0, locked = false;\n    function show() {\n      locked = false;\n      document.getElementById('next').style.display = 'none';\n      if (idx >= quiz.length) {\n        document.getElementById('no').textContent = '끝!';\n        document.getElementById('q').textContent = quiz.length + '문제 중 ' + score + '문제를 맞혔어요 🎉';\n        document.getElementById('opts').innerHTML = '';\n        return;\n      }\n      var item = quiz[idx];\n      document.getElementById('no').textContent = (idx + 1) + ' / ' + quiz.length;\n      document.getElementById('q').textContent = item[0];\n      var box = document.getElementById('opts'); box.innerHTML = '';\n      item[1].forEach(function (text, i) {\n        var b = document.createElement('button'); b.className = 'opt'; b.textContent = text;\n        b.onclick = function () {\n          if (locked) return; locked = true;\n          if (i === item[2]) { b.className += ' right'; score++; } else { b.className += ' wrong'; box.children[item[2]].className += ' right'; }\n          document.getElementById('next').style.display = 'inline-block';\n        };\n        box.appendChild(b);\n      });\n    }\n    document.getElementById('next').onclick = function () { idx++; show(); };\n    show();\n  <\/script>\n</body>\n</html>\n\"\"\"\n\nwith open(\"index.html\", \"w\", encoding=\"utf-8\") as f:\n    f.write(html)\n\nprint(\"index.html 을 만들었어요!\")\nprint(\"아래의 [만든 웹페이지 보기] 또는 위쪽의 [웹 미리보기] 버튼을 눌러 보세요.\")"],
 ["bmi|비만도|체질량",true,"bmi","# 웹페이지 만들기: BMI 계산기\n# 파이썬이 HTML 글자를 파일에 써 줘요. 실행한 뒤 [웹 미리보기] 버튼으로 바로 볼 수 있어요.\nhtml = r\"\"\"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>BMI 계산기</title>\n<\style>\nbody{font-family:system-ui,sans-serif;max-width:420px;margin:0 auto;padding:18px;background:#f8fafc;color:#0f172a}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;margin:4px 0}button{padding:10px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:15px;cursor:pointer}.card{background:#fff;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 1px 4px #0001}\n<\/style>\n</head>\n<body>\n<h2>⚖️ BMI 계산기</h2><div class=\"card\"><label>키 (cm)</label><input id=\"h\" type=\"number\" value=\"170\"><label>몸무게 (kg)</label><input id=\"w\" type=\"number\" value=\"65\"><button id=\"go\">계산하기</button></div><div class=\"card\" id=\"out\">값을 넣고 버튼을 눌러 보세요.</div>\n<\script>\ndocument.getElementById(\"go\").onclick=function(){var h=parseFloat(document.getElementById(\"h\").value)/100,w=parseFloat(document.getElementById(\"w\").value),o=document.getElementById(\"out\");if(!(h>0)||!(w>0)){o.textContent=\"키와 몸무게를 올바르게 넣어 주세요.\";return}var b=w/(h*h),t=b<18.5?\"저체중\":b<23?\"정상\":b<25?\"과체중\":\"비만\";o.innerHTML=\"BMI <b>\"+b.toFixed(1)+\"</b> · \"+t+\"<br><small>(대한비만학회 기준 아시아 성인 분류, 참고용이에요)</small>\"};\n<\/script>\n</body>\n</html>\n\"\"\"\n\nwith open(\"index.html\", \"w\", encoding=\"utf-8\") as f:\n    f.write(html)\n\nprint(\"index.html 을 만들었어요!\")\nprint(\"아래의 [만든 웹페이지 보기] 또는 위쪽의 [웹 미리보기] 버튼을 눌러 보세요.\")"],
 ["계산기",true,"calc","# 웹페이지 만들기: 계산기\n# 파이썬이 HTML 글자를 파일에 써 줘요. 실행한 뒤 [웹 미리보기] 버튼으로 바로 볼 수 있어요.\nhtml = r\"\"\"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>계산기</title>\n<\style>\n  * { box-sizing: border-box; }\n  body { font-family: system-ui, sans-serif; background: #111827; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 12px; }\n  .calc { width: 100%; max-width: 320px; background: #1f2937; border-radius: 18px; padding: 16px; }\n  #screen { background: #0b1220; color: #fff; text-align: right; border-radius: 10px; padding: 14px; font-size: 32px; min-height: 64px; overflow: hidden; word-break: break-all; }\n  #expr { color: #9ca3af; font-size: 14px; min-height: 18px; }\n  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }\n  button { padding: 16px 0; font-size: 20px; border: 0; border-radius: 10px; background: #374151; color: #fff; cursor: pointer; }\n  button:active { filter: brightness(1.3); }\n  .op { background: #f59e0b; } .eq { background: #10b981; } .clr { background: #ef4444; }\n<\/style>\n</head>\n<body>\n  <div class=\"calc\">\n    <div id=\"screen\"><div id=\"expr\"></div><div id=\"val\">0</div></div>\n    <div class=\"keys\" id=\"keys\"></div>\n  </div>\n  <\script>\n    var keys = ['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','=',''];\n    var cur = '0', prev = null, op = null, fresh = true;\n    function show() { document.getElementById('val').textContent = cur; document.getElementById('expr').textContent = prev !== null ? prev + ' ' + op : ''; }\n    function calc(a, b, o) {\n      a = parseFloat(a); b = parseFloat(b);\n      var r = o === '+' ? a + b : o === '−' ? a - b : o === '×' ? a * b : (b === 0 ? NaN : a / b);\n      return isNaN(r) ? '오류' : String(parseFloat(r.toFixed(10)));\n    }\n    function press(k) {\n      if (/[0-9]/.test(k)) { cur = (fresh || cur === '0') ? k : cur + k; fresh = false; }\n      else if (k === '.') { if (fresh) { cur = '0.'; fresh = false; } else if (cur.indexOf('.') < 0) cur += '.'; }\n      else if (k === 'C') { cur = '0'; prev = null; op = null; fresh = true; }\n      else if (k === '⌫') { cur = cur.length > 1 && cur !== '오류' ? cur.slice(0, -1) : '0'; }\n      else if (k === '%') { cur = String(parseFloat(cur) / 100); }\n      else if (k === '=') { if (op !== null) { cur = calc(prev, cur, op); prev = null; op = null; fresh = true; } }\n      else if (k) {\n        if (op !== null && !fresh) { cur = calc(prev, cur, op); }\n        prev = cur; op = k === '÷' ? '÷' : k; fresh = true;\n      }\n      show();\n    }\n    var box = document.getElementById('keys');\n    keys.forEach(function (k) {\n      var b = document.createElement('button'); b.textContent = k;\n      if (['÷','×','−','+'].indexOf(k) >= 0) b.className = 'op'; if (k === '=') b.className = 'eq'; if (k === 'C') b.className = 'clr';\n      if (k === '0') b.style.gridColumn = 'span 1';\n      if (!k) b.style.visibility = 'hidden';\n      b.onclick = function () { press(k); };\n      box.appendChild(b);\n    });\n    show();\n  <\/script>\n</body>\n</html>\n\"\"\"\n\nwith open(\"index.html\", \"w\", encoding=\"utf-8\") as f:\n    f.write(html)\n\nprint(\"index.html 을 만들었어요!\")\nprint(\"아래의 [만든 웹페이지 보기] 또는 위쪽의 [웹 미리보기] 버튼을 눌러 보세요.\")"],
 ["(?:할일|투두|todo|체크리스트)",true,"todo","# 웹페이지 만들기: 할 일 목록\n# 파이썬이 HTML 글자를 파일에 써 줘요. 실행한 뒤 [웹 미리보기] 버튼으로 바로 볼 수 있어요.\nhtml = r\"\"\"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>할 일 목록</title>\n<\style>\n  * { box-sizing: border-box; }\n  body { font-family: system-ui, sans-serif; background: #f3f4f6; margin: 0; padding: 20px; }\n  .app { max-width: 420px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }\n  h1 { margin: 0 0 14px; font-size: 22px; }\n  .row { display: flex; gap: 8px; }\n  input[type=text] { flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; }\n  button { border: 0; border-radius: 8px; padding: 10px 14px; background: #4f46e5; color: #fff; cursor: pointer; font-size: 15px; }\n  ul { list-style: none; padding: 0; margin: 14px 0 0; }\n  li { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid #eee; }\n  li span { flex: 1; }\n  li.done span { text-decoration: line-through; color: #9ca3af; }\n  li button { background: #ef4444; padding: 4px 9px; font-size: 13px; }\n  #count { margin-top: 12px; color: #6b7280; font-size: 14px; }\n<\/style>\n</head>\n<body>\n  <div class=\"app\">\n    <h1>📝 할 일 목록</h1>\n    <div class=\"row\"><input id=\"text\" type=\"text\" placeholder=\"할 일을 쓰고 Enter\"><button id=\"add\">추가</button></div>\n    <ul id=\"list\"></ul>\n    <div id=\"count\"></div>\n  </div>\n  <\script>\n    var todos = [];\n    try { todos = JSON.parse(localStorage.getItem('todos') || '[]'); } catch (e) { todos = []; }   // 저장이 막힌 곳에서는 그냥 넘어가요\n    function save() { try { localStorage.setItem('todos', JSON.stringify(todos)); } catch (e) {} }\n    function render() {\n      var list = document.getElementById('list');\n      list.innerHTML = '';\n      todos.forEach(function (t, i) {\n        var li = document.createElement('li');\n        if (t.done) li.className = 'done';\n        var box = document.createElement('input'); box.type = 'checkbox'; box.checked = t.done;\n        box.onchange = function () { t.done = box.checked; save(); render(); };\n        var span = document.createElement('span'); span.textContent = t.text;\n        var del = document.createElement('button'); del.textContent = '삭제';\n        del.onclick = function () { todos.splice(i, 1); save(); render(); };\n        li.append(box, span, del); list.appendChild(li);\n      });\n      var left = todos.filter(function (t) { return !t.done; }).length;\n      document.getElementById('count').textContent = '남은 일 ' + left + '개 / 전체 ' + todos.length + '개';\n    }\n    function add() {\n      var input = document.getElementById('text');\n      var text = input.value.trim();\n      if (!text) return;\n      todos.push({ text: text, done: false });\n      input.value = ''; save(); render();\n    }\n    document.getElementById('add').onclick = add;\n    document.getElementById('text').onkeydown = function (e) { if (e.key === 'Enter') add(); };\n    render();\n  <\/script>\n</body>\n</html>\n\"\"\"\n\nwith open(\"index.html\", \"w\", encoding=\"utf-8\") as f:\n    f.write(html)\n\nprint(\"index.html 을 만들었어요!\")\nprint(\"아래의 [만든 웹페이지 보기] 또는 위쪽의 [웹 미리보기] 버튼을 눌러 보세요.\")"],
 ["스톱워치|타이머|초시계",true,"stopwatch","# 웹페이지 만들기: 스톱워치\n# 파이썬이 HTML 글자를 파일에 써 줘요. 실행한 뒤 [웹 미리보기] 버튼으로 바로 볼 수 있어요.\nhtml = r\"\"\"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>스톱워치</title>\n<\style>\n  body { font-family: system-ui, sans-serif; text-align: center; background: #0f172a; color: #fff; margin: 0; padding: 24px; }\n  #time { font-size: 56px; font-variant-numeric: tabular-nums; margin: 20px 0; }\n  button { margin: 4px; padding: 12px 22px; border: 0; border-radius: 999px; font-size: 16px; cursor: pointer; background: #334155; color: #fff; }\n  #start { background: #22c55e; } #stop { background: #ef4444; }\n  ol { max-width: 260px; margin: 14px auto; text-align: left; color: #cbd5e1; }\n<\/style>\n</head>\n<body>\n  <h2>⏱ 스톱워치</h2>\n  <div id=\"time\">00:00.00</div>\n  <button id=\"start\">시작</button><button id=\"stop\">정지</button><button id=\"lap\">랩</button><button id=\"reset\">초기화</button>\n  <ol id=\"laps\"></ol>\n  <\script>\n    var elapsed = 0, startAt = 0, timer = null;\n    function fmt(ms) {\n      var m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60, c = Math.floor(ms / 10) % 100;\n      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + String(c).padStart(2, '0');\n    }\n    function tick() { document.getElementById('time').textContent = fmt(elapsed + (timer ? Date.now() - startAt : 0)); }\n    document.getElementById('start').onclick = function () { if (!timer) { startAt = Date.now(); timer = setInterval(tick, 30); } };\n    document.getElementById('stop').onclick = function () { if (timer) { elapsed += Date.now() - startAt; clearInterval(timer); timer = null; tick(); } };\n    document.getElementById('lap').onclick = function () {\n      var li = document.createElement('li'); li.textContent = document.getElementById('time').textContent;\n      document.getElementById('laps').appendChild(li);\n    };\n    document.getElementById('reset').onclick = function () { clearInterval(timer); timer = null; elapsed = 0; document.getElementById('laps').innerHTML = ''; tick(); };\n  <\/script>\n</body>\n</html>\n\"\"\"\n\nwith open(\"index.html\", \"w\", encoding=\"utf-8\") as f:\n    f.write(html)\n\nprint(\"index.html 을 만들었어요!\")\nprint(\"아래의 [만든 웹페이지 보기] 또는 위쪽의 [웹 미리보기] 버튼을 눌러 보세요.\")"],
 ["클리커|쿠키.*(?:게임|클릭)|클릭게임|방치형",false,"clicker","# 웹페이지 만들기: 쿠키 클리커\n# 파이썬이 HTML 글자를 파일에 써 줘요. 실행한 뒤 [웹 미리보기] 버튼으로 바로 볼 수 있어요.\nhtml = r\"\"\"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>쿠키 클리커</title>\n<\style>\n  body { font-family: system-ui, sans-serif; text-align: center; background: #fff7ed; margin: 0; padding: 20px; user-select: none; }\n  #cookie { font-size: 110px; cursor: pointer; transition: transform .08s; display: inline-block; }\n  #cookie:active { transform: scale(.9); }\n  #score { font-size: 34px; margin: 8px 0; }\n  .shop { max-width: 360px; margin: 18px auto 0; display: grid; gap: 8px; }\n  button { padding: 12px; border: 0; border-radius: 10px; background: #f97316; color: #fff; font-size: 16px; cursor: pointer; }\n  button:disabled { background: #d1d5db; cursor: default; }\n<\/style>\n</head>\n<body>\n  <h2>🍪 쿠키 클리커</h2>\n  <div id=\"score\">0</div>\n  <div>초당 <b id=\"cps\">0</b>개 · 클릭당 <b id=\"per\">1</b>개</div>\n  <div id=\"cookie\">🍪</div>\n  <div class=\"shop\">\n    <button id=\"b1\"></button>\n    <button id=\"b2\"></button>\n  </div>\n  <\script>\n    var score = 0, perClick = 1, auto = 0, cost1 = 20, cost2 = 50;\n    function show() {\n      document.getElementById('score').textContent = Math.floor(score);\n      document.getElementById('cps').textContent = auto; document.getElementById('per').textContent = perClick;\n      var b1 = document.getElementById('b1'), b2 = document.getElementById('b2');\n      b1.textContent = '👆 클릭 강화 (+1)  - ' + cost1 + '개'; b1.disabled = score < cost1;\n      b2.textContent = '🤖 자동 굽기 (+1/초)  - ' + cost2 + '개'; b2.disabled = score < cost2;\n    }\n    document.getElementById('cookie').onclick = function () { score += perClick; show(); };\n    document.getElementById('b1').onclick = function () { if (score >= cost1) { score -= cost1; perClick++; cost1 = Math.ceil(cost1 * 1.6); show(); } };\n    document.getElementById('b2').onclick = function () { if (score >= cost2) { score -= cost2; auto++; cost2 = Math.ceil(cost2 * 1.7); show(); } };\n    setInterval(function () { score += auto / 10; show(); }, 100);\n    show();\n  <\/script>\n</body>\n</html>\n\"\"\"\n\nwith open(\"index.html\", \"w\", encoding=\"utf-8\") as f:\n    f.write(html)\n\nprint(\"index.html 을 만들었어요!\")\nprint(\"아래의 [만든 웹페이지 보기] 또는 위쪽의 [웹 미리보기] 버튼을 눌러 보세요.\")"],
 ["타자(?:연습|게임|속도)|타이핑",true,"typing","# 웹페이지 만들기: 타자 연습\n# 파이썬이 HTML 글자를 파일에 써 줘요. 실행한 뒤 [웹 미리보기] 버튼으로 바로 볼 수 있어요.\nhtml = r\"\"\"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>타자 연습</title>\n<\style>\n  * { box-sizing: border-box; }\n  body { font-family: system-ui, sans-serif; text-align: center; background: #f0fdf4; margin: 0; padding: 22px; }\n  #target { white-space: pre-wrap; word-break: break-word; font-size: 26px; margin: 18px 0; letter-spacing: 1px; }\n  #target .ok { color: #16a34a; } #target .no { color: #dc2626; background: #fee2e2; }\n  input { width: 90%; max-width: 420px; font-size: 20px; padding: 10px; border: 2px solid #86efac; border-radius: 10px; }\n  button { margin: 10px; padding: 10px 20px; border: 0; border-radius: 8px; background: #16a34a; color: #fff; font-size: 15px; cursor: pointer; }\n  #stat { font-size: 18px; min-height: 28px; }\n<\/style>\n</head>\n<body>\n  <h2>⌨️ 타자 연습</h2>\n  <div id=\"target\"></div>\n  <input id=\"box\" autocomplete=\"off\" placeholder=\"여기에 똑같이 쳐 보세요\">\n  <div id=\"stat\"></div>\n  <button id=\"next\">다음 문장</button>\n  <\script>\n    var sentences = ['the quick brown fox jumps over the lazy dog', 'hello python world', 'practice makes perfect', 'coding is fun and creative'];\n    var idx = -1, startAt = 0, done = false;\n    function load() {\n      idx = (idx + 1) % sentences.length; done = false; startAt = 0;\n      document.getElementById('box').value = ''; document.getElementById('stat').textContent = '';\n      paint('');\n      document.getElementById('box').focus();\n    }\n    function paint(typed) {\n      var t = sentences[idx], html = '';\n      for (var i = 0; i < t.length; i++) {\n        var ch = t[i];\n        html += i < typed.length ? '<span class=\"' + (typed[i] === t[i] ? 'ok' : 'no') + '\">' + ch + '</span>' : ch;\n      }\n      document.getElementById('target').innerHTML = html;\n    }\n    document.getElementById('box').oninput = function (e) {\n      if (done) return;\n      if (!startAt) startAt = Date.now();\n      var typed = e.target.value; paint(typed);\n      if (typed === sentences[idx]) {\n        done = true; var sec = (Date.now() - startAt) / 1000;\n        var wpm = Math.round(sentences[idx].split(' ').length / (sec / 60));\n        document.getElementById('stat').textContent = '완료! ' + sec.toFixed(1) + '초 · 분당 약 ' + wpm + '단어';\n      }\n    };\n    document.getElementById('next').onclick = load;\n    load();\n  <\/script>\n</body>\n</html>\n\"\"\"\n\nwith open(\"index.html\", \"w\", encoding=\"utf-8\") as f:\n    f.write(html)\n\nprint(\"index.html 을 만들었어요!\")\nprint(\"아래의 [만든 웹페이지 보기] 또는 위쪽의 [웹 미리보기] 버튼을 눌러 보세요.\")"],

document.getElementById('n'), nctx = nv.getContext('2d');\n    var SHAPES = {\n      I: [[1,1,1,1]], O: [[1,1],[1,1]], T: [[0,1,0],[1,1,1]], S: [[0,1,1],[1,1,0]], Z: [[1,1,0],[0,1,1]], J: [[1,0,0],[1,1,1]], L: [[0,0,1],[1,1,1]]\n    };\n    var COLORS = { I: '#22d3ee', O: '#facc15', T: '#a855f7', S: '#22c55e', Z: '#ef4444', J: '#3b82f6', L: '#f97316' };\n    var board, cur, next, score, lines, level, timer, alive;\n    function rotate(m) { return m[0].map(function (_, i) { return m.map(function (r) { return r[i]; }).reverse(); }); }\n    function randomPiece() { var k = Object.keys(SHAPES)[Math.floor(Math.random() * 7)]; return { k: k, m: SHAPES[k], x: 0, y: 0 }; }\n    function spawn() { cur = next || randomPiece(); next = randomPiece(); cur.x = Math.floor((COLS - cur.m[0].length) / 2); cur.y = 0; drawNext(); if (hit(cur.m, cur.x, cur.y)) { alive = false; clearInterval(timer); draw(); } }\n    function hit(m, x, y) {\n      for (var r = 0; r < m.length; r++) for (var c = 0; c < m[r].length; c++) if (m[r][c]) {\n        var bx = x + c, by = y + r;\n        if (bx < 0 || bx >= COLS || by >= ROWS || (by >= 0 && board[by][bx])) return true;\n      }\n      return false;\n    }\n    function lock() {\n      cur.m.forEach(function (row, r) { row.forEach(function (v, c) { if (v && cur.y + r >= 0) board[cur.y + r][cur.x + c] = cur.k; }); });\n      var cleared = 0;\n      for (var r = ROWS - 1; r >= 0; r--) { if (board[r].every(Boolean)) { board.splice(r, 1); board.unshift(Array(COLS).fill(null)); cleared++; r++; } }\n      if (cleared) { score += [0, 100, 300, 500, 800][cleared] * level; lines += cleared; level = 1 + Math.floor(lines / 10); restart(); }\n      spawn(); show();\n    }\n    function move(dx) { if (alive && !hit(cur.m, cur.x + dx, cur.y)) { cur.x += dx; draw(); } }\n    function down() { if (!alive) return false; if (!hit(cur.m, cur.x, cur.y + 1)) { cur.y++; draw(); return true; } lock(); return false; }\n    function drop() { if (!alive) return; while (down()) { } }\n    function turn() { if (!alive) return; var m = rotate(cur.m); [0, -1, 1, -2, 2].some(function (k) { if (!hit(m, cur.x + k, cur.y)) { cur.m = m; cur.x += k; return true; } return false; }); draw(); }\n    function cell(g, x, y, color, s) { g.fillStyle = color; g.fillRect(x * s + 1, y * s + 1, s - 2, s - 2); }\n    function draw() {\n      ctx.clearRect(0, 0, cv.width, cv.height);\n      board.forEach(function (row, r) { row.forEach(function (v, c) { if (v) cell(ctx, c, r, COLORS[v], S); }); });\n      if (cur && alive) cur.m.forEach(function (row, r) { row.forEach(function (v, c) { if (v) cell(ctx, cur.x + c, cur.y + r, COLORS[cur.k], S); }); });\n      if (!alive) { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.fillStyle = '#fff'; ctx.font = '24px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('게임 오버', cv.width / 2, cv.height / 2); }\n    }\n    function drawNext() { nctx.clearRect(0, 0, 80, 80); next.m.forEach(function (row, r) { row.forEach(function (v, c) { if (v) cell(nctx, c + 0.5, r + 0.5, COLORS[next.k], 18); }); }); }\n    function show() { document.getElementById('score').textContent = score; document.getElementById('lines').textContent = lines; document.getElementById('level').textContent = level; draw(); }\n    function restart() { clearInterval(timer); timer = setInterval(down, Math.max(100, 700 - (level - 1) * 60)); }\n    function start() { board = Array.from({ length: ROWS }, function () { return Array(COLS).fill(null); }); score = 0; lines = 0; level = 1; alive = true; next = null; spawn(); show(); restart(); }\n    document.addEventListener('keydown', function (e) {\n      var k = { ArrowLeft: 'left', ArrowRight: 'right', ArrowDown: 'down', ArrowUp: 'rot', ' ': 'drop' }[e.key]; if (!k) return; e.preventDefault(); act(k);\n    });\n    function act(k) { if (k === 'left') move(-1); else if (k === 'right') move(1); else if (k === 'down') down(); else if (k === 'rot') turn(); else if (k === 'drop') dro
