<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>파이썬 첫걸음</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#EDF1F8;--surface:#FFFFFF;--surface2:#F5F7FB;--ink:#152033;--mute:#63728C;--line:#DDE4EF;
--acc:#2F6DB5;--acc2:#245A98;--accink:#FFFFFF;--accsoft:#E8F0FB;--yellow:#FFD43B;
--red:rgba(222,62,62,.12);--redn:#D23B3B;--yel:rgba(255,190,0,.24);--yeln:#A86F00;--ok:#1B8A5A;
--sh:0 1px 2px rgba(18,28,48,.06),0 10px 28px rgba(18,28,48,.08);
--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,"Noto Sans KR","Malgun Gothic",monospace;
--sans:"Noto Sans KR",system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
--g:46px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0B111D;--surface:#131B2B;--surface2:#182234;--ink:#E7EDF8;--mute:#92A0BA;--line:#25324B;
--acc:#5BA6EE;--acc2:#3F8DDB;--accink:#06121F;--accsoft:#16263D;
--red:rgba(255,92,92,.17);--redn:#FF7B7B;--yel:rgba(255,205,60,.15);--yeln:#F0C24A;--ok:#55D19A;
--sh:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B111D;--surface:#131B2B;--surface2:#182234;--ink:#E7EDF8;--mute:#92A0BA;--line:#25324B;--acc:#5BA6EE;--acc2:#3F8DDB;--accink:#06121F;--accsoft:#16263D;--red:rgba(255,92,92,.17);--redn:#FF7B7B;--yel:rgba(255,205,60,.15);--yeln:#F0C24A;--ok:#55D19A;--sh:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.4);color-scheme:dark}
*{-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html,body,textarea,#gut,#pre{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
button{font-family:inherit}
/* 상단 */
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{flex:none;width:34px;height:34px;border-radius:10px;display:block;box-shadow:0 3px 10px rgba(36,90,152,.35)}
.bt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.bt strong{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.bt span{font-size:11px;color:var(--mute);white-space:nowrap}
.btns{display:flex;gap:6px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;transition:transform .08s,background .15s,border-color .15s}
.btn svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:active{transform:scale(.97)}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--accink);border-color:transparent;font-weight:700;box-shadow:0 4px 14px rgba(47,109,181,.35)}
.btn.primary svg{fill:currentColor;stroke:none}
.btn.wide{width:100%;height:44px;font-size:15px}
.btn:focus-visible,.chip:focus-visible,.x:focus-visible,.btn2:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (max-width:440px){.btn .l{display:none}.btn{padding:0 10px}.bt span{display:none}}
@media (min-width:441px){.btn .s{display:none}}
@media (max-width:370px){.bt{display:none}}
/* 추천 */
#sug{flex:none;display:flex;gap:6px;overflow-x:auto;padding:0 14px;height:46px;align-items:center;font-size:12.5px;color:var(--mute);scrollbar-width:none}
#sug::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:var(--mono);font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--acc);cursor:pointer;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--acc);background:var(--accsoft)}
/* 에디터 */
.stage{flex:1;min-height:0;display:flex;padding:0 12px 10px}
.wrap{flex:1;min-height:0;display:flex;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}
#gut{position:sticky;left:0;flex:none;width:var(--g);box-sizing:border-box;padding:12px 8px 120px 0;text-align:right;background:var(--surface2);border-right:1px solid var(--line);z-index:2;font-family:var(--mono);font-size:13px;line-height:var(--lh,24px);color:var(--mute);user-select:none}
#gut .n{height:var(--lh,24px)}#gut .r{color:var(--redn);font-weight:600}#gut .y{color:var(--yeln);font-weight:600}
.ed{position:relative;flex:1 0 auto}
#pre{position:absolute;left:0;right:0;top:0;padding:12px 0;pointer-events:none}
#pre div{height:var(--lh,24px)}#pre .r{background:var(--red);box-shadow:inset 3px 0 0 var(--redn)}#pre .y{background:var(--yel);box-shadow:inset 3px 0 0 var(--yeln)}
#ta{position:relative;display:block;box-sizing:border-box;min-width:calc(100vw - var(--g) - 26px);margin:0;padding:12px 12px 120px 12px;border:0;outline:0;resize:none;overflow:hidden;white-space:pre;background:transparent;color:var(--ink);caret-color:var(--acc);font-family:var(--mono);font-size:14px;line-height:24px;tab-size:4}
/* 바이브 */
#vp{display:none;flex:none;flex-direction:column;gap:8px;margin:0 12px 8px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}
#vp.open{display:flex}
.vr{display:flex;gap:8px}
#vin{flex:1;min-width:0;font-family:var(--sans);font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);outline:none}
#vin:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accsoft)}
#vgo{height:auto;padding:0 16px}
#vgo:disabled{opacity:.5}
#vex{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
#vex::-webkit-scrollbar{display:none}
#vex .chip{font-family:var(--sans);font-size:12px;color:var(--mute)}
#vh{font-size:12.5px;line-height:1.55;color:var(--mute);height:72px;overflow:auto}
#vundo{font-size:12px;padding:0 10px;height:auto}
/* 상태줄 */
#msg{flex:none;display:flex;align-items:flex-start;gap:10px;padding:11px 14px;background:var(--surface);border-top:1px solid var(--line);font-size:13px;line-height:1.55;color:var(--mute);height:66px;overflow:auto;box-sizing:border-box}
#msg .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--mute);margin-top:7px}
#msg.r{color:var(--redn)}#msg.r .dot{background:var(--redn)}
#msg.y{color:var(--yeln)}#msg.y .dot{background:var(--yeln)}
#msg.ok{color:var(--ok)}#msg.ok .dot{background:var(--ok)}
#mt{flex:1}
#mfix{flex:none;height:32px;padding:0 12px;border-radius:9px;border:0;background:var(--acc);color:var(--accink);font-size:13px;font-weight:700;cursor:pointer}
/* 시트 */
#bk{position:fixed;inset:0;background:rgba(8,14,28,.55);display:none;z-index:25;backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;display:none;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -12px 48px rgba(6,12,26,.35);z-index:30;max-width:780px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{display:flex}
#fx{top:30%}#ex{top:8%}
.grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0}
.sh{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 6px}
.sh strong{font-size:17px;font-weight:700;letter-spacing:-.01em}
.x{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface2);color:var(--mute);font-size:15px;cursor:pointer}
.sb{flex:1;overflow:auto;padding:4px 18px 18px}
.sa{padding:10px 18px 14px;border-top:1px solid var(--line)}
.sq{padding:4px 18px 8px}
#exq{width:100%;box-sizing:border-box;font-family:var(--sans);font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);outline:none}
#exq:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accsoft)}
.su{padding:0 18px}
.fxw{margin:4px 0 8px;font-size:14.5px;line-height:1.7}
.fxl{font-size:12px;font-weight:700;color:var(--mute);margin:14px 0 6px;letter-spacing:.02em}
.sn{margin:0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);font-family:var(--mono);font-size:13px;line-height:1.65;overflow:auto}
.sn div{white-space:pre}.sn .mk{background:var(--yel);border-radius:4px}
.gc h4{font-size:12px;font-weight:700;color:var(--mute);margin:18px 0 6px;letter-spacing:.02em}
.gc p{margin:0;font-size:14.5px;line-height:1.75}
.gh{padding:12px 14px;background:var(--accsoft);border-radius:12px}
.gh code{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--acc)}
.gw{display:flex;flex-wrap:wrap;gap:6px}
.gx{white-space:pre}
.btn2{margin-top:8px;width:100%;height:40px;border-radius:10px;border:1px solid var(--acc);background:transparent;color:var(--acc);font-size:13.5px;font-weight:700;cursor:pointer}
.btn2:hover{background:var(--accsoft)}
.gl0{margin:6px 0 12px;color:var(--mute);line-height:1.7}
/* 실행 결과 */
#panel{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);z-index:40;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
#panel.open{display:flex}#panel.half{top:48%;border-radius:20px 20px 0 0;box-shadow:0 -12px 48px rgba(6,12,26,.4)}#panel.small{top:72%;border-radius:20px 20px 0 0;box-shadow:0 -12px 48px rgba(6,12,26,.4)}
.ph{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.ph strong{font-size:15px}
.ph .t{display:flex;gap:6px;align-items:center}
.ph select,.ph button{font-size:12.5px;height:32px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
#pstop{color:var(--redn);border-color:var(--redn);background:transparent}
#out{flex:1;margin:10px 12px;padding:14px;border-radius:14px;overflow:auto;white-space:pre-wrap;word-break:break-word;background:#0B1020;color:#E6EDF7;font-family:var(--mono);font-size:13.5px;line-height:1.7;box-shadow:var(--sh)}
#out .e{color:#FF9B9B;font-weight:600}#out .ok{color:#8FA3BF}
#out .chip{background:#16203A;border-color:#2A3A5E;color:#9CC8FF;margin-top:8px}
#ir{display:none;gap:8px;padding:8px 12px 12px;background:transparent}#ir.open{display:flex}
#iin{flex:1;min-width:0;font-family:var(--mono);font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);outline:none}
#iin:focus{border-color:var(--acc)}
#isend{padding:0 16px;border-radius:10px;border:0;background:var(--acc);color:var(--accink);font-weight:700;cursor:pointer}

.hlon #ta{color:transparent;-webkit-text-fill-color:transparent}
#ta::selection{background:rgba(91,166,238,.35)}
#pre div{white-space:pre;padding-left:12px;font-family:var(--mono);font-size:14px;overflow:hidden}
.tk{color:var(--tk);font-weight:600}.ts{color:var(--ts)}.tn{color:var(--tn)}.tc{color:var(--tc);font-style:italic}.tb{color:var(--tb)}
:root{--tk:#C2255C;--ts:#0B7A55;--tn:#B35A00;--tc:#7A8AA3;--tb:#6741D9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tk:#FF7AA8;--ts:#7EE0A8;--tn:#F2B866;--tc:#7C8BA6;--tb:#C6A8FF}}
:root[data-theme="dark"]{--tk:#FF7AA8;--ts:#7EE0A8;--tn:#F2B866;--tc:#7C8BA6;--tb:#C6A8FF}
</style>
</head>
<body>
<header class="top">
<div class="brand">
<svg class="logo" viewBox="0 0 34 34" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4C8FD6"/><stop offset="1" stop-color="#1F4F86"/></linearGradient></defs><rect width="34" height="34" rx="10" fill="url(#lg)"/><circle cx="26.5" cy="7.5" r="3.4" fill="#FFD43B"/><text x="16" y="23" text-anchor="middle" font-family="Noto Sans KR,sans-serif" font-size="14" font-weight="700" fill="#fff">Py</text></svg>
<div class="bt"><strong>파이썬 첫걸음</strong><span>쓰고, 돌려 보고, 물어보는 연습장</span></div>
</div>
<div class="btns">
<button id="explain" class="btn" type="button" aria-label="코드 설명"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 8h6M9 12h4"/></svg><span class="l">코드 설명</span><span class="s">설명</span></button>
<button id="vibe" class="btn" type="button" aria-label="바이브"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg><span>바이브</span></button>
<button id="run" class="btn primary" type="button" aria-label="실행"><svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg><span>실행</span></button>
</div>
</header>
<div id="sug"></div>
<main class="stage"><div class="wrap" id="wrap">
<div id="gut"></div>
<div class="ed"><div id="pre"></div><textarea id="ta" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="파이썬 코드 입력"></textarea></div>
</div></main>
<div id="vp"><div class="vr"><input id="vin" placeholder="만들고 싶은 코드를 한국어로 말해 보세요" autocomplete="off" aria-label="한국어로 만들 코드 설명"><button id="vgo" class="btn primary" type="button">만들기</button><button id="vundo" class="btn" type="button" style="display:none">되돌리기</button></div><div id="vex"></div><div id="vh">원하는 값을 말하면 그 값으로 채워서 만들어 줘요. 예) 리스트에 사과 바나나 포도 넣어줘</div></div>
<div id="msg"><span class="dot"></span><span id="mt"></span><button id="mfix" type="button" style="display:none">고치기</button></div>
<div id="bk"></div>
<div id="fx" class="sheet"><div class="grab"></div><div class="sh"><strong>고치는 방법</strong><button id="fxc" class="x" type="button" aria-label="닫기">✕</button></div><div id="fxb" class="sb"></div><div id="fxa" class="sa"><button id="fxok" class="btn primary wide" type="button">이대로 고치기</button></div></div>
<div id="ex" class="sheet"><div class="grab"></div><div class="sh"><strong>코드 설명</strong><button id="exc" class="x" type="button" aria-label="닫기">✕</button></div><div class="sq"><input id="exq" type="search" placeholder="궁금한 코드 검색 (예: if, for, while, 딕셔너리)" autocomplete="off" aria-label="코드 검색"></div><div id="exu" class="su"></div><div id="exr" class="sb"></div></div>
<div id="panel">
<div class="ph"><strong>실행 결과</strong><span class="t"><button id="pstop" type="button">정지</button><select id="psize" aria-label="화면 크기"><option value="full">전체</option><option value="half">절반</option><option value="small">작게</option></select><button id="pclose" type="button">닫기</button></span></div>
<pre id="out"></pre>
<div id="ir"><input id="iin" autocomplete="off" aria-label="입력칸"><button id="isend" type="button">입력</button></div>
</div>

<script>
const $=s=>document.querySelector(s);
const ta=$('#ta'),pre=$('#pre'),gut=$('#gut'),sug=$('#sug'),msg=$('#msg'),wrap=$('#wrap');
const KW=new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const BI=new Set('print input len range int str float list dict set tuple bool type sum min max abs round sorted enumerate zip map filter open isinstance reversed any all chr ord format id dir help pow divmod bin hex oct repr hash iter next object super Exception ValueError TypeError KeyError IndexError ZeroDivisionError NameError FileNotFoundError StopIteration __name__'.split(' '));
const POP=[['print','f'],['input','f'],['len','f'],['range','f'],['int','f'],['str','f'],['float','f'],['list','f'],['def','k'],['if','k'],['for','k'],['while','k'],['import','k'],['return','k'],['else','k'],['elif','k'],['in','k'],['True','k'],['False','k'],['None','k'],['class','k'],['try','k'],['except','k'],['break','k'],['continue','k'],['pass','k'],['sum','f'],['max','f'],['min','f'],['abs','f'],['round','f'],['sorted','f'],['enumerate','f'],['zip','f'],['open','f'],['type','f'],['dict','f'],['set','f'],['tuple','f'],['bool','f'],['and','k'],['or','k'],['not','k'],['with','k'],['as','k'],['from','k'],['lambda','k'],['isinstance','f'],['map','f'],['filter','f'],['finally','k'],['raise','k'],['is','k']];
const METH=['append','split','join','strip','format','upper','lower','replace','items','keys','values','sort','pop','remove','count','index','extend','insert','startswith','endswith','find'].map(x=>[x,'f']);
'pow reversed divmod eval exit hex oct bin chr ord id dir help hash iter next any all repr format callable vars'.split(' ').forEach(x=>POP.push([x,'f']));
'math random time datetime os sys json re self __init__ global nonlocal assert del yield async await pickle pprint property'.split(' ').forEach(x=>POP.push([x,'v']));
const SP=new Set('if elif while for in and or not is import from return with as lambda class def except'.split(' ')),CO=new Set(['else','try','finally']);
const BLOCK=/^(if|elif|else|for|while|def|class|with|try|except|finally)\b/;
const cnt=(s,set)=>[...s].filter(c=>set.includes(c)).length;
const ids=s=>(s.match(/[A-Za-z_]\w*/g)||[]).filter(x=>!KW.has(x));
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function pre1(t){const o=[];let m;
 if(m=t.match(/^(?:async\s+)?def\s+(\w+)\s*\(([^)]*)/)){o.push(m[1]);m[2].split(',').forEach(p=>{const q=p.trim().replace(/^\*+/,'').match(/^[A-Za-z_]\w*/);if(q)o.push(q[0])})}
 if(m=t.match(/^class\s+(\w+)/))o.push(m[1]);
 if(m=t.match(/^import\s+(.+)/))m[1].split(',').forEach(p=>{const q=p.trim().split(/\s+as\s+/);const nm=(q[1]||q[0]).trim().split('.')[0];if(nm)o.push(nm)});
 if(m=t.match(/^from\s+[\w.]+\s+import\s+(.+)/))m[1].replace(/[()]/g,'').split(',').forEach(p=>{const q=p.trim().split(/\s+as\s+/);const nm=(q[1]||q[0]).trim();if(nm&&nm!=='*')o.push(nm)});
 for(const r of t.matchAll(/\bfor\s+([\w\s,()*]+?)\s+in\b/g))o.push(...ids(r[1]));
 for(const r of t.matchAll(/\bas\s+(\w+)/g))o.push(r[1]);
 for(const r of t.matchAll(/(\w+)\s*:=/g))o.push(r[1]);
 for(const r of t.matchAll(/\blambda\b([^:]*):/g))o.push(...ids(r[1].replace(/=[^,]*/g,'')));

function needVar(name,label,numeric,ctx){
 ctx.vars.add(name);
 if(ctx.noInput){ctx.cnt=ctx.cnt||{};ctx.cnt[name]=1;return}
 ctx.pre.push(name+' = '+(numeric?'int(input("'+label+': "))':'input("'+label+': ")'))}
function subjVar(t,ctx,numeric){
 t=clean((t||'').trim());
 if(!t)return ctx.subj||ctx.last||null;
 if(/^-?\d+(\.\d+)?$/.test(t))return t;
 if(ctx.vars.has(t))return t;
 const k=NOUN[t];
 if(k){if(!ctx.vars.has(k))needVar(k,t,numeric,ctx);return k}
 if(/^[A-Za-z_]\w*$/.test(t)){if(!ctx.vars.has(t))needVar(t,t,numeric,ctx);return t}
 ctx.nm=ctx.nm||{};
 if(!ctx.nm[t]){const v=newVar(ctx);ctx.nm[t]=v;if(ctx.noInput){ctx.cnt=ctx.cnt||{};ctx.cnt[v]=1}else ctx.pre.push(v+' = '+(numeric?'int(input("'+t+': "))':'input("'+t+': ")'))}
 return ctx.nm[t]}

const CMP={크:'>',많:'>',높:'>',넘:'>',초과:'>',작:'<',적:'<',낮:'<',미만:'<',이상:'>=',이하:'<=',같:'==',다르:'!='};
const NEGOP={'>':'<=','<':'>=','>=':'<','<=':'>','==':'!=','!=':'=='};
function condAtom(s,ctx,ds){
 s=fixEnd(s.trim().replace(/(\d+)\s*(살|점|도|원|개|명|번|cm|kg|km|m|시|분|초|세|%|퍼센트|층|칸)(?=\s|이|가|은|는|을|를|보다|$)/g,'$1').replace(/\s+/g,' '));
 const S=(t,n)=>t?subjVar(t,ctx,n):(ds||ctx.subj||ctx.last||null);
 let m;
 if(m=s.match(/^(?:(\S+?)(?:이|가|은|는)\s+)?(짝수|홀수|양수|음수)(?:이|임|인|일)?$/)){const v=S(m[1],true);if(!v)return null;return{e:{짝수:v+' % 2 == 0',홀수:v+' % 2 == 1',양수:v+' > 0',음수:v+' < 0'}[m[2]],v}}
 if(m=s.match(/^(?:(\S+?)(?:이|가|은|는)\s+)?(-?\d+)\s*(이상|초과)\s*(-?\d+)\s*(이하|미만)$/)){const v=S(m[1],true);if(!v)return null;return{e:m[2]+(m[3]==='이상'?' <= ':' < ')+v+(m[5]==='이하'?' <= ':' < ')+m[4],v}}
 if(m=s.match(/^(?:(\S+?)(?:에는|에서|에|이|가|은|는)\s+)?(\S+?)(?:이|가|을|를)?\s*(포함|들어\s*있|들어있)(.*)$/)){const v=S(m[1],false);if(!v)return null;const w=valueOf2(m[2],ctx),no=/않|없/.test(m[4]);return{e:w+(no?' not in ':' in ')+v,v}}
 if(m=s.match(/^(\S+?)(?:이|가|은|는)?\s*비(?:어)?\s*있(.*)$/)){const v=S(m[1],false);if(!v)return null;return{e:/않/.test(m[2])?'len('+v+') > 0':'len('+v+') == 0',v}}
 if(m=s.match(/^(?:(\S+?)(?:이|가|은|는)\s+)?(\S+?)(?:와|과|랑|보다|을|를|이)?\s*(같|다르|크|작|많|적|높|낮|넘|이상|이하|초과|미만)(.*)$/)){
  let op=CMP[m[3]];if(/않|아니/.test(m[4]))op=NEGOP[op];
  const num=op!=='=='&&op!=='!=';const v=S(m[1],num);if(!v)return null;
  const w=valueOf2(m[2],ctx);return{e:v+' '+op+' '+w,v}}
 if(m=s.match(/^(\S+?)(?:이|가|은|는)\s+(["“”‘’'][^"“”‘’']+["“”‘’']|-?\d+(?:\.\d+)?)(?:이|가|인|일|임|이다|다)?$/)){const v=S(m[1],/\d/.test(m[2]));if(!v)return null;return{e:v+' == '+valueOf2(m[2],ctx),v}}
 if(m=s.match(/^(\S+?)(?:이|가|은|는)\s+(\S+?)(?:이|가|인|일|임|이다|다)?$/)){const k=clean(m[1]);if(NOUN[k]||ctx.vars.has(k)||/^[A-Za-z_]\w*$/.test(k)){const v=S(m[1],false);return{e:v+' == '+JSON.stringify(m[2]),v}}}
 return null}
function parseCond(s,ctx,ds){
 s=s.replace(/(이고|이면서|이며)\s+/g,' @A ').replace(/(이거나|거나|또는|혹은)\s+/g,' @O ');
 const outs=[];let first=null,last=ds;
 for(const o of s.split(' @O ')){const as=[];for(const a of o.split(' @A ')){const r=condAtom(a,ctx,last);if(!r)return null;if(!first)first=r.v;last=r.v||last;as.push(r.e)}outs.push(as.join(' and '))}
 return{e:outs.join(' or '),v:first}}

function glFind(q){
 q=(q||'').trim().toLowerCase();
 if(!q)return[];
 if(GLK[q])return[GLK[q],...GL.filter(g=>g!==GLK[q]&&(g.use||[]).includes(GLK[q].k)).slice(0,0)];
 const sc=[];
 GL.forEach(g=>{let best=0;[g.k,g.t,...g.al].forEach(a=>{a=a.toLowerCase();if(a.includes(q)||q.includes(a))best=Math.max(best,1.5+Math.min(a.length,q.length)/Math.max(a.length,q.length));else{const A=bg(norm(a)),B=bg(norm(q));if(A.size&&B.size){let n=0;A.forEach(x=>{if(B.has(x))n++});best=Math.max(best,2*n/(A.size+B.size))}}});if(best>=0.35)sc.push([best,g])});
 sc.sort((a,b)=>b[0]-a[0]);return sc.slice(0,5).map(x=>x[1])}
