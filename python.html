 ["지뢰찾기|마인스위퍼|지뢰게임|minesweeper",false,"minesweeper","# 웹페이지 만들기: 지뢰찾기\n# 파이썬이 HTML 글자를 파일에 써 줘요. 실행한 뒤 [웹 미리보기] 버튼으로 바로 볼 수 있어요.\nhtml = r\"\"\"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>지뢰찾기</title>\n<\style>\n  * { box-sizing: border-box; }\n  body { font-family: system-ui, sans-serif; background: #e2e8f0; text-align: center; margin: 0; padding: 12px; user-select: none; }\n  #board { display: inline-grid; gap: 2px; background: #94a3b8; padding: 4px; border-radius: 8px; }\n  .c { width: 32px; height: 32px; border: 0; border-radius: 4px; background: #cbd5e1; font-size: 16px; font-weight: 700; cursor: pointer; padding: 0; }\n  .c.open { background: #f8fafc; cursor: default; } .c.mine { background: #fca5a5; }\n  .n1 { color: #2563eb; } .n2 { color: #16a34a; } .n3 { color: #dc2626; } .n4 { color: #7c3aed; } .n5 { color: #b45309; }\n  .bar { margin: 8px 0; font-size: 16px; } button.t { padding: 6px 12px; margin: 3px; border: 0; border-radius: 8px; background: #334155; color: #fff; cursor: pointer; }\n  button.t.on { background: #f59e0b; }\n<\/style>\n</head>\n<body>\n  <h2 style=\"margin:4px\">💣 지뢰찾기</h2>\n  <div class=\"bar\">남은 지뢰 <b id=\"left\">0</b> · 시간 <b id=\"time\">0</b>초 · <span id=\"state\">시작!</span></div>\n  <div class=\"bar\"><button class=\"t\" data-lv=\"0\">쉬움 8×8</button><button class=\"t\" data-lv=\"1\">보통 10×10</button><button class=\"t on\" id=\"flag\">🚩 깃발 모드 끄기</button></div>\n  <div id=\"board\"></div>\n  <div style=\"font-size:12px;color:#475569;margin-top:8px\">누르면 열려요. 오른쪽 클릭(또는 🚩 깃발 모드)으로 깃발을 꽂아요.</div>\n  <\script>\n    var LV = [{ n: 8, m: 10 }, { n: 10, m: 16 }];\n    var N, M, cells, over, firstClick, flags, opened, flagMode, t0, timer, level = 0;\n    function neighbors(i) { var r = Math.floor(i / N), c = i % N, out = []; for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) { if (!dr && !dc) continue; var rr = r + dr, c  < 4; c++) if (!g[r][c]) e.push([r, c]); if (!e.length) return; var p = e[Math.floor(Math.random() * e.length)]; g[p[0]][p[1]] = Math.random() < 0.9 ? 2 : 4; }\n    function slideRow(row) {\n      var a = row.filter(Boolean), out = [], gained = 0;\n      for (var i = 0; i < a.length; i++) { if (a[i] === a[i + 1]) { out.push(a[i] * 2); gained += a[i] * 2; i++; } else out.push(a[i]); }\n      while (out.length < 4) out.push(0);\n      return { row: out, gained: gained };\n    }\n    function move(dir) {\n      var before = JSON.stringify(g), gained = 0;\n      function line(i) { // dir: 0 왼쪽, 1 오른쪽, 2 위, 3 아래\n        var cells = []; for (var k = 0; k < 4; k++) cells.push(dir < 2 ? g[i][k] : g[k][i]);\n        if (dir === 1 || dir === 3) cells.reverse();\n        var s = slideRow(cells); gained += s.gained; var res = s.row; if (dir === 1 || dir === 3) res.reverse();\n        for (var k = 0; k < 4; k++) { if (dir < 2) g[i][k] = res[k]; else g[k][i] = res[k]; }\n      }\n      for (var i = 0; i < 4; i++) line(i);\n      if (JSON.stringify(g) !== before) { score += gained; add(); render(); }\n    }\n    function canMove() { for (var r = 0; r < 4; r++) for (var c = 0; c < 4; c++) { if (!g[r][c]) return true; if (c < 3 && g[r][c] === g[r][c + 1]) return true; if (r < 3 && g[r][c] === g[r + 1][c]) return true; } return false; }\n    function render() {\n      var b = document.getElementById('board'); b.innerHTML = '';\n      g.forEach(function (row) { row.forEach(function (v) { var d = document.createElement('div'); d.className = 't' + (v ? ' v' + v : ''); d.textContent = v || ''; b.appendChild(d); }); });\n      best = Math.max(best, score); document.getElementById('score').textContent = score; document.getElementById('best').textContent = best;\n      var flat = [].concat.apply([], g), m = document.getElementById('msg');\n      if (!won && flat.indexOf(2048) >= 0) { won = true; m.textContent = '🎉 2048 달성! 계속 해도 돼요'; }\n      else if (!canMove()) m.textContent = '더 움직일 수 없어요. 게임 오버!'; else if (!won) m.textContent = '';\n    }\n    function start() { g = empty(); score = 0; won = false; add(); add(); render(); }\n    document.addEventListener('keydown', function (e) { var d = { ArrowLeft: 0, ArrowRight: 1, ArrowUp: 2, ArrowDown: 3 }[e.key]; if (d !== undefined) { e.preventDefault(); move(d); } });\n    var sx, sy;\n    document.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });\n    document.addEventListener('touchend', function (e) { var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return; if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : 0); else move(dy > 0 ? 3 : 2); });\n    document.getElementById('reset').onclick = start; start();\n  <\/script>\n</body>\n</html>\n\"\"\"\n\nwith open(\"index.html\", \"w\", encoding=\"utf-8\") as f:\n    f.write(html)\n\nprint(\"index.html 을 만들었어요!\")\nprint(\"아래의 [만든 웹페이지 보기] 또는 위쪽의 [웹 미리보기] 버튼을 눌러 보세요.\")"],
 ["플래피|플랩피|flappy|날아라새|새날리기",false,"flappy","# 웹페이지 만들기: 날아라 새\n# 파이썬이 HTML 글자를 파일에 써 줘요. 실행한 뒤 [웹 미리보기] 버튼으로 바로 볼 수 있어요.\nhtml = r\"\"\"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>날아라 새</title>\n<\style>\n  body { font-family: system-ui, sans-serif; text-align: center; background: #0ea5e9; margin: 0; padding: 10px; user-select: none; touch-action: manipulation; }\n  canvas { background: #7dd3fc; border-radius: 10px; max-width: 100%; border: 3px solid #fff; }\n  button { padding: 9px 22px; border: 0; border-radius: 999px; background: #f97316; color: #fff; font-size: 15px; cursor: pointer; margin: 6px; }\n<\/style>\n</head>\n<body>\n  <h3 style=\"margin:4px;color:#fff\">🐤 날아라 새 · 점수 <span id=\"score\">0</span> · 최고 <span id=\"best\">0</span></h3>\n  <canvas id=\"c\" width=\"320\" height=\"440\"></canvas><br>\n  <button id=\"flap\">날개짓! (스페이스 · 화면 터치)</button>\n  <\script>\n    var cv = document.getElementById('c'), ctx = cv.getContext('2d'), W = cv.width, H = cv.height, GAP = 120, PW = 52;\n    var by, vy, pipes, score, best = 0, state = 'ready', frame = 0, raf;\n    function reset() { by = H / 2; vy = 0; pipes = []; score = 0; frame = 0; state = 'ready'; }\n    function flap() { if (state === 'over') { reset(); return; } if (state === 'ready') state = 'play'; vy = -6.2; }\n    function loop() {\n      if (state === 'play') {\n        frame++; vy += 0.38; by += vy;\n        if (frame % 90 === 1) pipes.push({ x: W, top: 60 + Math.random() * (H - GAP - 140), passed: false });\n        pipes.forEach(function (p) { p.x -= 2.4; if (!p.passed && p.x + PW < 60) { p.passed = true; score++; } });\n        pipes = pipes.filter(function (p) { return p.x > -PW; });\n        var dead = by < 0 || by > H - 20;\n        pipes.forEach(function (p) { if (60 + 14 > p.x && 60 - 14 < p.x + PW && (by - 14 < p.top || by + 14 > p.top + GAP)) dead = true; });\n        if (dead) { state = 'over'; best = Math.max(best, score); }\n      }\n      ctx.clearRect(0, 0, W, H);\n      ctx.fillStyle = '#22c55e'; pipes.forEach(function (p) { ctx.fillRect(p.x, 0, PW, p.top); ctx.fillRect(p.x, p.top + GAP, PW, H); });\n      ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(60, by, 14, 0, 7); ctx.fill(); ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(66, by - 4, 3, 0, 7); ctx.fill();\n      document.getElementById('score').textContent = score; document.getElementById('best').textContent = best;\n      ctx.fillStyle = '#fff'; ctx.font = '22px sans-serif'; ctx.textAlign = 'center';\n      if (state === 'ready') ctx.fillText('화면을 눌러 시작!', W / 2, H / 2 - 60);\n      if (state === 'over') ctx.fillText('게임 오버 · 다시 누르기', W / 2, H / 2 - 60);\n      raf = requestAnimationFrame(loop);\n    }\n    document.addEventListener('keydown', function (e) { if (e.code === 'Space') { e.preventDefault(); flap(); } });\n    cv.addEventListener('touchstart', function (e) { e.preventDefault(); flap(); }, { passive: false });\n    cv.addEventListener('mousedown', flap); document.getElementById('flap').onclick = flap;\n    reset(); loop();\n  <\/script>\n</body>\n</html>\n\"\"\"\n\nwith open(\"index.html\", \"w\", encoding=\"utf-8\") as f:\n    f.write(html)\n\nprint(\"index.html 을 만들었어요!\")\nprint(\"아래의 [만든 웹페이지 보기] 또는 위쪽의 [웹 미리보기] 버튼을 눌러 보세요.\")"],
 ["오목",false,"omok","# 웹페이지 만들기: 오목\n# 파이썬이 HTML 글자를 파일에 써 줘요. 실행한 뒤 [웹 미리보기] 버튼으로 바로 볼 수 있어요.\nhtml = r\"\"\"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>오목</title>\n<\style>\n  body { font-family: system-ui, sans-serif; text-align: center; background: #fef3c7; margin: 0; padding: 10px; }\n  canvas { background: #e0b36a; border-radius: 8px; max-width: 100%; touch-action: manipulation; }\n  button { padding: 8px 18px; border: 0; border-radius: 8px; background: #92400e; color: #fff; cursor: pointer; font-size: 15px; margin: 4px; }\n<\/style>\n</head>\n<body>\n  <h3 style=\"margin:4px\">⚫⚪ 오목 (둘이서)</h3>\n  <div id=\"status\" style=\"min-height:24px;font-size:17px\">흑돌 차례</div>\n  <canvas id=\"c\" width=\"450\" height=\"450\"></canvas><br>\n  <button id=\"undo\">한 수 무르기</button><button id=\"reset\">새 판</button>\n  <\script>\n    var N = 15, CELL = 30, PAD = 15, cv = document.getElementById('c'), ctx = cv.getContext('2d');\n    var b, turn, over, moves;\n    function init() { b = Array.from({ length: N }, function () { return Array(N).fill(0); }); turn = 1; over = false; moves = []; draw(); status(); }\n    function status(msg) { document.getElementById('status').textContent = msg || (turn === 1 ? '⚫ 흑돌 차례' : '⚪ 백돌 차례'); }\n    function draw() {\n      ctx.clearRect(0, 0, cv.width, cv.height); ctx.strokeStyle = '#6b4a1e'; ctx.lineWidth = 1;\n      for (var i = 0; i < N; i++) { ctx.beginPath(); ctx.moveTo(PAD, PAD + i * CELL); ctx.lineTo(PAD + (N - 1) * CELL, PAD + i * CELL); ctx.stroke(); ctx.beginPath(); ctx.moveTo(PAD + i * CELL, PAD); ctx.lineTo(PAD + i * CELL, PAD + (N - 1) * CELL); ctx.stroke(); }\n      for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) if (b[r][c]) { ctx.beginPath(); ctx.arc(PAD + c * CELL, PAD + r * CELL, 13, 0, 7); ctx.fillStyle = b[r][c] === 1 ? '#111' : '#fff'; ctx.fill(); ctx.strokeStyle = '#333'; ctx.stroke(); }\n      if (moves.length) { var m = moves[moves.length - 1]; ctx.fillStyle = '#ef4444'; ctx.fillRect(PAD + m[1] * CELL - 3, PAD + m[0] * CELL - 3, 6, 6); }\n    }\n    function five(r, c, p) {\n      var dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];\n      return dirs.some(function (d) {\n        var n = 1;\n        for (var s = -1; s <= 1; s += 2) { var rr = r + d[0] * s, cc = c + d[1] * s; while (rr >= 0 && rr < N && cc >= 0 && cc < N && b[rr][cc] === p) { n++; rr += d[0] * s; cc += d[1] * s; } }\n        return n >= 5;\n      });\n    }\n    function place(r, c) {\n      if (over || b[r][c]) return; b[r][c] = turn; moves.push([r, c]);\n      if (five(r, c, turn)) { over = true; draw(); status((turn === 1 ? '⚫ 흑돌' : '⚪ 백돌') + ' 승리! 🎉'); return; }\n      turn = 3 - turn; draw(); status();\n    }\n    cv.addEventListener('click', function (e) {\n      var rect = cv.getBoundingClientRect(), x = (e.clientX - rect.left) * cv.width / rect.width, y = (e.clientY - rect.top) * cv.height / rect.height;\n      var c = Math.round((x - PAD) / CELL), r = Math.round((y - PAD) / CELL);\n      if (r >= 0 && r < N && c >= 0 && c < N) place(r, c);\n    });\n    document.getElementById('undo').onclick = function () { if (over || !moves.length) return; var m = moves.pop(); b[m[0]][m[1]] = 0; turn = 3 - turn; draw(); status(); };\n    document.getElementById('reset').onclick = init; init();\n  <\/script>\n</body>\n</html>\n\"\"\"\n\nwith open(\"index.html\", \"w\", encoding=\"utf-8\") as f:\n    f.write(html)\n\nprint(\"index.html 을 만들었어요!\")\nprint(\"아래의 [만든 웹페이지 보기] 또는 위쪽의 [웹 미리보기] 버튼을 눌러 보세요.\")"],
 ["슬라이딩퍼즐|슬라이드퍼즐|15퍼즐|숫자퍼즐|퍼즐맞추기|숫자밀기",false,"puzzle15","# 웹페이지 만들기: 슬라이딩 퍼즐\n# 파이썬이 HTML 글자를 파일에 써 줘요. 실행한 뒤 [웹 미리보기] 버튼으로 바로 볼 수 있어요.\nhtml = r\"\"\"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>슬라이딩 퍼즐</title>\n<\style>\n  body { font-family: system-ui, sans-serif; text-align: center; background: #ecfdf5; margin: 0; padding: 14px; user-select: none; }\n  #board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: min(90vw, 340px); margin: 12px auto; padding: 8px; background: #065f46; border-radius: 12px; }\n  .t { aspect-ratio: 1; border: 0; border-radius: 8px; background: #34d399; color: #064e3b; font-size: 26px; font-weight: 800; cursor: pointer; }\n  .t.blank { background: transparent; cursor: default; }\n  button.r { padding: 9px 18px; border: 0; border-radius: 8px; background: #059669; color: #fff; font-size: 15px; cursor: pointer; }\n<\/style>\n</head>\n<body>\n  <h2 style=\"margin:4px\">🔢 슬라이딩 퍼즐</h2>\n  <div>움직임 <b id=\"moves\">0</b>번 <span id=\"done\"></span></div>\n  <div id=\"board\"></div>\n  <button class=\"r\" id=\"shuffle\">다시 섞기</button>\n  <\script>\n    var N = 4, tiles, moves, blank;\n    function solvable(a) {\n      var inv = 0, flat = a.filter(function (v) { return v; });\n      for (var i = 0; i < flat.length; i++) for (var j = i + 1; j < flat.length; j++) if (flat[i] > flat[j]) inv++;\n      var rowFromBottom = N - Math.floor(a.indexOf(0) / N);\n      return rowFromBottom % 2 === 0 ? inv % 2 === 1 : inv % 2 === 0;   // 4×4 에서 풀 수 있는 배치인지\n    }\n    function shuffle() {\n      do { tiles = []; for (var i = 0; i < N * N; i++) tiles.push(i); for (var k = tiles.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)); var t = tiles[k]; tiles[k] = tiles[j]; tiles[j] = t; } } while (!solvable(tiles) || solved());\n      moves = 0; render();\n    }\n    function solved() { for (var i = 0; i < N * N - 1; i++) if (tiles[i] !== i + 1) return false; return tiles[N * N - 1] === 0; }\n    function click(i) {\n      var z = tiles.indexOf(0), r = Math.floor(i / N), c = i % N, zr = Math.floor(z / N), zc = z % N;\n      if (Math.abs(r - zr) + Math.abs(c - zc) !== 1) return;\n      tiles[z] = tiles[i]; tiles[i] = 0; moves++; render();\n    }\n    function render() {\n      var b = document.getElementById('board'); b.innerHTML = '';\n      tiles.forEach(function (v, i) { var e = document.createElement('button'); e.className = 't' + (v ? '' : ' blank'); e.textContent = v || ''; e.onclick = function () { click(i); }; b.appendChild(e); });\n      document.getElementById('moves').textContent = moves; document.getElementById('done').textContent = solved() ? '🎉 완성!' : '';\n    }\n    document.getElementById('shuffle').onclick = shuffle; shuffle();\n  <\/script>\n</body>\n</html>\n\"\"\"\n\nwith open(\"index.html\", \"w\", encoding=\"utf-8\") as f:\n    f.write(html)\n\nprint(\"index.html 을 만들었어요!\")\nprint(\"아래의 [만든 웹페이지 보기] 또는 위쪽의 [웹 미리보기] 버튼을 눌러 보세요.\")"],
 ["행맨|교수형게임|단어맞추기",true,"hangmanweb","# 웹페이지 만들기: 행맨\n# 파이썬이 HTML 글자를 파일에 써 줘요. 실행한 뒤 [웹 미리보기] 버튼으로 바로 볼 수 있어요.\nhtml = r\"\"\"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>행맨</title>\n<\style>\n  body { font-family: system-ui, sans-serif; text-align: center; background: #fff1f2; margin: 0; padding: 16px; }\n  #word { font-size: 36px; letter-spacing: 8px; margin: 14px 0; font-family: monospace; }\n  #keys { max-width: 380px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }\n  #keys button { width: 38px; height: 40px; border: 0; border-radius: 8px; background: #fb7185; color: #fff; font-size: 16px; cursor: pointer; }\n  #keys button:disabled { background: #e5e7eb; color: #9ca3af; cursor: default; }\n  #man { font-size: 20px; min-height: 28px; }\n  button.r { margin-top: 14px; padding: 9px 18px; border: 0; border-radius: 8px; background: #be123c; color: #fff; cursor: pointer; }\n<\/style>\n</head>\n<body>\n  <h2 style=\"margin:4px\">🪢 행맨</h2>\n  <div id=\"man\"></div>\n  <div>힌트: <b id=\"hint\"></b></div>\n  <div id=\"word\"></div>\n  <div id=\"keys\"></div>\n  <div id=\"msg\" style=\"min-height:28px;font-size:18px;margin-top:10px\"></div>\n  <button class=\"r\" id=\"again\">새 단어</button>\n  <\script>\n    var WORDS = [['python', '프로그래밍 언어'], ['banana', '노란 과일'], ['keyboard', '컴퓨터 입력 장치'], ['elephant', '코가 긴 동물'], ['rainbow', '비 온 뒤 하늘'], ['guitar', '악기'], ['planet', '지구도 이거예요']];\n    var MAX = 6, word, hint, guessed, wrong, over;\n    function pick() { var p = WORDS[Math.floor(Math.random() * WORDS.length)]; word = p[0]; hint = p[1]; guessed = []; wrong = 0; over = false; build(); render(); }\n    function build() {\n      var k = document.getElementById('keys'); k.innerHTML = '';\n      'abcdefghijklmnopqrstuvwxyz'.split('').forEach(function (ch) { var b = document.createElement('button'); b.textContent = ch; b.onclick = function () { guess(ch, b); }; k.appendChild(b); });\n    }\n    function guess(ch, btn) {\n      if (over) return; btn.disabled = true; guessed.push(ch);\n      if (word.indexOf(ch) < 0) wrong++;\n      render();\n    }\n    function render() {\n      var shown = word.split('').map(function (c) { return guessed.indexOf(c) >= 0 || over ? c : '_'; }).join(' ');\n      var won = word.split('').every(function (c) { return guessed.indexOf(c) >= 0; });\n      if (wrong >= MAX && !over) { over = true; document.getElementById('msg').textContent = '💀 실패! 정답은 ' + word; }\n      else if (won && !over) { over = true; document.getElementById('msg').textContent = '🎉 맞췄어요!'; }\n      else if (!over) document.getElementById('msg').textContent = '';\n      document.getElementById('word').textContent = over && !won ? word.split('').join(' ') : shown;\n      document.getElementById('hint').textContent = hint;\n      document.getElementById('man').textContent = '❤️'.repeat(MAX - wrong) + '🖤'.repeat(wrong);\n    }\n    document.getElementById('again').onclick = pick; pick();\n  <\/script>\n</body>\n</html>\n\"\"\"\n\nwith open(\"index.html\", \"w\", encoding=\"utf-8\") as f:\n    f.write(html)\n\nprint(\"index.html 을 만들었어요!\")\nprint(\"아래의 [만든 웹페이지 보기] 또는 위쪽의 [웹 미리보기] 버튼을 눌러 보세요.\")"],

 ["단위(?:변환|바꾸)|길이변환|무게변환|변환기",true,"unit","# 웹페이지 만들기: 단위 변환기\n# 파이썬이 HTML 글자를 파일에 써 줘요. 실행한 뒤 [웹 미리보기] 버튼으로 바로 볼 수 있어요.\nhtml = r\"\"\"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>단위 변환기</title>\n<\style>\nbody{font-family:system-ui,sans-serif;max-width:420px;margin:0 auto;padding:18px;background:#f8fafc;color:#0f172a}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;margin:4px 0}button{padding:10px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:15px;cursor:pointer}.card{background:#fff;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 1px 4px #0001}\n<\/style>\n</head>\n<body>\n<h2>📏 단위 변환기</h2><div class=\"card\"><select id=\"kind\"></select><input id=\"v\" type=\"number\" value=\"1\"><select id=\"from\"></select><div style=\"text-align:center\">⬇</div><select id=\"to\"></select></div><div class=\"card\" id=\"out\" style=\"font-size:22px;text-align:center\"></div>\n<\script>\nvar U={\"길이\":{mm:0.001,cm:0.01,m:1,km:1000,inch:0.0254,ft:0.3048,mile:1609.344},\"무게\":{g:0.001,kg:1,t:1000,lb:0.45359237,oz:0.028349523},\"넓이\":{\"㎡\":1,\"평\":3.305785,\"ha\":10000,\"km²\":1000000}};var k=document.getElementById(\"kind\"),f=document.getElementById(\"from\"),t=document.getElementById(\"to\"),v=document.getElementById(\"v\");Object.keys(U).forEach(function(n){k.add(new Option(n,n))});function fill(){[f,t].forEach(function(s){s.innerHTML=\"\";Object.keys(U[k.value]).forEach(function(u){s.add(new Option(u,u))})});t.selectedIndex=1;calc()}function calc(){var x=parseFloat(v.value),o=document.getElementById(\"out\");if(isNaN(x)){o.textContent=\"숫자를 넣어 주세요\";return}var m=U[k.value],r=x*m[f.value]/m[t.value];o.textContent=x+\" \"+f.value+\" = \"+(Math.round(r*1e6)/1e6)+\" \"+t.value}k.onchange=fill;[f,t,v].forEach(function(e){e.oninput=calc});fill();\n<\/script>\n</bod   try{ast=pyParse(this.src)}catch(e){this.error=errInfo(e);this.finished=true;return}
  pyReset(s=>{this.out+=s});
  this.env=new Env(null,'module');this.env.vars.set('__name__','__main__');
  this.gen=execBlock(ast.body,this.env);this.send=undefined;this.thr=null}
 provideInput(text){if(this.waiting){this.send=String(text);this.out+=text+'\n';this.waiting=null}}
 step(){
  if(this.finished||this.waiting)return this.state();
  try{
   for(;;){
    let r;
    if(this.thr){const t=this.thr;this.thr=null;r=this.gen.throw(t)}else r=this.gen.next(this.send);
    this.send=undefined;
    if(r.done){this.finished=true;this.line=0;this.scopes=snapScopes(this.env);break}
    const v=r.value;
    if(v.k==='call'){this.frames[v.env.depth]=v.env;continue}
    if(v.k==='iter'){this.loops[v.line]=v.n;this.loopTot[v.line]=v.total;continue}
    if(v.k==='input'){RT.out(v.prompt);this.waiting={prompt:v.prompt,line:v.line};break}
    if(v.k==='line'){
     this.steps++;this.line=v.line;
     if(v.loop)this.loops[v.line]=v.loop.n;
     else if(v.node&&(v.node.t==='For'||v.node.t==='While')&&!(v.line in this.loops))this.loops[v.line]=0;
     this.curEnv=v.env;this.scopes=snapStack(v.env,this.frames,this.env);
     const flat={};this.scopes.forEach(sc=>sc.vars.forEach(x=>{flat[sc.kind+':'+x.name]=x.repr}));
     this.changed=new Set();for(const k in flat)if(this.prevVars[k]!==flat[k])this.changed.add(k);
     this.prevVars=flat;
     if(this.trace.length<1500)this.trace.push({step:this.steps,line:v.line,scopes:this.scopes.map(sc=>({label:sc.label,kind:sc.kind,vars:sc.vars.map(x=>[x.name,x.repr])})),out:this.out.length});
     if(this.steps>300000){this.error={type:'StepLimit',msg:'너무 오래 실행돼서 멈췄어요',line:v.line};this.finished=true}
     break}}}
  catch(e){if(e instanceof PyExit){this.finished=true}else{this.error=errInfo(e);this.finished=true}}
  return this.state()}
 state(){return{line:this.line,scopes:this.scopes,out:this.out,finished:this.finished,error:this.error,waiting:this.waiting,loops:Object.assign({},this.loops),loopTot:Object.assign({},this.loopTot),steps:this.steps,changed:this.changed}}
 runToEnd(limit){let n=0;while(!this.finished&&!this.waiting&&n++<(limit||200000))this.step();return this.state()}}

class PyRunner{
 constructor(src,opts){
  opts=opts||{};this.opts=opts;this.out='';this.error=null;this.finished=false;this.waiting=null;this.steps=0;this.exitCode=null;this.stdin=(opts.stdin||[]).slice();this.max=opts.maxSteps||0;
  let ast;
  try{ast=pyParse(src)}catch(e){this.error=errInfo(e);this.finished=true;return}
  pyReset(s=>{this.out+=s;if(opts.onOut)opts.onOut(s)});
  this.env=new Env(null,'module');this.env.vars.set('__name__','__main__');
  this.gen=execBlock(ast.body,this.env);this.send=undefined;this.thr=null}
 provide(text){if(this.waiting){this.send=String(text);const echo=text+'\n';this.out+=echo;if(this.opts.onOut)this.opts.onOut(echo);this.waiting=null}}
 run(budgetMs){
  if(this.finished||this.waiting)return this;
  const t0=Date.now();
  try{
   for(;;){
    for(let k=0;k<400;k++){
     let r;
     if(this.thr){const t=this.thr;this.thr=null;r=this.gen.throw(t)}else r=this.gen.next(this.send);
     this.send=undefined;
     if(r.done){this.finished=true;return this}
     const v=r.value;
     if(v.k==='line'){this.steps++;this.line=v.line;if(this.max&&this.steps>this.max){this.error={type:'StepLimit',msg:'너무 오래 실행돼서 멈췄어요 (끝나지 않는 반복일 수 있어요)',line:v.line};this.finished=true;return this}}
     else if(v.k==='input'){
      if(!this.opts.quietPrompt)RT.out(v.prompt);
      if(this.stdin.length)this.send=String(this.stdin.shift());
      else if(this.opts.interactive){this.waiting={prompt:v.prompt,line:v.line};return this}
      else this.thr=pyErr('EOFError','EOF when reading a line')}}
    if(Date.now()-t0>(budgetMs||12))return this}}
  catch(e){if(e instanceof PyExit){this.exitCode=e.code;this.finished=true}else{this.error=errInfo(e);this.finished=true}}
  return this}}

return{pyRun,PyStepper,PyRunner,pyParse,errInfo,errText,PySyntax,PyUnsupported,pyRepr,pyStr,vfs:VFS,moduleNames:()=>Object.keys(MODULES)};
})();
</script>

/* ---------- 줄 단위 비교 + 고르기 ---------- */
function diffLines(A,B){
 const n=A.length,m=B.length;
 if(n*m>250000){ // 너무 크면 앞뒤만 맞추고 가운데는 통째로 바뀐 것으로
  let s=0;while(s<n&&s<m&&A[s]===B[s])s++;let e=0;while(e<n-s&&e<m-s&&A[n-1-e]===B[m-1-e])e++;
  const ops=[];for(let i=0;i<s;i++)ops.push({t:'=',a:i,b:i,s:A[i]});
  for(let i=s;i<n-e;i++)ops.push({t:'-',a:i,s:A[i]});for(let j=s;j<m-e;j++)ops.push({t:'+',b:j,s:B[j]});
  for(let i=0;i<e;i++)ops.push({t:'=',a:n-e+i,b:m-e+i,s:A[n-e+i]});return ops}
 const L=[];for(let i=0;i<=n;i++)L.push(new Int16Array(m+1));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
 const ops=[];let i=0,j=0;
 while(i<n&&j<m){if(A[i]===B[j]){ops.push({t:'=',a:i,b:j,s:A[i]});i++;j++}else if(L[i+1][j]>=L[i][j+1]){ops.push({t:'-',a:i,s:A[i]});i++}else{ops.push({t:'+',b:j,s:B[j]});j++}}
 while(i<n){ops.push({t:'-',a:i,s:A[i]});i++}while(j<m){ops.push({t:'+',b:j,s:B[j]});j++}
 return ops}
function hunksOf(ops){const hs=[];let cur=null;ops.forEach((o,k)=>{if(o.t==='='){cur=null}else{if(!cur){cur={from:k,to:k,minus:[],plus:[]};hs.push(cur)}cur.to=k;(o.t==='-'?cur.minus:cur.plus).push(o)}});return hs}
function buildFrom(ops,hs,sel){
 const out=[];let hk=0;
 for(let k=0;k<ops.length;k++){
  const o=ops[k];
  if(o.t==='='){out.push(o.s);continue}
  const H=hs.find(x=>x.from===k);
  if(H){hk=hs.indexOf(H);const on=sel[hk];(on?H.plus:H.minus).forEach(x=>out.push(x.s));k=H.to}}
 return out.join('\n')}
P3.diffLines=diffLines;
/* opts:{title,why,oldCode,options:[{label,code,note}],onApply(code),applyLabel} */
P3.showDiff=function(opts){
 sheetOpen(opts.title||'바꾸기 전과 후 비교',(b,a)=>{

  const optBox=h('div','opt');if(options.length>1){const lb=h('p','p3p','마음에 드는 방법을 고르세요');b.appendChild(lb);b.appendChild(optBox)}
  const note=h('p','p3p');b.appendChild(note);
  const view=h('div');b.appendChild(view);
  const sum=h('p','p3p');b.appendChild(sum);
  const ok=h('button','btn primary wide','선택한 변경만 적용');ok.type='button';
  const no=h('button','btn2','적용하지 않고 닫기');no.type='button';
  a.style.display='';a.appendChild(ok);a.appendChild(no);
  no.onclick=sheetClose;
  function drawOpts(){optBox.textContent='';options.forEach((o,i)=>{const p=h('button','pill'+(i===ci?' on':''),o.label);p.type='button';p.onclick=()=>{ci=i;draw()};optBox.appendChild(p)})}

  if(hdrCh.length){const q=h('div','dnote');q.style.cssText='margin:0 0 6px;color:var(--ink)';q.appendChild(document.createTextNode('↻ 반복이 다음 바퀴로 넘어와서 '));hdrCh.forEach((c,i)=>{q.appendChild(h('code',null,c.name+' : '+(c.old!==undefined?c.old+' → ':'')+c.val));if(i<hdrCh.length-1)q.appendChild(document.createTextNode(', '))});q.appendChild(document.createTextNode(' 로 값이 바뀌었어요.'));d.appendChild(q)}
  if(ex&&ex.what){const p=h('div');rich(ex.what,p);d.appendChild(p);if(ex.why){const q=h('div','dnote');q.style.margin='4px 0 0';rich(ex.why,q);d.appendChild(q)}}
  body.appendChild(d)}
 if(SP.note)body.appendChild(h('p','dnote',SP.note));
 /* 반복 */
 ls.forEach(l=>{
  const n=e.loops[l.line],tot=e.loopTot[l.line];

  body.appendChild(d)});
 /* 탭 */
 const tabs=h('div','dtabs');

  e.scopes.forEach(sc=>body.appendChild(tbl(sc,ch,e)));
  body.appendChild(h('p','dnote','노란색은 방금 바뀐 값, 초록색은 새로 생긴 값이에요. 글자는 따옴표로 감싸서 보여 줘요.'))}
 else if(SP.tab==='flow'){
  const box=h('div','flwrap');body.appendChild(box);
  if(P3.flowRender){const vis={};for(let k=0;k<=SP.pos;k++){const x=SP.H[k];if(x&&!x.fin)vis[x.line]=(vis[x.line]||0)+1}
   P3.flowRender(box,SP.src,{cur:e.fin?(e.err?e.err.line:0):e.line,visits:vis,onPick:function(){}});
   const c=box.querySelector('.fn1.cur');if(c&&c.scrollIntoView)setTimeout(()=>{try{c.scrollIntoView({block:'nearest'})}catch(x){}},0)}}
 else{
  const t=sp.out.slice(0,e.outLen);
  const o=h('pre','dout',t.length?t.slice(-2000):'(아직 출력된 게 없어요)');body.appendChild(o)}
 /* 입력칸 */
 const needIn=atLast&&sp.waiting&&!e.fin;
 dirw.classList.toggle('open',!!needIn);
 if(needIn){iinp.placeholder=(sp.waiting.prompt||'값을 입력하세요').slice(0,60);setTimeout(()=>{try{iinp.focus({preventScroll:true})}catch(x){}},0)}
 if(needIn&&!body.querySelector('.dinw')){const w=h('p','dnote dinw','⌨ 프로그램이 입력을 기다리고 있어요'+(sp.waiting.prompt?': '+sp.waiting.prompt:'')+'. 아래 칸에 쓰고 [입력]을 누르세요.');body.insertBefore(w,body.firstChild)}
 }
function sendInput(){
 const sp=SP.sp;if(!sp||!sp.waiting)return;

isb.onclick=sendInput;iinp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();sendInput()}};

function begin(){
 SP.src=ta.value;SP.lr=loopRanges(SP.src);
 try{SP.ex=explainCode(SP.src)}catch(e){SP.ex=[]}
 SP.sp=new PYI.PyStepper(SP.src);SP.H=[];SP.pos=-1;SP.cap=false;SP.note='';

 if(!src.trim()){setMsg('코드를 먼저 써 주세요. 그다음 [단계 실행]을 눌러요.','i');flashT=Date.now()+4000;return}
 try{PYI.pyParse(src)}catch(e){

  setMsg((info.line?info.line+'번째 줄: ':'')+info.msg+' — 문법 오류부터 고치면 단계 실행을 쓸 수 있어요.','r');flashT=Date.now()+7000;return}
 SP.on=true;P3.stepping=true;ta.readOnly=true;document.body.classList.add('stepping');
 dbg.classList.add('open');$('#t-step').classList.add('on');
 for(const id of ['t-undo','t-redo']){$('#'+id).disabled=true}
 begin();
 setTimeout(()=>{try{window.dispatchEvent(new Event('resize'))}catch(e){}},0)};
P3.stepClose=function(){
 if(!SP.on)return;
 stopAuto();SP.on=false;P3.stepping=false;ta.readOnly=false;document.body.classList.remove('stepping');
 dbg.classList.remove('open');dirw.classList.remove('open');$('#t-step').classList.remove('on');

 try{P3.checkpoint()}catch(e){}
 const u=$('#t-undo'),r=$('#t-redo');u.disabled=false;r.disabled=false;try{P3.refreshHist()}catch(e){}};
$('#t-step').onclick=P3.stepOpen;
document.addEventListener('keydown',e=>{

 if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault();stopAuto();fwd()}
 else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();stopAuto();back()}
 else if(e.key==='Escape'){P3.stepClose()}});
P3._SP=SP;

<script>
/* ===== 3단계 도구: 코드 흐름도 ===== */
(function(){
'use strict';
const P3=window.P3,h=P3.h;
const MAXN=300;
const KR={if:'만약 (조건 검사)',elif:'아니면 만약',while:'조건이 참인 동안 반복',for:'하나씩 꺼내며 반복'};
function lineOf(src,n){return (src.split('\n')[n-1]||'').trim().replace(/\s+#.*$/,'')}
function isCall(e,name){return e&&e.t==='Call'&&e.func&&e.func.t==='Name'&&e.func.name===name}
function hasInput(e){let f=false;(function w(n){if(f||!n||typeof n!=='object')return;if(Array.isArray(n))return n.forEach(w);if(n.t==='Call'&&n.func&&n.func.t==='Name'&&n.func.name==='input'){f=true;return}Object.values(n).forEach(w)})(e);return f}
function build(ast,src,opt){
 let count=0,over=false;
 const arrow=()=>h('div','fa1');
 function mk(cls,line,code,cap){
  count++;
  const n=h('div','fn1 '+cls);n.dataset.line=line;
  if(cap){const c=h('span','cp',cap);n.appendChild(c)}
  const cd=h('code',null,code||'');n.appendChild(cd);
  if(opt.cur&&opt.cur===line)n.classList.add('cur');
  const v=opt.visits&&opt.visits[line];if(v)n.appendChild(h('span','vc',v+'번'));
  n.tabIndex=0;n.setAttribute('role','button');n.setAttribute('aria-label',line+'번째 줄 '+(code||''));
  const pick=()=>{if(opt.onPick)opt.onPick(line);else{P3.setCur(line);if(P3.sheetClose&&!P3._flowInStep){P3.sheetClose();flash(line+'번째 줄을 코드창에 표시했어요.')}}};
  n.onclick=pick;n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}};
  return n}
 function head(s){return lineOf(src,s.line).replace(/:\s*$/,'')}
 function chain(stmts){
  const col=h('div','fcol');col.style.width='100%';let first=true;
  for(const s of stmts){
   if(count>MAXN){over=true;break}
   const el=node(s);if(!el)continue;
   if(!first)col.appendChild(arrow());first=false;col.appendChild(el)}
  if(first){const e=h('div','fn1',null);e.style.opacity='.6';e.textContent='(비어 있음)';col.appendChild(e)}
  return col}
 function labeled(label,cls,child){const c=h('div','fcol');c.appendChild(h('span','flb '+cls,label));c.appendChild(arrow());c.appendChild(child);return c}
 function box(title,child){const b=h('div','flbox');b.appendChild(h('div','ft',title));if(child)b.appendChild(child);return b}
 function node(s){
  const t=s.t;
  if(t==='If'){
   const wrap=h('div','fcol');wrap.style.width='100%';
   const isElif=/^\s*elif\b/.test(lineOf(src,s.line));
   wrap.appendChild(mk('dc',s.line,head(s),isElif?KR.elif:KR.if));
   wrap.appendChild(arrow());
   const br=h('div','fbr');
   br.appendChild(labeled('참','y',chain(s.body)));
   if(s.orelse&&s.orelse.length){
    const single=s.orelse.length===1&&s.orelse[0].t==='If'&&/^\s*elif\b/.test(lineOf(src,s.orelse[0].line));
    br.appendChild(labeled(single?'아니면':'거짓 (else)','n',chain(s.orelse)))}
   else br.appendChild(labeled('거짓','n',(()=>{const e=h('div','fn1');e.style.opacity='.6';e.textContent='그냥 건너뛰어요';return e})()));
   wrap.appendChild(br);wrap.appendChild(arrow());wrap.appendChild(h('div','fmg'));
   return wrap}
  if(t==='For'||t==='While'){
   const wrap=h('div','fcol');wrap.style.width='100%';
   wrap.appendChild(mk('dc',s.line,head(s),KR[t==='For'?'for':'while']));
   wrap.appendChild(arrow());wrap.appendChild(h('span','flb l',t==='For'?'꺼낸 값마다 안쪽을 실행':'조건이 참인 동안 안쪽을 실행'));
   wrap.appendChild(arrow());
   const lp=h('div','flp');lp.appendChild(chain(s.body));wrap.appendChild(lp);
   wrap.appendChild(arrow());wrap.appendChild(h('span','flb l','반복이 끝나면 아래로'));
   if(s.orelse&&s.orelse.length){wrap.appendChild(arrow());wrap.appendChild(box('반복이 끝까지 돌았을 때 (else)',chain(s.orelse)))}
   return wrap}
  if(t==='With'){
   const b=box('with 블록 — 들어갈 때 준비하고, 나올 때 자동으로 정리해요',null);
   b.querySelector('.ft').after(chain(s.body));
   const hd=mk('dc',s.line,head(s),'with');b.querySelector('.ft').after(hd);
   count++;return b}
  if(t==='FuncDef'){
   const params=s.params.map(p=>(p.kind==='star'?'*':p.kind==='kwstar'?'**':'')+p.name).join(', ');
   const gen=(function w(n){if(!n||typeof n!=='object')return false;if(Array.isArray(n))return n.some(w);if(n.t==='Yield')return true;if(n.t==='FuncDef'||n.t==='Lambda'||n.t==='ClassDef')return false;for(const k in n){if(k==='t'||k==='line')continue;if(n[k]&&typeof n[k]==='object'&&w(n[k]))return true}return false})(s.body);
   const decs=(s.decorators||[]).map(d=>'@'+lineOf(src,d.line).trim().replace(/^@/,'')).slice(0,1);
   const b=box((gen?'제너레이터 함수 ':'함수 ')+s.name+'('+params+(gen?') — 불러도 바로 안 달리고, 값을 하나씩 내보내요':') — 불러야 실행돼요')+(s.decorators&&s.decorators.length?'  [데코레이터 '+s.decorators.length+'개]':''),null);b.querySelector('.ft').after(chain(s.body));b.dataset.line=s.line;
   count++;return b}
  if(t==='ClassDef'){const b=box('클래스 '+s.name+' — 설계도',null);b.querySelector('.ft').after(chain(s.body));count++;return b}
  if(t==='Try'){
   const wrap=h('div','fcol');wrap.style.width='100%';
   wrap.appendChild(box('오류가 날 수 있는 부분 (try)',chain(s.body)));
   s.handlers.forEach(hd=>{wrap.appendChild(arrow());const lt=lineOf(src,hd.line).replace(/:\s*$/,'');wrap.appendChild(box('오류가 나면 → '+lt,chain(hd.body)))});
   if(s.orelse&&s.orelse.length){wrap.appendChild(arrow());wrap.appendChild(box('오류가 없었다면 (else)',chain(s.orelse)))}
   if(s.finalbody&&s.finalbody.length){wrap.appendChild(arrow());wrap.appendChild(box('무조건 마지막에 (finally)',chain(s.finalbody)))}
   count++;return wrap}
  const code=lineOf(src,s.line);
  if(t==='Break')return mk('br2',s.line,code,'반복 탈출');
  if(t==='Continue')return mk('br2',s.line,code,'다음 바퀴로');
  if(t==='Return')return mk('br2 fnn',s.line,code,'돌려주고 함수 끝');
  if(t==='Raise')return mk('br2',s.line,code,'오류 일으키기');
  if(t==='Pass')return mk('',s.line,code,'아무것도 안 함');
  if(t==='Import'||t==='ImportFrom')return mk('',s.line,code,'도구 가져오기');
  if(t==='Assign'||t==='AugAssign'||t==='AnnAssign'){
   if(t==='Assign'&&hasInput(s.value))return mk('io',s.line,code,'입력 받기');
   return mk('',s.line,code,t==='AugAssign'?'값 바꾸기':'저장')}
  if(t==='Expr'){
   if(s.e&&s.e.t==='Yield')return mk('io',s.line,code,s.e.from?'다른 반복에서 값 가져와 내보내기':'값 내보내고 잠깐 멈춤');
   if(isCall(s.e,'print'))return mk('io',s.line,code,'출력');
   if(hasInput(s.e))return mk('io',s.line,code,'입력 받기');
   return mk('',s.line,code,'실행')}
  if(t==='Global'||t==='Nonlocal')return null;
  return mk('',s.line,code,'')}
 const root=h('div','fl');
 root.appendChild(mk('st',0,'시작'));
 root.querySelector('.fn1').onclick=null;
 root.appendChild(arrow());
 const c=chain(ast.body);c.style.width='100%';root.appendChild(c);
 root.appendChild(arrow());const en=mk('st',0,'끝');en.onclick=null;root.appendChild(en);
 if(over){const m=h('p','p3p','코드가 길어서 앞부분 위주로 그렸어요.');m.style.marginTop='8px';root.appendChild(m)}
 return root}
P3.flowRender=function(box,src,opt){
 opt=opt||{};box.textContent='';
 let ast;
 try{ast=PYI.pyParse(src)}catch(e){
  const info=PYI.errInfo(e);const p=h('p','p3p',(info.unsupported?'이 기능은 흐름도에서 아직 지원하지 않아요: ':'문법 오류가 있어서 흐름도를 그릴 수 없어요: ')+(info.line?info.line+'번째 줄 — ':'')+info.msg);box.appendChild(p);return}

  const g=h('div','flg');[['둥근 알약','시작/끝'],['점선 평행사변형','입력/출력'],['노란 둥근 상자','조건/반복'],['빨간 상자','탈출/돌려주기'],['↺ 왼쪽 선','반복 구간']].forEach(([a,b])=>{const s=h('span');s.appendChild(h('i'));s.appendChild(document.createTextNode(b));g.appendChild(s)});
  box.appendChild(g)}

function openFlow(){
 const src=ta.value;

<script>
/* ===== 3단계 도구: 실제 실행 점검 · 자동 테스트 ===== */
(function(){

function smartVal(lineText,k){
 if(NUMIN.test(lineText))return '5';

 return TEXTV[k%TEXTV.length]}

 opt=opt||{};const lines=src.split('\n');

function inputCalls(src){
 let ast;try{ast=PYI.pyParse(src)}catch(e){return null}

 (function w(n){if(!n||typeof n!=='object')return;if(Array.isArray(n)){n.forEach(w);return}
  if(n.t==='Call'&&n.func&&n.func.t==='Name'&&n.func.name==='input')calls.push({line:n.line,num:NUMIN.test(L[n.line-1]||'')});

 else{out.push(mk('빈 입력',()=>''));out.push(mk('숫자를 넣어 보기',()=>'123'));out.push(mk('긴 글자',()=>'가나다라마바사아자차카타파하'))}

const norm=s=>String(s).replace(/\r/g,'').split('\n').map(x=>x.replace(/\s+$/,'')).join('\n').replace(/\n+$/,'');
function runCase(src,c){

 P3.sheetOpen('자동 테스트',(b,a)=>{
  const intro=h('p','p3p');rich('여러 입력값을 넣어서 코드를 한꺼번에 돌려 보고, 오류가 없는지 · 기대한 결과와 같은지 확인해요. 입력값은 `input()` 이 불릴 때마다 한 줄씩 쓰여요. 기대 출력은 비워 두면 결과만 보여 주고, 쓰면 같은지 비교해요. (print 한 글자만 비교하고 input 안내 문구는 빼요)',intro);b.appendChild(intro);

  function runAll(){

    const del=h('button','sm d','삭제');del.type='button';del.onclick=()=>{TS.cases.splice(idx,1);saveTests();draw()};hd.appendChild(del);box.appendChild(hd);
    box.appendChild(h('div','lb','입력값 (한 줄에 하나)'));
    const ti=h('textarea');ti.value=c.i;ti.rows=Math.min(5,Math.max(1,c.i.split('\n').length));ti.setAttribute('aria-label','입력값');ti.onchange=()=>{c.i=ti.value;saveTests()};ti.oninput=()=>{c.i=ti.value};box.appendChild(ti);
    box.appendChild(h('div','lb','기대하는 출력 (비워도 돼요)'));
    const te=h('textarea');te.value=c.e;te.rows=Math.min(5,Math.max(1,c.e.split('\n').length));te.setAttribute('aria-label','기대하는 출력');te.onchange=()=>{c.e=te.value;saveTests()};te.oninput=()=>{c.e=te.value};box.appendChild(te);
    if(r){
     box.appendChild(h('div','lb','실제 출력'));box.appendChild(h('pre',null,r.out.length?r.out.slice(0,3000):'(출력 없음)'));
     if(r.note){const n=h('div','cw',r.note);n.style.cssText='margin-top:6px;font-size:13px;line-height:1.65';box.appendChild(n)}
     box.appendChild(h('div','lb',r.steps+'줄 실행'))}
    list.appendChild(box)});
   const rs=TS.cases.filter(c=>c.r);
   sum.className='card';sum.textContent='';
   if(!rs.length){sum.appendChild(h('div','cw','아직 실행하지 않았어요. [모두 실행]을 눌러 보세요.'))}
   else{
    const p=rs.filter(c=>c.r.st==='pass').length,f=rs.filter(c=>c.r.st==='fail').length,e=rs.filter(c=>c.r.st==='err').length;

    if(e||f){const w=h('div','cw');rich(e?'`확인 필요`는 그 입력에서 오류가 났거나 끝나지 않았다는 뜻이에요. 숫자 대신 글자를 넣는 것처럼 일부러 이상한 값을 넣은 케이스라면, 그런 값도 견디게 `try/except` 나 `if` 로 막아 두면 더 튼튼해져요.':'기대한 출력과 달랐어요. 위의 설명을 보고 코드를 고쳐 보세요.',w);sum.appendChild(w)}

<script>
/* ===== 3단계 도구: 코드 리뷰(규칙 기반) · 학습 기록 · 변수 변화 표 ===== */
(function(){
'use strict';
const P3=window.P3,h=P3.h,rich=P3.rich;
const BUILTIN_SHADOW=new Set('list str int float dict set tuple bool sum max min len print input type id range sorted map filter all any abs round format next iter open zip reversed enumerate'.split(' '));
const TERM=new Set(['Return','Break','Continue','Raise']);
const isNum=n=>n&&n.t==='Num';
const nv=n=>Number(n.v);
function walk(n,fn,par){
 if(!n||typeof n!=='object')return;
 if(Array.isArray(n)){n.forEach(x=>walk(x,fn,par));return}
 if(n.t)fn(n,par);
 for(const k in n){const v=n[k];if(v&&typeof v==='object')walk(v,fn,n.t?n:par)}}
function storeNames(t,set){if(!t)return;if(t.t==='Name')set.push(t);else if(t.t==='Tuple'||t.t==='List')t.items.forEach(x=>storeNames(x,set));else if(t.t==='Starred')storeNames(t.value,set)}
function indOf(l){return (l.match(/^ */)||[''])[0].length}
function bodyEnd(L,i){const ind=indOf(L[i]);let e=i;for(let j=i+1;j<L.length;j++){if(!L[j].trim())continue;if(indOf(L[j])<=ind)break;e=j}return e}
function review(src){
 const F=[];let ast;
 try{ast=PYI.pyParse(src)}catch(e){return{syntax:PYI.errInfo(e),F}}
 const L=src.split('\n');
 const repl=(n,t)=>{const a=L.slice();a[n-1]=t;return a.join('\n')};
 const add=o=>F.push(o);
 const T=n=>(L[n-1]||'');
 /* 저장/읽기 이름 */
 const stores=[],storeSet=new Set();
 walk(ast,n=>{
  if(n.t==='Assign')n.targets.forEach(t=>storeNames(t,stores));
  else if(n.t==='For')storeNames(n.target,stores);
  else if(n.t==='With')n.items.forEach(it=>storeNames(it.target,stores));
  else if(n.t==='ListComp'||n.t==='DictComp'||n.t==='SetComp'||n.t==='GenExp'){(n.gens||[]).forEach(g=>storeNames(g.target,stores))}});
 stores.forEach(x=>storeSet.add(x));
 const loads=new Set(),assigned=new Map();
 walk(ast,n=>{if(n.t==='Name'&&!storeSet.has(n))loads.add(n.name)});
 walk(ast,n=>{if(n.t==='Assign')n.targets.forEach(t=>{const o=[];storeNames(t,o);o.forEach(x=>{if(!assigned.has(x.name))assigned.set(x.name,x.line)})})});
 const globals=new Set();walk(ast,n=>{if(n.t==='Global'||n.t==='Nonlocal')n.names.forEach(x=>globals.add(x))});
 const defs={};walk(ast,n=>{if(n.t==='FuncDef')defs[n.name]=n});
 /* 1 == 1 or 2 */
 walk(ast,n=>{
  if(n.t==='BoolOp'&&n.op==='or'){
   const hasCmp=n.values.some(v=>v.t==='Compare'&&v.ops.length===1&&v.ops[0]==='==');
   const lit=n.values.find(v=>v.t==='Num'||v.t==='Str');
   if(hasCmp&&lit){
    const t=T(n.line);let fix=null,after='';
    const m=t.match(/^(\s*)(if|elif|while)\s+(.+?)\s*==\s*(\S+?)\s+or\s+(\S+?)\s*:\s*$/);
    if(m&&!/\b(and|or)\b/.test(m[3])){after=m[1]+m[2]+' '+m[3]+' in ('+m[4]+', '+m[5]+'):';fix=repl(n.line,after)}
    add({line:n.line,sev:'bug',title:'조건이 항상 참이에요',why:'`'+(lit.t==='Str'?'"…"':lit.v)+'` 처럼 값만 따로 쓰면 파이썬은 그것을 "참"으로 봐요. `a == 1 or 2` 는 "a가 1이거나, 2이거나" 가 아니라 항상 참이 돼요. 비교는 `a == 1 or a == 2` 처럼 매번 써야 하고, 짧게는 `a in (1, 2)` 라고 써요.',fix,after})}}});
 /* 변경 가능한 기본값 */
 Object.values(defs).forEach(f=>{
  f.params.forEach(p=>{
   if(p.def&&(p.def.t==='List'||p.def.t==='Dict'||p.def.t==='Set')){
    const lit=p.def.t==='List'?'[]':p.def.t==='Dict'?'{}':'set()';
    const dl=T(f.line);const first=f.body[0]&&f.body[0].line;let fix=null,after='';
    if(first&&new RegExp('\\b'+p.name+'\\s*=\\s*'+(p.def.t==='List'?'\\[\\s*\\]':p.def.t==='Dict'?'\\{\\s*\\}':'set\\(\\s*\\)')).test(dl)){
     const nl=dl.replace(new RegExp('(\\b'+p.name+'\\s*=\\s*)'+(p.def.t==='List'?'\\[\\s*\\]':p.def.t==='Dict'?'\\{\\s*\\}':'set\\(\\s*\\)')),'$1None');
     const ind=T(first).match(/^ */)[0];const a=L.slice();a[f.line-1]=nl;a.splice(f.line,0,ind+'if '+p.name+' is None:',ind+'    '+p.name+' = '+lit);fix=a.join('\n');after=nl+'\n'+ind+'if '+p.name+' is None:\n'+ind+'    '+p.name+' = '+lit}
    add({line:f.line,sev:'bug',title:'함수의 기본값으로 '+lit+' 를 쓰면 값이 쌓여요',why:'`'+p.name+'='+lit+'` 처럼 기본값을 리스트/딕셔너리로 만들면, 함수를 부를 때마다 새로 만들어지는 게 아니라 같은 것을 계속 같이 써요. 그래서 이전에 넣은 값이 남아 있어요. 기본값은 `None` 으로 하고 함수 안에서 새로 만드는 게 안전해요.',fix,after})}})});

/* ---------- "현재 코드" 설명에 변수 변화 표 붙이기 ---------- */
function traceRows(src){
 let sp;try{PYI.pyParse(src);sp=new PYI.PyStepper(src)}catch(e){return null}
 const lines=src.split('\n');let k=0,guard=0;
 while(!sp.finished&&guard++<20000){if(sp.waiting){const t=lines[sp.waiting.line-1]||'';sp.provideInput(/\b(?:int|float)\s*\(\s*input/.test(t)?'5':/\.split\s*\(/.test(t)?'3 4 5':['철수','n','q','끝'][k++%4])}else sp.step()}
 const tr=sp.trace,fin=sp.state().scopes;
 const rows=[];
 const outer=sc=>sc.slice().reverse();
 for(let i=0;i<tr.length;i++){
  const a=tr[i],bs=i+1<tr.length?tr[i+1].scopes:fin.map(s=>({label:s.label,kind:s.kind,vars:s.vars.map(x=>[x.name,x.repr])}));
  const A=outer(a.scopes),B=outer(bs),ch=[];
  B.forEach((sc,j)=>{const pa=A[j];const same=pa&&pa.label===sc.label;sc.vars.forEach(([n,r])=>{if(/^(함수|클래스) /.test(r))return;if(!same){ch.push({n,v:r,nw:true});return}const old=(pa.vars.find(x=>x[0]===n)||[])[1];if(old===undefined)ch.push({n,v:r,nw:true});else if(old!==r)ch.push({n,o:old,v:r})})});
  const outTxt=tr[i+1]?sp.out.slice(a.out,tr[i+1].out):sp.out.slice(a.out);
  rows.push({line:a.line,ch,out:outTxt,hdr:/^\s*for\s+(.+?)\s+in\b/.exec(lines[a.line-1]||'')})}
 /* 반복 변수는 for 줄이 바꾼 것으로 */
 for(let i=0;i+1<rows.length;i++){
  const nx=rows[i+1];
  if(nx.hdr&&rows[i].line!==nx.line){const nm=nx.hdr[1].replace(/[()\s]/g,'').split(',');const mv=rows[i].ch.filter(c=>nm.includes(c.n));rows[i].ch=rows[i].ch.filter(c=>!mv.includes(c));nx.ch=mv.concat(nx.ch)}}
 return{rows,err:sp.error,steps:sp.steps,timeout:!sp.finished}}
function appendTrace(){
 const box=$('#exr');if(!box||box.querySelector('.p3tr'))return;
 const src=ta.value;if(!src.trim())return;
 const T=traceRows(src);if(!T||!T.rows.length)return;
 const wrapc=h('div','gc p3tr');wrapc.appendChild(h('h4',null,'실제로 돌려 본 변수 변화 (입력은 알아서 넣어 봤어요)'));
 const p=h('p',null);p.style.cssText='font-size:13px;color:var(--mute);line-height:1.7;margin:0 0 6px';p.textContent='코드를 한 줄씩 실제로 실행하면서 값이 어떻게 바뀌는지 적었어요. 같은 줄이 여러 번 반복되면 처음 3번과 마지막만 보여 줘요.';wrapc.appendChild(p);
 const cnt={},total={};T.rows.forEach(r=>total[r.line]=(total[r.line]||0)+1);
 let shown=0,skipped=0;const L=src.split('\n');
 const list=h('div');
 T.rows.forEach(r=>{
  cnt[r.line]=(cnt[r.line]||0)+1;
  if(total[r.line]>4&&cnt[r.line]>3&&cnt[r.line]<total[r.line]){skipped++;return}
  if(!r.ch.length&&!r.out)return;
  if(shown>=60)return;shown++;
  const d=h('div','ec');d.style.padding='8px 10px';
  const l=h('div','ecl',r.line+'번째 줄'+(total[r.line]>1?' · '+cnt[r.line]+'번째 실행':''));d.appendChild(l);
  d.appendChild(h('div','ecc',(L[r.line-1]||'').trim()));
  r.ch.slice(0,8).forEach(c=>{const x=h('div','ecw');x.style.margin='0';x.style.fontFamily='var(--mono)';x.style.fontSize='12.5px';x.textContent=c.nw?c.n+' ← '+c.v+'  (새로 만들어짐)':c.n+':  '+c.o+'  →  '+c.v;d.appendChild(x)});
  if(r.out){const x=h('div','ecy');x.textContent='화면 출력: '+r.out.replace(/\n$/,'').slice(0,120);d.appendChild(x)}
  list.appendChild(d)});
 wrapc.appendChild(list);
 if(skipped)wrapc.appendChild(h('p',null,'(반복되는 '+skipped+'번의 실행은 줄여서 보여 줬어요)')).style.cssText='font-size:12.5px;color:var(--mute)';
 if(T.err)wrapc.appendChild(h('p',null,'※ 실행 중 '+T.err.type+' 오류가 나서 거기까지만 보여 줬어요.')).style.cssText='font-size:12.5px;color:var(--redn)';
 if(!shown)return;
 box.appendChild(wrapc)}
const _oce=window.openCodeExplain;
window.openCodeExplain=function(){_oce.apply(this,arguments);try{appendTrace()}catch(e){}};
$('#exall').onclick=window.openCodeExplain;
})();
</script>

arn", "함수 안에서 만든 변수는 함수 밖에서 쓸 수 없어요. 필요하면 `return` 으로 돌려주세요."], ["code", "def greet(name, greeting=\"안녕\"):   # 기본값\n    return f\"{greeting}, {name}!\"\nprint(greet(\"철수\"))\nprint(greet(\"영희\", \"반가워\"))"], ["tip", "함수는 \"입력 → 처리 → 출력\"의 작은 기계예요. 한 함수는 한 가지 일만 하게 만들어요."]]}, {"id": "class", "t": "클래스(객체)", "i": "🏗️", "c": "클래스", "intro": "클래스는 설계도, 객체는 설계도로 만든 실제 물건이에요. 데이터(속성)와 기능(메서드)을 한 덩어리로 묶어요.", "b": [["code", "class Dog:\n    def __init__(self, name):   # 만들 때 자동 실행\n        self.name = name         # 속성\n\n    def bark(self):              # 메서드\n        print(self.name + \": 멍멍!\")\n\nd = Dog(\"초코\")\nd.bark()"], ["warn", "메서드의 첫 매개변수는 항상 `self` 예요. 속성은 `self.이름` 으로 써야 해요(그냥 `name` 이 아니에요)."], ["tip", "`__init__` 은 객체가 만들어질 때 처음 한 번 실행되는 \"준비 단계\"예요."]]}, {"id": "err", "t": "오류 읽고 잡기", "i": "🩺", "c": "오류", "intro": "오류 메시지는 \"무엇이, 몇 번째 줄에서\" 틀렸는지 알려 주는 친절한 힌트예요. 아래에서 위로, 마지막 줄부터 읽어요.", "b": [["p", "**자주 만나는 오류**: `SyntaxError`(문법), `NameError`(없는 이름), `TypeError`(자료형 안 맞음), `ValueError`(값이 이상함), `IndexError`(칸 번호 초과), `KeyError`(없는 키), `ZeroDivisionError`(0으로 나눔), `IndentationError`(들여쓰기)."], ["code", "try:\n    n = int(\"abc\")\nexcept ValueError:\n    print(\"숫자가 아니에요\")\nprint(\"프로그램은 계속 돼요\")"], ["warn", "오류가 나는 줄만 보지 말고 **그 앞줄**도 보세요. 괄호나 따옴표를 닫지 않으면 다음 줄에서 오류가 나요."], ["tip", "이 사이트는 오류가 나면 쉬운 말로 설명하고 [고치기] 버튼을 보여 줘요."]]}, {"id": "file", "t": "파일 읽고 쓰기", "i": "📄", "c": "파일", "intro": "프로그램이 끝나도 남기고 싶은 내용은 파일에 저장해요.", "b": [["code", "with open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"안녕\\n오늘도 코딩!\\n\")\n\nwith open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    for line in f:\n        print(line.strip())"], ["p", "`\"w\"` 는 쓰기(기존 내용은 지워져요), `\"a\"` 는 뒤에 이어쓰기, `\"r\"` 은 읽기예요. `with` 를 쓰면 끝난 뒤 알아서 파일을 닫아요."], ["warn", "없는 파일을 `\"r\"` 로 열면 `FileNotFoundError`. 먼저 만들었는지 확인하세요."]]}, {"id": "tips", "t": "코딩 잘하는 습관", "i": "🌱", "c": "기초", "intro": "실력이 빨리 느는 방법은 의외로 간단해요.", "b": [["p", "**1. 작게 쪼개서 풀기.** 큰 문제는 \"입력 → 계산 → 출력\" 세 덩어리로 나눠요."], ["p", "**2. 일부러 끝값을 넣어 보기.** 0, 1, 빈 입력, 가장 큰 값. 오류와 틀린 답은 대부분 끝에서 나와요."], ["p", "**3. 중간 값을 print 로 찍어 보기.** 변수에 뭐가 들어 있는지 눈으로 보면 대부분 바로 알게 돼요. [단계 실행] 도구를 쓰면 한 줄씩 볼 수 있어요."], ["p", "**4. 오류 메시지를 끝까지 읽기.** 마지막 줄이 이유, 위쪽이 위치예요."], ["p", "**5. 모르면 모른다고 하기.** 모르는 부분을 정확히 적어 두면 절반은 해결된 거예요."]]}];

  const draw=()=>{list.textContent='';let n=0;PROBS.forEach(p=>{const s=st(p.id);
   if(cat==='⚠️ 자주 틀려요'){if(!p.pit)return}else if(cat!=='전체'&&p.c!==cat)return;
   if(lv&&p.lv!==lv)return;if(hideDone&&s.solved)return;n++;
   const c=h('button','exi');c.type='button';const t=h('div','exh');
   t.appendChild(h('b',null,(s.solved?'✅ ':'')+p.t));const rt=h('span');rt.style.cssText='display:flex;gap:5px;align-items:center';if(p.pit)rt.appendChild(h('span','lv lv3','⚠️'));rt.appendChild(h('span','lv lv'+p.lv,LV[p.lv]));t.appendChild(rt);c.appendChild(t);
   c.appendChild(h('div','exd',p.c+' · '+(s.solved?'해결했어요':s.tries?'도전 중 ('+s.tries+'번 채점)':'아직 안 풀었어요')));
   c.onclick=()=>begin(p);list.appendChild(c)});cnt.textContent=n+'문제';if(!n)list.appendChild(h('p','p3p','조건에 맞는 문제가 없어요.'))};
  cats.forEach(c=>{const x=h('button','chip'+(c===cat?' on':''),c);x.type='button';x.onclick=()=>{cat=c;[...chips.children].forEach(y=>y.classList.toggle('on',y===x));draw()};chips.appendChild(x)});
  draw()})}
/* ---------- 문제 보기 / 시작 ---------- */
function starter(p){return '# 문제: '+p.t+'\n# '+p.d.split('\n')[0]+'\n\n'}
function begin(p){
 cur=p;const s=st(p.id);
 P3.sheetClose();
 setCode(s.code&&s.code.trim()?s.code:starter(p));
 showBar();say('"'+p.t+'" 문제를 시작했어요. 코드를 쓰고 [채점]을 눌러요.');
 view(p)}
function view(p){
 cur=p;showBar();const s=st(p.id);
 P3.sheetOpen('문제 · '+p.t,(b,a)=>{
  b.appendChild(h('div','pcat',p.c+' · '+LV[p.lv]));
  b.appendChild(h('p','pdesc',p.d));if(p.pit){const w=h('div','ppit');w.appendChild(h('b',null,'⚠️ 자주 틀리는 부분 '));w.appendChild(document.createTextNode(p.pit));b.appendChild(w)}
  b.appendChild(box('입력',p.fi));b.appendChild(box('출력',p.fo));
  const ex=p.tests[0];b.appendChild(box('예시 입력',ex[0]));b.appendChild(box('예시 출력',ex[1]));
  const hs=h('div','phints');b.appendChild(hs);
  const drawH=()=>{hs.textContent='';for(let i=0;i<s.hints;i++){const d=h('div','phint');d.appendChild(h('b',null,'힌트 '+(i+1)+' '));d.appendChild(document.createTextNode(p.h[i]));hs.appendChild(d)}};
  drawH();
  const row=h('div','opt');b.appendChild(row);
  const hb=h('button','sm','💡 힌트 보기');hb.type='button';
  hb.onclick=()=>{if(s.hints<p.h.length){s.hints++;save();drawH()}if(s.hints>=p.h.length)hb.disabled=true};if(s.hints>=p.h.length)hb.disabled=true;row.appendChild(hb);
  const ab=h('button','sm','🔓 정답 예시 보기');ab.type='button';
  const need=!(s.solved||s.tries>=2||s.hints>=p.h.length);
  if(CAT2L[p.c]){const lb=h('button','sm','📖 개념 다시 배우기');lb.type='button';lb.onclick=()=>lesson(CAT2L[p.c]);row.appendChild(lb)}
  if(need){ab.disabled=true;ab.title='채점을 2번 해 보거나 힌트를 모두 본 뒤에 열려요'}
  ab.onclick=()=>{const w=h('div','pbx');w.appendChild(h('div','pbl','정답 예시 (이 방법만 있는 게 아니에요)'));const pre=h('pre','pbp');pre.textContent=p.sol;w.appendChild(pre);if(p.ex){const e=h('div','pexp');e.appendChild(h('b',null,'해설 '));e.appendChild(document.createTextNode(p.ex));w.appendChild(e)}b.appendChild(w);ab.disabled=true};row.appendChild(ab);
  if(need)b.appendChild(h('p','p3p','💡 정답 예시는 채점을 2번 해 보거나 힌트를 모두 본 뒤에 열려요. 먼저 스스로 해 보는 게 실력이 가장 많이 늘어요.'));
  a.style.display='flex';a.textContent='';
  const g=h('button','btn primary','코드창으로 가서 풀기');g.type='button';g.onclick=()=>{P3.sheetClose();setCode(s.code&&s.code.trim()?s.code:starter(p))};a.appendChild(g)})}
/* ---------- 채점 ---------- */
function grade(){
 if(!cur){openList();return}
 const p=cur,s=st(p.id),src=ta.value;
 let perr=null;try{PYI.pyParse(src)}catch(e){perr=e}
 s.code=src;
 if(perr){const info=PYI.errInfo(perr);P3.sheetOpen('채점 결과',(b)=>{b.appendChild(h('div','pres bad','문법 오류가 있어서 채점할 수 없어요'));b.appendChild(h('p','p3p',(info.line?info.line+'번째 줄 근처: ':'')+info.type+': '+info.msg));b.appendChild(h('p','p3p','코드창 아래의 안내와 [고치기] 버튼을 확인해 보세요.'))});save();return}
 s.tries++;
 const res=p.tests.map(t=>{const r=P3.runOne(src,{stdin:t[0].split('\n'),maxSteps:300000,budget:1500});const got=norm(r.out);let ok=!r.error&&got===norm(t[1]);return{t,r,got,ok}});
 const pass=res.filter(x=>x.ok).length,all=pass===res.length;
 if(all)s.solved=true;else s.fails++;save();
 P3.sheetOpen('채점 결과 · '+p.t,(b,a)=>{
  b.appendChild(h('div','pres '+(all?'good':'bad'),all?'🎉 모두 맞았어요! ('+pass+'/'+res.length+')':pass+' / '+res.length+' 통과'));
  const dots=h('div','pdots');res.forEach(x=>dots.appendChild(h('i',x.ok?'ok':'no')));b.appendChild(dots);
  if(all){const n=PROBS.findIndex(q=>q.id===p.id);b.appendChild(h('p','p3p','잘했어요! 다른 방법으로도 풀 수 있는지 생각해 보거나, 다음 문제에 도전해 보세요.'));if(p.ex){const e=h('div','pexp');e.appendChild(h('b',null,'해설 '));e.appendChild(document.createTextNode(p.ex));b.appendChild(e)}if(p.pit){const w=h('div','ppit');w.appendChild(h('b',null,'⚠️ 이 문제에서 자주 하는 실수 '));w.appendChild(document.createTextNode(p.pit));b.appendChild(w)}const sol=h('div','pbx');sol.appendChild(h('div','pbl','내 풀이와 비교해 보세요 (정답 예시)'));const sp=h('pre','pbp');sp.textContent=p.sol;sol.appendChild(sp);b.appendChild(sol);
   a.style.display='flex';a.textContent='';
   const nx=PROBS.slice(n+1).find(q=>!st(q.id).solved)||PROBS.find(q=>!st(q.id).solved);
   const l=h('button','btn','문제 목록');l.type='button';l.onclick=openList;a.appendChild(l);
   if(nx){const g=h('button','btn primary','다음 문제: '+nx.t);g.type='button';g.onclick=()=>begin(nx);a.appendChild(g)}}
  else{const f=res.find(x=>!x.ok);
   b.appendChild(h('p','p3p','처음 틀린 경우를 보여 줄게요. (입력이 이렇게 들어왔을 때)'));
   b.appendChild(box('입력',f.t[0]));b.appendChild(box('기대한 출력',f.t[1]));
   if(f.r.error){const e=f.r.error;b.appendChild(box('내 코드의 결과',(e.type==='EOFError'?'입력을 더 기다렸어요. input() 을 필요한 만큼만 불러야 해요.':e.type==='StepLimit'?'시간 안에 끝나지 않았어요. 끝나지 않는 반복일 수 있어요.':e.type+': '+e.msg+(e.line?' ('+e.line+'번째 줄)':''))+(f.got?'\n\n지금까지 출력: \n'+f.got:''),'bad'))}
   else{const A=f.got.split('\n'),B=f.t[1].split('\n');let k=0;while(k<A.length&&k<B.length&&A[k]===B[k])k++;b.appendChild(box('내 코드의 출력',f.got,'bad'));
    b.appendChild(h('p','p3p',A.length!==B.length&&k>=Math.min(A.length,B.length)?'줄 수가 달라요. 기대는 '+B.length+'줄, 내 출력은 '+A.length+'줄이에요.':(k+1)+'번째 줄부터 달라요. 띄어쓰기와 글자 하나하나까지 똑같아야 해요.'))}
   if(p.pit){const w=h('div','ppit');w.appendChild(h('b',null,'⚠️ 이런 실수가 많아요 '));w.appendChild(document.createTextNode(p.pit));b.appendChild(w)}b.appendChild(h('p','p3p','💡 [문제 보기]에서 힌트와 개념 설명을 볼 수 있어요.'));
   a.style.display='flex';a.textContent='';
   const v=h('button','btn','문제 보기');v.type='button';v.onclick=()=>view(p);a.appendChild(v);
   const g=h('button','btn primary','다시 풀기');g.type='button';g.onclick=()=>P3.sheetClose();a.appendChild(g)}})}
/* ---------- 개념 배우기 ---------- */
function runSnippet(code,out){
 out.textContent='';
 if(/\binput\s*\(/.test(code)){out.textContent='이 예제는 입력이 필요해요. [코드창에 넣기] 후 실행해 보세요.';return}
 try{const r=P3.runOne(code,{stdin:[],maxSteps:100000,budget:1500});out.textContent=(r.out||'')+(r.error?'\n⚠️ '+r.error.type+': '+r.error.msg:'');if(!out.textContent.trim())out.textContent='(출력이 없어요)'}catch(e){out.textContent='실행하지 못했어요'}}
function lesson(id){
 const L=LESSONS.find(x=>x.id===id);if(!L){openLearn();return}
 P3.sheetOpen(L.i+' '+L.t,(b,a)=>{
  const p0=h('p','pdesc');P3.rich(L.intro,p0);b.appendChild(p0);
  L.b.forEach(x=>{
   if(x[0]==='h')b.appendChild(h('h4','lh',x[1]));
   else if(x[0]==='p'){const p=h('p','lp');rich2(x[1],p);b.appendChild(p)}
   else if(x[0]==='warn'){const w=h('div','ppit');w.appendChild(h('b',null,'⚠️ 자주 하는 실수 '));rich2(x[1],w);b.appendChild(w)}
   else if(x[0]==='tip'){const w=h('div','ptip');w.appendChild(h('b',null,'💡 꿀팁 '));rich2(x[1],w);b.appendChild(w)}
   else if(x[0]==='code'){const w=h('div','lcode');const pre=h('pre','pbp');pre.textContent=x[1];w.appendChild(pre);
    const row=h('div','opt');const out=h('pre','lout');out.style.display='none';
    const r=h('button','sm','▶ 결과 보기');r.type='button';r.onclick=()=>{out.style.display='block';runSnippet(x[1],out)};
    const c=h('button','sm','코드창에 넣기');c.type='button';c.onclick=()=>{P3.sheetClose();setCode(x[1]+'\n');say('예제를 코드창에 넣었어요. 고쳐 가며 [실행]해 보세요!')};
    row.appendChild(r);row.appendChild(c);w.appendChild(row);w.appendChild(out);b.appendChild(w)}});
  const cat=Object.keys(CAT2L).find(k=>CAT2L[k]===id);
  a.style.display='flex';a.textContent='';
  const l=h('button','btn','개념 목록');l.type='button';l.onclick=openLearn;a.appendChild(l);
  if(cat){const g=h('button','btn primary',cat+' 문제 풀어 보기');g.type='button';g.onclick=()=>{openList()};a.appendChild(g)}})}
function rich2(t,into){String(t).split(/(\*\*[^*]+\*\*|`[^`]+`)/).forEach(p=>{if(!p)return;if(p[0]==='`')into.appendChild(h('code',null,p.slice(1,-1)));else if(p.slice(0,2)==='**')into.appendChild(h('b',null,p.slice(2,-2)));else into.appendChild(document.createTextNode(p))})}
function openLearn(){
 try{document.getElementById('pclose').click()}catch(e){}
 P3.sheetOpen('개념 배우기',(b)=>{
  b.appendChild(h('p','p3p','처음부터 차근차근 읽어 보세요. 각 개념마다 예제를 바로 실행해 볼 수 있고, "자주 하는 실수"도 알려 드려요.'));
  const g=h('div','lgrid');LESSONS.forEach((L,i)=>{const c=h('button','lcard');c.type='button';c.appendChild(h('div','lico',L.i));c.appendChild(h('b',null,(i+1)+'. '+L.t));c.appendChild(h('div','exd',L.intro.replace(/`/g,'').slice(0,40)+'…'));c.onclick=()=>lesson(L.id);g.appendChild(c)});b.appendChild(g)})}
P3.openLearn=openLearn;
/* ---------- 문제 바 ---------- */
let barEl=null;
function showBar(){
 if(!barEl){barEl=h('div','pbar');barEl.id='pbar';const sug=document.getElementById('sug');sug.parentNode.insertBefore(barEl,sug)}
 barEl.textContent='';const p=cur;if(!p){barEl.style.display='none';return}barEl.style.display='flex';
 barEl.appendChild(h('span','pbt','📝 '+p.t));
 const mk=(l,fn,c)=>{const x=h('button','pbb'+(c?' '+c:''),l);x.type='button';x.onclick=fn;barEl.appendChild(x)};
 mk('문제 보기',()=>view(p));mk('채점',grade,'go');mk('✕',()=>{cur=null;showBar()})}
/* ---------- 버튼과 모양 ---------- */
const x=h('button','tbn');x.type='button';x.id='t-prob';x.title='연습 문제 풀고 자동 채점받기';x.setAttribute('aria-label','연습 문제');
x.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg><span>문제</span>';
tools.insertBefore(x,document.getElementById('t-ex')||sv);x.onclick=openList;
const lb2=h('button','tbn');lb2.type='button';lb2.id='t-learn';lb2.title='개념 배우기';lb2.setAttribute('aria-label','개념 배우기');lb2.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 8h6"/></svg><span>배우기</span>';tools.insertBefore(lb2,x);lb2.onclick=openLearn;
P3.openProblems=openList;P3.PROBS=PROBS;
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key==='Enter'&&cur){e.preventDefault();grade()}});
const css=[
'.pgs{display:flex;align-items:center;gap:12px;margin:2px 0 6px;font-size:14px}.pgb{flex:1;height:8px;border-radius:6px;background:var(--line);overflow:hidden}.pgb i{display:block;height:100%;background:var(--ok);border-radius:6px}',
'.pcat{font-size:12px;color:var(--mute);margin:2px 0 4px}.pdesc{font-size:15px;line-height:1.75;margin:4px 0 12px}',
'.pbx{margin:8px 0}.pbl{font-size:11.5px;font-weight:600;color:var(--mute);margin-bottom:3px}.pbp{margin:0;padding:9px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-family:var(--mono);font-size:13px;white-space:pre-wrap;word-break:break-all}',
'.pbx.bad .pbp{border-color:var(--redn);background:var(--red)}',
'.phint{margin:6px 0;padding:9px 12px;border-radius:10px;background:var(--yel);color:var(--ink);font-size:13.5px;line-height:1.6}',
'.pres{font-size:17px;font-weight:700;margin:4px 0 8px}.pres.good{color:var(--ok)}.pres.bad{color:var(--redn)}',
'.pdots{display:flex;gap:6px;margin:0 0 8px}.pdots i{width:12px;height:12px;border-radius:50%}.pdots i.ok{background:var(--ok)}.pdots i.no{background:var(--redn)}',
'.pbar{display:flex;align-items:center;gap:8px;margin:6px 14px 0;padding:6px 10px;border-radius:12px;background:var(--accsoft);border:1px solid var(--acc);font-size:13px}',
'.pbt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}',
'.ppit{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--red);font-size:13.5px;line-height:1.65}.ptip{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--accsoft);font-size:13.5px;line-height:1.65}.pexp{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--accsoft);font-size:13.5px;line-height:1.7}',
'.prec{margin:6px 0 10px;padding:10px 12px;border-radius:12px;background:var(--yel)}.prt{font-weight:600;font-size:13.5px;margin-bottom:6px}',
'.lh{margin:16px 0 4px;font-size:15px}.lp{margin:6px 0;font-size:14px;line-height:1.75}.lcode{margin:8px 0}.lout{margin:6px 0 0;padding:9px 12px;border-radius:10px;background:#0b1020;color:#e8eefc;font-family:var(--mono);font-size:13px;white-space:pre-wrap;word-break:break-all}',
'.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}.lcard{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px;cursor:pointer;font:inherit;transition:border-color .15s,transform .1s}.lcard:hover{border-color:var(--acc)}.lcard:active{transform:scale(.98)}.lico{font-size:26px;margin-bottom:4px}',
'.pbb{flex:none;height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:12.5px;cursor:pointer}.pbb.go{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}'].join('\n');
const sty=document.createElement('style');sty.textContent=css;document.head.appendChild(sty);
})();
</script>
