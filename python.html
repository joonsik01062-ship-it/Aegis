<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>파이썬 첫걸음</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7FA;--panel:#FFFFFF;--ink:#1D2733;--mute:#6B7886;--line:#DDE3EA;--acc:#3B5BDB;--accink:#FFFFFF;--red:rgba(229,57,53,.16);--redn:#D32F2F;--yel:rgba(250,190,0,.30);--yeln:#B27F00;--ok:#2E7D32;--g:48px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151A21;--panel:#1B222B;--ink:#E4E9F0;--mute:#8C99A8;--line:#2B3542;--acc:#7C93FF;--accink:#10131A;--red:rgba(255,82,82,.20);--redn:#FF6B6B;--yel:rgba(255,200,40,.20);--yeln:#E8B93A;--ok:#6FCF7A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151A21;--panel:#1B222B;--ink:#E4E9F0;--mute:#8C99A8;--line:#2B3542;--acc:#7C93FF;--accink:#10131A;--red:rgba(255,82,82,.20);--redn:#FF6B6B;--yel:rgba(255,200,40,.20);--yeln:#E8B93A;--ok:#6FCF7A;color-scheme:dark}
html,body{height:100%;margin:0}
html,body,textarea,#gut,#pre{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,"Noto Sans KR","Malgun Gothic",sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0;font-weight:600}
.btns{display:flex;gap:8px}
.btns button{font:inherit;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btns .run{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.btns button:focus-visible,.chip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#sug{display:flex;gap:6px;overflow-x:auto;padding:0 12px;height:48px;flex:none;box-sizing:border-box;background:var(--panel);border-bottom:1px solid var(--line);align-items:center;font-size:13px;color:var(--mute)}
.chip{flex:none;font:inherit;font-size:13px;padding:5px 9px;border-radius:999px;border:1px solid var(--acc);background:transparent;color:var(--acc);cursor:pointer}
.wrap{flex:1;min-height:0;display:flex;overflow:auto;background:var(--panel)}
#gut{position:sticky;left:0;flex:none;width:var(--g);box-sizing:border-box;padding:12px 8px 120px 0;text-align:right;background:var(--panel);border-right:1px solid var(--line);z-index:2;font-size:14px;line-height:var(--lh,24px);color:var(--mute);user-select:none}
#gut .n{height:var(--lh,24px)}#gut .r{color:var(--redn);font-weight:600}#gut .y{color:var(--yeln);font-weight:600}
.ed{position:relative;flex:1 0 auto}
#pre{position:absolute;left:0;right:0;top:0;padding:12px 0;pointer-events:none}
#pre div{height:var(--lh,24px)}#pre .r{background:var(--red)}#pre .y{background:var(--yel)}
#ta{position:relative;display:block;box-sizing:border-box;min-width:calc(100vw - var(--g));margin:0;padding:12px 12px 120px 12px;border:0;outline:0;resize:none;overflow:hidden;white-space:pre;background:transparent;color:var(--ink);caret-color:var(--acc);font:inherit;font-size:14px;line-height:24px;tab-size:4}
#msg{padding:10px 12px;font-size:13px;line-height:1.5;background:var(--panel);border-top:1px solid var(--line);color:var(--mute);height:64px;flex:none;overflow:auto;box-sizing:border-box}
#msg.r{color:var(--redn)}#msg.y{color:var(--yeln)}#msg.ok{color:var(--ok)}
#panel{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);z-index:10;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
#panel.open{display:flex}#panel.half{top:50%;border-top:2px solid var(--acc)}#panel.small{top:72%;border-top:2px solid var(--acc)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px}
.ph select,.ph button{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
#out{flex:1;margin:0;padding:12px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:inherit;font-size:14px;line-height:1.6}
#out .e{color:var(--redn);font-weight:600}#out .ok{color:var(--mute)}
#ir{display:none;gap:8px;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line)}#ir.open{display:flex}
#iin{flex:1;min-width:0;font:inherit;font-size:16px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#ir button{font:inherit;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--accink)}
#vp{display:none;flex:none;flex-direction:column;gap:6px;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line)}
#vp.open{display:flex}.vr{display:flex;gap:8px}
#vin{flex:1;min-width:0;font:inherit;font-size:16px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#vgo{font:inherit;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--accink);font-weight:600}
#vh{font-size:12px;line-height:1.4;color:var(--mute);height:64px;overflow:auto}
#vundo{font:inherit;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
#vgo:disabled{opacity:.5}
#msg{display:flex;gap:8px;align-items:flex-start}#mt{flex:1}
#mfix{flex:none;font:inherit;font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--accink);font-weight:600}
#fx{position:fixed;left:0;right:0;bottom:0;top:34%;display:none;flex-direction:column;background:var(--bg);z-index:20;border-top:2px solid var(--acc);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
#fx.open{display:flex}#fxb{flex:1;overflow:auto;padding:12px}
.fxw{margin:0 0 10px;font-size:14px;line-height:1.6}.fxl{font-size:12px;color:var(--mute);margin:10px 0 4px}
.sn{margin:0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font:inherit;font-size:13px;line-height:1.6;overflow:auto}
.sn div{white-space:pre}.sn .mk{background:var(--yel)}
#fxa{padding:8px 12px;background:var(--panel);border-top:1px solid var(--line)}
#fxok{width:100%;font:inherit;font-size:15px;padding:10px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--accink);font-weight:600}
</style>
</head>
<body>
<header>
<h1>파이썬 첫걸음</h1>
<div class="btns"><button id="vibe" type="button">바이브</button><button id="run" class="run" type="button">실행</button></div>
</header>
<div id="sug"></div>
<div class="wrap" id="wrap">
<div id="gut"></div>
<div class="ed"><div id="pre"></div><textarea id="ta" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="파이썬 코드 입력"></textarea></div>
</div>
<div id="vp"><div class="vr"><input id="vin" placeholder="예) 1부터 10까지 출력해줘" autocomplete="off" aria-label="한국어로 만들 코드 설명"><button id="vgo" type="button">만들기</button><button id="vundo" type="button" style="display:none">되돌리기</button></div><div id="vh"></div></div>
<div id="msg"><span id="mt"></span><button id="mfix" type="button" style="display:none">고치기</button></div>
<div id="fx"><div class="ph"><strong>고치는 방법</strong><button id="fxc" type="button">닫기</button></div><div id="fxb"></div><div id="fxa"><button id="fxok" type="button">이대로 고치기</button></div></div>
<div id="panel">
<div class="ph"><strong>실행 결과</strong><span><button id="pstop" type="button">정지</button> <select id="psize" aria-label="화면 크기"><option value="full">전체</option><option value="half">절반</option><option value="small">작게</option></select> <button id="pclose" type="button">닫기</button></span></div>
<pre id="out"></pre>
<div id="ir"><input id="iin" autocomplete="off" aria-label="입력칸"><button id="isend" type="button">입력</button></div>
</div>
<script>
const $=s=>document.querySelector(s);
const ta=$('#ta'),pre=$('#pre'),gut=$('#gut'),sug=$('#sug'),msg=$('#msg'),wrap=$('#wrap');
const KW=new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const BI=new Set('print input len range int str float list dict set tuple bool type sum min max abs round sorted enumerate zip map filter open isinstance reversed any all chr ord format id dir help pow divmod bin hex oct repr hash iter next object super Exception ValueError TypeError KeyError IndexError ZeroDivisionError NameError FileNotFoundError StopIteration __name__'.split(' '));
const POP=[['print','f'],['input','f'],['len','f'],['range','f'],['int','f'],['str','f'],['float','f'],['list','f'],['def','k'],['if','k'],['for','k'],['while','k'],['import','k'],['return','k'],['else','k'],['elif','k'],['in','k'],['True','k'],['False','k'],['None','k'],['class','k'],['try','k'],['except','k'],['break','k'],['continue','k'],['pass','k'],['sum','f'],['max','f'],['min','f'],['abs','f'],['round','f'],['sorted','f'],['enumerate','f'],['zip','f'],['open','f'],['type','f'],['dict','f'],['set','f'],['tuple','f'],['bool','f'],['and','k'],['or','k'],['not','k'],['with','k'],['as','k'],['from','k'],['lambda','k'],['isinstance','f'],['map','f'],['filter','f'],['finally','k'],['raise','k'],['is','k']];
const METH=['append','split','join','strip','format','upper','lower','replace','items','keys','values','sort','pop','remove','count','index','extend','insert','startswith','endswith','find'].map(x=>[x,'f']);
'pow reversed divmod eval exit hex oct bin chr ord id dir help hash iter next any all repr format callable vars'.split(' ').forEach(x=>POP.push([x,'f']));
'math random time datetime os sys json re self __init__ global nonlocal assert del yield async await pickle pprint property'.split(' ').forEach(x=>POP.push([x,'v']));
const SP=new Set('if elif while for in and or not is import from return with as lambda class def except'.split(' ')),CO=new Set(['else','try','finally']);
const BLOCK=/^(if|elif|else|for|while|def|class|with|try|except|finally)\b/;
const cnt=(s,set)=>[...s].filter(c=>set.includes(c)).length;
const ids=s=>(s.match(/[A-Za-z_]\w*/g)||[]).filter(x=>!KW.has(x));
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function pre1(t){const o=[];let m;
 if(m=t.match(/^(?:async\s+)?def\s+(\w+)\s*\(([^)]*)/)){o.push(m[1]);m[2].split(',').forEach(p=>{const q=p.trim().replace(/^\*+/,'').match(/^[A-Za-z_]\w*/);if(q)o.push(q[0])})}
 if(m=t.match(/^class\s+(\w+)/))o.push(m[1]);
 if(m=t.match(/^import\s+(.+)/))m[1].split(',').forEach(p=>{const q=p.trim().split(/\s+as\s+/);const nm=(q[1]||q[0]).trim().split('.')[0];if(nm)o.push(nm)});
 if(m=t.match(/^from\s+[\w.]+\s+import\s+(.+)/))m[1].replace(/[()]/g,'').split(',').forEach(p=>{const q=p.trim().split(/\s+as\s+/);const nm=(q[1]||q[0]).trim();if(nm&&nm!=='*')o.push(nm)});
 for(const r of t.matchAll(/\bfor\s+([\w\s,()*]+?)\s+in\b/g))o.push(...ids(r[1]));
 for(const r of t.matchAll(/\bas\s+(\w+)/g))o.push(r[1]);
 for(const r of t.matchAll(/(\w+)\s*:=/g))o.push(r[1]);
 for(const r of t.matchAll(/\blambda\b([^:]*):/g))o.push(...ids(r[1].replace(/=[^,]*/g,'')));
 return o}
function post1(t){const o=[];let rest=t,m;while(m=rest.match(/^\s*([A-Za-z_*][\w\s,*]*?)\s*=(?!=)(.*)$/)){ids(m[1]).forEach(x=>o.push(x));rest=m[2]}return o}
function postLen(t){let rest=t,m,len=0;while(m=rest.match(/^\s*([A-Za-z_*][\w\s,*]*?)\s*=(?!=)(.*)$/)){len+=rest.length-m[2].length;rest=m[2]}return len}
let userNames=[];
function analyze(src){
 const L=src.split('\n'),n=L.length,res=new Array(n).fill(null);
 const CL={'(':')','[':']','{':'}'};
 const mark=(i,lv,t,fix)=>{if(fix&&fix.k==='line'&&fix.line===undefined)fix.line=i;if(!res[i]||(lv==='r'&&res[i].lv!=='r'))res[i]={lv,t,fix:fix||null}};
 const C=[],D0=[],P=[],stack=[],left=[];let tri=null;
 const endIdx=i=>{const c=C[i],p=P[i];let k=c.length-1;while(k>=0&&c[k]===' ')k--;return k<0?L[i].length:(p[k]>=0?p[k]+1:L[i].replace(/\s+$/,'').length)};
 for(let i=0;i<n;i++){
  const s=L[i];let out='',pos=[],j=0,bad=null;
  if(stack.length&&!tri&&/^(if|elif|else|for|while|def|class|return|import|from|try|except|finally|with|print|break|continue|pass)\b/.test(s.trim())&&s.match(/^ */)[0].length<=L[stack[0].i].match(/^ */)[0].length){left.push(...stack);stack.length=0}
  while(j<s.length){
   if(tri){const k=s.indexOf(tri,j);if(k<0){j=s.length;break}j=k+3;tri=null;out+='""';pos.push(-1,-1);continue}
   const c=s[j];
   if(c==='#')break;
   if(c==='"'||c==="'"){
    const b4=out.length;out=out.replace(/(?<![\w])[rRbBfFuU]{1,2}$/,'');pos.length-=b4-out.length;
    if(s.substr(j,3)===c+c+c){tri=c+c+c;j+=3;continue}
    let k=j+1;while(k<s.length&&s[k]!==c){if(s[k]==='\\')k++;k++}
    if(k>=s.length){bad=c;out+='""';pos.push(-1,-1);break}
    out+='""';pos.push(-1,-1);j=k+1;continue}
   out+=c;pos.push(j);j++}
  C.push(out);D0.push(stack.length);P.push(pos);
  if(bad){const st=[];for(const ch of out){if('([{'.includes(ch))st.push(ch);else if(')]}'.includes(ch)&&st.length)st.pop()}
   const cl=st.reverse().map(x=>CL[x]).join('');
   mark(i,'r','따옴표가 안 닫혔어요. 글자 끝에 같은 따옴표를 하나 더 붙여 주세요.',{k:'line',text:s.replace(/\s+$/,'')+bad+cl,why:'글자 끝에 따옴표'+(cl?'와 닫는 괄호':'')+'를 붙였어요.'})}
  for(let k=0;k<out.length;k++){
   const ch=out[k];
   if('([{'.includes(ch))stack.push({ch,i});
   else if(')]}'.includes(ch)){
    const o=stack.pop(),idx=pos[k];
    if(!o)mark(i,'r','닫는 괄호 '+ch+' 가 짝이 안 맞아요. 여는 괄호와 닫는 괄호 개수를 확인해 보세요.',idx>=0?{k:'line',text:s.slice(0,idx)+s.slice(idx+1),why:'짝이 없는 '+ch+' 를 지웠어요.'}:null);
    else if(CL[o.ch]!==ch)mark(i,'r','닫는 괄호 '+ch+' 가 짝이 안 맞아요. 여는 괄호와 닫는 괄호 모양을 확인해 보세요.',idx>=0?{k:'line',text:s.slice(0,idx)+CL[o.ch]+s.slice(idx+1),why:ch+' 를 여는 괄호 '+o.ch+' 와 짝이 맞는 '+CL[o.ch]+' 로 바꿨어요.'}:null)}}
 }
 left.push(...stack);const byLine={};left.forEach(o=>{(byLine[o.i]=byLine[o.i]||[]).push(o.ch)});
 for(const li in byLine){const i=+li,cl=byLine[li].slice().reverse().map(x=>CL[x]).join(''),e=endIdx(i);
  mark(i,'r','여는 괄호 '+byLine[li][0]+' 가 안 닫혔어요. 닫는 괄호를 붙여 주세요.',{k:'line',text:L[i].slice(0,e)+cl+L[i].slice(e),why:'줄 끝에 닫는 괄호 '+cl+' 를 붙였어요.'})}
 let pI=-1,pStart='',pLast='';
 for(let i=0;i<n;i++){
  const t=C[i].trim();if(!t)continue;
  if(D0[i]>0){pLast=t;continue}
  const I=L[i].match(/^ */)[0].length,ib=' '.repeat(I),body=L[i].trim();
  if(/^print\s+[^(=\s]/.test(t))mark(i,'r','print 는 괄호가 필요해요. print("글자") 처럼 써요.',{k:'line',text:ib+'print('+body.replace(/^print\s+/,'')+')',why:'print 뒤에 괄호를 붙였어요.'});
  if(/^(elseif|elsif|else\s+if)\b/.test(t))mark(i,'r','else if 는 파이썬에서 elif 라고 써요.',{k:'line',text:L[i].replace(/^(\s*)(elseif|elsif|else\s+if)\b/,'$1elif'),why:'elif 로 바꿨어요.'});
  const pp=t.match(/^(\w+)\s*(\+\+|--)$/);
  if(pp)mark(i,'r',pp[2]+' 는 파이썬에 없어요. '+pp[1]+(pp[2]==='++'?' += 1':' -= 1')+' 로 써요.',{k:'line',text:ib+pp[1]+(pp[2]==='++'?' += 1':' -= 1'),why:'파이썬은 ++ 대신 += 1 을 써요.'});
  if(/&&|\|\|/.test(t))mark(i,'r','&& 는 and, || 는 or 로 써요.',{k:'line',text:ib+body.replace(/\s*&&\s*/g,' and ').replace(/\s*\|\|\s*/g,' or '),why:'&& 를 and, || 를 or 로 바꿨어요.'});
  if(/(^|[\s(])!(?!=)/.test(t))mark(i,'r','! 는 not 으로 써요.',{k:'line',text:ib+body.replace(/(^|[\s(])!(?!=)\s*/g,'$1not '),why:'! 를 not 으로 바꿨어요.'});
  if(pI>=0){const opens=BLOCK.test(pStart)&&/:\s*$/.test(pLast);
   if(opens&&I<=pI)mark(i,'r','위 줄이 : 로 끝나서 이 줄은 안쪽으로 들여쓰기(스페이스 4칸)가 필요해요.',{k:'line',text:' '.repeat(pI+4)+body,why:'위 줄 안쪽이 되도록 스페이스 4칸을 더했어요.'});
   else if(!opens&&I>pI)mark(i,'r','들여쓰기가 갑자기 늘었어요. 위 줄과 줄을 맞춰 주세요.',{k:'line',text:' '.repeat(pI)+body,why:'위 줄과 들여쓰기를 맞췄어요.'})}
  if(/^(if|elif|while)\b/.test(t)){let f=t;for(let q=0;q<5;q++)f=f.replace(/\([^()]*\)/g,'');
   if(/(?<![=!<>:])=(?!=)/.test(f)){const o=C[i];let d=0,idx=-1;
    for(let k=0;k<o.length;k++){const ch=o[k];if('([{'.includes(ch))d++;else if(')]}'.includes(ch))d--;else if(ch==='='&&d===0&&!'=!<>:'.includes(o[k-1]||'')&&o[k+1]!=='='){idx=P[i][k];break}}
    mark(i,'r','조건에는 = 말고 == 를 써야 해요. (같은지 비교할 때는 ==)',idx>=0?{k:'line',text:(L[i].slice(0,idx)+'=='+L[i].slice(idx+1)).replace(/\s+$/,'')+(t.includes(':')?'':':'),why:'= 를 == 로 바꿨어요. (= 는 값 넣기, == 는 같은지 비교예요)'+(t.includes(':')?'':' 줄 끝에 : 도 붙였어요.')}:null)}}
  if(BLOCK.test(t)&&cnt(t,'([{')===cnt(t,')]}')&&!t.includes(':')){const e=endIdx(i);mark(i,'r','줄 끝에 : 가 빠졌어요. 예) if a > 3:',{k:'line',text:L[i].slice(0,e)+':'+L[i].slice(e),why:'줄 끝에 : 를 붙였어요.'})}
  pI=I;pStart=t;pLast=t;
 }
 const PRE=[],POST=[],all=new Set(BI);

const DICT=ENT.map(e=>{const raw=e[0].split('|');return{raw,b:raw.map(x=>bg(norm(x))),code:e[1]}});
function fill(code,t){
 const nums=t.match(/-?\d+(?:\.\d+)?/g)||[];
 const strs=[...t.matchAll(/["“”‘’']([^"“”‘’']+)["“”‘’']/g)].map(m=>m[1]);
 return code.replace(/\{([NS])(\d)(?::([^}]*))?\}/g,(_,k,i,d)=>{i=+i-1;if(k==='N')return nums[i]!==undefined?nums[i]:(d||'0');const s=strs[i];return JSON.stringify(s!==undefined?s:(d||'안녕하세요'))})}
function dictBest(c){
 const tb=bg(norm(c.replace(/["“”‘’'][^"“”‘’']*["“”‘’']/g,'')));
 if(!tb.size)return null;
 let best=null,bs=0;const all=[];
 for(const e of DICT){let es=0;for(const x of e.b){let n=0;x.forEach(g=>{if(tb.has(g))n++});const sc=.6*(n/x.size)+.4*(2*n/(tb.size+x.size));if(sc>es)es=sc}all.push([es,e]);if(es>bs){bs=es;best=e}}
 all.sort((a,b)=>b[0]-a[0]);
 return{e:best,s:bs,top:all.slice(0,3)}}

 t=t.replace(new RegExp('(열|스무|스물|서른|마흔|쉰)\\s*(한|두|세|네|다섯|여섯|일곱|여덟|아홉)\\s*('+KU+')','g'),(m,a,b,u)=>(KN[a]+KN[b])+u);
 return t.replace(new RegExp('(한|두|세|네|다섯|여섯|일곱|여덟|아홉|열|스무|스물|서른|마흔|쉰|백|천)\\s*('+KU+')','g'),(m,a,u)=>KN[a]+u)}

function mkLoop(kind,v,a,b,body,o){
 o=o||{};const st=o.step||1,desc=!!o.desc;
 if(kind==='for')return ['for '+v+' in range('+a+', '+(desc?m1(b):p1(b))+(desc?', -'+st:(st>1?', '+st:''))+'):',...ind(body)];
 return [v+' = '+a,'while '+v+(desc?' >= ':' <= ')+b+':',...ind(body),'    '+v+(desc?' -= ':' += ')+st]}
function mkLoopN(kind,v,n,body){
 if(kind==='for')return ['for '+v+' in range('+n+'):',...ind(body)];
 return [v+' = 0','while '+v+' < '+n+':',...ind(body),'    '+v+' += 1']}

function neg(e){
 if(/ and | or |\bnot\b/.test(e))return 'not ('+e+')';
 const M=[[' >= ',' < '],[' <= ',' > '],[' > ',' <= '],[' < ',' >= '],[' == ',' != '],[' != ',' == ']];
 for(const [a,b] of M){if(e.includes(a))return e.replace(a,b)}
 return 'not ('+e+')'}

function needVar(name,label,numeric,ctx){
 ctx.vars.add(name);
 if(ctx.noInput){ctx.cnt=ctx.cnt||{};ctx.cnt[name]=1;return}
 ctx.pre.push(name+' = '+(numeric?'int(input("'+label+': "))':'input("'+label+': ")'))}
function subjVar(t,ctx,numeric){
 t=clean((t||'').trim());
 if(!t)return ctx.subj||ctx.last||null;
 if(/^-?\d+(\.\d+)?$/.test(t))return t;
 if(ctx.vars.has(t))return t;
 const k=NOUN[t];
 if(k){if(!ctx.vars.has(k))needVar(k,t,numeric,ctx);return k}
 if(/^[A-Za-z_]\w*$/.test(t)){if(!ctx.vars.has(t))needVar(t,t,numeric,ctx);return t}
 ctx.nm=ctx.nm||{};
 if(!ctx.nm[t]){const v=newVar(ctx);ctx.nm[t]=v;if(ctx.noInput){ctx.cnt=ctx.cnt||{};ctx.cnt[v]=1}else ctx.pre.push(v+' = '+(numeric?'int(input("'+t+': "))':'input("'+t+': ")'))}
 return ctx.nm[t]}
function valueOf2(t,ctx){
 t=(t||'').trim();
 const q=t.match(/^["“”‘’'](.*)["“”‘’']$/);if(q)return JSON.stringify(q[1]);
 const c=clean(t);
 if(/^-?\d+(\.\d+)?$/.test(c))return c;
 if(ctx.vars.has(c))return c;
 if(NOUN[c]&&ctx.vars.has(NOUN[c]))return NOUN[c];

  out.push(...ctx.pre,...ls);lastIf=ls[0].startsWith('if ')&&!ls.includes('else:');
 }
 let ask='';
 if(asks.length)ask='이해하지 못한 문장: '+asks.map(s=>'"'+s+'"').join(', ')+(ctx.sug&&ctx.sug.length?' / 혹시 이런 말인가요? 아래 버튼을 눌러 보세요.':' / 이렇게 써 보세요: 1부터 10까지 출력, 이름 입력받아 안녕 출력, a가 10보다 크면 "큼" 출력 아니면 "작음" 출력, 구구단 3단');
 return{code:out.join('\n'),ask,sug:asks.length?(ctx.sug||[]):[]}}
let samP=null,vbusy=false,vundoVal=null;
try{if(window.claude&&claude.use)samP=claude.use('sample')}catch(e){samP=null}
const vhist=[];
function parseAI(txt){
 let t=(txt||'').trim().replace(/^```(?:json|python)?\s*/i,'').replace(/```\s*$/,'').trim();
 try{return JSON.parse(t)}catch(e){}
 const m=t.match(/\{[\s\S]*\}/);if(m){try{return JSON.parse(m[0])}catch(e){}}
 return{mode:'append',code:t.replace(/```/g,''),note:''}}
async function aiVibe(t){
 if(!samP)return null;
 const sm=await Promise.race([samP,new Promise(r=>setTimeout(()=>r(null),4000))]);
 if(!sm)return null;
 const cur=ta.value.length>6000?ta.value.slice(0,6000)+'\n# ...(이하 생략)':ta.value;
 const hist=vhist.slice(-5).map((h,i)=>(i+1)+'. '+h).join('\n')||'(없음)';
 const prompt='당신은 파이썬 초보자를 돕는 코드 생성기입니다. 사용자가 한국어로 말한 내용을 파이썬 코드로 바꿔 주세요.\n'+
'규칙:\n'+
'- 코드는 Skulpt(브라우저용 파이썬 3 실행기)에서 돌아가야 합니다. 라이브러리는 math, random, time, datetime 정도만 쓰고, f-string과 외부 라이브러리는 피하세요. 입력은 input(), 출력은 print()를 쓰세요.\n'+
'- 초보자가 읽기 쉽게 짧은 한국어 주석을 넣고, 코드는 단순하게 쓰세요.\n'+
'- 변수 이름을 정해 주지 않았으면 a, b, c 같은 짧은 이름이나 뜻이 분명한 영어 이름을 직접 정하세요.\n'+
'- 꼭 필요한 정보가 없어서 도저히 만들 수 없을 때만 code를 비우고 ask에 한국어로 필요한 정보를 물어보세요. 웬만하면 합리적으로 정해서 만드세요.\n'+
'- 사용자가 기존 코드를 고치거나 바꿔 달라고 하면 mode를 "replace"로 하고 고친 전체 코드를 code에 넣으세요. 그 밖에는 mode를 "append"로 하고 새로 추가할 코드만 code에 넣으세요. 이미 있는 변수와 함수는 다시 만들지 말고 이어서 쓰세요.\n'+
'- 응답은 JSON 객체 하나만 쓰세요(설명이나 코드블록 표시 금지): {"mode":"append","code":"파이썬 코드","note":"한국어 한 줄 설명","ask":""}\n\n'+
'현재 편집기 코드:\n<<<\n'+cur+'\n>>>\n\n이전에 사용자가 한 요청들:\n'+hist+'\n\n이번 요청: '+t;
 const r=await sm(prompt,{modelTier:'default',cache:false});
 return parseAI(r.text)}
async function runVibe(){
 const t=vin.value.trim();
 if(!t){vh.textContent='만들고 싶은 코드를 한국어로 적어 주세요.';return}
 if(vbusy)return;
 vbusy=true;$('#vgo').disabled=true;
 let r=null,msg='';
 try{vh.textContent='AI가 코드를 만드는 중이에요...';r=await aiVibe(t)}
 catch(e){msg=e&&e.code==='not_granted'?'AI 사용 허락이 없어서 기본 규칙으로 만들었어요. ':e&&e.code==='rate_limited'?'AI를 너무 자주 불러서 기본 규칙으로 만들었어요. ':'AI를 못 불러서 기본 규칙으로 만들었어요. '}
 if(!r){
  if(!msg)msg='AI를 쓸 수 없는 곳이라 기본 규칙으로 만들었어요. ';
  try{r=vibe(t)}catch(e){r={code:'',ask:'이 문장은 아직 못 바꿔요. 조금 더 쉽게 나눠서 적어 주세요.'}}
 }
 else msg='';
 const code=(r.code||'').replace(/\s+$/,'');
 if(code){
  vundoVal=ta.value;$('#vundo').style.display='';
  if(r.mode==='replace')ta.value=code+'\n';
  else{let v=ta.value;if(v&&!v.endsWith('\n'))v+='\n';if(v.trim())v+='\n';ta.value=v+code+'\n'}
  vin.value='';update();wrap.scrollTop=r.mode==='replace'?0:wrap.scrollHeight;vhist.push(t)}
 vh.textContent=msg+(code?(r.mode==='replace'?'코드를 고쳤어요. ':'코드를 아래에 넣었어요. '):'')+(r.note||'')+(r.ask?' '+r.ask:'');
 if(r.sug&&r.sug.length){const w=document.createElement('div');w.style.cssText='display:flex;gap:6px;flex-wrap:wrap;margin-top:4px';r.sug.forEach(x=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=x;b.onclick=()=>{vin.value=x;vin.focus()};w.appendChild(b)});vh.appendChild(w)}
 vbusy=false;$('#vgo').disabled=false}
$('#vundo').onclick=()=>{if(vundoVal===null)return;ta.value=vundoVal;vundoVal=null;$('#vundo').style.display='none';update();vh.textContent='방금 넣은 코드를 되돌렸어요.'};
$('#vgo').onclick=runVibe;
vin.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();runVibe()}});
$('#vibe').onclick=()=>{VP.classList.toggle('open');if(VP.classList.contains('open'))vin.focus()};

ta.value='name = input("이름이 뭐예요? ")\nprint("안녕", name)\n';
update();
</script>
